<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>调拨入库 · 区域药房协同管理系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"/>
        <path d="M8.4 15.6L15.6 8.4"/>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <div class="header-user" id="headerUser" title="点击退出登录">
      <span class="header-avatar">药</span>
      <span class="header-user-name">—</span>
      <svg class="user-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>
</header>

<div class="app-body">
  <aside class="app-side" id="appSide"></aside>
<main class="app-main">
    <div class="tabbar">
      <div class="tab">首页</div>
      <div class="tab" data-href="transfer.html">调拨管理</div>
      <div class="tab active">
        <span id="tabName">调拨入库</span>
        <button class="tab-close" id="tabClose" title="关闭">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
    </div>

    <div class="page sel-page tr-detail">
      <div class="sel-main">
        <div class="page-head">
          <div class="head-back">
            <button class="back-btn" id="btnBack" title="返回调拨列表">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <h1 class="page-title">调拨入库</h1>
            <span class="pa-code" id="headCode">调拨单号：—</span>
          </div>
          <span class="status-text" id="headStatus"></span>
        </div>

        <div class="sel-card">
          <div class="card-body" style="padding:16px;">
            <div class="form-wrap">

              <section class="block">
                <div class="block-head"><h2 class="block-title">申请信息</h2></div>
                <div class="form-grid-4" id="applyInfo"></div>
              </section>

              <section class="block">
                <div class="block-head"><h2 class="block-title">出库信息</h2></div>
                <div class="form-grid-4" id="outInfo"></div>
              </section>

              <section class="block">
                <div class="block-head"><h2 class="block-title">入库信息</h2></div>
                <div class="form-grid-4">
                  <div class="form-item">
                    <span class="form-label">入库单号</span>
                    <input class="input is-readonly" id="fInCode" readonly value="确认入库后生成">
                  </div>
                  <div class="form-item">
                    <span class="form-label">入库时间</span>
                    <input class="input is-readonly" id="fInTime" readonly value="—">
                  </div>
                  <div class="form-item">
                    <span class="form-label">入库人</span>
                    <input class="input is-readonly" id="fInUser" readonly>
                  </div>
                </div>
              </section>

              <section class="block">
                <div class="block-head">
                  <h2 class="block-title">药品明细</h2>
                  <span class="tr-in-hint">入库数量、不合格数量由「扫码核对」结果自动计算；不合格需选择原因，可在扫码核对中标记</span>
                </div>
                <div class="tr-stage-table is-scroll">
                  <table class="data-table tr-tree tr-in-tree">
                    <thead>
                      <tr>
                        <th style="width:36px;"></th>
                        <th style="width:180px;">药品名称</th>
                        <th style="width:140px;">药品规格</th>
                        <th style="width:120px;">品规编码</th>
                        <th style="width:80px;" class="num">申请数量</th>
                        <th style="width:80px;" class="num">调拨数量</th>
                        <th style="width:80px;" class="num">入库数量</th>
                        <th style="width:84px;" class="num">不合格数量</th>
                        <th style="width:120px;"><span class="req">*</span>不合格原因</th>
                        <th style="width:120px;" class="num">进货价金额合计</th>
                        <th style="width:120px;" class="num">零售价金额合计</th>
                        <th style="width:90px;" class="num">追溯码核对</th>
                        <th style="width:96px;">操作</th>
                      </tr>
                    </thead>
                    <tbody id="rowBody"></tbody>
                  </table>
                </div>

                <div class="tr-in-sum">
                  <span class="item">入库总量<b id="sumIn">0</b></span>
                  <span class="item">不合格总量<b id="sumBad" class="is-bad">0</b></span>
                  <span class="item">合格入库量<b id="sumGood">0</b></span>
                  <span class="item">进货价合计<b id="sumPurchase">0.00</b></span>
                  <span class="item">零售价合计<b id="sumRetail">0.00</b></span>
                </div>
              </section>

            </div>
          </div>

          <div class="tr-in-bar">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnConfirm">确认入库</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-mask" id="modalMask"></div>
<div class="drawer-mask" id="drawerMask"></div>
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastText"></span>
</div>

<script src="mock.js"></script>
<script src="selection-common.js"></script>
<script src="transfer-common.js"></script>
<script>
(function () {
  var $ = SEL.$, esc = SEL.esc;
  var user = TR.user();
  if (!user) return;

  var all = TR.load();
  var bill = SEL.qs("id") ? TR.byId(all, SEL.qs("id")) : null;
  if (!bill || !TR.canInbound(bill, user)) { location.href = "transfer.html"; return; }
  bill = JSON.parse(JSON.stringify(bill));

  var expanded = {};
  var traceGi = -1;
  var drawerMode = "verify";

  bill.batches.forEach(function (g) {
    (g.rows || []).forEach(function (r) {
      if (!r.traceCodes) r.traceCodes = [];
      if (!r.badCodes) r.badCodes = [];
      if (!r.verified) r.verified = [];
      if (!r.extraCodes) r.extraCodes = [];
    });
    if (!g.badReason) g.badReason = "";
    if (!g.unknownExtras) g.unknownExtras = [];
    syncQty(g);
  });

  function isOpen(g) { return expanded[g.key] !== undefined ? expanded[g.key] : (g.rows || []).length > 0; }
  function badCount(g) {
    var n = 0;
    (g.rows || []).forEach(function (r) { n += (r.badCodes || []).length; });
    return n;
  }
  function okCount(g) {
    var n = 0;
    (g.rows || []).forEach(function (r) { n += (r.verified || []).length; });
    return n;
  }
  function extraCount(g) {
    var n = (g.unknownExtras || []).length;
    (g.rows || []).forEach(function (r) { n += (r.extraCodes || []).length; });
    return n;
  }
  function manifestCount(g) {
    var n = 0;
    (g.rows || []).forEach(function (r) { n += (r.traceCodes || []).length; });
    return n;
  }
  function moneyOf(g) {
    var p = 0, rt = 0;
    (g.rows || []).forEach(function (r) {
      var ok = (r.verified || []).length;
      p += ok * (Number(r.purchase) || 0);
      rt += ok * (Number(r.retail) || 0);
    });
    return { purchase: TR.money(p), retail: TR.money(rt) };
  }

  /* 数量由扫码结果驱动：入库数量 = 已核合格码数；不合格数量 = 标记不合格码数 */
  function syncQty(g) {
    var ok = 0, bad = 0;
    (g.rows || []).forEach(function (r) {
      r.inQty = (r.verified || []).length;
      r.badQty = (r.badCodes || []).length;
      ok += r.inQty;
      bad += r.badQty;
    });
    g.inQty = ok;
    g.badQty = bad;
  }

  function infoItem(l, v) {
    return '<div class="form-item"><span class="form-label">' + esc(l) + '</span>' +
      '<span class="text-value">' + esc(v || "—") + "</span></div>";
  }

  function renderInfos() {
    $("applyInfo").innerHTML =
      infoItem("申请机构", bill.applyOrgName) +
      infoItem("申请库位", bill.applyLocationName) +
      infoItem("提交人", bill.creator) +
      infoItem("提交时间", bill.submitTime) +
      '<div class="form-item span-2of4"><span class="form-label">缺药说明</span>' +
        '<span class="text-value">' + esc(bill.shortageDesc || "—") + "</span></div>";

    $("outInfo").innerHTML =
      infoItem("出库机构", bill.outOrgName) +
      infoItem("出库库位", bill.outLocationName) +
      infoItem("出库单号", bill.outCode) +
      infoItem("出库时间", bill.outTime);
    $("fInUser").value = user.name;
  }

  function renderRows() {
    $("rowBody").innerHTML = bill.batches.length ? bill.batches.map(function (g, idx) {
      var rows = g.rows || [];
      var open = isOpen(g);
      var badN = badCount(g);
      var okN = okCount(g);
      var mCount = manifestCount(g);
      var m = moneyOf(g);
      var done = mCount > 0 && okN + badN >= mCount;
      var html =
        '<tr class="tr-tree-parent">' +
          '<td><button class="tr-expander' + (open ? " is-open" : "") + '" data-toggle="' + idx + '" title="展开/收起">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
          "</button></td>" +
          "<td>" + esc(g.drugName) + "</td>" +
          "<td>" + esc(g.spec) + "</td>" +
          "<td>" + esc(g.drugCode) + "</td>" +
          '<td class="num">' + g.applyQty + "</td>" +
          '<td class="num">' + TR.allocated(g) + "</td>" +
          '<td class="num">' + (mCount ? okN : "—") + "</td>" +
          '<td class="num' + (badN ? " is-bad-num" : "") + '">' + badN + "</td>" +
          '<td><select class="select tr-reason" data-g="' + idx + '" data-field="badReason"' + (badN > 0 ? "" : " disabled") + ">" +
            '<option value="">请选择</option>' +
            TR.BAD_REASONS.map(function (x) {
              return '<option value="' + x + '"' + (g.badReason === x ? " selected" : "") + ">" + x + "</option>";
            }).join("") +
          "</select></td>" +
          '<td class="num">' + m.purchase + "</td>" +
          '<td class="num">' + m.retail + "</td>" +
          '<td class="num tr-check-cell' + (done ? " is-done" : okN > 0 ? " is-doing" : "") + '">' + (mCount ? okN + "/" + mCount : "—") + "</td>" +
          '<td><button class="link-btn" data-trace="' + idx + '">' + (done ? "查看核对" : "扫码核对") + "</button></td>" +
        "</tr>";

      if (open) {
        html += '<tr class="tr-child-wrap"><td></td><td colspan="12"><table class="tr-child-table"><thead><tr>' +
          '<th style="width:120px;">批次号</th>' +
          '<th style="width:150px;">生产企业</th>' +
          '<th style="width:95px;">有效期</th>' +
          '<th style="width:90px;" class="num">进货价</th>' +
          '<th style="width:90px;" class="num">零售价</th>' +
          '<th style="width:90px;" class="num">入库数量</th>' +
          '<th style="width:90px;" class="num">不合格数量</th>' +
          '<th style="width:90px;" class="num">追溯码核对</th>' +
        "</tr></thead><tbody>";
        if (!rows.length) {
          html += '<tr class="tr-child-empty"><td colspan="8">暂无出库批次</td></tr>';
        } else {
          html += rows.map(function (r) {
            var v = (r.verified || []).length;
            return "<tr>" +
              "<td>" + esc(r.batchNo) + "</td>" +
              "<td>" + esc(r.vendor) + "</td>" +
              "<td>" + esc(r.expDate) + "</td>" +
              '<td class="num">' + TR.money(r.purchase) + "</td>" +
              '<td class="num">' + TR.money(r.retail) + "</td>" +
              '<td class="num">' + v + "</td>" +
              '<td class="num">' + (r.badCodes || []).length + "</td>" +
              '<td class="num">' + v + "/" + (r.traceCodes || []).length + "</td>" +
            "</tr>";
          }).join("");
        }
        html += "</tbody></table></td></tr>";
      }
      return html;
    }).join("") : '<tr><td colspan="13" class="tr-empty-cell">暂无药品明细</td></tr>';
    renderSums();
  }

  function renderSums() {
    var totalIn = 0, totalBad = 0, purchase = 0, retail = 0;
    bill.batches.forEach(function (g) {
      (g.rows || []).forEach(function (r) {
        var v = (r.verified || []).length;
        var b = (r.badCodes || []).length;
        totalIn += v + b;
        totalBad += b;
        purchase += v * (Number(r.purchase) || 0);
        retail += v * (Number(r.retail) || 0);
      });
    });
    $("sumIn").textContent = totalIn;
    $("sumBad").textContent = totalBad;
    $("sumGood").textContent = totalIn;
    $("sumPurchase").textContent = TR.money(purchase);
    $("sumRetail").textContent = TR.money(retail);
  }

  function renderAll() {
    renderRows();
  }

  /* ---------------- 扫码核对抽屉 ---------------- */
  function closeDrawer() {
    document.body.classList.remove("drawer-open");
    $("drawerMask").innerHTML = "";
    traceGi = -1;
  }

  function codeOwnerRow(g, code) {
    var owner = null;
    (g.rows || []).forEach(function (r) {
      if ((r.traceCodes || []).indexOf(code) >= 0) owner = r;
    });
    return owner;
  }

  function stateOfCode(r, c) {
    if ((r.badCodes || []).indexOf(c) >= 0) return "bad";
    if ((r.verified || []).indexOf(c) >= 0) return "ok";
    return "pending";
  }

  /* 非本单码：按码内批次号（TRC+批次号 前缀）归入对应批次；识别不了归入「未识别批次」 */
  function addExtra(g, code) {
    var host = null;
    (g.rows || []).forEach(function (r) {
      if (code.indexOf("TRC" + r.batchNo) === 0) host = r;
    });
    if (host) {
      if ((host.extraCodes || []).indexOf(code) >= 0) { SEL.toast("该追溯码已在非本单码列表中"); return; }
      host.extraCodes.push(code);
      SEL.toast("已登记为非本单码（批次 " + host.batchNo + "）");
    } else {
      g.unknownExtras = g.unknownExtras || [];
      if (g.unknownExtras.indexOf(code) >= 0) { SEL.toast("该追溯码已在非本单码列表中"); return; }
      g.unknownExtras.push(code);
      SEL.toast("已登记为非本单码（未识别批次）");
    }
  }

  function verifyScan(g, code) {
    var owner = codeOwnerRow(g, code);
    if (!owner) { addExtra(g, code); return; }
    var st = stateOfCode(owner, code);
    if (st === "bad") {
      owner.badCodes.splice(owner.badCodes.indexOf(code), 1);
      owner.verified.push(code);
      SEL.toast("已恢复合格并核对");
    } else if (st === "ok") {
      SEL.toast("该追溯码已核对");
    } else {
      owner.verified.push(code);
    }
  }

  function badScan(g, code) {
    var owner = codeOwnerRow(g, code);
    if (!owner) { addExtra(g, code); return; }
    var st = stateOfCode(owner, code);
    if (st === "bad") { SEL.toast("该追溯码已标记为不合格"); return; }
    if (st === "ok") owner.verified.splice(owner.verified.indexOf(code), 1);
    owner.badCodes.push(code);
  }

  function undoScan(g, code) {
    var hit = false;
    (g.rows || []).forEach(function (r) {
      if (hit) return;
      var at = (r.badCodes || []).indexOf(code);
      if (at >= 0) { r.badCodes.splice(at, 1); hit = true; return; }
      at = (r.verified || []).indexOf(code);
      if (at >= 0) { r.verified.splice(at, 1); hit = true; return; }
      at = (r.extraCodes || []).indexOf(code);
      if (at >= 0) { r.extraCodes.splice(at, 1); hit = true; }
    });
    if (!hit) {
      g.unknownExtras = g.unknownExtras || [];
      var at = g.unknownExtras.indexOf(code);
      if (at >= 0) { g.unknownExtras.splice(at, 1); hit = true; }
    }
    if (!hit) SEL.toast("未找到该追溯码的核对记录");
  }

  function chipHtml(c, st, ri) {
    var cls = "tr-code-chip" + (st === "ok" ? " is-ok" : st === "bad" ? " is-bad" : st === "extra" ? " is-extra" : "");
    return '<span class="' + cls + '" data-code="' + esc(c) + '" data-ri="' + ri + '" data-st="' + st + '">' + esc(c) + "</span>";
  }

  function groupHtml(batchNo, expDate, stat, chips) {
    return '<div class="tr-code-group">' +
      '<div class="tr-code-head"><b>批次 ' + esc(batchNo) +
        (expDate ? ' <span class="tr-code-exp">· 效期 ' + esc(expDate) + "</span>" : "") + "</b>" +
        '<span class="count">' + esc(stat) + "</span></div>" +
      '<div class="tr-code-chips">' + chips + "</div></div>";
  }

  function openTrace(idx) {
    traceGi = idx;
    drawerMode = "verify";
    expanded[bill.batches[idx].key] = true;
    renderRows();
    var g = bill.batches[idx];
    var mask = $("drawerMask");
    mask.innerHTML =
      '<div class="drawer is-pa">' +
        '<div class="drawer-head">' +
          '<span class="drawer-title">扫码核对 · ' + esc(g.drugName) + "</span>" +
          '<button class="drawer-close" data-drawer-close="1"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>' +
        "</div>" +
        '<div class="drawer-body tr-scan-body trv-body" id="traceBody"></div>' +
        '<div class="drawer-foot">' +
          '<button class="btn" data-drawer-close="1">取消</button>' +
          '<button class="btn btn-primary" id="traceConfirm">确认核对</button>' +
        "</div>" +
      "</div>";
    document.body.classList.add("drawer-open");
    renderTrace();
    $("traceConfirm").addEventListener("click", function () {
      if (badCount(g) > 0 && !g.badReason) {
        var sel = $("badReasonSel");
        if (sel) sel.classList.add("is-invalid");
        SEL.toast("存在不合格追溯码，请先选择不合格原因");
        return;
      }
      closeDrawer();
      SEL.toast("核对结果已确认；少发、多发差异将随入库结果回传出库方");
      renderRows();
    });
  }

  function renderTrace() {
    if (traceGi < 0) return;
    var g = bill.batches[traceGi];
    var mCount = manifestCount(g), okN = okCount(g), badN = badCount(g), extraN = extraCount(g);
    var body = $("traceBody");
    if (!body) return;

    var modeBtn = function (m, label) {
      return '<span class="trv-mode' + (drawerMode === m ? " is-active" : "") + '" data-mode="' + m + '">' + label + "</span>";
    };
    var groups = (g.rows || []).map(function (r, ri) {
      var codes = r.traceCodes || [];
      var v = (r.verified || []).length, b = (r.badCodes || []).length, e = (r.extraCodes || []).length;
      var chips = codes.map(function (c) { return chipHtml(c, stateOfCode(r, c), ri); }).join("");
      chips += (r.extraCodes || []).map(function (c) { return chipHtml(c, "extra", ri); }).join("");
      if (!chips) chips = '<span class="tr-code-empty">该批次暂无追溯码</span>';
      var stat = "已核 " + v + "/" + codes.length + " · 不合格 " + b + (e ? " · 非本单码 " + e : "");
      return groupHtml(r.batchNo, r.expDate, stat, chips);
    });
    if ((g.unknownExtras || []).length) {
      groups.push(groupHtml("未识别批次", "", "非本单码 " + g.unknownExtras.length,
        g.unknownExtras.map(function (c) { return chipHtml(c, "extra", -1); }).join("")));
    }

    body.innerHTML =
      '<div class="trv-stats">' +
        '<div class="trv-stat"><span class="label">应到码数</span><b>' + mCount + "</b></div>" +
        '<div class="trv-stat is-ok"><span class="label">已核码数</span><b>' + okN + "</b></div>" +
        '<div class="trv-stat is-bad"><span class="label">不合格</span><b>' + badN + "</b></div>" +
        '<div class="trv-stat is-extra"><span class="label">非本单码</span><b>' + extraN + "</b></div>" +
      "</div>" +
      '<div class="tr-scan-input">' +
        '<div class="trv-modes">' +
          modeBtn("verify", "扫码核对") +
          modeBtn("bad", "标记不合格") +
          modeBtn("undo", "撤销扫码") +
        "</div>" +
        '<input class="input" id="traceCode" placeholder="' + (drawerMode === "undo" ? "扫描需撤销的追溯码后回车" : "扫描或输入追溯码后回车") + '" autocomplete="off">' +
        '<button class="btn" id="traceAdd">录入</button>' +
      "</div>" +
      '<div class="trv-reason"><span class="label">' + (badN > 0 ? '<i class="req">*</i>' : "") + '不合格原因</span><select class="select" id="badReasonSel">' +
        '<option value="">请选择</option>' +
        TR.BAD_REASONS.map(function (x) {
          return '<option value="' + x + '"' + (g.badReason === x ? " selected" : "") + ">" + x + "</option>";
        }).join("") +
      "</select></div>" +
      '<div class="trv-legend">' +
        '<span><i style="background:#D9D9D9;"></i>未扫码</span>' +
        '<span><i style="background:#52C41A;"></i>核对无误</span>' +
        '<span><i style="background:#FF4D4F;"></i>不合格</span>' +
        '<span><i style="background:#FA8C16;"></i>非本单码</span>' +
      "</div>" +
      groups.join("");

    var input = $("traceCode");
    function submit() {
      var code = input.value.trim().toUpperCase();
      if (!code) return;
      if (drawerMode === "undo") undoScan(g, code);
      else if (drawerMode === "bad") badScan(g, code);
      else verifyScan(g, code);
      input.value = "";
      syncQty(g);
      renderTrace();
      renderRows();
      setTimeout(function () { var el = $("traceCode"); if (el) el.focus(); }, 0);
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
    });
    $("traceAdd").addEventListener("click", submit);

    [].slice.call(body.querySelectorAll(".trv-mode")).forEach(function (btn) {
      btn.addEventListener("click", function () {
        drawerMode = btn.getAttribute("data-mode");
        renderTrace();
        setTimeout(function () { var el = $("traceCode"); if (el) el.focus(); }, 0);
      });
    });

    $("badReasonSel").addEventListener("change", function (e) {
      g.badReason = e.target.value;
      e.target.classList.remove("is-invalid");
      renderRows();
    });

    body.onclick = function (e) {
      var chip = e.target.closest("[data-code]");
      if (!chip) return;
      var code = chip.getAttribute("data-code");
      var ri = parseInt(chip.getAttribute("data-ri"), 10);
      var st = chip.getAttribute("data-st");
      var r = ri >= 0 ? g.rows[ri] : null;
      if (drawerMode === "bad") {
        /* 标记不合格模式：点标签直接标记不合格 */
        if (st === "bad" && r) {
          r.badCodes.splice(r.badCodes.indexOf(code), 1);
        } else if (r) {
          var vi = (r.verified || []).indexOf(code);
          if (vi >= 0) r.verified.splice(vi, 1);
          if ((r.badCodes || []).indexOf(code) < 0) r.badCodes.push(code);
        }
      } else if (drawerMode === "undo") {
        /* 撤销扫码模式：点标签撤销当前状态 */
        if (st === "bad" && r) {
          r.badCodes.splice(r.badCodes.indexOf(code), 1);
        } else if (st === "ok" && r) {
          r.verified.splice(r.verified.indexOf(code), 1);
        } else if (st === "extra") {
          if (r) r.extraCodes.splice((r.extraCodes || []).indexOf(code), 1);
          else {
            g.unknownExtras = g.unknownExtras || [];
            g.unknownExtras.splice(g.unknownExtras.indexOf(code), 1);
          }
        }
      } else if (drawerMode === "verify") {
        /* 扫码核对模式：待核对→核对；已核对→撤销；不合格→恢复合格并核对 */
        if (r) verifyScan(g, code);
        return;
      }
      syncQty(g);
      renderTrace();
      renderRows();
    };
    setTimeout(function () { input.focus(); }, 50);
  }

  /* ---------------- 校验 / 确认入库 ---------------- */
  function confirmIn() {
    if (!bill.batches.length) { SEL.toast("暂无药品明细"); return; }
    var invalid = false, anyScan = false;
    bill.batches.forEach(function (g) {
      if (badCount(g) > 0 && !g.badReason) invalid = true;
      if (okCount(g) + badCount(g) > 0) anyScan = true;
    });
    [].slice.call($("rowBody").querySelectorAll("select[data-g]")).forEach(function (el) {
      var g = bill.batches[parseInt(el.getAttribute("data-g"), 10)];
      var ok = !(badCount(g) > 0 && !el.value);
      el.classList.toggle("is-invalid", !ok);
    });
    if (invalid) { SEL.toast("请为不合格药品选择不合格原因"); return; }
    if (!anyScan) { SEL.toast("请先扫码核对追溯码后再确认入库"); return; }

    bill.batches.forEach(function (g) {
      syncQty(g);
    });

    var code = TR.newInCode(TR.load());
    bill.inCode = code;
    bill.inUser = user.name;
    bill.inTime = SEL.fmtNow();
    bill.transferStatus = "done";
    TR.addRecord(bill, "入库", user.name, user.org, "已完成", "入库单号 " + code);
    TR.persist(bill);
    SEL.toast("已确认入库，入库单号 " + code);
    setTimeout(function () { location.href = "transfer.html"; }, 500);
  }

  /* ---------------- 事件 ---------------- */
  $("headCode").textContent = "调拨单号：" + bill.code;
  $("headStatus").textContent = "调拨状态：" + (TR.TRANSFER[bill.transferStatus] || "—");
  document.title = "调拨入库 " + bill.code + " · 区域药房协同管理系统";
  $("btnBack").addEventListener("click", function () { location.href = "transfer.html"; });
  $("tabClose").addEventListener("click", function () { location.href = "transfer.html"; });
  $("btnConfirm").addEventListener("click", confirmIn);
  $("btnCancel").addEventListener("click", function () { location.href = "transfer.html"; });

  $("rowBody").addEventListener("click", function (e) {
    var t = e.target.closest("[data-toggle]");
    if (t) {
      var g0 = bill.batches[parseInt(t.getAttribute("data-toggle"), 10)];
      expanded[g0.key] = !isOpen(g0);
      renderRows();
      return;
    }
    var tr = e.target.closest("[data-trace]");
    if (tr) { openTrace(parseInt(tr.getAttribute("data-trace"), 10)); }
  });

  $("rowBody").addEventListener("change", function (e) {
    var el = e.target;
    var idx = parseInt(el.getAttribute("data-g"), 10);
    var g = bill.batches[idx];
    if (!g) return;
    var field = el.getAttribute("data-field");
    if (field === "badReason") {
      g.badReason = el.value;
      el.classList.remove("is-invalid");
      if (badCount(g) > 0 && !g.badReason) el.classList.add("is-invalid");
    }
  });

  document.addEventListener("click", function (e) {
    var mask = $("drawerMask");
    if (!mask || !mask.innerHTML) return;
    if (e.target === mask || e.target.closest("[data-drawer-close]")) closeDrawer();
  });

  $("headerUser").addEventListener("click", function () {
    SEL.confirmDialog({
      title: "退出登录",
      text: "确认退出当前账号「" + user.name + "」？",
      okText: "退出",
      onOk: function () { SEL.logout(); }
    });
  });

  renderInfos();
  renderRows();
  SEL.renderHeaderUser(user);
  SEL.bindNav();
})();
</script>
  <script src="nav.js"></script>
</body>
