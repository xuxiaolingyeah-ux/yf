<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>调拨出库 · 区域药房协同管理系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"/>
        <path d="M8.4 15.6L15.6 8.4"/>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <div class="header-user" id="headerUser" title="点击退出登录">
      <span class="header-avatar">药</span>
      <span class="header-user-name">—</span>
      <svg class="user-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>
</header>

<div class="app-body">
  <aside class="app-side" id="appSide"></aside>
<main class="app-main">
    <div class="tabbar">
      <div class="tab">首页</div>
      <div class="tab" data-href="transfer.html">调拨管理</div>
      <div class="tab active">
        <span id="tabName">调拨出库</span>
        <button class="tab-close" id="tabClose" title="关闭">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
    </div>

    <div class="page sel-page tr-detail">
      <div class="sel-main">
        <div class="page-head">
          <div class="head-back">
            <button class="back-btn" id="btnBack" title="返回调拨列表">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <h1 class="page-title">调拨出库</h1>
            <span class="pa-code" id="headCode">调拨单号：—</span>
          </div>
          <span class="status-text" id="headStatus"></span>
        </div>

        <div class="sel-card">
          <div class="card-body" style="padding:16px;">
            <div class="form-wrap">

              <section class="block">
                <div class="block-head"><h2 class="block-title">申请信息</h2></div>
                <div class="form-grid-4" id="applyInfo"></div>
              </section>

              <section class="block">
                <div class="block-head"><h2 class="block-title">出库信息</h2></div>
                <div class="form-grid-4">
                  <div class="form-item">
                    <span class="form-label">出库机构</span>
                    <input class="input is-readonly" id="fOutOrg" readonly>
                  </div>
                  <div class="form-item">
                    <span class="form-label"><span class="req">*</span>出库库位</span>
                    <select class="select" id="fLocation">
                      <option value="">请选择</option>
                    </select>
                  </div>
                  <div class="form-item">
                    <span class="form-label">出库单号</span>
                    <input class="input is-readonly" id="fOutCode" readonly value="确认出库后生成">
                  </div>
                </div>
              </section>

              <section class="block">
                <div class="block-head">
                  <h2 class="block-title">药品明细</h2>
                  <span class="tr-in-hint">展开药品后按批次录入出库数量，并扫描对应追溯码</span>
                </div>
                <div class="tr-stage-table is-scroll">
                  <table class="data-table tr-tree">
                    <thead>
                      <tr>
                        <th style="width:220px;">药品名称 / 规格</th>
                        <th style="width:105px;">药品编码</th>
                        <th style="width:80px;" class="num">申请数量</th>
                        <th style="width:90px;" class="num">调拨数量</th>
                        <th style="width:115px;" class="num">进货价金额合计</th>
                        <th style="width:115px;" class="num">零售价金额合计</th>
                        <th style="width:125px;">追溯码</th>
                        <th style="width:150px;">操作</th>
                      </tr>
                    </thead>
                    <tbody id="treeBody"></tbody>
                  </table>
                </div>

                <div class="tr-sum-line">
                  <span class="item">申请合计<b id="sumApply">0</b></span>
                  <span class="item">调拨合计<b id="sumAlloc">0</b></span>
                  <span class="item">进货价合计<b id="sumPurchase">0.00</b></span>
                  <span class="item">零售价合计<b id="sumRetail">0.00</b></span>
                </div>
              </section>

            </div>
          </div>

          <div class="tr-out-bar">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnConfirm">确认出库</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-mask" id="modalMask"></div>
<div class="drawer-mask" id="drawerMask"></div>
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastText"></span>
</div>

<script src="mock.js"></script>
<script src="selection-common.js"></script>
<script src="transfer-common.js"></script>
<script>
(function () {
  var $ = SEL.$, esc = SEL.esc;
  var user = TR.user();
  if (!user) return;

  var all = TR.load();
  var bill = SEL.qs("id") ? TR.byId(all, SEL.qs("id")) : null;
  if (!bill || !TR.canOutbound(bill, user)) { location.href = "transfer.html"; return; }
  bill = JSON.parse(JSON.stringify(bill));

  var outOrg = TR.orgKey(user);
  var expanded = {};
  var scanGi = -1;

  /* 每个申请药品确保有对应的批次分组 */
  bill.items.forEach(function (it) {
    var exists = bill.batches.some(function (g) { return g.drugId === it.drugId && g.si === it.si; });
    if (!exists) {
      bill.batches.push({
        key: it.drugId + "_" + it.si, drugId: it.drugId, si: it.si,
        drugName: it.drugName, drugCode: it.drugCode,
        specCode: it.specCode, spec: it.spec, applyQty: it.applyQty,
        rows: []
      });
    }
  });

  function gi(g) { return bill.batches.indexOf(g); }
  function isOpen(g) { return expanded[g.key] !== undefined ? expanded[g.key] : g.rows.length > 0; }
  function diffOf(g) { return g.applyQty - TR.allocated(g); }
  void diffOf;
  function progressHtml(g) {
    var need = TR.allocated(g), got = TR.scanned(g);
    var cls = need === 0 ? "" : (got === need ? "is-ok" : "is-bad");
    return '<span class="tr-code-progress ' + cls + '">已扫 ' + got + " / " + need + "</span>";
  }

  function renderApplyInfo() {
    $("applyInfo").innerHTML =
      infoItem("申请机构", bill.applyOrgName) +
      infoItem("申请库位", bill.applyLocationName) +
      infoItem("提交人", bill.creator) +
      infoItem("提交时间", bill.submitTime) +
      infoItem("审核状态", TR.AUDIT[bill.auditStatus]) +
      '<div class="form-item span-2of4"><span class="form-label">缺药说明</span>' +
        '<span class="text-value">' + esc(bill.shortageDesc || "—") + "</span></div>";
  }
  function infoItem(l, v) {
    return '<div class="form-item"><span class="form-label">' + esc(l) + '</span>' +
      '<span class="text-value">' + esc(v || "—") + "</span></div>";
  }

  function renderLocation() {
    var list = TR.locationsOfOrg(outOrg);
    $("fLocation").innerHTML = '<option value="">请选择</option>' + list.map(function (l) {
      return '<option value="' + l.id + '">' + esc(l.name) + "</option>";
    }).join("");
    $("fOutOrg").value = TR.orgName(outOrg);
    if (bill.outLocation) $("fLocation").value = bill.outLocation;
  }

  function moneyOf(g) {
    var p = 0, r = 0;
    (g.rows || []).forEach(function (x) {
      var q = Number(x.outQty) || 0;
      p += q * (Number(x.purchase) || 0);
      r += q * (Number(x.retail) || 0);
    });
    return { purchase: TR.money(p), retail: TR.money(r) };
  }

  function renderTree() {
    var body = $("treeBody");
    body.innerHTML = bill.batches.map(function (g, idx) {
      var rows = g.rows || [];
      var open = isOpen(g);
      var m = moneyOf(g);
      var html =
        '<tr class="tr-tree-parent">' +
          '<td><button class="tr-expander' + (open ? " is-open" : "") + '" data-toggle="' + idx + '" title="展开/收起">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
          "</button>" + esc(g.drugName) + '<span class="sub">' + esc(g.spec) + "</span></td>" +
          "<td>" + esc(g.drugCode) + "</td>" +
          '<td class="num">' + g.applyQty + "</td>" +
          '<td class="num">' + TR.allocated(g) + "</td>" +
          '<td class="num">' + m.purchase + "</td>" +
          '<td class="num">' + m.retail + "</td>" +
          "<td>" + progressHtml(g) + "</td>" +
          '<td><button class="link-btn" data-add="' + idx + '">添加批次</button>' +
          '<button class="link-btn" data-scan="' + idx + '">扫码</button></td>' +
        "</tr>";

      if (open) {
        html += '<tr class="tr-child-wrap"><td colspan="8"><table class="tr-child-table"><thead><tr>' +
          '<th style="width:112px;">批次号</th>' +
          '<th style="width:210px;">生产企业</th>' +
          '<th style="width:105px;">有效期</th>' +
          '<th style="width:80px;" class="num">进货价</th>' +
          '<th style="width:80px;" class="num">零售价</th>' +
          '<th style="width:90px;" class="num">当前库存</th>' +
          '<th style="width:100px;" class="num">出库数量</th>' +
          '<th style="width:70px;" class="tr-act-cell">操作</th>' +
        "</tr></thead><tbody>";
        if (!rows.length) {
          html += '<tr class="tr-child-empty"><td colspan="8">请点击「添加批次」选择出库批次</td></tr>';
        } else {
          html += rows.map(function (r, ri) {
            var q = Number(r.outQty) || 0;
            return "<tr>" +
              "<td>" + esc(r.batchNo) + "</td>" +
              "<td>" + esc(r.vendor) + "</td>" +
              "<td>" + esc(r.expDate) + "</td>" +
              '<td class="num">' + TR.money(r.purchase) + "</td>" +
              '<td class="num">' + TR.money(r.retail) + "</td>" +
              '<td class="num">' + r.stock + "</td>" +
              '<td class="num"><input class="input tr-qty" type="text" inputmode="numeric" value="' + r.outQty +
                '" data-g="' + idx + '" data-r="' + ri + '"></td>' +
              '<td class="tr-act-cell"><button class="link-btn is-danger" data-rm="' + idx + '" data-ri="' + ri + '">删除</button></td>' +
            "</tr>";
          }).join("");
        }
        html += "</tbody></table></td></tr>";
      }
      return html;
    }).join("");
  }

  function renderTotals() {
    var apply = 0, alloc = 0;
    bill.batches.forEach(function (g) {
      apply += g.applyQty;
      alloc += TR.allocated(g);
    });
    var s = TR.outSums(bill);
    $("sumApply").textContent = apply;
    $("sumAlloc").textContent = alloc;
    $("sumAlloc").classList.toggle("is-bad", alloc !== apply);
    $("sumPurchase").textContent = s.purchase;
    $("sumRetail").textContent = s.retail;
  }

  function renderAll() {
    renderTree();
    renderTotals();
  }

  /* ---------------- 批次选择 ---------------- */
  var pickGi = -1;
  function openBatch(idx) {
    pickGi = idx;
    var g = bill.batches[idx];
    var added = (g.rows || []).map(function (r) { return r.batchNo; });
    var list = TR.batchesOf(g.drugId, g.si);
    var mask = $("modalMask");
    mask.innerHTML =
      '<div class="modal tr-batch-modal">' +
        '<div class="modal-head">' +
          '<span class="modal-title">添加批次 · ' + esc(g.drugName) + " " + esc(g.spec) + "</span>" +
          '<button class="drawer-close" data-close="1"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>' +
        "</div>" +
        '<div class="modal-body">' +
          '<div class="tr-batch-pick"><table class="data-table"><thead><tr>' +
            '<th style="width:40px;"><input type="checkbox" id="batchAll"></th>' +
            '<th style="width:130px;">批次号</th>' +
            "<th>生产企业</th>" +
            '<th style="width:100px;" class="num">当前库存</th>' +
            '<th style="width:110px;">有效期</th>' +
            '<th style="width:90px;" class="num">进货价</th>' +
            '<th style="width:90px;" class="num">零售价</th>' +
          "</tr></thead><tbody id=\"batchBody\"></tbody></table></div>" +
          '<div class="tr-batch-hint">库存为 0 的批次不可选择；已在明细中的批次标注「已添加」。默认按剩余申请量带出出库数量，可继续调整。</div>' +
        "</div>" +
        '<div class="modal-foot">' +
          '<button class="btn" data-close="1">取消</button>' +
          '<button class="btn btn-primary" id="batchOk">添加</button>' +
        "</div>" +
      "</div>";
    mask.classList.add("show");

    $("batchBody").innerHTML = list.length ? list.map(function (b) {
      var already = added.indexOf(b.batchNo) >= 0;
      var disabled = b.stock <= 0 || already;
      return '<tr class="' + (disabled ? "is-disabled" : "") + '">' +
        '<td><input type="checkbox" data-batch="' + esc(b.batchNo) + '"' + (disabled ? " disabled" : "") + "></td>" +
        "<td>" + esc(b.batchNo) + "</td>" +
        "<td>" + esc(b.vendor) + "</td>" +
        '<td class="num">' + b.stock + "</td>" +
        "<td>" + esc(b.expDate) + "</td>" +
        '<td class="num">' + TR.money(b.purchase) + "</td>" +
        '<td class="num">' + TR.money(b.retail) + "</td>" +
      "</tr>";
    }).join("") : '<tr><td colspan="7" class="tr-empty-cell">暂无可选批次</td></tr>';

    $("batchAll").addEventListener("change", function () {
      var on = this.checked;
      [].slice.call($("batchBody").querySelectorAll("input[data-batch]")).forEach(function (cb) {
        if (!cb.disabled) cb.checked = on;
      });
    });
    $("batchOk").addEventListener("click", function () {
      var picked = [].slice.call($("batchBody").querySelectorAll("input[data-batch]:checked"));
      if (!picked.length) { SEL.toast("请先勾选要出库的批次"); return; }
      var need = g.applyQty - TR.allocated(g);
      picked.forEach(function (cb) {
        var batchNo = cb.getAttribute("data-batch");
        var b = list.filter(function (x) { return x.batchNo === batchNo; })[0];
        if (!b) return;
        var qty = Math.max(1, Math.min(b.stock, need > 0 ? need : 1));
        need = Math.max(0, need - qty);
        g.rows.push({
          batchNo: b.batchNo, vendor: b.vendor, stock: b.stock,
          purchase: b.purchase, retail: b.retail, expDate: b.expDate,
          outQty: qty, traceCodes: []
        });
      });
      expanded[g.key] = true;
      SEL.closeModal();
      renderAll();
      SEL.toast("已添加 " + picked.length + " 个批次");
    });
  }

  /* ---------------- 扫码抽屉 ---------------- */
  function closeDrawer() {
    document.body.classList.remove("drawer-open");
    $("drawerMask").innerHTML = "";
    scanGi = -1;
  }

  function openScan(idx) {
    scanGi = idx;
    expanded[bill.batches[idx].key] = true;
    renderTree();
    var mask = $("drawerMask");
    mask.innerHTML =
      '<div class="drawer is-pa">' +
        '<div class="drawer-head">' +
          '<span class="drawer-title">扫码追溯码</span>' +
          '<button class="drawer-close" data-drawer-close="1"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>' +
        "</div>" +
        '<div class="drawer-body tr-scan-body" id="scanBody"></div>' +
        '<div class="drawer-foot"><button class="btn" data-drawer-close="1">关闭</button></div>' +
      "</div>";
    document.body.classList.add("drawer-open");
    renderScanBody();
  }

  function renderScanBody() {
    if (scanGi < 0) return;
    var g = bill.batches[scanGi];
    var body = $("scanBody");
    body.innerHTML =
      '<div class="tr-scan-headline">' +
        '<span class="name">' + esc(g.drugName) + "</span>" +
        '<span class="meta">' + esc(g.spec) + "</span>" +
        '<span class="meta">应扫 ' + TR.allocated(g) + " 个</span>" +
        '<span class="meta">已扫 ' + TR.scanned(g) + " 个</span>" +
      "</div>" +
      '<div class="tr-scan-input">' +
        '<input class="input" id="scanCode" placeholder="扫描或输入追溯码后回车" autocomplete="off">' +
        '<button class="btn" id="scanAdd">添加</button>' +
        '<button class="btn" id="scanAuto">自动补齐（演示）</button>' +
      "</div>" +
      '<div class="tr-scan-tip">支持整行扫码后输入回车，系统按批次自动归集；重复追溯码会自动去重，不属于该药品的追溯码将被忽略。</div>' +
      (g.rows.length ? g.rows.map(function (r, ri) {
        var codes = r.traceCodes || [];
        return '<div class="tr-code-group">' +
          '<div class="tr-code-head"><b>批次 ' + esc(r.batchNo) + "</b>" +
            '<span class="count ' + (codes.length === r.outQty ? "" : "is-bad") + '">已扫 ' + codes.length + " / " + r.outQty + "</span></div>" +
          '<div class="tr-code-chips">' + (codes.length ? codes.map(function (c) {
            return '<span class="tr-code-chip" data-rmcode="' + esc(c) + '" data-g="' + scanGi + '" data-ri="' + ri + '" title="点击移除">' +
              esc(c) + "</span>";
          }).join("") : '<span class="tr-code-empty">尚未扫描追溯码</span>') + "</div>" +
        "</div>";
      }).join("") : '<div class="tr-code-empty">请先在明细中添加批次，再扫描追溯码</div>');

    var input = $("scanCode");
    function submitCode() {
      var code = input.value.trim().toUpperCase();
      if (!code) return;
      var matched = null, ri = -1;
      g.rows.forEach(function (r, i) {
        if (code.indexOf("TRC" + r.batchNo) === 0) { matched = r; ri = i; }
      });
      if (!matched) {
        SEL.toast("该追溯码不属于「" + g.drugName + "」当前批次，已忽略");
        input.value = "";
        return;
      }
      if ((matched.traceCodes || []).indexOf(code) >= 0) {
        SEL.toast("追溯码已扫描，已自动去重");
        input.value = "";
        return;
      }
      if ((matched.traceCodes || []).length >= matched.outQty) {
        SEL.toast("批次 " + matched.batchNo + " 追溯码已达出库数量");
        input.value = "";
        return;
      }
      matched.traceCodes = matched.traceCodes || [];
      matched.traceCodes.push(code);
      renderScanBody();
      setTimeout(function () { var el = $("scanCode"); if (el) el.focus(); }, 0);
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); submitCode(); }
    });
    $("scanAdd").addEventListener("click", submitCode);
    $("scanAuto").addEventListener("click", function () {
      var total = 0;
      g.rows.forEach(function (r) {
        var need = Math.max(0, (r.outQty || 0) - (r.traceCodes || []).length);
        if (!need) return;
        var pool = TR.codesFor(g.drugId, g.si, r.batchNo, r.outQty);
        var existing = r.traceCodes || [];
        pool.forEach(function (c) {
          if (need > 0 && existing.indexOf(c) < 0) { existing.push(c); need--; total++; }
        });
        r.traceCodes = existing;
      });
      renderScanBody();
      renderTree();
      renderTotals();
      SEL.toast("已自动补齐 " + total + " 个追溯码（演示）");
    });
    setTimeout(function () { input.focus(); }, 50);
  }

  /* ---------------- 校验 / 确认出库 ---------------- */
  function confirmOut() {
    var bad = [];
    $("fLocation").classList.remove("is-invalid");
    if (!$("fLocation").value) { $("fLocation").classList.add("is-invalid"); bad.push("出库库位"); }

    var totalRows = 0, qtyBad = false, scanBad = null;
    bill.batches.forEach(function (g) {
      (g.rows || []).forEach(function (r) {
        totalRows++;
        var q = Number(r.outQty) || 0;
        var ok = /^\d+$/.test(String(r.outQty)) && q >= 1 && q <= r.stock;
        if (!ok) qtyBad = true;
        var need = TR.allocated(g);
        if ((r.traceCodes || []).length !== q && !scanBad) {
          scanBad = "批次 " + r.batchNo + " 追溯码已扫 " + (r.traceCodes || []).length + " / " + q;
        }
        if (need < 0) scanBad = scanBad || "已分配数量超出库存";
      });
    });
    if (!totalRows) bad.push("出库批次");
    if (qtyBad) bad.push("出库数量（需为正整数且不超过库存）");
    if (bad.length) { SEL.toast("请完善：" + bad.join("、")); return; }
    if (scanBad) { SEL.toast(scanBad + "，请扫码或使用「自动补齐（演示）」后再提交"); return; }

    var loc = TR.locationsOfOrg(outOrg).filter(function (l) { return l.id === $("fLocation").value; })[0];
    var code = TR.newOutCode(TR.load());
    bill.outOrg = outOrg;
    bill.outOrgName = TR.orgName(outOrg);
    bill.outLocation = loc.id;
    bill.outLocationName = loc.name;
    bill.outCode = code;
    bill.outTime = SEL.fmtNow();
    bill.transferStatus = "in";
    TR.addRecord(bill, "出库", user.name, user.org, "已出库", "出库单号 " + code);
    TR.persist(bill);
    SEL.toast("已确认出库，调拨单号 " + code);
    setTimeout(function () { location.href = "transfer.html"; }, 500);
  }

  /* ---------------- 事件 ---------------- */
  $("headCode").textContent = "调拨单号：" + bill.code;
  $("headStatus").textContent = "调拨状态：" + (TR.TRANSFER[bill.transferStatus] || "—");
  document.title = "调拨出库 " + bill.code + " · 区域药房协同管理系统";
  $("btnBack").addEventListener("click", function () { location.href = "transfer.html"; });
  $("tabClose").addEventListener("click", function () { location.href = "transfer.html"; });
  $("fLocation").addEventListener("change", function () { this.classList.remove("is-invalid"); });
  $("btnConfirm").addEventListener("click", confirmOut);
  $("btnCancel").addEventListener("click", function () { location.href = "transfer.html"; });

  $("treeBody").addEventListener("click", function (e) {
    var t = e.target.closest("[data-toggle]");
    if (t) {
      var g0 = bill.batches[parseInt(t.getAttribute("data-toggle"), 10)];
      expanded[g0.key] = !isOpen(g0);
      renderTree();
      return;
    }
    var add = e.target.closest("[data-add]");
    if (add) { openBatch(parseInt(add.getAttribute("data-add"), 10)); return; }
    var scan = e.target.closest("[data-scan]");
    if (scan) { openScan(parseInt(scan.getAttribute("data-scan"), 10)); return; }
    var rm = e.target.closest("[data-rm]");
    if (rm) {
      var gi0 = parseInt(rm.getAttribute("data-rm"), 10);
      bill.batches[gi0].rows.splice(parseInt(rm.getAttribute("data-ri"), 10), 1);
      renderAll();
    }
  });
  $("treeBody").addEventListener("change", function (e) {
    if (!e.target.classList.contains("tr-qty")) return;
    var idx = parseInt(e.target.getAttribute("data-g"), 10);
    var ri = parseInt(e.target.getAttribute("data-r"), 10);
    var row = bill.batches[idx].rows[ri];
    row.outQty = e.target.value;
    renderAll();
  });

  document.addEventListener("click", function (e) {
    var mask = $("drawerMask");
    if (!mask || !mask.innerHTML) return;
    if (e.target === mask || e.target.closest("[data-drawer-close]")) closeDrawer();
  });
  $("drawerMask").addEventListener("click", function (e) {
    var chip = e.target.closest("[data-rmcode]");
    if (!chip) return;
    var g = bill.batches[parseInt(chip.getAttribute("data-g"), 10)];
    var r = g.rows[parseInt(chip.getAttribute("data-ri"), 10)];
    var code = chip.getAttribute("data-rmcode");
    var at = (r.traceCodes || []).indexOf(code);
    if (at >= 0) r.traceCodes.splice(at, 1);
    renderScanBody();
    renderTree();
  });

  $("headerUser").addEventListener("click", function () {
    SEL.confirmDialog({
      title: "退出登录",
      text: "确认退出当前账号「" + user.name + "」？",
      okText: "退出",
      onOk: function () { SEL.logout(); }
    });
  });

  renderApplyInfo();
  renderLocation();
  renderAll();
  SEL.renderHeaderUser(user);
  SEL.bindNav();
})();
</script>
  <script src="nav.js"></script>
</body>
</html>
