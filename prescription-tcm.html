<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中药医嘱开具 · 中心药房</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ===== 处方管理 · 中药医嘱开具 局部样式 ===== */
.tcm-card {
  flex: 1; min-height: 0; margin: 12px;
  display: flex; flex-direction: column;
  background: var(--bg-white);
  border-radius: var(--radius-lg);
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
  overflow: hidden;
}

/* 工具栏 */
.tcm-toolbar {
  flex: none; height: 48px;
  display: flex; align-items: center; gap: 2px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
}
.tcm-tool {
  height: 30px; padding: 0 10px;
  border: none; background: none; border-radius: var(--radius);
  color: var(--primary-dark); font-size: 13px;
  display: inline-flex; align-items: center; gap: 5px;
  cursor: pointer; white-space: nowrap;
  transition: background .15s, color .15s;
}
.tcm-tool:hover { background: var(--primary-lighter); }
.tcm-tool:active { color: var(--primary); }
.tcm-tool svg { width: 14px; height: 14px; }
.tcm-tool .tcm-key { font-size: 12px; opacity: .75; }
.tcm-meta {
  margin-left: auto; font-size: 12px; color: var(--text-tertiary);
  display: flex; align-items: center; gap: 4px 12px; white-space: nowrap;
}
.tcm-meta > span { display: inline-flex; align-items: center; gap: 4px; }
.tcm-meta .select { height: 28px; font-size: 12px; min-width: 118px; }
.tcm-meta .input { height: 28px; font-size: 12px; width: 180px; }
.tcm-rxname { color: var(--text-secondary); font-weight: 500; }

/* 禁用态 */
.select:disabled, .input:disabled {
  background: #F5F5F5 !important; color: var(--text-placeholder) !important;
  cursor: not-allowed;
}

/* 录入行 */
.tcm-addrow {
  flex: none; height: 46px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: #F7FAFF;
}
.tcm-lbl { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
.tcm-pickwrap { position: relative; width: 300px; flex: none; }
.tcm-pickwrap .input { width: 100%; }
.tcm-pick {
  display: none; position: absolute; left: 0; top: 34px; z-index: 30;
  width: 880px; max-height: 300px; overflow: auto;
  background: #fff; border: 1px solid var(--border-input);
  border-radius: var(--radius); box-shadow: var(--shadow-2);
}
.tcm-pick.show { display: block; }
.tcm-pick-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
.tcm-pick-table thead th {
  position: sticky; top: 0; height: 30px; padding: 0 10px;
  background: var(--table-head); color: var(--text-secondary);
  text-align: left; font-weight: 500; white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
.tcm-pick-table tbody td {
  height: 32px; padding: 0 10px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  border-bottom: 1px solid var(--border-light);
}
.tcm-pick-table tbody tr:hover { background: var(--primary-lighter); cursor: pointer; }
.tcm-pick-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.tcm-pick-none { padding: 16px; text-align: center; color: var(--text-placeholder); font-size: 12px; }
.tcm-qty { width: 72px !important; }
.tcm-addrow .select { min-width: 96px; }
.tcm-unit { font-size: 12px; color: var(--text-tertiary); }
.input.is-invalid, .select.is-invalid { border-color: var(--danger) !important; }

/* 药味区 */
.tcm-herbs {
  flex: 1; min-height: 0; overflow: auto;
  padding: 12px;
  display: flex; flex-wrap: wrap; gap: 10px;
  align-content: flex-start;
}
.tcm-chip {
  flex: 0 0 auto; height: 36px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 8px 0 12px;
  background: var(--primary-lighter);
  border: 1px solid #BEDAFF; border-radius: var(--radius);
  font-size: 13px; color: var(--text-primary);
  white-space: nowrap;
}
.tcm-chip-name { font-weight: 500; flex: 0 0 auto; }
.tcm-chip .input { width: 56px; height: 26px; padding: 0 6px; font-size: 12px; text-align: right; }
.tcm-chip .select { height: 26px; min-width: 84px; font-size: 12px; padding: 0 4px; }
.tcm-chip-x {
  width: 20px; height: 20px; border: none; background: none; border-radius: 50%;
  color: var(--text-tertiary); font-size: 14px; line-height: 1;
  display: grid; place-items: center; cursor: pointer;
}
.tcm-chip-x:hover { background: rgba(0,0,0,.08); color: var(--danger); }
.tcm-empty {
  width: 100%; padding: 72px 0; text-align: center;
  color: var(--text-placeholder); font-size: 13px;
}

/* 汇总条 */
.tcm-sum {
  flex: none; height: 34px;
  display: flex; align-items: center; justify-content: flex-end; gap: 18px;
  padding: 0 16px;
  background: #EAF3FF;
  border-top: 1px solid #D3E5FF;
  font-size: 12px; color: var(--text-secondary);
}
.tcm-sum b { font-weight: 500; color: var(--primary-dark); font-variant-numeric: tabular-nums; }

/* 处方信息区 */
.tcm-rxinfo { flex: none; border-top: 1px solid var(--border); background: var(--bg-white); }
.tcm-rxrow {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 16px 0;
}
.tcm-rxrow:last-child { padding-bottom: 10px; }
.tcm-fld { display: flex; align-items: center; gap: 6px; }
.tcm-fld .input { width: 64px; }
.tcm-fld .select { width: auto; min-width: 92px; }
.tcm-fld.w-diag .select { min-width: 180px; }
.tcm-note { flex: 1; min-width: 140px; max-width: 220px; }
.tcm-rxrow-sep { width: 1px; height: 14px; background: var(--border); flex: none; }
.tcm-chk {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; color: var(--text-primary); cursor: pointer; user-select: none;
}
.tcm-chk input { accent-color: var(--primary, #4080ff); margin: 0; }
.tcm-deliver-link { font-size: 13px; color: var(--primary, #4080ff); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcm-deliver-link:hover { text-decoration: underline; }
.tcm-deliver-link.is-hidden { display: none; }

/* 弹窗 / toast */
.tcm-mask {
  display: none; position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,.35); align-items: center; justify-content: center;
}
.tcm-mask.show { display: flex; }
.tcm-dlg {
  width: 400px; background: #fff; border-radius: var(--radius-lg);
  box-shadow: var(--shadow-2); overflow: hidden;
}
.tcm-dlg-title { padding: 18px 20px 8px; font-size: 15px; font-weight: 500; color: var(--text-primary); }
.tcm-dlg-body { padding: 0 20px 22px; font-size: 13px; line-height: 1.6; color: var(--text-secondary); }
.tcm-dlg-foot { padding: 12px 20px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); }
</style>
</head>

<script src="mock.js"></script>
<script>
(function(){
  "use strict";

  function $(id){ return document.getElementById(id); }
  function esc(v){
    if (v === null || v === undefined || v === "") return "—";
    return String(v).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function money(n){ return (Math.round((Number(n) || 0) * 100) / 100).toFixed(2); }
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function nowStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " "
      + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  var KEY_DRAFT = "RX_TCM_DRAFT_V1";
  var KEY_LIST  = "RX_TCM_LIST_V1";
  var RX_NAME = {
    "中药饮片": "中草药处方",
    "配方颗粒": "中药配方颗粒处方",
    "中药直服饮片": "中药直服饮片处方"
  };

  function drugOf(key){
    for (var i = 0; i < MOCK.tcmHerbs.length; i++){
      if (MOCK.tcmHerbs[i].key === key) return MOCK.tcmHerbs[i];
    }
    return null;
  }
  function unitOf(drug){ return drug && drug.kind === "中药饮片" ? "g" : "袋"; }

  function blankDraft(){
    return {
      pharmacy: "中药房", kind: "中药饮片", rxName: "中草药处方",
      herbs: [], selKey: "",
      doses: "3", usage: "水煎温服", freq: "每日一剂", route: "口服",
      ml: "200", mlUnit: "ml", timing: "饭后服用", diag: "", note: "",
      longRx: false, daifian: false, delivery: null
    };
  }
  function seedDraft(){
    var d = blankDraft();
    var s = MOCK.tcmSeed;
    d.herbs = s.herbs.filter(function(h){ return drugOf(h.key); })
      .map(function(h){ return { key: h.key, qty: String(h.qty), usage: h.usage }; });
    d.doses = String(s.doses); d.usage = s.usage; d.freq = s.freq; d.route = s.route;
    d.ml = String(s.ml); d.timing = s.timing; d.diag = s.diag; d.note = s.note;
    return d;
  }

  function loadDraft(){
    try {
      var raw = sessionStorage.getItem(KEY_DRAFT);
      if (raw){
        var data = JSON.parse(raw);
        if (data && data.v === 1 && data.draft && Array.isArray(data.draft.herbs)){
          data.draft.herbs = data.draft.herbs.filter(function(h){ return drugOf(h.key); });
          return data.draft;
        }
      }
    } catch(e){}
    return seedDraft();
  }
  function persist(){
    try { sessionStorage.setItem(KEY_DRAFT, JSON.stringify({ v: 1, draft: ST })); } catch(e){}
  }
  function loadList(){
    try {
      var raw = sessionStorage.getItem(KEY_LIST);
      if (raw){
        var data = JSON.parse(raw);
        if (data && data.v === 1 && Array.isArray(data.list)) return data.list;
      }
    } catch(e){}
    return [];
  }
  function persistList(list){
    try { sessionStorage.setItem(KEY_LIST, JSON.stringify({ v: 1, list: list })); } catch(e){}
  }

  /* 发送医嘱成功后，同步流转到「门诊医嘱开具」（prescription-western.html 的数据源）。
     含毒麻精药品（attr=毒麻精药品）时以「待审核」进入，由毒麻精审药医生审核。 */
  var KEY_WX = "RX_WX_DATA_V2"; /* 与门诊医嘱开具页保持一致（V2） */
  function wxRows(){
    try {
      var raw = sessionStorage.getItem(KEY_WX);
      if (raw){
        var data = JSON.parse(raw);
        if (data && data.v === 1 && Array.isArray(data.rows)) return data.rows;
      }
    } catch(e){}
    return JSON.parse(JSON.stringify(MOCK.rxOrders));
  }
  function persistWx(rows){
    try { sessionStorage.setItem(KEY_WX, JSON.stringify({ v: 1, rows: rows })); } catch(e){}
  }

  var ST = loadDraft();

  /* ---------------- 计算 ---------------- */
  function herbPrice(h){
    var d = drugOf(h.key);
    return d ? (Number(h.qty) || 0) * d.price : 0;
  }
  function sums(){
    var doses = Number(ST.doses) || 0;
    var w = 0, a = 0;
    ST.herbs.forEach(function(h){
      w += Number(h.qty) || 0;
      a += herbPrice(h);
    });
    return { cnt: ST.herbs.length, weight: w * doses, amount: a * doses };
  }

  /* ---------------- 渲染 ---------------- */
  function usageOptions(cur){
    var html = '<option value="">请选择</option>';
    MOCK.tcmUsage.forEach(function(u){
      html += '<option' + (u === cur ? " selected" : "") + '>' + u + '</option>';
    });
    return html;
  }

  function renderHerbs(){
    var box = $("tcmHerbs");
    if (!ST.herbs.length){
      box.innerHTML = '<div class="tcm-empty">暂无处方药味，请通过上方录入行搜索药品并添加</div>';
      return;
    }
    box.innerHTML = ST.herbs.map(function(h, i){
      var d = drugOf(h.key);
      return '<div class="tcm-chip" data-i="' + i + '">'
        + '<span class="tcm-chip-name" title="' + esc(d.name) + '（' + esc(d.spec) + '）">' + esc(d.name) + '</span>'
        + '<input class="input tcm-chip-qty" data-i="' + i + '" type="number" min="0.5" step="0.5" value="' + esc(h.qty) + '">'
        + '<span class="tcm-unit">' + unitOf(d) + '</span>'
        + '<select class="select tcm-chip-usage" data-i="' + i + '">' + usageOptions(h.usage) + '</select>'
        + '<button class="tcm-chip-x" data-i="' + i + '" title="删除该药味">×</button>'
        + '</div>';
    }).join("");
  }

  function renderSum(){
    var s = sums();
    $("sumCnt").textContent = s.cnt;
    $("sumWeight").textContent = s.weight;
    $("sumAmount").textContent = money(s.amount);
  }

  function syncForm(){
    $("tcmPharmacy").value = ST.pharmacy;
    $("tcmKind").value = ST.kind;
    // 药味 > 0 时禁用药品种类
    $("tcmKind").disabled = ST.herbs.length > 0;
    $("tcmRxName").value = ST.rxName || RX_NAME[ST.kind] || "中草药处方";
    $("tcmDoses").value = ST.doses;
    $("tcmUsage").value = ST.usage;
    $("tcmFreq").value = ST.freq;
    $("tcmRoute").value = ST.route;
    $("tcmMl").value = ST.ml;
    $("tcmMlUnit").value = ST.mlUnit || "ml";
    $("tcmTiming").value = ST.timing;
    $("tcmDiag").value = ST.diag;
    $("tcmNote").value = ST.note;
    $("tcmLongRx").checked = !!ST.longRx;
    $("tcmDaifian").checked = !!ST.daifian;
    syncDeliverLink();
    var d = drugOf(ST.selKey);
    $("tcmDrugInput").value = d ? d.name : "";
  }

  /* 代煎外送地址入口：勾选代煎后展示，显示地址填写状态 */
  function syncDeliverLink(){
    var link = $("tcmDeliverLink");
    if (!ST.daifian){
      link.classList.add("is-hidden");
      link.textContent = "";
      return;
    }
    link.classList.remove("is-hidden");
    link.textContent = ST.delivery
      ? "外送地址：" + ST.delivery.full + "（点击修改）"
      : "请填写外送地址（必填）";
  }

  function renderAll(){
    renderHerbs(); renderSum(); syncForm();
  }

  /* ---------------- 药品选择 ---------------- */
  function matchDrug(d, q){
    if (d.kind !== ST.kind) return false;
    if (!q) return true;
    q = q.toLowerCase();
    return (d.name + d.py + d.vendor).toLowerCase().indexOf(q) >= 0;
  }
  function renderPick(q){
    var list = MOCK.tcmHerbs.filter(function(d){ return matchDrug(d, q); });
    if (!list.length){
      $("tcmPickBody").innerHTML = '<tr><td colspan="9" class="tcm-pick-none">当前药品种类下无匹配药品</td></tr>';
      return;
    }
    $("tcmPickBody").innerHTML = list.map(function(d){
      return '<tr data-key="' + d.key + '">'
        + '<td>' + esc(d.name) + '</td>'
        + '<td>' + esc(d.spec) + '</td>'
        + '<td>' + esc(d.kind) + '</td>'
        + '<td class="num">' + d.stock + unitOf(d) + '</td>'
        + '<td class="num">' + money(d.price) + '</td>'
        + '<td>' + esc(d.attr) + '</td>'
        + '<td>' + esc(d.insLevel) + '</td>'
        + '<td title="' + esc(d.insNote) + '">' + esc(d.insNote) + '</td>'
        + '<td title="' + esc(d.vendor) + '">' + esc(d.vendor) + '</td>'
        + '</tr>';
    }).join("");
  }
  function openPick(){
    renderPick($("tcmDrugInput").value.trim());
    $("tcmPick").classList.add("show");
  }
  function closePick(){ $("tcmPick").classList.remove("show"); }

  function selectDrug(key){
    var d = drugOf(key);
    if (!d) return;
    ST.selKey = key;
    $("tcmDrugInput").value = d.name;
    $("tcmDrugInput").classList.remove("is-invalid");
    closePick();
    $("tcmQty").focus();
  }

  /* ---------------- 添加药味 ---------------- */
  function addHerb(){
    var d = drugOf(ST.selKey);
    if (!d){
      $("tcmDrugInput").classList.add("is-invalid");
      toast("请先选择药品");
      return;
    }
    var qty = Number($("tcmQty").value);
    if (!(qty > 0)){
      $("tcmQty").classList.add("is-invalid");
      toast("请填写数量");
      return;
    }
    for (var i = 0; i < ST.herbs.length; i++){
      if (ST.herbs[i].key === d.key){
        toast("「" + d.name + "」已在处方中，可直接在药味卡片上修改数量");
        return;
      }
    }
    ST.herbs.push({ key: d.key, qty: String(qty), usage: $("tcmHerbUsage").value });
    ST.selKey = "";
    $("tcmDrugInput").value = "";
    $("tcmQty").value = "";
    $("tcmHerbUsage").value = "";
    persist();
    renderHerbs(); renderSum();
    $("tcmDrugInput").focus();
  }

  /* ---------------- 发送 / 重置 ---------------- */
  function setInvalid(el, bad){ if (el) el.classList.toggle("is-invalid", !!bad); }

  /* 代煎外送地址弹窗：保存后写入草稿；取消视为放弃勾选代煎（由调用方决定） */
  function openDeliverDialog(onCancel){
    AddrDialog.open({
      title: "代煎外送地址",
      defaults: ST.delivery || {},
      onSave: function(addr){
        ST.delivery = addr;
        persist();
        syncDeliverLink();
        toast("外送地址已保存");
      },
      onCancel: onCancel
    });
  }

  function sendRx(){
    var errs = [];
    if (!ST.herbs.length) errs.push("至少 1 味药品");
    var badQty = false;
    ST.herbs.forEach(function(h){ if (!(Number(h.qty) > 0)) badQty = true; });
    if (badQty) errs.push("药味数量须大于 0");
    var doses = Number(ST.doses);
    setInvalid($("tcmDoses"), !(doses >= 1));
    if (!(doses >= 1)) errs.push("剂数");
    setInvalid($("tcmDiag"), !ST.diag);
    if (!ST.diag) errs.push("诊断");
    /* 选择代煎后必须录入外送地址 */
    if (ST.daifian && !ST.delivery) errs.push("外送地址（已选代煎）");
    if (errs.length){
      toast("请完善：" + errs.join("、"));
      /* 未填外送地址时直接打开地址弹窗引导录入 */
      if (ST.daifian && !ST.delivery) openDeliverDialog();
      return;
    }
    var s = sums();
    var diagName = ST.diag;
    MOCK.diagnoses.forEach(function(g){ if (g.code === ST.diag) diagName = g.name; });
    confirmDialog(
      "发送医嘱",
      "将发送当前" + (ST.rxName || RX_NAME[ST.kind] || "处方") + "（共 " + s.cnt + " 种药，剂数 " + doses
        + " 剂，总金额 " + money(s.amount) + " 元），发送后流转至门诊医嘱开具。",
      "发送",
      function(){
        var list = loadList();
        var d = new Date();
        var code = "CF" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + pad(list.length + 1 + 100).slice(-2);
        var rxNameText = ST.rxName || RX_NAME[ST.kind] || "中草药处方";
        list.push({
          id: "tcmrx" + Date.now(), code: code, time: nowStr(), status: "pending",
          pharmacy: ST.pharmacy, kind: ST.kind, rxName: rxNameText,
          herbs: ST.herbs.map(function(h){
            var drug = drugOf(h.key);
            return {
              key: h.key, name: drug.name, spec: drug.spec, qty: Number(h.qty),
              unit: unitOf(drug), usage: h.usage, price: drug.price,
              amount: Number(money(herbPrice(h) * doses))
            };
          }),
          doses: doses, usage: ST.usage, freq: ST.freq, route: ST.route,
          ml: Number(ST.ml) || 0, mlUnit: ST.mlUnit || "ml", timing: ST.timing,
          diag: ST.diag, diagName: diagName, note: ST.note,
          longRx: !!ST.longRx, daifian: !!ST.daifian,
          delivery: ST.daifian ? ST.delivery : null,
          weight: s.weight, amount: Number(money(s.amount))
        });
        persistList(list);

        // 流转到「门诊医嘱开具」：整张处方作为一条医嘱明细
        var narc = false;
        ST.herbs.forEach(function(h){
          var drug = drugOf(h.key);
          if (drug && drug.attr === "毒麻精药品") narc = true;
        });
        var rows = wxRows();
        rows.push({
          id: "rxo-tcm-" + Date.now(), source: "tcm",
          status: narc ? "pending" : "unsent", needAudit: narc, audited: false,
          mark: ST.kind, time: nowStr(),
          drugKey: "", drugName: rxNameText, spec: "共 " + s.cnt + " 味", specCode: "",
          content: rxNameText + "（" + s.cnt + " 味 × " + doses + " 剂，" + ST.usage + "，" + ST.freq + "）："
            + ST.herbs.map(function(h){
              var drug = drugOf(h.key);
              return drug.name + " " + h.qty + unitOf(drug) + (h.usage ? "（" + h.usage + "）" : "");
            }).join("、"),
          groupNo: "", dose: doses, doseUnit: "剂",
          freq: ST.freq, route: ST.route, days: doses,
          drip: "", dripUnit: "滴/分",
          total: doses, totalUnit: "剂",
          price: Number(money(s.amount / doses)), amount: Number(money(s.amount)),
          pharmacy: ST.pharmacy, pharmacies: [ST.pharmacy],
          insFlag: "—", insClass: "—", insCode: "—", insName: "中药饮片",
          note: ST.note || "",
          longRx: !!ST.longRx, daifian: !!ST.daifian,
          delivery: ST.daifian ? ST.delivery : null
        });
        persistWx(rows);

        var kind = ST.kind;
        ST = blankDraft();
        ST.kind = kind;
        persist();
        renderAll();
        toast(narc
          ? "医嘱已发送至门诊医嘱开具；含毒麻精药品，已进入待审核，待毒麻精审药医生审核"
          : "医嘱已发送至门诊医嘱开具");
      }
    );
  }

  function resetRx(){
    if (!ST.herbs.length && !ST.diag && !ST.note){
      toast("当前已是空白处方");
      return;
    }
    confirmDialog("重置处方", "将清空已录入的 " + ST.herbs.length + " 味药品及处方信息，确认重置吗？", "重置", function(){
      var kind = ST.kind;
      ST = blankDraft();
      ST.kind = kind;
      persist();
      renderAll();
      toast("已重置");
    });
  }

  /* ---------------- 弹窗 / toast ---------------- */
  var dlgOk = null;
  function confirmDialog(title, body, okText, onOk){
    $("tcmDlgTitle").textContent = title;
    $("tcmDlgBody").textContent = body;
    $("tcmDlgOk").textContent = okText || "确定";
    dlgOk = onOk;
    $("tcmMask").classList.add("show");
  }
  function closeDialog(){
    $("tcmMask").classList.remove("show");
    dlgOk = null;
  }

  var toastTimer = null;
  function toast(msg){
    var el = $("tcmToast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
  }

  /* ---------------- 事件绑定 ---------------- */
  function bind(){
    $("btnSend").onclick = sendRx;
    $("btnReset").onclick = resetRx;
    $("btnAdd").onclick = addHerb;

    // 药品种类切换：已有药味时需确认清空
    $("tcmKind").addEventListener("change", function(){
      var v = this.value;
      var doSwitch = function(){
        ST.kind = v;
        ST.selKey = "";
        $("tcmDrugInput").value = "";
        persist();
        renderAll();
      };
      if (ST.herbs.length){
        var self = this;
        confirmDialog(
          "切换药品种类",
          "切换为「" + v + "」将清空已添加的 " + ST.herbs.length + " 味药品，确认切换吗？",
          "切换",
          doSwitch
        );
        // 取消时还原下拉显示
        var old = ST.kind;
        dlgCancelRestore = function(){ self.value = old; };
      } else {
        doSwitch();
      }
    });

    // 药品选择
    $("tcmDrugInput").addEventListener("focus", openPick);
    $("tcmDrugInput").addEventListener("input", function(){
      ST.selKey = "";
      this.classList.remove("is-invalid");
      openPick();
    });
    $("tcmPickBody").addEventListener("click", function(e){
      var tr = e.target.closest("tr[data-key]");
      if (tr) selectDrug(tr.getAttribute("data-key"));
    });
    document.addEventListener("click", function(e){
      if (!e.target.closest(".tcm-pickwrap")) closePick();
    });

    $("tcmQty").addEventListener("input", function(){ this.classList.remove("is-invalid"); });
    $("tcmQty").addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); addHerb(); }
    });

    // 药味卡片：改数量 / 改用法 / 删除（下标定位）
    $("tcmHerbs").addEventListener("input", function(e){
      var inp = e.target.closest(".tcm-chip-qty");
      if (!inp) return;
      var i = Number(inp.getAttribute("data-i"));
      if (ST.herbs[i]){
        ST.herbs[i].qty = inp.value;
        persist();
        renderSum();
      }
    });
    $("tcmHerbs").addEventListener("change", function(e){
      var sel = e.target.closest(".tcm-chip-usage");
      if (!sel) return;
      var i = Number(sel.getAttribute("data-i"));
      if (ST.herbs[i]){
        ST.herbs[i].usage = sel.value;
        persist();
      }
    });
    $("tcmHerbs").addEventListener("click", function(e){
      var btn = e.target.closest(".tcm-chip-x");
      if (!btn) return;
      var i = Number(btn.getAttribute("data-i"));
      var h = ST.herbs[i];
      if (!h) return;
      var d = drugOf(h.key);
      ST.herbs.splice(i, 1);
      persist();
      renderHerbs(); renderSum();
      toast("已删除「" + (d ? d.name : "") + "」");
    });

    // 处方信息字段
    $("tcmPharmacy").addEventListener("change", function(){ ST.pharmacy = this.value; persist(); });
    $("tcmRxName").addEventListener("input", function(){ ST.rxName = this.value; persist(); });
    $("tcmDoses").addEventListener("input", function(){
      ST.doses = this.value;
      setInvalid(this, false);
      persist(); renderSum();
    });
    $("tcmUsage").addEventListener("change", function(){ ST.usage = this.value; persist(); });
    $("tcmFreq").addEventListener("change", function(){ ST.freq = this.value; persist(); });
    $("tcmRoute").addEventListener("change", function(){ ST.route = this.value; persist(); });
    $("tcmMl").addEventListener("input", function(){ ST.ml = this.value; persist(); });
    $("tcmMlUnit").addEventListener("change", function(){ ST.mlUnit = this.value; persist(); });
    $("tcmTiming").addEventListener("change", function(){ ST.timing = this.value; persist(); });
    $("tcmDiag").addEventListener("change", function(){
      ST.diag = this.value;
      setInvalid(this, false);
      persist();
    });
    $("tcmNote").addEventListener("input", function(){ ST.note = this.value; persist(); });

    // 长处方 / 代煎：勾选代煎必须录入外送地址
    $("tcmLongRx").addEventListener("change", function(){ ST.longRx = this.checked; persist(); });
    $("tcmDaifian").addEventListener("change", function(){
      var self = this;
      if (this.checked){
        ST.daifian = true;
        persist();
        syncDeliverLink();
        /* 勾选代煎立即弹出地址录入；取消则回退勾选 */
        openDeliverDialog(function(){
          ST.daifian = false;
          ST.delivery = null;
          persist();
          syncForm();
          toast("已取消代煎（需先填写外送地址）");
        });
      } else {
        ST.daifian = false;
        ST.delivery = null;
        persist();
        syncDeliverLink();
      }
    });
    $("tcmDeliverLink").addEventListener("click", function(){ openDeliverDialog(); });

    // 快捷键 Alt+A 发送 / Alt+R 重置
    document.addEventListener("keydown", function(e){
      if (e.altKey && !e.ctrlKey && !e.metaKey){
        var k = (e.key || "").toLowerCase();
        if (k === "a"){ e.preventDefault(); sendRx(); }
        else if (k === "r"){ e.preventDefault(); resetRx(); }
      }
      if (e.key === "Escape"){
        if ($("tcmMask").classList.contains("show")) closeDialog();
        else closePick();
      }
    });

    // 弹窗
    $("tcmDlgCancel").onclick = function(){
      closeDialog();
      if (dlgCancelRestore){ dlgCancelRestore(); dlgCancelRestore = null; }
    };
    $("tcmDlgOk").onclick = function(){
      var fn = dlgOk;
      closeDialog();
      dlgCancelRestore = null;
      if (fn) fn();
    };
    $("tcmMask").addEventListener("click", function(e){
      if (e.target === this){
        closeDialog();
        if (dlgCancelRestore){ dlgCancelRestore(); dlgCancelRestore = null; }
      }
    });
  }
  var dlgCancelRestore = null;

  /* ---------------- 初始化 ---------------- */
  $("tcmHerbUsage").innerHTML = usageOptions("");
  $("tcmDiag").innerHTML = '<option value="">请选择</option>' + MOCK.diagnoses.map(function(g){
    return '<option value="' + g.code + '">' + esc(g.code + " " + g.name) + '</option>';
  }).join("");
  bind();
  renderAll();
})();
</script>
