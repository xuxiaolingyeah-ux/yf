<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>药品目录管理（V2） · 中心药房</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ==================== V2 专用样式 ==================== */

/* 基本信息：4 列键值 */
.kv-grid.kv4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 24px; }

/* 药品规格：左品规 / 右厂商 双栏 */
.spec2 { display: grid; grid-template-columns: minmax(0, 62fr) minmax(0, 38fr); gap: 14px; align-items: stretch; min-height: 250px; }
.pane2 {
  display: flex; flex-direction: column; min-width: 0; max-width: 100%;
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  background: var(--bg-white); overflow: hidden;
}
.pane2.left { min-width: 0; }
.pane2.right { min-width: 0; }
.pane2-head {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-page);
}
.pane2-title { font-size: 13px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.pane2-title .count { font-size: 12px; font-weight: 400; color: var(--text-tertiary); }
.pane2-tip { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pane2-body { flex: 1; min-height: 0; width: 100%; overflow: auto; }


/* 通用表格（可横向滚动 + 冻结列） */
.gt { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; table-layout: fixed; }
.gt th {
  position: sticky; top: 0; z-index: 2;
  background: #F2F4F7; color: var(--text-secondary); font-weight: 500; text-align: left;
  padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.gt td {
  padding: 8px; border-bottom: 1px solid var(--border);
  color: var(--text-primary); white-space: nowrap; background: var(--bg-white);
  overflow: hidden; text-overflow: ellipsis;
}
.gt tbody tr { cursor: pointer; }
.gt tbody tr:hover td { background: var(--primary-lighter); }
.gt tr.sel td { background: var(--primary-lighter); }
.gt .frzn { position: sticky; z-index: 1; background: var(--bg-white); border-left: 1px solid var(--border); }
.gt .frzn.s1 { right: 108px; box-shadow: -8px 0 10px -8px rgba(15, 23, 42, .28); }
.gt .frzn.s2 { right: 0; box-shadow: -4px 0 8px -4px rgba(0, 0, 0, 0.15); }
.gt tr.sel .frzn { background: var(--primary-lighter); }
.gt th.frzn { z-index: 3; }
.gt td.nm { overflow: hidden; text-overflow: ellipsis; }
.reg2 { min-width: 820px; }
.vend2 { min-width: 452px; }
.gt .link-btn { white-space: nowrap; font-size: 12px; }
.gt .link-btn + .link-btn { margin-left: 7px; }

.spec-ctx {
  margin: 0 0 12px; padding: 8px 12px; border-radius: var(--radius);
  background: var(--bg-page); border: 1px solid var(--border);
  font-size: 12px; color: var(--text-secondary);
}

.spec-ctx {
  margin: 0 0 12px; padding: 8px 12px; border-radius: var(--radius);
  background: var(--bg-page); border: 1px solid var(--border);
  font-size: 12px; color: var(--text-secondary);
}

/* 新增厂商：企业搜索下拉 */
.eg-field.is-full { grid-column: 1 / -1; }
.vd-wrap { position: relative; flex: 1; min-width: 0; }
.vd-menu {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
  max-height: 220px; overflow: auto; background: var(--bg-white);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(15, 23, 42, .12); display: none;
}
.vd-menu.is-open { display: block; }
.vd-opt { padding: 8px 12px; font-size: 13px; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.vd-opt:hover { background: var(--primary-lighter); }
.vd-sub { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
.vd-empty { padding: 12px; font-size: 12px; color: var(--text-tertiary); text-align: center; }

/* 空态 */
.empty2 {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  min-height: 180px; color: var(--text-tertiary); font-size: 13px;
}
.empty2 .box { width: 40px; height: 30px; border: 1px dashed var(--border-input); border-radius: var(--radius); }

/* 禁用按钮 */
.btn[disabled], .btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn[disabled]:hover { border-color: var(--border-btn); color: var(--text-secondary); background: var(--bg-white); }

/* 抽屉内分组分隔线（无标题） */
.flag-divider { border-top: 1px dashed var(--border-light); margin: 14px 0 12px; }
</style>
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"/>
        <path d="M8.4 15.6L15.6 8.4"/>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <button class="header-icon" title="通知">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      </svg>
    </button>
    <div class="header-user">
      <div class="header-avatar">张</div>
      <span class="header-user-name">张明远</span>
    </div>
  </div>
</header>

<div class="app-body">
  <!-- ========== 左侧导航 ========== -->
  <aside class="app-side" id="appSide"></aside>
  <!-- ========== 主区域 ========== -->
  <main class="app-main">
    <div class="tabbar">
      <div class="tab" data-nav="首页">首页</div>
      <div class="tab active">
        药品目录管理（V2）
        <button class="tab-close" title="关闭">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M5 5l14 14M19 5L5 19"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="page">
      <div class="page-head">
        <h1 class="page-title">药品目录管理（V2）</h1>
        <div class="page-acts">
          <button class="btn btn-primary" id="btnAdd">新增药品</button>
        </div>
      </div>

      <div class="page-body">
        <!-- ---------- 左栏：筛选 + 药品列表 ---------- -->
        <section class="lbar">
          <div class="lfilter">
            <input class="input" id="kw" placeholder="药品名称 / 编码 / 拼音码" autocomplete="off">
            <div class="lfilter-row">
              <select class="select" id="kind">
                <option value="">全部种类</option>
              </select>
              <select class="select" id="status">
                <option value="">全部状态</option>
                <option value="on">启用</option>
                <option value="off">停用</option>
              </select>
            </div>
            <div class="lfilter-acts">
              <button class="btn btn-sm" id="btnReset">重置</button>
              <button class="btn btn-primary btn-sm" id="btnSearch">查询</button>
            </div>
          </div>

          <div class="llist" id="drugList"></div>
          <div class="pager">
            <span id="pagerInfo">共 0 条</span>
            <span class="pager-ctrl">
              <button class="pager-btn" id="prevPage" title="上一页">
                <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 6l-6 6 6 6"/>
                </svg>
              </button>
              <span class="pager-num" id="pagerNum">1</span>
              <button class="pager-btn" id="nextPage" title="下一页">
                <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 6l6 6-6 6"/>
                </svg>
              </button>
            </span>
          </div>
        </section>

        <!-- ---------- 右栏：药品详情 ---------- -->
        <section class="rbar" id="detail"></section>
      </div>
    </div>
  </main>
</div>

<!-- ========== 通用抽屉 ========== -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-title" id="drawerTitle">详情</span>
    <button class="drawer-close" id="drawerClose" title="关闭">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M5 5l14 14M19 5L5 19"/>
      </svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<!-- ========== 通用弹窗容器 ========== -->
<div class="modal-mask" id="modalMask"></div>

<!-- ========== Toast ========== -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6L9 17l-5-5"/>
  </svg>
  <span id="toastText"></span>
</div>

<script src="mock.js"></script>
<script>
(function () {
  "use strict";

  var PAGE_SIZE = 5;
  var state = { keyword: "", kind: "", status: "", page: 1, activeId: "", activeSpec: 0 };
  var filtered = [];

  var $ = function (id) { return document.getElementById(id); };

  /* ==================== 初始化 ==================== */
  function loadPendingDrugs() {
    var pending = [];
    try {
      pending = JSON.parse(sessionStorage.getItem("pendingDrugs") || "[]");
    } catch (e) {
      pending = [];
    }
    if (!pending.length) return;

    pending.forEach(function (d) {
      if (MOCK.drugs.some(function (x) { return x.code === d.code; })) return;
      if (d.insClass && d.insClass !== "—") {
        MOCK.insMap[d.id] = { leaf: d.insClass, path: d.insClass };
      }
      MOCK.drugs.unshift(d);
    });

    sessionStorage.removeItem("pendingDrugs");
    sessionStorage.removeItem("pendingDrugsIns");
    MOCK.total = MOCK.drugs.length;
  }

  function init() {
    loadPendingDrugs();

    MOCK.kinds.forEach(function (k) {
      var o = document.createElement("option");
      o.value = k; o.textContent = k;
      $("kind").appendChild(o);
    });

    var first = MOCK.drugs[0];
    state.activeId = first.id;
    state.activeSpec = 0;

    bindEvents();
    doSearch(false);
  }

  /* ==================== 筛选 + 列表 ==================== */
  function doSearch(resetPage) {
    if (resetPage) state.page = 1;
    state.keyword = $("kw").value.trim();
    state.kind = $("kind").value;
    state.status = $("status").value;

    var kw = state.keyword.toLowerCase();
    filtered = MOCK.drugs.filter(function (d) {
      var hitKw = !kw ||
        d.name.toLowerCase().indexOf(kw) > -1 ||
        d.code.indexOf(kw) > -1 ||
        d.py.toLowerCase().indexOf(kw) > -1;
      var hitKind = !state.kind || d.kind === state.kind;
      var hitStatus = !state.status || d.status === state.status;
      return hitKw && hitKind && hitStatus;
    });

    var pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (state.page > pages) state.page = pages;

    var exists = filtered.some(function (d) { return d.id === state.activeId; });
    if (!exists && filtered.length) state.activeId = filtered[0].id;

    renderList();
    renderDetail();
  }

  function renderList() {
    var box = $("drugList");
    var start = (state.page - 1) * PAGE_SIZE;
    var rows = filtered.slice(start, start + PAGE_SIZE);

    if (!rows.length) {
      box.innerHTML = '<div class="empty">没有符合条件的药品</div>';
    } else {
      box.innerHTML = rows.map(function (d) {
        var active = d.id === state.activeId ? " active" : "";
        var off = d.status === "off" ? " is-off" : "";
        var dotCls = d.status === "on" ? "on" : "off";
        return '<div class="drug-item' + active + off + '" data-id="' + d.id + '">' +
          '<span class="dot ' + dotCls + '" title="' + (d.status === 'on' ? '启用' : '停用') + '"></span>' +
          '<span class="di-name" title="' + d.name + '">' + d.name + '</span>' +
          '<button class="di-more" data-id="' + d.id + '" title="更多操作">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">' +
              '<circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"/>' +
              '<circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>' +
              '<circle cx="19" cy="12" r="1.2" fill="currentColor" stroke="none"/>' +
            '</svg>' +
          '</button>' +
        '</div>';
      }).join("");
    }

    var pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    $("pagerInfo").textContent = "共 " + filtered.length + " 条";
    $("pagerNum").textContent = state.page + " / " + pages;
    $("prevPage").disabled = state.page <= 1;
    $("nextPage").disabled = state.page >= pages;
  }

  /* ==================== 工具 ==================== */
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function activeDrug() {
    return MOCK.drugs.filter(function (d) { return d.id === state.activeId; })[0];
  }

  function vendorOf(name) {
    return (MOCK.vendors || []).filter(function (m) { return m.name === name; })[0] || null;
  }

  /* 演示用：由批准文号派生稳定的药品编码（正式环境由主数据系统同步回填） */
  function vendorCode(v) {
    if (v.drugCode) return v.drugCode;
    var digits = (v.approval || "").replace(/\D/g, "");
    if (!digits) return "—";
    return "8690" + ("00000000" + digits).slice(-8);
  }

  /* 单元格：label 在左、值在右 */
  function egCell(label, inner, cls) {
    return '<div class="eg-field' + (cls ? " " + cls : "") + '">' +
      '<span class="eg-label">' + label + '</span>' + inner + '</div>';
  }

  function egRead(label, val, mono, cls) {
    var v = (val === null || val === undefined || val === "") ? "—" : String(val);
    return egCell(label, '<span class="eg-val' + (mono ? " mono" : "") + '" title="' + esc(v) + '">' + esc(v) + '</span>', cls);
  }

  function egInput(label, val, ph, attr, dis, cls) {
    return egCell(label,
      '<input class="input" value="' + esc(val || "") + '" placeholder="' + esc(ph || "") + '"' + attr + (dis ? " disabled" : "") + '>', cls);
  }

  function egSelect(label, val, opts, attr, dis, cls) {
    return egCell(label,
      '<select class="select"' + attr + (dis ? " disabled" : "") + '>' +
        opts.map(function (o) {
          return '<option' + (o === val ? " selected" : "") + '>' + o + '</option>';
        }).join("") + '</select>', cls);
  }

  function egSwitch(label, on, attr, cls) {
    return egCell(label,
      '<label class="switch"><input type="checkbox"' + (on ? " checked" : "") + attr + '><span class="track"></span></label>', cls);
  }

  /* ==================== 右栏详情 ==================== */
  function markRows(m) {
    return [
      ["精神药品", m.spirit ? "是 · " + m.spirit : "否"],
      ["毒性药品", m.toxic ? "是" : "否"],
      ["麻醉药品", m.narcotic ? "是" : "否"],
      ["抗菌药物", m.antibiotic || "否"],
      ["抗肿瘤药物", m.antitumor || "否"],
      ["高警示药品", m.highAlert ? m.highAlert + " 级" : "否"],
      ["过敏药物", m.allergy && m.allergy.length ? m.allergy.join("/") : "否"],
      ["是否皮试", m.skinTest ? "是" : "否"],
      ["长处方", m.longTerm ? "是" : "否"],
      ["OTC", m.otc ? "是" : "否"]
    ];
  }

  function renderDetail() {
    var drug = activeDrug();
    var box = $("detail");

    if (!drug) {
      box.innerHTML = '<div class="empty">请在左侧选择药品</div>';
      return;
    }

    /* 选中品规越界保护 */
    var nSpec = drug.specs.length;
    if (state.activeSpec >= nSpec) state.activeSpec = nSpec ? nSpec - 1 : 0;
    var selSpec = drug.specs[state.activeSpec] || null;

    var tradeName = MOCK.tradeNames[drug.id];
    var drugName = tradeName ? drug.name + "（" + tradeName + "）" : drug.name;
    var ins = (MOCK.insMap && MOCK.insMap[drug.id]) || null;

    /* ---- 基本信息（特殊药品标识并入，无小标题） ---- */
    var kv = [
      ["品种编码", drug.code, true],
      ["品种名称", drug.name, false],
      ["药品名称", drugName, false],
      ["药品拼音码", drug.py, true],
      ["药品英文名", drug.en, false],
      ["药品种类", drug.kind, false],
      ["药品分类", drug.category, false],
      ["剂型", drug.form, false],
      ["医保药品分类", ins ? ins.leaf : drug.insClass, false, ins ? ins.path : ""],
      ["DDD", drug.ddd ? drug.ddd + " " + drug.dddUnit : "—", false]
    ].concat(markRows(drug.marks));

    var kvHtml = kv.map(function (item) {
      return '<div class="kv"><span class="kv-label">' + item[0] + '：</span>' +
        '<span class="kv-value' + (item[2] ? " mono" : "") + '" title="' + esc(item[3] || item[1]) + '">' + esc(item[1]) + '</span></div>';
    }).join("");

    /* ---- 品规列表 ---- */
    var regHtml;
    if (!nSpec) {
      regHtml = '<div class="empty2"><div class="box"></div>暂无品规，点击「新增品规」创建</div>';
    } else {
      regHtml =
        '<table class="gt reg2">' +
          '<colgroup>' +
            '<col style="width:88px"><col style="width:76px"><col style="width:80px">' +
            '<col style="width:64px"><col style="width:64px"><col style="width:64px">' +
            '<col style="width:64px"><col style="width:88px"><col style="width:64px">' +
            '<col style="width:60px"><col style="width:108px">' +
          '</colgroup>' +
          '<thead><tr>' +
            '<th>品规编码</th><th>药品规格</th><th>包装规格</th><th>基本剂量</th><th>剂量单位</th>' +
            '<th>制剂单位</th><th>最小系数</th><th>最小包装单位</th><th>包装系数</th>' +
            '<th class="frzn s1">状态</th><th class="frzn s2">操作</th>' +
          '</tr></thead>' +
          '<tbody>' +
            drug.specs.map(function (s, si) { return specRowHtml(s, si); }).join("") +
          '</tbody>' +
        '</table>';
    }

    /* ---- 厂商列表 ---- */
    var vendHtml;
    if (!selSpec) {
      vendHtml = '<div class="empty2"><div class="box"></div>请先在左侧选择一条品规</div>';
    } else if (!selSpec.vendors.length) {
      vendHtml = '<div class="empty2"><div class="box"></div>该品规暂无生产厂商，点击「新增厂商」添加</div>';
    } else {
      vendHtml =
        '<table class="gt vend2">' +
          '<colgroup>' +
            '<col style="width:108px"><col><col style="width:64px"><col style="width:88px"><col style="width:112px">' +
          '</colgroup>' +
          '<thead><tr>' +
            '<th>药品编码</th><th>生产企业</th><th>进口标识</th><th>批准文号</th>' +
            '<th class="frzn s2">操作</th>' +
          '</tr></thead>' +
          '<tbody>' +
            selSpec.vendors.map(function (v, vi) {
              return '<tr data-vendor>' +
                '<td title="' + esc(vendorCode(v)) + '">' + esc(vendorCode(v)) + '</td>' +
                '<td class="nm" title="' + esc(v.name) + '">' + esc(v.name) + '</td>' +
                '<td>' + esc(v.imported || "否") + '</td>' +
                '<td title="' + esc(v.approval || "") + '">' + esc(v.approval || "—") + '</td>' +
                '<td class="frzn s2">' +
                  '<button class="link-btn" data-act="vendor-detail" data-si="' + state.activeSpec + '" data-vi="' + vi + '">详情</button>' +
                  '<button class="link-btn" data-act="vendor-edit" data-si="' + state.activeSpec + '" data-vi="' + vi + '">编辑</button>' +
                  '<button class="link-btn is-danger" data-act="vendor-delete" data-si="' + state.activeSpec + '" data-vi="' + vi + '">删除</button>' +
                '</td>' +
              '</tr>';
            }).join("") +
          '</tbody>' +
        '</table>';
    }

    var addVendorBtn = selSpec
      ? '<button class="btn btn-sm" data-act="add-vendor" data-si="' + state.activeSpec + '">新增厂商</button>'
      : '<button class="btn btn-sm" disabled title="请先在品规列表选择一条品规">新增厂商</button>';

    box.innerHTML =
      /* 基本信息 */
      '<section class="block">' +
        '<div class="block-head">' +
          '<h2 class="block-title">基本信息</h2>' +
          '<div class="block-acts">' +
            '<button class="btn btn-sm" data-act="toggle">' + (drug.status === "on" ? "停用" : "启用") + '</button>' +
            '<button class="btn btn-sm" data-act="edit">编辑</button>' +

  /* 品规行：状态（开关）与操作冻结在右侧 */
  function specRowHtml(spec, si) {

  /* ==================== 品规草稿 ==================== */
  function specDraft(drug, spec) {
    var mk = drug.marks || {};
    return {
      code: spec.code || "",
      title: spec.title || "",
      formSpec: spec.formSpec || "",
      basicDose: spec.basicDose || "",
      doseUnit: spec.doseUnit || "",
      prepUnit: spec.prepUnit || "",
      minFactor: spec.minFactor || spec.factor || "",
      pkgSpec: spec.pkgSpec || "",
      minPkgUnit: spec.minPkgUnit || "",
      pkgFactor: spec.pkgFactor || "",
      pkgUnit: spec.pkgUnit || "",
      material: spec.pkgMaterial || spec.material || "",
      valuable: spec.valuable !== undefined ? !!spec.valuable : !!mk.valuable,
      essential: spec.essential !== undefined ? !!spec.essential : !!mk.essential,
      emergency: spec.emergency !== undefined ? !!spec.emergency : !!mk.emergency,
      keyMonitor: spec.keyMonitor !== undefined ? !!spec.keyMonitor : !!mk.keyMonitor,
      rare: spec.rare !== undefined ? !!spec.rare : !!mk.rare,
      splitOn: !!(spec.splitUnit && spec.splitUnit !== "—"),
      splitUnit: (spec.splitUnit && spec.splitUnit !== "—") ? spec.splitUnit : "",
      splitFactor: (spec.splitFactor && spec.splitFactor !== "—") ? spec.splitFactor : ""
    };
  }

  function newSpecDraft(drug) {
    var mk = drug.marks || {};
    return {
      code: "—",
      title: "", formSpec: "", basicDose: "", doseUnit: "g", prepUnit: "",
      minFactor: "", pkgSpec: "", minPkgUnit: "", pkgFactor: "", pkgUnit: "", material: "",
      valuable: false,
      essential: !!mk.essential,
      emergency: false, keyMonitor: false, rare: false,
      splitOn: false, splitUnit: "", splitFactor: ""
    };
  }

  function newSpecDirty(d) {
    if (!d) return false;
    return !!(d.title || d.formSpec || d.basicDose || d.prepUnit || d.minFactor ||
      d.pkgSpec || d.minPkgUnit || d.pkgFactor || d.pkgUnit || d.material ||
      d.splitUnit || d.splitFactor ||
      d.valuable || d.emergency || d.keyMonitor || d.rare);
  }

  var DOSE_UNITS = ["g", "mg", "ml", "IU"];
  var SPLIT_UNITS = ["片", "粒", "袋", "ml", "g"];

  /* 品规标识：查看 / 编辑共用 */
  var SPEC_FLAGS = [
    { key: "valuable",   name: "是否贵重" },
    { key: "essential",  name: "基药标识" },
    { key: "emergency",  name: "急救药" },
    { key: "keyMonitor", name: "重点监控" },
    { key: "rare",       name: "罕见病" }
  ];

  function specSectionsHtml(d, editable, lockBase) {
    var R = '<span class="req">*</span>';
    var attrGrid;
    if (editable && !lockBase) {
      /* 新增品规：全部可编辑 */
      attrGrid =
        egRead("品规编码", d.code || "—", true) +
        egInput(R + "药品规格", d.title, "如：0.25g * 24粒/盒", ' data-sk="title"') +
        egInput("制剂规格", d.formSpec, "如：0.25g", ' data-sk="formSpec"') +
        egInput(R + "基本剂量", d.basicDose, "如：0.25", ' data-sk="basicDose"') +
        egSelect(R + "剂量单位", d.doseUnit || "g", DOSE_UNITS, ' data-sk="doseUnit"') +
        egInput(R + "制剂单位", d.prepUnit, "如：粒", ' data-sk="prepUnit"') +
        egInput(R + "最小换算系数", d.minFactor, "如：24", ' data-sk="minFactor"') +
        egInput(R + "包装规格", d.pkgSpec, "如：24粒/盒", ' data-sk="pkgSpec"') +
        egInput(R + "最小包装单位", d.minPkgUnit, "如：盒", ' data-sk="minPkgUnit"') +
        egInput(R + "包装系数", d.pkgFactor, "如：1", ' data-sk="pkgFactor"') +
        egInput(R + "包装单位", d.pkgUnit, "如：盒", ' data-sk="pkgUnit"') +
        egInput("包装材质", d.material, "如：铝塑泡罩", ' data-sk="material"') +
        egSwitch("允许拆零", d.splitOn, ' data-sk="splitOn"') +
        egSelect("拆零-发药单位", d.splitUnit, SPLIT_UNITS, ' data-sk="splitUnit"', !d.splitOn) +
        egInput("拆零-发药系数", d.splitFactor, "正整数", ' data-sk="splitFactor"', !d.splitOn);
    } else if (editable && lockBase) {
      /* 编辑品规：允许拆零之前的字段只读 */
      attrGrid =
        egRead("品规编码", d.code || "—", true) +
        egRead("药品规格", d.title) +
        egRead("制剂规格", d.formSpec) +
        egRead("基本剂量", d.basicDose) +
        egRead("剂量单位", d.doseUnit) +
        egRead("制剂单位", d.prepUnit) +
        egRead("最小换算系数", d.minFactor) +
        egRead("包装规格", d.pkgSpec) +
        egRead("最小包装单位", d.minPkgUnit) +
        egRead("包装系数", d.pkgFactor) +
        egRead("包装单位", d.pkgUnit) +
        egRead("包装材质", d.material) +
        egSwitch("允许拆零", d.splitOn, ' data-sk="splitOn"') +
        egSelect("拆零-发药单位", d.splitUnit, SPLIT_UNITS, ' data-sk="splitUnit"', !d.splitOn) +
        egInput("拆零-发药系数", d.splitFactor, "正整数", ' data-sk="splitFactor"', !d.splitOn);
    } else {
      attrGrid =
        egRead("品规编码", d.code || "—", true) +
        egRead("药品规格", d.title) +
        egRead("制剂规格", d.formSpec) +
        egRead("基本剂量", d.basicDose) +
        egRead("剂量单位", d.doseUnit) +
        egRead("制剂单位", d.prepUnit) +
        egRead("最小换算系数", d.minFactor) +
        egRead("包装规格", d.pkgSpec) +
        egRead("最小包装单位", d.minPkgUnit) +
        egRead("包装系数", d.pkgFactor) +
        egRead("包装单位", d.pkgUnit) +
        egRead("包装材质", d.material) +
        egRead("允许拆零", d.splitOn ? "是" : "否") +
        egRead("拆零-发药单位", d.splitOn ? d.splitUnit : "—") +
        egRead("拆零-发药系数", d.splitOn ? d.splitFactor : "—");
    }

    var flagHtml = SPEC_FLAGS.map(function (f) {
      return editable
        ? egSwitch(f.name, d[f.key], ' data-sk="' + f.key + '"')
        : egRead(f.name, d[f.key] ? "是" : "否");
    }).join("");

    /* 不再使用分组小标题，规格属性与品规标识并入同一段 */
    return '<div class="drawer-section">' +
        '<div class="eg-grid">' + attrGrid + flagHtml + '</div>' +
      '</div>';
  }

  /* ==================== 品规抽屉 ==================== */
  function openSpecDetail(si) {
    var drug = activeDrug();
    if (!drug) return;
    var spec = drug.specs[si];
    if (!spec) return;
    closeCascader();

    var d = specDraft(drug, spec);

    $("drawerTitle").textContent = "品规详情";
    $("drawer").className = "drawer is-wide";
    $("drawerBody").innerHTML = specSectionsHtml(d, false);

    $("drawerFoot").innerHTML =
      '<button class="btn" data-dact="close">关闭</button>' +
      '<button class="btn btn-primary" data-dact="spec-edit" data-si="' + si + '">编辑规格</button>';

    var drug = activeDrug();
    if (!drug) return;

    if (!spec) return;
    closeCascader();
    editState = { type: "spec", drug: drug, si: si, draft: specDraft(drug, spec) };
    $("drawerTitle").textContent = "编辑品规";
    $("drawer").className = "drawer is-edit";
    $("drawerFoot").innerHTML =
      '<button class="btn" data-dact="edit-cancel">取消</button>' +
      '<button class="btn btn-primary" data-dact="edit-save">保存</button>';
    $("drawerBody").innerHTML = specSectionsHtml(editState.draft, true, true);
    document.body.classList.add("drawer-open");

  function syncSpecDraft() {
    var es = editState;
    if (!es || (es.type !== "spec" && es.type !== "create-spec")) return;
    var body = $("drawerBody");
    var d = es.draft;

    ["title", "formSpec", "basicDose", "doseUnit", "prepUnit", "minFactor",
      "pkgSpec", "minPkgUnit", "pkgFactor", "pkgUnit", "material",
      "splitUnit", "splitFactor"].forEach(function (k) {
      var el = body.querySelector('[data-sk="' + k + '"]');
      if (el) d[k] = el.value.trim();
    });

    ["splitOn", "valuable", "essential", "emergency", "keyMonitor", "rare"].forEach(function (k) {
      var el = body.querySelector('[data-sk="' + k + '"]');
      if (el) d[k] = el.checked;
    });
  }

  function saveEditSpec() {
    var es = editState;
    if (!es || (es.type !== "spec" && es.type !== "create-spec")) return;
    syncSpecDraft();
    var d = es.draft;

    var missing = [];
    if (es.type === "create-spec") {
      [["title", "药品规格"], ["basicDose", "基本剂量"], ["doseUnit", "剂量单位"],
        ["prepUnit", "制剂单位"], ["minFactor", "最小换算系数"], ["pkgSpec", "包装规格"],
        ["minPkgUnit", "最小包装单位"], ["pkgFactor", "包装系数"], ["pkgUnit", "包装单位"]]
        .forEach(function (r) {
          if (!String(d[r[0]] || "").trim()) missing.push(r[1]);
        });
    }
    if (d.splitOn && !d.splitUnit) missing.push("拆零-发药单位");
    if (d.splitOn && !d.splitFactor) missing.push("拆零-发药系数");
    if (missing.length) { toast("请完善：" + missing.join("、")); return; }

    function flags(spec) {
      spec.valuable = d.valuable;
      spec.essential = d.essential;
      spec.emergency = d.emergency;
      spec.keyMonitor = d.keyMonitor;
      spec.rare = d.rare;
    }

    if (es.type === "create-spec") {
      var spec = {
        code: "—",
        title: d.title,
        formSpec: d.formSpec,
        basicDose: d.basicDose,
        doseUnit: d.doseUnit,
        prepUnit: d.prepUnit,
        minFactor: d.minFactor,
        pkgSpec: d.pkgSpec,
        minPkgUnit: d.minPkgUnit,
        pkgFactor: d.pkgFactor,
        pkgUnit: d.pkgUnit,
        pkgMaterial: d.material,
        splitUnit: d.splitOn ? d.splitUnit : "—",
        splitFactor: d.splitOn ? d.splitFactor : "—",
        status: "on",
        vendors: []
      };
      flags(spec);
      es.drug.specs.push(spec);
      state.activeSpec = es.drug.specs.length - 1;
      closeDrawer(true);
      renderList();
      renderDetail();
      toast("品规已新增，可在右侧厂商列表维护生产企业");
      return;
    }

    var target = es.drug.specs[es.si];
    ["title", "formSpec", "basicDose", "doseUnit", "prepUnit", "minFactor",
      "pkgSpec", "minPkgUnit", "pkgFactor", "pkgUnit"].forEach(function (k) {
      target[k] = d[k];
    });
    target.pkgMaterial = d.material;
    target.splitUnit = d.splitOn ? d.splitUnit : "—";
    target.splitFactor = d.splitOn ? d.splitFactor : "—";
    flags(target);

    closeDrawer(true);
    renderDetail();
    toast("修改成功");
  }

  /* ==================== 厂商草稿 ==================== */
  function vendorDraft(v) {
    var m = vendorOf(v.name) || {};
    var purchase = v.purchase || v.purchaseType || "";
    var centralType = v.centralType || (/集采/.test(purchase) ? (purchase.indexOf("国家") > -1 ? "国家集采" : "省集采") : "");
    return {
      name: v.name,
      drugCode: vendorCode(v),
      nationalName: m.nationalName || "—",
      nationalId: m.nationalId || "—",
      approval: v.approval || "—",
      standardCode: m.standardCode || "—",
      price: v.price || "",
      imported: v.imported || "否",
      centralized: !!v.centralized || !!centralType,
      centralType: centralType || "国家集采",
      purchaseType: purchase || "阳光采购",
      negotiated: !!v.negotiated,
      ins: v.ins === undefined ? false : !!v.ins,
      insCode: v.insCode || ""
    };
  }

  function vendorSectionsHtml(d, editable) {
    var at = ' data-vk="';
    if (editable) {
      return '<div class="drawer-section">' +
                    '<div class="vendor-item is-editing">' +
            '<div class="vi-head"><span class="vi-name" title="' + esc(d.name) + '">' + esc(d.name) + '</span></div>' +
            '<div class="eg-grid">' +
              egRead("药品编码", d.drugCode, true) +
              egRead("国家药品名称", d.nationalName) +
              egRead("国家药品ID", d.nationalId, true) +
              egRead("批准文号", d.approval, true) +
              egRead("本位码", d.standardCode, true) +
              egInput("进药价格", d.price, "如：12.50", at + 'price"') +
              egRead("进口标识", d.imported) +
              egSwitch("集采标识", d.centralized, at + 'centralized"') +
              egSelect("集采类别", d.centralType, ["国家集采", "省集采"], at + 'centralType"', !d.centralized) +
              egSelect("采购类型", d.purchaseType, ["国家集中采购", "省级集中采购", "阳光采购", "挂网采购"], at + 'purchaseType"') +
              egSwitch("国谈标识", d.negotiated, at + 'negotiated"') +
              egSwitch("医保标识", d.ins, at + 'ins"') +
              egInput("医保药品代码", d.insCode, "如：XJ01CA0401010101032", at + 'insCode"', !d.ins) +
            '</div>' +
          '</div>' +
        '</div>';
    }
    return '<div class="drawer-section">' +
                '<div class="vendor-item">' +
          '<div class="vi-head"><span class="vi-name" title="' + esc(d.name) + '">' + esc(d.name) + '</span></div>' +
          '<div class="eg-grid">' +
            egRead("药品编码", d.drugCode, true) +
            egRead("国家药品名称", d.nationalName) +
            egRead("国家药品ID", d.nationalId, true) +
            egRead("批准文号", d.approval, true) +
            egRead("本位码", d.standardCode, true) +
            egRead("进药价格", d.price ? d.price + " 元" : "—") +
            egRead("进口标识", d.imported) +
            egRead("集采标识", d.centralized ? "是" : "否") +
            egRead("集采类别", d.centralized ? d.centralType : "—") +
            egRead("采购类型", d.purchaseType) +
            egRead("国谈标识", d.negotiated ? "是" : "否") +
            egRead("医保标识", d.ins ? "是" : "否") +
            egRead("医保药品代码", d.ins ? d.insCode : "—") +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* 新增厂商：必须先选中品规 */

    };

  function vendorCreateHtml() {
    var d = editState.draft;
    var picked = editState.picked > -1;
    return '<div class="drawer-section">' +

  /* ---------- 医保分类级联面板 ---------- */
  function openCascader(anchor) {
    closeCascader();
    cascPath = [];
    cascPanel = document.createElement("div");
    cascPanel.className = "casc-panel";
    document.body.appendChild(cascPanel);
    renderCascCol(MOCK.insTree, 0);
    cascPanel.addEventListener("click", function (e) {
      e.stopPropagation();
      onCascClick(e, anchor);
    });
    positionCascader(anchor);
    anchor.classList.add("is-active");
  }

  function positionCascader(anchor) {
    if (!cascPanel) return;
    var r = anchor.getBoundingClientRect();
    cascPanel.style.top = (r.bottom + 4) + "px";
    cascPanel.style.left = Math.max(12, Math.min(r.left, window.innerWidth - cascPanel.offsetWidth - 12)) + "px";
  }

  function renderCascCol(nodes, level) {
    while (cascPanel.children.length > level) cascPanel.removeChild(cascPanel.lastChild);
    var col = document.createElement("div");
    col.className = "casc-col";
    nodes.forEach(function (n, idx) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "casc-opt";
      b.setAttribute("data-level", level);
      b.setAttribute("data-idx", idx);
      b.title = n.name;
      b.innerHTML = n.name + (n.children ? '<span class="casc-arrow">›</span>' : "");
      col.appendChild(b);
    });
    cascPanel.appendChild(col);
  }

  function onCascClick(e, anchor) {
    var opt = e.target.closest(".casc-opt");
    if (!opt || !cascPanel) return;
    var level = parseInt(opt.getAttribute("data-level"), 10);
    var idx = parseInt(opt.getAttribute("data-idx"), 10);
    var nodes = MOCK.insTree;
    for (var i = 0; i < level; i++) nodes = cascPath[i].children;
    var node = nodes[idx];
    cascPath = cascPath.slice(0, level);
    cascPath.push(node);
    Array.prototype.forEach.call(opt.parentElement.children, function (c) { c.classList.remove("is-active"); });
    opt.classList.add("is-active");
    if (node.children) {
      renderCascCol(node.children, level + 1);
      positionCascader(anchor);
    } else {
      insLeaf = node.name;
      insPath = cascPath.map(function (n) { return n.name; }).join(" / ");
      anchor.value = insLeaf;
      anchor.title = insPath;
      closeCascader();
    }
  }

  function closeCascader() {
    if (cascPanel) { cascPanel.remove(); cascPanel = null; cascPath = []; }
    Array.prototype.forEach.call(document.querySelectorAll(".casc-input.is-active"), function (el) {
      el.classList.remove("is-active");
    });
  }

  /* ---------- 保存新增药品 ---------- */
  function saveCreate() {
    function val(id) { var el = $(id); return el ? el.value.trim() : ""; }
    var body = $("drawerBody");
    Array.prototype.forEach.call(body.querySelectorAll(".is-invalid"), function (el) {
      el.classList.remove("is-invalid");
    });

    var required = [
      ["f_code", "品种编码"], ["f_name", "品种名称"], ["f_py", "药品拼音码"],
      ["f_kind", "药品种类"], ["f_cat", "药品分类"], ["f_form", "剂型"]
    ];
    var missing = [];
    required.forEach(function (r) {
      if (!val(r[0])) { missing.push(r[1]); $(r[0]).classList.add("is-invalid"); }
    });
    var code = val("f_code");
    if (code && MOCK.drugs.some(function (d) { return d.code === code; })) {
      missing.push("品种编码（已存在）");
      $("f_code").classList.add("is-invalid");
    }
    if (missing.length) { toast("请完善：" + missing.join("、")); return; }

    var marks = {};
    EG_FLAGS.forEach(function (f) {
      var on = body.querySelector('[data-flag="' + f.key + '"]').checked;
      if (f.levels) {
        var lv = body.querySelector('[data-flag-level="' + f.key + '"]').value;
        if (f.key === "highAlert") marks[f.key] = on ? lv.charAt(0) : null;
        else if (f.key === "allergy") marks[f.key] = on ? [lv] : [];
        else marks[f.key] = on ? lv : null;
      } else {
        marks[f.key] = on;
      }
    });

    var id = "d" + Date.now();
    var drug = {
      id: id,
      code: code,
      name: val("f_name"),
      py: val("f_py").toUpperCase(),
      en: val("f_en") || "—",
      kind: val("f_kind"),
      category: val("f_cat"),
      form: val("f_form"),
      insClass: insLeaf || "—",
      ddd: val("f_ddd"),
      dddUnit: val("f_dddUnit"),
      status: "on",
      marks: marks,
      specs: []
    };
    MOCK.drugs.unshift(drug);
    if (val("f_trade")) MOCK.tradeNames[id] = val("f_trade");
    if (insLeaf) MOCK.insMap[id] = { leaf: insLeaf, path: insPath };

    state.keyword = ""; state.kind = ""; state.status = ""; state.page = 1;
    state.activeId = id; state.activeSpec = 0;
    $("kw").value = ""; $("kind").value = ""; $("status").value = "";
    renderList();
    renderDetail();
    closeDrawer();
    toast("药品「" + drug.name + "」已新增，可继续维护品规");
  }

  /* ==================== 药品操作 ==================== */
  function handleDrugAction(act, drug) {
    if (act === "toggle") {
      drug.status = drug.status === "on" ? "off" : "on";
      doSearch(false);
      toast(drug.name + " 已" + (drug.status === "on" ? "启用" : "停用"));
    } else if (act === "edit") {
      openEditBasic();
    } else if (act === "delete") {
      confirmDialog({
        title: "删除药品",
        text: "确认删除「" + drug.name + "」？删除后该药品将不在目录中展示，已引用该药品的历史单据不受影响。",
        okText: "删除",
        onOk: function () {
          toast("「" + drug.name + "」已删除（原型演示）");
        }
      });
    }
  }

  /* ==================== 通用弹窗 ==================== */
  function openModal(html) {
    var mask = $("modalMask");
    mask.innerHTML = '<div class="modal">' + html + '</div>';
    mask.classList.add("show");
  }

  function closeModal() {
    var mask = $("modalMask");
    mask.classList.remove("show");
    mask.innerHTML = "";
  }

  function confirmDialog(opt) {
    openModal(
      '<div class="modal-head">' +
        '<span class="modal-title">' + opt.title + '</span>' +
        '<button class="drawer-close" data-close="1">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="modal-body"><p class="modal-text">' + opt.text + '</p></div>' +
      '<div class="modal-foot">' +
        '<button class="btn" data-close="1">取消</button>' +
        '<button class="btn btn-primary" data-ok="1">' + (opt.okText || "确定") + '</button>' +
      '</div>'
    );

    var mask = $("modalMask");
    mask.querySelector("[data-ok]").addEventListener("click", function () {
      closeModal();
      if (opt.onOk) opt.onOk();
    });
  }

  /* ==================== Toast ==================== */
  var toastTimer = null;
  function toast(msg) {
    var el = $("toast");
    $("toastText").textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  /* ==================== 抽屉关闭 ==================== */
  function closeDrawer(force) {
    if (!force && editState && editState.type === "create-spec") {
      syncSpecDraft();
      if (newSpecDirty(editState.draft)) {
        confirmDialog({
          title: "放弃新增品规",
          text: "当前已填写内容，关闭后将丢失。确认放弃本次新增？",
          okText: "放弃",
          onOk: function () { closeDrawer(true); }
        });
        return;
      }
    }
    closeCascader();
    editState = null;
    document.body.classList.remove("drawer-open");
  }

  /* ==================== 事件绑定 ==================== */
  function bindEvents() {
    $("btnSearch").addEventListener("click", function () { doSearch(true); });
    $("btnReset").addEventListener("click", function () {
      $("kw").value = "";
      $("kind").value = "";
      $("status").value = "";
      doSearch(true);
    });
    $("kw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") doSearch(true);
    });

    /* 药品列表点击 */
    $("drugList").addEventListener("click", function (e) {
      var more = e.target.closest(".di-more");
      if (more) {
        e.stopPropagation();
        state.activeId = more.getAttribute("data-id");
        state.activeSpec = 0;
        openMenu(more);
        return;
      }
      var item = e.target.closest(".drug-item");
      if (item) {
        closeMenu();
        state.activeId = item.getAttribute("data-id");
        state.activeSpec = 0;
        renderList();
        renderDetail();
      }
    });

    /* 分页 */
    $("prevPage").addEventListener("click", function () {
      if (state.page > 1) { state.page--; renderList(); }
    });
    $("nextPage").addEventListener("click", function () {
      var pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (state.page < pages) { state.page++; renderList(); }
    });

    /* 右栏点击：操作按钮优先，其次品规行选中 */
    $("detail").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-act]");
      if (btn) {
        var act = btn.getAttribute("data-act");
        var drug = activeDrug();
        if (!drug) return;

        if (act === "toggle" || act === "edit" || act === "delete") {
          handleDrugAction(act, drug);
          return;
        }
        if (act === "add-spec") { openCreateSpec(); return; }

        var si = parseInt(btn.getAttribute("data-si"), 10);
        var vi = parseInt(btn.getAttribute("data-vi"), 10);

        if (act === "spec-detail") openSpecDetail(si);
        else if (act === "spec-edit") openEditSpec(si);
        else if (act === "spec-delete") {
          var spec = drug.specs[si];
          if (!spec) return;
          confirmDialog({
            title: "删除品规",
            text: "确认删除品规「" + (spec.formSpec || spec.title) + "」？删除后该品规及其厂商关系将不可恢复，历史单据不受影响。",
            okText: "删除",
            onOk: function () {
              drug.specs.splice(si, 1);
              if (state.activeSpec >= drug.specs.length) state.activeSpec = Math.max(0, drug.specs.length - 1);
              renderList();
              renderDetail();
              toast("品规已删除");
            }
          });
        }
        else if (act === "add-vendor") openAddVendor(si);
        else if (act === "vendor-detail") openVendorDetail(si, vi);
        else if (act === "vendor-edit") openVendorEdit(si, vi);
        else if (act === "vendor-delete") {
          var d2 = activeDrug();
          var sp2 = d2 && d2.specs[si];
          var v2 = sp2 && sp2.vendors[vi];
          if (!v2) return;
          confirmDialog({
            title: "删除厂商",
            text: "确认删除生产企业「" + v2.name + "」？删除后如需继续维护，可重新添加。",
            okText: "删除",
            onOk: function () {
              sp2.vendors.splice(vi, 1);
              renderDetail();
              toast("厂商「" + v2.name + "」已删除");
            }
          });
        }
        return;
      }

      /* 品规行选中（排除开关） */
      var tr = e.target.closest("tr[data-si]");
      if (tr && !e.target.closest("input") && !e.target.closest("label")) {
        var si2 = parseInt(tr.getAttribute("data-si"), 10);
        if (si2 !== state.activeSpec) {
          state.activeSpec = si2;
          renderDetail();
        }
      }
    });

    /* 品规状态开关 */
    $("detail").addEventListener("change", function (e) {
      var input = e.target;
      if (!input.matches("[data-specsw]")) return;
      var si = parseInt(input.getAttribute("data-specsw"), 10);
      var drug = activeDrug();
      var spec = drug && drug.specs[si];
      if (!spec) return;
      spec.status = input.checked ? "on" : "off";
      renderDetail();
      toast("品规 " + (spec.formSpec || spec.title) + " 已" + (input.checked ? "启用" : "停用"));
    });

    /* 抽屉 */
    $("drawerMask").addEventListener("click", function () { closeDrawer(); });
    $("drawerClose").addEventListener("click", function () { closeDrawer(); });
    $("drawerFoot").addEventListener("click", function (e) {
      var b = e.target.closest("[data-dact]");
      if (!b) return;
      var dact = b.getAttribute("data-dact");
      if (dact === "close" || dact === "create-cancel" || dact === "edit-cancel") closeDrawer();
      else if (dact === "spec-edit") openEditSpec(parseInt(b.getAttribute("data-si"), 10));
      else if (dact === "vendor-edit") openVendorEdit(parseInt(b.getAttribute("data-si"), 10), parseInt(b.getAttribute("data-vi"), 10));
      else if (dact === "create-save") saveCreate();
      else if (dact === "edit-save") {
        if (editState && editState.type === "basic") saveEditBasic();
        else if (editState && editState.type === "vendor") saveVendorEdit();
        else if (editState && editState.type === "vendor-create") saveVendorCreate();
        else saveEditSpec();
      }
    });

    /* 抽屉内交互（委托，只绑定一次） */
    $("drawerBody").addEventListener("change", function (e) {
      var t = e.target;
      /* 编辑基本信息：特殊药品标识 */
      if (t.matches("[data-ef]")) {
        var fk = t.getAttribute("data-ef");
        var cell = $("drawerBody").querySelector('[data-efcell="' + fk + '"]');
        var lv = $("drawerBody").querySelector('[data-eflv="' + fk + '"]');
        if (cell) cell.classList.toggle("is-on", t.checked);
        if (lv) lv.disabled = !t.checked;
      }
      /* 新增药品：标识开关 */
      if (t.matches("[data-flag]")) {
        var key = t.getAttribute("data-flag");
        var sel = $("drawerBody").querySelector('[data-flag-level="' + key + '"]');
        var item = $("drawerBody").querySelector('[data-flag-item="' + key + '"]');
        if (sel) sel.disabled = !t.checked;
        if (item) item.classList.toggle("is-on", t.checked);
      }
      /* 品规编辑：允许拆零 → 拆零字段 */
      if (t.matches('[data-sk="splitOn"]')) {
        var su = $("drawerBody").querySelector('[data-sk="splitUnit"]');
        var sf = $("drawerBody").querySelector('[data-sk="splitFactor"]');
        if (su) su.disabled = !t.checked;
        if (sf) { sf.disabled = !t.checked; if (!t.checked) sf.value = ""; }
      }
      /* 厂商编辑：集采标识 → 集采类别 */
      if (t.matches('[data-vk="centralized"]')) {
        var ct = $("drawerBody").querySelector('[data-vk="centralType"]');
        if (ct) ct.disabled = !t.checked;
      }
      /* 厂商编辑：医保标识 → 医保药品代码 */
      if (t.matches('[data-vk="ins"]')) {
        var ic = $("drawerBody").querySelector('[data-vk="insCode"]');
        if (ic) { ic.disabled = !t.checked; if (!t.checked) ic.value = ""; }
      }
    });

    $("drawerBody").addEventListener("click", function (e) {
      if (e.target.id === "f_ins" || e.target.id === "e_ins") {
        e.stopPropagation();
        if (cascPanel) closeCascader(); else openCascader(e.target);
        return;
      }
    });
    $("drawerBody").addEventListener("scroll", closeCascader);

    /* 弹窗关闭 */
    $("modalMask").addEventListener("click", function (e) {
      if (e.target === $("modalMask")) closeModal();
      if (e.target.closest("[data-close]")) closeModal();
    });

    /* 全局：点空白关闭浮动菜单 */
    document.addEventListener("click", function (e) {
      if (activeMenu && !e.target.closest(".float-menu") && !e.target.closest(".di-more")) closeMenu();
      if (cascPanel && !e.target.closest(".casc-panel") && !e.target.classList.contains("casc-input")) closeCascader();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { closeMenu(); closeModal(); closeCascader(); closeDrawer(); }
    });
    window.addEventListener("resize", closeMenu);

    /* 顶部按钮：新增药品 —— 沿用旧逻辑，跳转独立页面 */
    $("btnAdd").addEventListener("click", function () {
      location.href = "drug-create.html?from=v2";
    });

    /* 导航 / 标签 */
    document.querySelectorAll("[data-nav]").forEach(function (el) {
      el.addEventListener("click", function () {
        var name = el.getAttribute("data-nav");
        if (name === "首页") toast("「首页」页面待开发");
        else if (el.classList.contains("nav-sub-item") && !el.classList.contains("active")) toast("「" + name + "」页面待开发");
        else if (el.classList.contains("nav-item") && !el.querySelector(".nav-arrow")) toast("「" + name + "」页面待开发");
      });
    });
    document.querySelector(".tab-close").addEventListener("click", function (e) {
      e.stopPropagation();
      toast("原型仅演示「药品目录管理（V2）」页");
    });
  }

  init();
})();
</script>
