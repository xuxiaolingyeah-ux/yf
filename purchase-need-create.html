<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>发起采购申请 · 区域药房协同管理系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"/>
        <path d="M8.4 15.6L15.6 8.4"/>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <div class="header-user" id="headerUser">
      <span class="header-avatar">药</span>
      <span class="header-user-name">—</span>
    </div>
  </div>
</header>

<div class="app-body">
  <!-- ========== 左侧导航 ========== -->
  <aside class="app-side" id="appSide"></aside>
  <!-- ========== 主区域 ========== -->
  <main class="app-main">
    <div class="tabbar">
      <div class="tab">首页</div>
      <div class="tab active">
        发起采购申请
        <button class="tab-close" id="tabClose" title="关闭">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
    </div>

    <div class="page sel-page">
      <div class="sel-main">
        <div class="page-head">
          <div class="head-back">
            <button class="back-btn" id="btnBack" title="返回采购需求列表">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <h1 class="page-title" id="pageTitle">发起采购申请</h1>
          </div>
        </div>

        <div class="sel-card">
          <div class="card-body">
            <div class="form-wrap">

              <!-- 基本信息 -->
              <section class="block">
                <div class="block-head"><h2 class="block-title">基本信息</h2></div>
                <div class="form-grid-4">
                  <div class="form-item">
                    <label class="form-label">申请机构</label>
                    <input class="input is-readonly" id="fOrg" readonly>
                  </div>
                  <div class="form-item">
                    <label class="form-label"><span class="req">*</span>申请库位</label>
                    <select class="select" id="fLoc"><option value="">请选择库位</option></select>
                  </div>
                  <div class="form-item">
                    <label class="form-label">提交人</label>
                    <input class="input is-readonly" id="fCreator" readonly>
                  </div>
                  <div class="form-item">
                    <label class="form-label">提交时间</label>
                    <input class="input is-readonly" id="fCreatedAt" readonly>
                  </div>
                  <div class="form-item span-3">
                    <label class="form-label">申请说明</label>
                    <textarea class="textarea" id="fDesc" placeholder="选填，可说明采购原因等（200 字以内）" maxlength="200" style="flex:1;min-width:0;min-height:56px;"></textarea>
                  </div>
                </div>
              </section>

              <!-- 药品明细 -->
              <section class="block">
                <div class="block-head">
                  <h2 class="block-title">药品明细<span class="count" id="itemCount"></span></h2>
                  <div class="block-acts">
                    <button class="btn btn-primary btn-sm" id="btnAddItem">添加药品</button>
                  </div>
                </div>
                <table class="data-table pur-table">
                  <thead>
                    <tr>
                      <th style="width:180px;">药品名称</th>
                      <th style="width:120px;">药品编码</th>
                      <th style="width:160px;">药品规格</th>
                      <th style="width:170px;">生产企业</th>
                      <th style="width:110px;" class="num"><span class="req">*</span>需求数量</th>
                      <th style="width:90px;" class="num">库存数量</th>
                      <th style="width:85px;" class="num">库存上限</th>
                      <th style="width:85px;" class="num">库存下限</th>
                      <th style="width:70px;" class="col-acts">操作</th>
                    </tr>
                  </thead>
                  <tbody id="itemBody"></tbody>
                </table>
              </section>

            </div>
          </div>

          <div class="page-foot">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn" id="btnSave">暂存</button>
            <button class="btn btn-primary" id="btnSubmit">提交</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-mask" id="modalMask"></div>
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastText"></span>
</div>

<script src="mock.js"></script>
<script src="selection-common.js"></script>
<script src="purchase-mgmt-common.js"></script>
<script>
(function () {
  var $ = SEL.$, esc = SEL.esc;

  var user = PC.user();
  if (!user) return;
  if (user.role === "his") { location.href = "home.html"; return; }

  var editId = SEL.qs("id");
  var list = PC.load("need");
  var doc = editId ? PC.byId(list, editId) : null;

  if (editId && !doc) { location.href = "purchase-need.html"; return; }
  if (doc && doc.status !== "draft" && doc.status !== "rejected") {
    location.href = "purchase-need-detail.html?id=" + editId;
    return;
  }
  if (doc && !PC.isCreator(doc, user)) { location.href = "purchase-need.html"; return; }

  /* 新建草稿 */
  if (!doc) {
    doc = {
      id: SEL.newId(),
      code: PC.newCode("need", list),
      creatorRole: user.role,
      creatorId: user.id,
      creator: user.name,
      creatorOrg: user.org,
      loc: "",
      desc: "",
      createdAt: SEL.fmtNow(),
      status: "draft",
      items: [],
      records: []
    };
  }

  /* ---------------- 基本信息 ---------------- */
  $("fOrg").value = doc.creatorOrg;
  $("fCreator").value = doc.creator;
  $("fCreatedAt").value = doc.createdAt;
  $("fDesc").value = doc.desc || "";
  PC.locsFor(doc.creatorOrg).forEach(function (l) {
    var opt = document.createElement("option");
    opt.value = l.name;
    opt.textContent = l.name;
    $("fLoc").appendChild(opt);
  });
  $("fLoc").value = doc.loc || "";

  if (editId) {
    $("pageTitle").textContent = "编辑采购申请";
    document.title = "编辑采购申请 · 区域药房协同管理系统";
  }

  /* ---------------- 药品明细 ---------------- */
  function renderItems() {
    $("itemCount").textContent = "（" + doc.items.length + "）";
    if (!doc.items.length) {
      $("itemBody").innerHTML = '<tr class="pa-empty-row"><td colspan="9">暂无药品明细，请点击右上角「添加药品」（可单个或批量添加）</td></tr>';
      return;
    }
    $("itemBody").innerHTML = doc.items.map(function (it, i) {
      return "<tr>" +
        '<td><div class="cell-ellipsis" title="' + esc(it.drugName) + '">' + esc(it.drugName) + "</div></td>" +
        "<td>" + esc(it.drugCode) + "</td>" +
        "<td>" + esc(it.spec) + "</td>" +
        '<td><div class="cell-ellipsis" title="' + esc(it.vendor) + '">' + esc(it.vendor) + "</div></td>" +
        '<td class="num"><div class="qty-wrap"><input class="input pur-qty" data-ii="' + i + '" value="' + esc(it.qty) + '" placeholder="请输入"><span class="qty-unit">' + esc(it.unit || PC.unitOfSpec(it.spec)) + '</span></div></td>' +
        '<td class="num">' + esc(it.stock) + " " + esc(it.unit || "") + "</td>" +
        '<td class="num">' + esc(it.upper) + "</td>" +
        '<td class="num">' + esc(it.lower) + "</td>" +
        '<td class="col-acts"><button class="link-btn is-danger" data-del="' + i + '">删除</button></td>' +
      "</tr>";
    }).join("");
  }

  $("itemBody").addEventListener("input", function (e) {
    var el = e.target.closest("[data-ii]");
    if (!el) return;
    var i = parseInt(el.getAttribute("data-ii"), 10);
    if (!doc.items[i]) return;
    doc.items[i].qty = el.value.trim();
    el.classList.remove("is-invalid");
  });

  $("itemBody").addEventListener("click", function (e) {
    var del = e.target.closest("[data-del]");
    if (!del) return;
    var i = parseInt(del.getAttribute("data-del"), 10);
    var it = doc.items[i];
    SEL.confirmDialog({
      title: "删除药品明细",
      text: "确认删除「" + it.drugName + " / " + it.spec + "」这条明细？",
      okText: "删除",
      onOk: function () {
        doc.items.splice(i, 1);
        renderItems();
      }
    });
  });

  /* ---------------- 添加药品（弹窗：单个 / 批量） ---------------- */
  var specRows = PC.specRows();
  var pk = { filtered: specRows.slice(), checked: {} };

  function openPicker() {
    pk.filtered = specRows.slice();
    pk.checked = {};

    var kindOpts = '<option value="">全部种类</option>' +
      MOCK.drugKinds.map(function (k) {
        return '<option value="' + esc(k) + '">' + esc(k) + "</option>";
      }).join("");

    SEL.openModal(
      '<div class="modal-head">' +
        '<span class="modal-title">选择药品</span>' +
        '<button class="drawer-close" data-close="1">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>' +
        "</button>" +
      "</div>" +
      '<div class="modal-body">' +
        '<div class="pa-pick-filter">' +
          '<span class="filter-label">药品名称</span>' +
          '<input class="input" id="pkName" placeholder="请输入药品名称" style="width:170px;">' +
          '<span class="filter-label" style="margin-left:12px;">药品种类</span>' +
          '<select class="select" id="pkKind" style="width:130px;">' + kindOpts + "</select>" +
          '<label class="radio" style="margin-left:16px;white-space:nowrap;">' +
            '<input type="checkbox" id="pkLow"><span>库存低于下限</span>' +
          "</label>" +
          '<div class="pa-pick-acts">' +
            '<button class="btn" id="pkReset">重置</button>' +
            '<button class="btn btn-primary" id="pkQuery">查询</button>' +
          "</div>" +
        "</div>" +
        '<div class="pa-pick-wrap pur-pick-wrap" style="margin-top:12px;">' +
          '<table class="data-table"><thead><tr>' +
            '<th style="width:36px;"><input type="checkbox" id="pkAll" title="全选"></th>' +
            '<th style="width:110px;">药品编码</th>' +
            '<th style="width:160px;">药品名称</th>' +
            '<th style="width:150px;">药品规格</th>' +
            '<th style="width:90px;">药品种类</th>' +
            '<th>生产企业</th>' +
            '<th style="width:80px;" class="num">库存数量</th>' +
            '<th style="width:70px;" class="num">库存上限</th>' +
            '<th style="width:70px;" class="num">库存下限</th>' +
          '</tr></thead><tbody id="pkBody"></tbody></table>' +
        "</div>" +
      "</div>" +
      '<div class="modal-foot">' +
        '<span class="pur-pick-count" style="margin-right:auto;font-size:12px;color:var(--text-tertiary);">已选 <b id="pkCount">0</b> 项</span>' +
        '<button class="btn" data-close="1">取消</button>' +
        '<button class="btn btn-primary" id="pkOk">确定</button>' +
      "</div>"
    );

    document.querySelector("#modalMask .modal").classList.add("pa-modal");
    renderPkBody();

    $("pkQuery").addEventListener("click", doPkQuery);
    $("pkName").addEventListener("keydown", function (e) { if (e.key === "Enter") doPkQuery(); });
    $("pkReset").addEventListener("click", function () {
      $("pkName").value = ""; $("pkKind").value = ""; $("pkLow").checked = false;
      doPkQuery();
    });
    $("pkAll").addEventListener("change", function () {
      var on = this.checked;
      pk.checked = {};
      if (on) {
        pk.filtered.forEach(function (s) {
          if (!isAdded(s.key)) pk.checked[s.key] = true;
        });
      }
      renderPkBody();
    });
    $("pkBody").addEventListener("change", function (e) {
      var c = e.target.closest("input[data-key]");
      if (!c) return;
      var k = c.getAttribute("data-key");
      if (c.checked) pk.checked[k] = true;
      else delete pk.checked[k];
      syncPkCount();
    });
    $("pkOk").addEventListener("click", confirmPick);
  }

  function doPkQuery() {
    var name = $("pkName").value.trim().toLowerCase();
    var kind = $("pkKind").value;
    var lowOnly = $("pkLow").checked;
    pk.filtered = specRows.filter(function (s) {
      if (name && s.drugName.toLowerCase().indexOf(name) < 0) return false;
      if (kind && s.kind !== kind) return false;
      if (lowOnly && !(Number(s.stock) < Number(s.lower))) return false;
      return true;
    });
    renderPkBody();
  }

  function isAdded(key) {
    return doc.items.some(function (it) { return it.key === key; });
  }

  function renderPkBody() {
    var body = $("pkBody");
    if (!pk.filtered.length) {
      body.innerHTML = '<tr class="pa-pick-empty"><td colspan="9">未查询到匹配药品</td></tr>';
      syncPkCount();
      return;
    }
    body.innerHTML = pk.filtered.map(function (s) {
      var added = isAdded(s.key);
      var low = Number(s.stock) < Number(s.lower);
      return "<tr" + (added ? ' class="is-disabled"' : "") + ">" +
        '<td><input type="checkbox" data-key="' + esc(s.key) + '"' +
          (added ? " disabled" : "") + (pk.checked[s.key] ? " checked" : "") + "></td>" +
        "<td>" + esc(s.drugCode) + "</td>" +
        "<td>" + esc(s.drugName) + "</td>" +
        "<td>" + esc(s.spec) + "</td>" +
        "<td>" + esc(s.kind) + "</td>" +
        '<td><div class="cell-ellipsis" title="' + esc(s.vendor) + '">' + esc(s.vendor) +
          (added ? '<span class="pa-added">已添加</span>' : "") + "</div></td>" +
        '<td class="num" style="color:' + (low ? "var(--danger)" : "inherit") + ';">' + esc(s.stock) + " " + esc(s.unit || "") + "</td>" +
        '<td class="num">' + esc(s.upper) + "</td>" +
        '<td class="num">' + esc(s.lower) + "</td>" +
      "</tr>";
    }).join("");
    syncPkCount();
  }

  function syncPkCount() {
    var n = Object.keys(pk.checked).length;
    var c = $("pkCount");
    if (c) c.textContent = n;
    var all = $("pkAll");
    if (all) {
      var selectable = pk.filtered.filter(function (s) { return !isAdded(s.key); });
      all.disabled = !selectable.length;
      all.checked = selectable.length > 0 && selectable.every(function (s) { return pk.checked[s.key]; });
    }
  }

  function confirmPick() {
    var keys = Object.keys(pk.checked);
    if (!keys.length) { SEL.toast("请至少选择 1 个药品"); return; }
    var added = 0;
    keys.forEach(function (k) {
      if (isAdded(k)) return;
      var s = null;
      specRows.forEach(function (x) { if (x.key === k) s = x; });
      if (!s) return;
      doc.items.push({
        key: s.key,
        drugCode: s.drugCode,
        drugName: s.drugName,
        spec: s.spec,
        vendor: s.vendor,
        qty: "",
        stock: s.stock,
        upper: s.upper,
        lower: s.lower,
        unit: s.unit
      });
      added++;
    });
    SEL.closeModal();
    document.body.classList.remove("modal-open");
    renderItems();
    SEL.toast("已新增 " + added + " 条药品明细");
  }

  $("btnAddItem").addEventListener("click", openPicker);

  /* ---------------- 保存 / 提交 ---------------- */
  function collect() {
    doc.loc = $("fLoc").value;
    doc.desc = $("fDesc").value.trim();
    $("itemBody").querySelectorAll("[data-ii]").forEach(function (el) {
      var i = parseInt(el.getAttribute("data-ii"), 10);
      if (doc.items[i]) doc.items[i].qty = el.value.trim();
    });
  }

  function validate() {
    var missing = [];
    if (!$("fLoc").value) missing.push("申请库位");
    if (!doc.items.length) missing.push("至少 1 条药品明细");
    doc.items.forEach(function (it, i) {
      var el = document.querySelector('[data-ii="' + i + '"]');
      var ok = PC.isQty(it.qty);
      if (el) el.classList.toggle("is-invalid", !ok);
      if (!ok) missing.push("第 " + (i + 1) + " 行需求数量须为正整数");
    });
    if (missing.length) {
      SEL.toast("请完善：" + missing.join("、"));
      return false;
    }
    return true;
  }

  function goBack() { location.href = "purchase-need.html"; }
  $("btnBack").addEventListener("click", goBack);
  $("tabClose").addEventListener("click", goBack);
  $("btnCancel").addEventListener("click", goBack);

  $("btnSave").addEventListener("click", function () {
    collect();
    if (!doc.items.length) { SEL.toast("请至少添加 1 条药品明细"); return; }
    PC.persist("need", doc);
    SEL.toast("已暂存");
    setTimeout(goBack, 400);
  });

  $("btnSubmit").addEventListener("click", function () {
    collect();
    if (!validate()) return;
    doc.records.push({ node: "提交", org: doc.creatorOrg, person: doc.creator, result: "已提交", opinion: "—", time: SEL.fmtNow() });
    var next = PC.nextStatus(doc);
    if (next === "approved") {
      doc.status = "approved";
      doc.records.push({ node: "中心药房审核", org: doc.creatorOrg, person: doc.creator, result: "通过", opinion: "中心药房发起，提交后自动生效。", time: SEL.fmtNow() });
      SEL.toast("已提交并自动生效");
    } else {
      doc.status = next;
      SEL.toast("已提交审核");
    }
    PC.persist("need", doc);
    setTimeout(goBack, 400);
  });

  SEL.renderHeaderUser(user);
  SEL.bindNav();
  renderItems();
})();
</script>
  <script src="nav.js?v=20261111c"></script>
</body>
</html>
