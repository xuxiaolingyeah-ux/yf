/* ---------- 本页专用样式 ---------- */
/* 按钮三态：普通（白底灰边）/ 次按钮（白底蓝边蓝字）/ 主按钮（蓝底白字，沿用 .btn-primary） */
.btn-plain {
  border-color: #D0D5DD;
  color: #4E5969;
}
.btn-plain:hover { border-color: var(--primary); color: var(--primary-dark); }
.btn-outline {
  border-color: #A9C7FF;
  color: var(--primary);
  background: var(--bg-white);
}
.btn-outline:hover { border-color: var(--primary); color: var(--primary-dark); background: var(--primary-lighter); }
.btn-outline:disabled,
.btn-outline[disabled] {
  border-color: #E5E6EB; color: var(--text-placeholder);
  background: var(--bg-white); cursor: not-allowed;
}

.dc2-card {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  margin: 0 16px 16px;
  background: var(--bg-white);
  overflow: hidden;
}
.dc2-card .filter-bar { border-bottom: 1px solid var(--border); }
.filter-checks { display: flex; align-items: center; gap: 12px; }
.filter-checks label {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; color: var(--text-secondary);
  cursor: pointer; white-space: nowrap;
}
.filter-checks input { accent-color: var(--primary); width: 14px; height: 14px; margin: 0; cursor: pointer; }

/* 多选下拉（精神/抗菌/抗肿瘤） */
.ms-item { position: relative; }
.ms-box {
  width: 170px; height: 32px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 8px;
  border: 1px solid var(--border-input);
  border-radius: var(--radius);
  background: var(--bg-white);
  cursor: pointer; font-size: 13px; color: var(--text-primary);
  box-sizing: border-box;
}
.ms-box:hover { border-color: var(--primary); }
.ms-item.is-open .ms-box { border-color: var(--primary); }
.ms-val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-val.is-ph { color: var(--text-tertiary); }
.ms-caret {
  flex: none; font-size: 10px; color: var(--text-tertiary);
  transform: rotate(0deg); transition: transform 0.15s;
}
.ms-item.is-open .ms-caret { transform: rotate(180deg); }
.ms-panel {
  display: none;
  position: absolute; top: calc(100% + 4px); left: 0;
  z-index: 40;
  min-width: 100%; width: max-content; max-width: 260px;
  max-height: 240px; overflow-y: auto;
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
  padding: 6px;
}
.ms-item.is-open .ms-panel { display: block; }
.ms-panel label {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; font-size: 13px;
  color: var(--text-primary);
  border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.ms-panel label:hover { background: #F5F7FA; }
.ms-panel input { accent-color: var(--primary); width: 14px; height: 14px; margin: 0; cursor: pointer; }

/* 批量操作条 */
.batch-bar {
  display: none; align-items: center; gap: 8px;
  padding: 8px 16px;
  background: #F0F7FF;
  border-bottom: 1px solid var(--border);
  font-size: 13px; color: var(--text-secondary);
}
.batch-bar.show { display: flex; }
.batch-bar .bb-count { color: var(--primary-dark); font-weight: 500; }
.batch-bar .bb-gap { flex: 1; }

/* 列表与固定列 */
.dc2-table { min-width: 1300px; }
.dc2-table .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
.dc2-table .c-check { width: 42px; text-align: center; }
.dc2-table .c-check input { accent-color: var(--primary); width: 14px; height: 14px; margin: 0; cursor: pointer; }
.dc2-table .c-name { width: 210px; min-width: 160px; font-weight: 500; }
.dc2-table .c-name-txt { display: inline-block; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.dc2-table .c-kind { width: 90px; }
.dc2-table .c-cat { width: 150px; max-width: 150px; }
.dc2-table .c-form { width: 130px; }
.dc2-table .c-spirit { width: 88px; }
.dc2-table .c-flag { width: 78px; }
.dc2-table .c-ab { width: 112px; }
.dc2-table .c-at { width: 112px; }
.dc2-table .c-status { width: 70px; }
.dc2-table .c-acts { width: 158px; white-space: nowrap; }
.dc2-table .c-acts .link-btn + .link-btn { margin-left: 12px; }
.dc2-table th.stick-l { left: 0; z-index: 3; }
.dc2-table th.stick-name { left: 42px; z-index: 3; }
.dc2-table th.stick-status { right: 158px; z-index: 3; }
.dc2-table th.stick-acts { right: 0; z-index: 3; }
.dc2-table td.stick-l, .dc2-table td.stick-name, .dc2-table td.stick-status, .dc2-table td.stick-acts {
  position: sticky; background: var(--bg-white);
}
.dc2-table td.stick-l { left: 0; z-index: 2; }
.dc2-table td.stick-name { left: 42px; z-index: 2; box-shadow: inset 1px 0 0 var(--border); }
.dc2-table td.stick-status { right: 158px; z-index: 2; }
.dc2-table td.stick-acts { right: 0; z-index: 2; box-shadow: inset 1px 0 0 var(--border); }
.dc2-table tbody tr:nth-child(even) td.stick-l,
.dc2-table tbody tr:nth-child(even) td.stick-name,
.dc2-table tbody tr:nth-child(even) td.stick-status,
.dc2-table tbody tr:nth-child(even) td.stick-acts { background: var(--table-even); }
.dc2-table tbody tr:hover td.stick-l,
.dc2-table tbody tr:hover td.stick-name,
.dc2-table tbody tr:hover td.stick-status,
.dc2-table tbody tr:hover td.stick-acts { background: var(--table-hover); }
.dc2-dash { color: var(--text-placeholder); }

/* 分页附加 */
.pager-size { display: flex; align-items: center; gap: 6px; margin-left: 14px; }
.pager-size select { height: 26px; font-size: 12px; padding: 0 6px; }

/* 查看抽屉：规格只读卡 */
.dc2-spec { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.dc2-spec-head {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 14px; background: #FAFBFC;
  border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 500; color: var(--text-primary);
}
.dc2-spec-head .sp-code { color: var(--text-tertiary); font-weight: 400; font-size: 12px; }
.dc2-spec-head .sp-code b { color: var(--text-secondary); font-weight: 500; font-family: "SF Mono", Menlo, Consolas, monospace; }
.dc2-spec-head .sp-st { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--text-tertiary); }
.dc2-spec-head .sp-st.is-on { color: var(--primary-dark); }
.dc2-spec-head .sp-toggle { margin-left: auto; flex: none; }
.dc2-spec-body { padding: 12px 14px; }
/* 规格卡：默认收起，点「展开」看全部 */
.dc2-spec-collapsed { padding: 8px 14px 12px; border-top: 1px dashed var(--border-light); }
.dc2-spec.is-expanded .dc2-spec-collapsed { display: none; }
.dc2-spec.is-expanded .dc2-spec-body { display: block; }
.dc2-spec .dc2-spec-body { display: none; }
.dc2-vend-title { font-size: 12px; color: var(--text-tertiary); margin: 12px 0 8px; }

/* 抽屉 Tab */
.dc2-tabs {
  display: flex; gap: 28px;
  margin: -16px -20px 16px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
}
.dc2-tab {
  border: none; background: none; cursor: pointer;
  padding: 12px 2px; font-size: 14px;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.dc2-tab:hover { color: var(--primary-dark); }
.dc2-tab.is-active { color: var(--primary-dark); font-weight: 500; border-bottom-color: var(--primary); }
.dc2-tab .tab-count { font-weight: 400; color: var(--text-tertiary); font-size: 13px; }

/* 导入弹窗 */
.imp-tip { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 14px; }
.imp-tip .link-btn { font-size: 13px; }
.imp-drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  height: 180px;
  background: #F7FBFF;
  border: 1px dashed #A9C7FF;
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.imp-drop:hover, .imp-drop.is-over { border-color: var(--primary); background: #F0F7FF; }
.imp-drop .imp-ic { color: var(--primary); display: flex; }
.imp-drop-title { font-size: 14px; color: var(--text-secondary); }
.imp-drop-sub { font-size: 12px; color: var(--text-tertiary); }
.imp-drop.is-file { gap: 8px; }
.imp-file-name {
  font-size: 14px; font-weight: 500; color: var(--text-primary);
  max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.imp-file-size { font-size: 12px; color: var(--text-tertiary); }
.imp-notes {
  margin-top: 14px;
  background: #FAFAFA;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px; color: var(--text-secondary); line-height: 1.9;
}
.imp-notes-title { font-size: 13px; color: var(--text-primary); margin-bottom: 2px; }
/* 导入结果（整屏结果态） */
.imp2-result {
  padding: 34px 20px 18px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.imp2-result-title { font-size: 18px; font-weight: 500; color: var(--text-primary); margin-top: 18px; }
.imp2-result-sub { font-size: 13px; color: var(--text-tertiary); margin-top: 8px; }
.imp2-result .btn { margin-top: 18px; }
</style>

<script data-page-node-id="Ki0rq2ibAtWOd2WPlMvHOY" src="mock.js"></script>
<script data-page-node-id="WoCyzuVSECt2TSPzzfczw7" data-pnid-children="nm0dXhVVxmFIq0MRRvTHvC">
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* ================= 口径统一 ================= */
  /* 精神药品：统一为「第一类 / 第二类」 */
  function normSpirit(v) {
    if (!v) return "";
    var s = String(v);
    if (s.indexOf("第一类") > -1) return "第一类";
    if (s.indexOf("第二类") > -1) return "第二类";
    return "";
  }
  /* 抗菌 / 抗肿瘤级别：统一为「非限制使用级 / 限制使用级 / 特殊使用级」 */
  function normLevel(v) {
    if (!v) return "";
    var s = String(v);
    if (s.indexOf("非限制") > -1) return "非限制使用级";
    if (s.indexOf("特殊") > -1) return "特殊使用级";
    if (s.indexOf("限制") > -1) return "限制使用级";
    return s;
  }

  /* 标识读取 */
  function markText(d, key) {
    var m = d.marks || {};
    if (key === "spirit") return normSpirit(m.spirit);
    if (key === "toxic") return m.toxic ? "是" : "";
    if (key === "narcotic") return m.narcotic ? "是" : "";
    if (key === "antibiotic") return normLevel(m.antibiotic);
    if (key === "antitumor") return normLevel(m.antitumor);
    return "";
  }
  function txtOrDash(v) {
    return v ? esc(v) : '<span class="dc2-dash">—</span>';
  }

  /* 查看抽屉标识定义（与新增/编辑口径一致） */
  var FLAGS = [
    { key: "spirit",     name: "精神药品",   levels: ["第一类", "第二类"] },
    { key: "toxic",      name: "毒性药品" },
    { key: "narcotic",   name: "麻醉药品" },
    { key: "antibiotic", name: "抗菌药物",   levels: ["非限制使用级", "限制使用级", "特殊使用级"] },
    { key: "antitumor",  name: "抗肿瘤药物", levels: ["非限制使用级", "限制使用级"] },
    { key: "highAlert",  name: "高警示药品", levels: ["A 级", "B 级", "C 级"] },
    { key: "allergy",    name: "过敏药物",   levels: ["青霉素类", "头孢菌素类", "磺胺类", "其他"] },
    { key: "skinTest",   name: "是否皮试" },
    { key: "longTerm",   name: "长处方" },
    { key: "otc",        name: "OTC" }
  ];
  function flagState(d, f) {
    var m = d.marks || {};
    if (f.key === "allergy") return { on: !!(m.allergy && m.allergy.length), lv: (m.allergy && m.allergy[0]) || "" };
    if (f.key === "highAlert") return { on: !!m.highAlert, lv: m.highAlert ? (String(m.highAlert).length === 1 ? m.highAlert + " 级" : m.highAlert) : "" };
    var v = m[f.key];
    if (f.key === "spirit") v = normSpirit(v);
    if (f.key === "antibiotic" || f.key === "antitumor") v = normLevel(v);
    return { on: !!v, lv: typeof v === "string" ? v : "" };
  }

  /* ================= 状态 ================= */
  var state = { kw: "", kind: "", spirit: [], toxic: false, narc: false, ab: [], at: [], status: "", page: 1, size: 20 };
  var filtered = [];
  var checked = {};   /* id -> true */

  /* ================= 数据装载 ================= */
  function loadPendingDrugs() {
    var pending = [];
    try { pending = JSON.parse(sessionStorage.getItem("pendingDrugs") || "[]"); } catch (e) { pending = []; }
    pending.forEach(function (d) {
      if (MOCK.drugs.some(function (x) { return x.code === d.code; })) return;
      if (d.insClass && d.insClass !== "—") {
        MOCK.insMap[d.id] = { leaf: d.insClass, path: d.insClass };
      }
      MOCK.drugs.unshift(d);
    });
    try {
      sessionStorage.removeItem("pendingDrugs");
      sessionStorage.removeItem("pendingDrugsIns");
    } catch (e) { /* ignore */ }
  }

  /* 编辑页保存回写 */
  function loadEditSave() {
    var raw = null;
    try { raw = sessionStorage.getItem("drugEditSave"); } catch (e) { raw = null; }
    if (!raw) return;
    try {
      var d = JSON.parse(raw);
      var idx = -1;
      for (var i = 0; i < MOCK.drugs.length; i++) { if (MOCK.drugs[i].id === d.id) { idx = i; break; } }
      if (idx >= 0) MOCK.drugs[idx] = d; else MOCK.drugs.unshift(d);
    } catch (e) { /* ignore */ }
    try { sessionStorage.removeItem("drugEditSave"); } catch (e) { /* ignore */ }
  }

  /* ================= 多选下拉 ================= */
  function msValues(name) {
    var vals = [];
    document.querySelectorAll('[data-ms="' + name + '"]').forEach(function (c) {
      if (c.checked) vals.push(c.value);
    });
    return vals;
  }
  function updateMsLabel(item) {
    var vals = [];
    item.querySelectorAll("[data-ms]").forEach(function (c) { if (c.checked) vals.push(c.value); });
    var span = item.querySelector(".ms-val");
    if (vals.length) { span.textContent = vals.join("、"); span.classList.remove("is-ph"); }
    else { span.textContent = "全部"; span.classList.add("is-ph"); }
  }
  function closeAllMs() {
    document.querySelectorAll(".ms-item.is-open").forEach(function (i) { i.classList.remove("is-open"); });
  }
  document.querySelectorAll(".ms-box").forEach(function (box) {
    box.addEventListener("click", function (e) {
      e.stopPropagation();
      var item = box.closest(".ms-item");
      var wasOpen = item.classList.contains("is-open");
      closeAllMs();
      if (!wasOpen) item.classList.add("is-open");
    });
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".ms-item")) closeAllMs();
  });
  document.querySelectorAll("[data-ms]").forEach(function (c) {
    c.addEventListener("change", function () { updateMsLabel(c.closest(".ms-item")); });
  });

  /* ================= 筛选 ================= */
  function doSearch(resetPage) {
    if (resetPage) state.page = 1;
    state.kw = $("fKw").value.trim();
    state.kind = $("fKind").value;
    state.spirit = msValues("spirit");
    state.toxic = $("fToxic").checked;
    state.narc = $("fNarc").checked;
    state.ab = msValues("ab");
    state.at = msValues("at");
    state.status = $("fStatus").value;

    var kw = state.kw.toLowerCase();
    filtered = MOCK.drugs.filter(function (d) {
      if (kw &&
        d.name.toLowerCase().indexOf(kw) < 0 &&
        String(d.code || "").toLowerCase().indexOf(kw) < 0 &&
        String(d.py || "").toLowerCase().indexOf(kw) < 0) return false;
      if (state.kind && d.kind !== state.kind) return false;
      if (state.spirit.length && state.spirit.indexOf(normSpirit((d.marks || {}).spirit)) < 0) return false;
      if (state.toxic && !(d.marks && d.marks.toxic)) return false;
      if (state.narc && !(d.marks && d.marks.narcotic)) return false;
      if (state.ab.length && state.ab.indexOf(normLevel((d.marks || {}).antibiotic)) < 0) return false;
      if (state.at.length && state.at.indexOf(normLevel((d.marks || {}).antitumor)) < 0) return false;
      if (state.status && d.status !== state.status) return false;
      return true;
    });

    var totalPages = Math.max(1, Math.ceil(filtered.length / state.size));
    if (state.page > totalPages) state.page = totalPages;
    renderBody();
  }

  function resetFilters() {
    $("fKw").value = ""; $("fKind").value = "";
    $("fToxic").checked = false; $("fNarc").checked = false;
    document.querySelectorAll("[data-ms]").forEach(function (c) { c.checked = false; });
    document.querySelectorAll(".ms-item").forEach(updateMsLabel);
    $("fStatus").value = "";
    doSearch(true);
  }

  /* ================= 列表渲染 ================= */
  /* 药品分类取叶子节点（末级） */
  function catLeaf(c) {
    var s = String(c || "").trim();
    if (!s) return "";
    return s.split("/").pop().trim();
  }

  function rowHtml(d) {
    var on = d.status === "on";
    return '<tr data-id="' + esc(d.id) + '">' +
      '<td class="stick-l c-check"><input type="checkbox" data-chk="' + esc(d.id) + '"' + (checked[d.id] ? " checked" : "") + '></td>' +
      '<td class="stick-name c-name"><span class="c-name-txt" title="' + esc(d.name) + '">' + esc(d.name) + '</span></td>' +
      '<td class="mono">' + esc(d.code) + '</td>' +
      '<td>' + esc(d.kind || "—") + '</td>' +
      '<td class="cell-ellipsis c-cat" style="max-width:230px;" title="' + esc(d.category) + '">' + esc(catLeaf(d.category)) + '</td>' +
      '<td>' + txtOrDash(d.form) + '</td>' +
      '<td>' + txtOrDash(markText(d, "spirit")) + '</td>' +
      '<td>' + txtOrDash(markText(d, "toxic")) + '</td>' +
      '<td>' + txtOrDash(markText(d, "narcotic")) + '</td>' +
      '<td>' + txtOrDash(markText(d, "antibiotic")) + '</td>' +
      '<td>' + txtOrDash(markText(d, "antitumor")) + '</td>' +
      '<td class="stick-status"><span class="tag ' + (on ? "is-on" : "is-off") + '">' + (on ? "启用" : "停用") + '</span></td>' +
      '<td class="stick-acts c-acts">' +
        '<button class="link-btn" data-act="view" data-id="' + esc(d.id) + '">查看</button>' +
        '<button class="link-btn" data-act="edit" data-id="' + esc(d.id) + '">编辑</button>' +
        '<button class="link-btn" data-act="toggle" data-id="' + esc(d.id) + '">' + (on ? "停用" : "启用") + '</button>' +
        '<button class="link-btn is-danger" data-act="del" data-id="' + esc(d.id) + '">删除</button>' +
      '</td>' +
    '</tr>';
  }

  function renderBody() {
    var start = (state.page - 1) * state.size;
    var rows = filtered.slice(start, start + state.size);
    $("tbody").innerHTML = rows.map(rowHtml).join("");
    $("tableEmpty").style.display = rows.length ? "none" : "";

    var totalPages = Math.max(1, Math.ceil(filtered.length / state.size));
    $("pagerInfo").textContent = "共 " + filtered.length + " 条";
    $("pgNum").textContent = state.page + " / " + totalPages;
    $("pgPrev").disabled = state.page <= 1;
    $("pgNext").disabled = state.page >= totalPages;

    syncCheckUi(rows);
  }

  /* ================= 勾选 / 批量条 ================= */
  function syncCheckUi(rows) {
    var list = rows || filtered.slice((state.page - 1) * state.size, state.page * state.size);
    var pageIds = list.map(function (d) { return d.id; });
    var selCount = 0;
    pageIds.forEach(function (id) { if (checked[id]) selCount++; });
    $("chkAll").checked = pageIds.length > 0 && selCount === pageIds.length;

    var total = 0;
    Object.keys(checked).forEach(function (id) { if (checked[id]) total++; });
    $("bbCount").textContent = total;
    $("batchBar").classList.toggle("show", total > 0);
    ["bbOn", "bbOff", "bbDel"].forEach(function (id) { $(id).disabled = total === 0; });
  }

  function clearChecked() {
    checked = {};
    document.querySelectorAll("[data-chk]").forEach(function (el) { el.checked = false; });
    $("chkAll").checked = false;
    syncCheckUi();
  }

  /* ================= 弹窗 / Toast ================= */
  var confirmCb = null;
  function confirmDialog(opt) {
    confirmCb = opt.onOk || null;
    $("modalMask").innerHTML =
      '<div class="modal" style="width:420px">' +
        '<div class="modal-head">' +
          '<span class="modal-title">' + esc(opt.title) + '</span>' +
          '<button class="drawer-close" data-close="1">' +
            '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="modal-body"><p class="modal-text">' + esc(opt.text) + '</p></div>' +
        '<div class="modal-foot">' +
          '<button class="btn" data-close="1">取消</button>' +
          '<button class="btn btn-primary" data-confirm="1">' + esc(opt.okText || "确定") + '</button>' +
        '</div>' +
      '</div>';
    $("modalMask").classList.add("show");
  }
  function closeModal() {
    var m = $("modalMask");
    m.classList.remove("show");
    m.innerHTML = "";
    confirmCb = null;
  }
  var toastTimer = null;
  function toast(msg) {
    $("toastText").textContent = msg;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").classList.remove("show"); }, 2200);
  }

  /* ================= 行操作 ================= */
  function drugOf(id) {
    return MOCK.drugs.filter(function (d) { return d.id === id; })[0];
  }

  function toggleStatus(id) {
    var d = drugOf(id);
    if (!d) return;
    if (d.status === "on") {
      confirmDialog({
        title: "停用药品",
        text: "确认停用「" + d.name + "」？停用后不可再开方。",
        okText: "停用",
        onOk: function () {
          d.status = "off";
          toast("已停用「" + d.name + "」");
          doSearch(false);
        }
      });
    } else {
      d.status = "on";
      toast("已启用「" + d.name + "」");
      doSearch(false);
    }
  }

  function delDrug(id) {
    var d = drugOf(id);
    if (!d) return;
    confirmDialog({
      title: "删除药品",
      text: "确认删除「" + d.name + "」？删除后该药品将不在目录中展示，已引用该药品的历史单据不受影响。",
      okText: "删除",
      onOk: function () {
        var idx = -1;
        for (var i = 0; i < MOCK.drugs.length; i++) { if (MOCK.drugs[i].id === id) { idx = i; break; } }
        if (idx >= 0) MOCK.drugs.splice(idx, 1);
        delete checked[id];
        MOCK.total = MOCK.drugs.length;
        toast("已删除「" + d.name + "」");
        doSearch(false);
      }
    });
  }

  /* ================= 批量操作 ================= */
  function selectedDrugs() {

  /* ================= CSV 工具 ================= */
  function csvEscape(v) {
    v = String(v === null || v === undefined ? "" : v);
    if (/[",\r\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function downloadCsv(filename, rows) {
    var text = "\uFEFF" + rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\r\n");
    var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function parseCsv(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var rows = [], row = [], field = "", inQ = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (inQ) {
        if (ch === '"') {
          if (text.charAt(i + 1) === '"') { field += '"'; i++; }
          else inQ = false;
        } else field += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ",") { row.push(field); field = ""; }
        else if (ch === "\r") { /* skip */ }
        else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else field += ch;
      }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.length && r.some(function (c) { return String(c).trim() !== ""; }); });
  }
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return "" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
  }

  function isTrue(v) {
    v = String(v || "").trim();
    return v === "是" || v === "true" || v === "1" || v === "Y" || v === "y";
  }

  function doImport() {
    if (!importFile) return;
    if (/\.xlsx$/i.test(importFile.name)) {
      toast("原型暂只解析 CSV，请在 Excel 中另存为 CSV 后上传");
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCsv(String(reader.result));
      if (!rows.length) { showImportResult(0, 0, [], []); return; }
      var header = rows[0].map(function (c) { return String(c).trim(); });
      var colIdx = {};
      TPL_COLS.forEach(function (name) { colIdx[name] = header.indexOf(name); });

      var okGroups = [];    /* 成功的品种分组 */
      var failRows = [];    /* 失败行 */
      var groups = {};      /* 品种编码 -> 行列表 */
      var order = [];

      rows.slice(1).forEach(function (cells, ri) {
        var rowNo = ri + 2;
        function cell(name) {
          var i = colIdx[name];
          return i >= 0 && i < cells.length ? String(cells[i]).trim() : "";
        }
        var code = cell("品种编码");
        var drugName = cell("药品名称") || cell("品种名称");
        var spec = cell("药品规格");
        var vendor = cell("生产企业名称");
        var reason = "";
        if (!code) reason = "品种编码为空";
        else if (!drugName) reason = "药品名称为空";
        else if (!spec) reason = "药品规格为空";
        else if (!vendor) reason = "生产企业名称为空";
        if (reason) {
          failRows.push({ no: rowNo, cells: cells, reason: reason });
          return;
        }
        if (!groups[code]) { groups[code] = []; order.push(code); }
        groups[code].push({ no: rowNo, cells: cells, get: cell });
      });

      order.forEach(function (code) {
        var g = groups[code];
        var first = g[0];
        var get = first.get;
        var drugName = get("药品名称") || get("品种名称");
        var specMap = {};
        var specOrder = [];
        g.forEach(function (r) {
          var specKey = r.get("规格编码") || r.get("药品规格");
          if (!specMap[specKey]) {
            specMap[specKey] = { rows: [] };
            specOrder.push(specKey);
          }
          specMap[specKey].rows.push(r);
        });

        var specs = specOrder.map(function (key) {
          var gspec = specMap[key];
          var sget = gspec.rows[0].get;
          var vendors = [];
          var seen = {};
          gspec.rows.forEach(function (r) {
            var vn = r.get("生产企业名称");
            if (!vn || seen[vn]) return;
            seen[vn] = true;
            vendors.push({
              name: vn,
              approval: r.get("批准文号") || "—",
              imported: r.get("进口标识") || "否",
              purchase: r.get("采购类型") || "—"
            });
          });
          return {
            code: sget("规格编码") || "—",
            title: sget("药品规格"),
            formSpec: sget("制剂规格") || "",
            basicDose: sget("基本剂量") || "",
            doseUnit: sget("剂量单位") || "",
            prepUnit: sget("制剂单位") || "",
            minFactor: sget("最小换算系数") || "",
            pkgSpec: sget("包装规格") || "",
            pkgUnit: sget("包装单位") || sget("最小包装单位") || "",
            pkgFactor: sget("包装系数") || "",
            pkgMaterial: sget("包装材质") || "",
            splitUnit: isTrue(sget("允许拆零")) ? (sget("拆零-发药单位") || "—") : "—",
            splitFactor: isTrue(sget("允许拆零")) ? (sget("拆零-发药系数") || "—") : "—",
            status: "on",
            vendors: vendors
          };
        });

        var allergy = get("过敏药物") ? get("过敏药物").split(/[、,，]/) : [];
        okGroups.push({
          id: "imp" + Date.now() + "_" + code,
          code: code,
          name: drugName,
          py: get("拼音码") || "",
          en: get("药品英文名") || "—",
          kind: get("药品种类") || "西药",
          category: get("药品分类") || "—",
          form: get("剂型") || "—",
          insClass: get("医保药品分类") || "—",
          ddd: get("DDD") || "",
          dddUnit: get("DDD单位") || "g",
          status: get("状态") === "停用" ? "off" : "on",
          marks: {
            spirit: normSpirit(get("精神药品")),
            toxic: isTrue(get("毒性药品")),
            narcotic: isTrue(get("麻醉药品")),
            antibiotic: normLevel(get("抗菌药物")),
            antitumor: normLevel(get("抗肿瘤药物")),
            highAlert: get("高警示药品") ? String(get("高警示药品")).charAt(0) : "",
            allergy: allergy,
            skinTest: isTrue(get("是否皮试")),
            longTerm: isTrue(get("长处方")),
            otc: isTrue(get("OTC")),
            centralized: "", negotiated: false,
            emergency: false, keyMonitor: false, rare: false,
            valuable: false, defaultSplit: false
          },
          specs: specs
        });
      });

      okGroups.forEach(function (d) {
        MOCK.drugs.unshift(d);
        if (d.insClass && d.insClass !== "—") {
          MOCK.insMap[d.id] = { leaf: d.insClass, path: d.insClass };
        }
      });
      MOCK.total = MOCK.drugs.length;

      showImportResult(okGroups.length, failRows.length, failRows, TPL_COLS);
      if (okGroups.length) doSearch(true);
    };
    reader.readAsText(importFile, "UTF-8");
  }

  function showImportResult(ok, fail, failRows, cols) {
    var modal = $("modalMask").querySelector(".modal");
    if (!modal) return;
    var title = fail
      ? (ok ? ok + " 条记录新增成功，" + fail + " 条记录新增失败" : fail + " 条记录新增失败")
      : ok + " 条记录新增成功";
    modal.innerHTML =
      '<div class="modal-head">' +
        '<span class="modal-title">导入药品</span>' +
        '<button class="drawer-close" data-close="1">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="modal-body imp2-result">' +
        (fail ? ICON_INFO_CIRCLE : ICON_OK_CIRCLE) +
        '<div class="imp2-result-title">' + title + '</div>' +
        (fail
          ? '<div class="imp2-result-sub">请下载错误详情文件修改后重新新增</div>' +
            '<button class="btn btn-plain" id="btnFailDl">' + ICON_DOWNLOAD + '<span>下载错误详情记录</span></button>'
          : '') +
      '</div>' +
      '<div class="modal-foot">' +
        '<button class="btn btn-primary" data-close="1">关闭</button>' +
      '</div>';

    $("modalMask").setAttribute("data-imported", "1");

    if (fail) {
      $("btnFailDl").addEventListener("click", function () {
        var rows = [cols.concat(["失败原因"])];
        failRows.forEach(function (f) {
          var r = f.cells.slice(0, cols.length);
          while (r.length < cols.length) r.push("");
          r.push(f.reason);
          rows.push(r);
        });
        downloadCsv("药品目录导入失败记录_" + todayStr() + ".csv", rows);
      });
    }
  }

  /* ================= 事件绑定 ================= */
  function bind() {
    $("btnAdd").addEventListener("click", function () {
      location.href = "drug-create.html?from=new";
    });
    $("btnImport").addEventListener("click", openImport);
    $("btnExport").addEventListener("click", doExport);
    $("btnQuery").addEventListener("click", function () { doSearch(true); });
    $("btnReset").addEventListener("click", resetFilters);
    $("fKw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") doSearch(true);
    });

    /* 表格事件 */
    $("tbody").addEventListener("click", function (e) {
      var chk = e.target.closest("[data-chk]");
      if (chk) {
        var id = chk.getAttribute("data-chk");
        if (chk.checked) checked[id] = true; else delete checked[id];
        syncCheckUi();
        return;
      }
      var b = e.target.closest("[data-act]");
      if (!b) return;
      var act = b.getAttribute("data-act");
      var id = b.getAttribute("data-id");
      if (act === "view") openView(id);
      else if (act === "edit") location.href = "drug-edit.html?id=" + encodeURIComponent(id);
      else if (act === "toggle") toggleStatus(id);
      else if (act === "del") delDrug(id);
    });

    $("chkAll").addEventListener("change", function () {
      var list = filtered.slice((state.page - 1) * state.size, state.page * state.size);
      list.forEach(function (d) {
        if (this.checked) checked[d.id] = true; else delete checked[d.id];
      }, this);
      document.querySelectorAll("[data-chk]").forEach(function (el) {
        el.checked = !!checked[el.getAttribute("data-chk")];
      });
      syncCheckUi();
    });

    /* 批量 */
    $("bbOn").addEventListener("click", batchOn);
    $("bbOff").addEventListener("click", batchOff);
    $("bbDel").addEventListener("click", batchDel);
    $("bbClear").addEventListener("click", clearChecked);

    /* 分页 */
    $("pgPrev").addEventListener("click", function () { if (state.page > 1) { state.page--; renderBody(); } });
    $("pgNext").addEventListener("click", function () {
      var tp = Math.max(1, Math.ceil(filtered.length / state.size));
      if (state.page < tp) { state.page++; renderBody(); }
    });
    $("pgSize").addEventListener("change", function () {
      state.size = parseInt(this.value, 10) || 20;
      state.page = 1;
      renderBody();
    });

    /* 抽屉 */
    $("drawerClose").addEventListener("click", closeDrawer);
    $("drawerMask").addEventListener("click", closeDrawer);
    $("drawerBody").addEventListener("click", function (e) {
      var t = e.target.closest("[data-vtab]");
      if (t) switchViewTab(t.getAttribute("data-vtab"));
      var tg = e.target.closest("[data-spec-toggle]");
      if (tg) {
        var spec = tg.closest(".dc2-spec");
        var expanded = spec.classList.toggle("is-expanded");
        tg.textContent = expanded ? "收起" : "展开";
      }
    });
    $("drawerFoot").addEventListener("click", function (e) {
      var b = e.target.closest("[data-dact]");
      if (!b) return;
      var act = b.getAttribute("data-dact");
      if (act === "close") closeDrawer();
      else if (act === "edit" && viewId) location.href = "drug-edit.html?id=" + encodeURIComponent(viewId);
    });

    /* 弹窗 */
    $("modalMask").addEventListener("click", function (e) {
      if (e.target === $("modalMask")) {
        closeModal();
        doSearch(false);
        return;
      }
      if (e.target.closest("[data-confirm]")) {
        var cb = confirmCb;
        closeModal();
        if (cb) cb();
        return;
      }
      if (e.target.closest("[data-close]")) {
        var hadImport = $("modalMask").getAttribute("data-imported") === "1";
        $("modalMask").removeAttribute("data-imported");
        closeModal();
        if (hadImport) doSearch(false);
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { closeDrawer(); closeModal(); }
    });

    /* 顶部标签 */
    document.querySelectorAll("[data-nav]").forEach(function (el) {
      el.addEventListener("click", function () {
        if (el.getAttribute("data-nav") === "首页") location.href = "home.html";
      });
    });
  }

  /* ================= 启动 ================= */
  loadEditSave();
  loadPendingDrugs();

  MOCK.drugKinds.forEach(function (k) {
    var o = document.createElement("option");
    o.value = k; o.textContent = k;
    $("fKind").appendChild(o);
  });

  bind();
  doSearch(false);
})();
</script>
