/* ===== 门诊处方开具 · 局部样式 ===== */
.pc-page{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pc-scroll{flex:1;min-height:0;overflow:auto}
.pc-btn{height:30px;padding:0 12px;border:1px solid var(--border-btn);border-radius:var(--radius);background:#fff;color:var(--text-primary);font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;white-space:nowrap}
.pc-btn:hover{background:var(--primary-lighter);border-color:var(--border-light)}
.pc-btn.primary{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
.pc-btn.primary:hover{background:var(--primary)}
.pc-btn.danger{color:var(--danger)}
.pc-btn.sm{height:26px;padding:0 8px;font-size:12px}
.pc-btn:disabled{opacity:.45;cursor:not-allowed}
.pc-ipt{height:30px;border:1px solid var(--border-input);border-radius:var(--radius);padding:0 8px;font-size:12px;background:#fff;color:var(--text-primary);min-width:0}
.pc-ipt:focus{outline:none;border-color:var(--primary)}
.pc-ipt.ro{background:var(--bg-disabled);color:var(--text-secondary)}
.pc-ipt.sm{height:26px;font-size:12px}
select.pc-ipt{padding:0 4px}
.pc-link{color:var(--primary-dark);cursor:pointer;margin-right:10px;white-space:nowrap}
.pc-link:hover{text-decoration:underline}
.pc-link.danger{color:var(--danger)}
.pc-more-trigger .caret{font-size:9px;margin-left:1px;position:relative;top:-1px}
.pc-filter{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}
.pc-tag{display:inline-block;font-size:11px;line-height:18px;padding:0 8px;border-radius:9px;white-space:nowrap}
.pc-tag.warn{color:var(--warning);background:var(--warning-bg)}
.pc-tag.danger{color:var(--danger);background:var(--danger-bg)}
.pc-tag.blue{color:var(--primary-dark);background:var(--primary-lighter)}
.pc-tag.ok{color:var(--success);background:var(--success-bg)}
.pc-tag.mute{color:var(--text-secondary);background:var(--bg-disabled)}
.pc-table{width:100%;border-collapse:collapse;font-size:12px}
.pc-table th{background:var(--table-head);color:var(--text-secondary);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
.pc-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.pc-table tr:hover td{background:var(--table-hover)}
/* 列表横向滚动 + 操作列固定右侧 */
.pc-tablewrap{overflow-x:auto}
.pc-tablewrap .pc-table{min-width:100%}
.pc-tablewrap .pc-table th,.pc-tablewrap .pc-table td{white-space:nowrap}
.pc-tablewrap .pc-table th:last-child,.pc-tablewrap .pc-table td:last-child{position:sticky;right:0;z-index:2;background:#fff;border-left:1px solid var(--border);box-shadow:-6px 0 8px -6px rgba(0,0,0,.16)}
.pc-tablewrap .pc-table th:last-child{background:var(--table-head)}
.pc-tablewrap .pc-table tr:hover td:last-child{background:var(--table-hover)}
.pc-ops{display:flex;align-items:center;gap:2px}
/* 更多菜单：挂到 body 上用 fixed 定位，避免被表格横向滚动容器裁切 */
.pc-more-menu{position:fixed;z-index:90;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 18px rgba(16,24,40,.14);min-width:96px;padding:4px;display:none}
.pc-more-menu.show{display:block}
.pc-more-menu div{padding:6px 10px;cursor:pointer;white-space:nowrap;font-size:12px;border-radius:4px;color:var(--text-primary)}
.pc-more-menu div:hover{background:var(--primary-lighter);color:var(--primary-dark)}
.pc-more-menu div.danger{color:var(--danger)}
.pc-more-menu div.danger:hover{background:var(--danger-bg);color:var(--danger)}
/* 区域划分：浅灰页底 + 白色区块卡片 */
.tabbar{padding:0 12px;}
.pc-page{flex:1;min-height:0;background:var(--bg-page);padding:8px 12px 12px;box-sizing:border-box}
.pc-sec{background:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 1px 3px rgba(16,24,40,.06);margin-bottom:8px}
.pc-sec:last-child{margin-bottom:0}
.pc-block + .pc-block{border-top:1px solid #F0F2F5;margin-top:14px;padding-top:14px}
/* 必填标记 */
.pc-field>label.req::before{content:"*";color:var(--danger);margin-right:3px}
.pc-req{color:var(--danger);font-style:normal;margin-right:2px}
/* 患者卡（常驻，两行） */
.pc-patient{display:flex;align-items:center;gap:14px;padding:2px 0}
.pc-avatar{width:46px;height:46px;flex:none}
.pc-pinfo-main{flex:1;min-width:0}
.pc-pline1{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.pc-name{font-size:15px;font-weight:600;color:var(--text-primary)}
.pc-pline2{display:flex;align-items:center;gap:26px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap}
.pc-pline2 b{font-weight:400;margin-right:6px;color:var(--text-tertiary)}
.pc-sex{font-size:17px;line-height:1;vertical-align:-2px;font-weight:600}
.pc-sex.male{color:var(--primary-dark)}
.pc-sex.female{color:#e0527f}
.pc-pactions{margin-left:auto;display:flex;gap:8px}
/* 表单顶部栏 */
.pc-form-hd{display:flex;align-items:center;gap:12px;padding:0 0 10px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.pc-back{cursor:pointer;color:var(--primary-dark);font-size:13px;white-space:nowrap}
.pc-back:hover{text-decoration:underline}
.pc-form-title{font-size:15px;font-weight:500}
/* 表单：label 与内容左右排版 */
.pc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px}
.pc-field{display:flex;align-items:center;gap:8px;min-width:0}
.pc-field>label{flex:0 0 92px;text-align:right;font-size:12px;color:var(--text-secondary);margin:0;line-height:1.4}
.pc-field>*:not(label){flex:1;min-width:0}
.pc-field.full{grid-column:1/-1}
.pc-field.half{grid-column:span 2}
.pc-field.grow3{grid-column:span 3}
/* 西药主处方：处方类型/有效天数/西医诊断/药房 四格按比例铺满整行 */
.pc-grid.wm{grid-template-columns:24fr 14fr 40fr 22fr}
.pc-grid.wm>.pc-field>label{flex:0 0 auto}
.pc-checks{display:flex;align-items:center;gap:16px;font-size:12px;flex-wrap:wrap}
.pc-checks label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.pc-entry{background:#fafbfc;border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:4px}
.pc-entry-ft{margin-top:10px;display:flex;gap:8px;align-items:center}
.pc-hint{font-size:11px;color:var(--text-tertiary);margin-left:8px}
/* 药品内联下拉 */
.pc-drugwrap{position:relative}
.pc-drugdrop{position:absolute;left:100px;top:34px;z-index:90;background:#fff;border:1px solid var(--border-btn);border-radius:var(--radius);box-shadow:var(--shadow-2);width:560px;max-height:280px;overflow:auto;display:none;flex:none}
.pc-drugdrop.show{display:block}
.pc-drugdrop .pc-table{font-size:11px}
.pc-drugdrop .pc-table th{padding:5px 6px;position:sticky;top:0}
.pc-drugdrop .pc-table td{padding:5px 6px;cursor:pointer}
.pc-drugdrop .pc-table tr:hover td{background:var(--table-hover)}
.pc-chips{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;margin-top:12px;min-height:78px}
.pc-chips:empty{border:1px dashed #D6E4FF;border-radius:4px;background:#FAFCFF;align-items:center;justify-content:center}
.pc-chips:empty::after{content:"尚未添加中药饮片";color:var(--text-tertiary);font-size:12px}
.pc-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #D6E4FF;background:#F5F9FF;border-radius:4px;padding:5px 8px;font-size:12px}
.pc-chip .nm{color:var(--text-primary)}
.pc-chip .pc-ipt{width:54px;height:26px;font-size:12px;padding:0 6px}
.pc-chip select.pc-ipt{width:80px}
.pc-chip .x{color:var(--text-tertiary);cursor:pointer;font-size:14px;line-height:1}
.pc-chip .x:hover{color:var(--danger)}
.pc-sum{display:flex;justify-content:flex-end;align-items:center;gap:28px;background:#F5F9FF;border:1px solid #D6E4FF;border-radius:4px;padding:8px 12px;font-size:12px;color:var(--text-secondary);margin-top:12px}
.pc-sum b{color:var(--text-primary);font-weight:500}
.pc-unit{color:var(--text-secondary);font-size:12px;white-space:nowrap}
.pc-inline{display:flex;align-items:center;gap:8px}
.pc-herbwrap{position:relative;flex:1;min-width:0}
.pc-herbtext{position:relative;display:flex;align-items:center}
.pc-herbtext input{flex:1;width:100%;min-width:0;cursor:pointer;padding-right:26px}
.pc-herbtext .caret{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);font-size:10px;pointer-events:none}
.pc-herbdrop{position:absolute;left:0;top:34px;z-index:80;background:#fff;border:1px solid var(--border-btn);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:8px;display:none;white-space:nowrap}
.pc-herbdrop.show{display:flex;gap:6px}
.pc-herbdrop select{min-width:76px;width:auto;height:26px;font-size:12px;padding:0 4px}
/* 弹窗 */
.pc-mask{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:none}
.pc-mask.show{display:block}
.pc-dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.98);background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-2);z-index:70;width:760px;max-width:92vw;max-height:86vh;display:none;flex-direction:column}
.pc-dialog.show{display:flex;transform:translate(-50%,-50%) scale(1)}
.pc-dialog.wide{width:1000px}
.pc-dialog-hd{height:46px;flex:none;padding:0 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;font-size:14px;font-weight:500}
.pc-dialog-hd .x{margin-left:auto;cursor:pointer;color:var(--text-tertiary);font-size:18px}
.pc-dialog-bd{flex:1;min-height:0;overflow:auto;padding:14px 16px}
.pc-dialog-ft{flex:none;height:52px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 16px;background:#fafbfc}
/* 查看详情 */
.pv-head{display:flex;align-items:center;gap:10px;padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.pv-id{font-size:14px;font-weight:600;letter-spacing:.2px}
.pv-amt{margin-left:auto;font-size:16px;font-weight:600;color:var(--danger);font-variant-numeric:tabular-nums}
.pv-sec{border:1px solid var(--border);border-radius:6px;margin-bottom:12px}
.pv-sec-hd{height:34px;display:flex;align-items:center;padding:0 12px;background:#FAFBFC;border-bottom:1px solid var(--border);border-radius:6px 6px 0 0;font-size:12px;font-weight:500;color:var(--text-primary)}
.pv-sec-hd .cnt{margin-left:6px;font-weight:400;color:var(--text-tertiary)}
.pv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 16px;padding:6px 12px 10px}
.pv-it{display:flex;gap:6px;padding:5px 0;font-size:12px;min-width:0;line-height:1.6}
.pv-it>i{flex:0 0 60px;color:var(--text-tertiary);font-style:normal;text-align:right}
.pv-it>span{flex:1;min-width:0;color:var(--text-primary);word-break:break-word}
.pv-it.full{grid-column:1/-1}
.pv-tok{display:inline-block;background:#F5F9FF;border:1px solid #D6E4FF;color:var(--primary-dark);border-radius:3px;padding:0 6px;margin:0 6px 4px 0;font-size:11px;line-height:18px}
.pv-tblwrap{overflow-x:auto;padding:0 12px}
.pv-tbl .pc-table th{background:#fff;color:var(--text-tertiary);font-weight:400;border-bottom:1px solid var(--border);padding:7px 8px}
.pv-tbl .pc-table td{padding:8px;border-bottom:1px dashed var(--border)}
.pv-tbl .pc-table tbody tr:last-child td{border-bottom:none}
.pv-tbl .pc-table tr:hover td{background:#fff}
.pv-tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.pv-tbl .idx{color:var(--text-tertiary);width:32px}
.pv-total{display:flex;justify-content:flex-end;align-items:center;gap:22px;padding:10px 12px;font-size:12px;color:var(--text-secondary)}
.pv-total b{color:var(--text-primary);font-weight:600}
.pv-total .amt{color:var(--danger);font-size:13px}
.pv-addr{margin:0 12px 12px;background:#FAFBFC;border:1px solid var(--border);border-radius:4px;padding:8px 10px;font-size:12px;line-height:1.8;color:var(--text-primary)}
.pv-addr .ln{color:var(--text-secondary);font-size:11px;margin-bottom:2px}
/* 处方笺 */
.rx-sheet{max-width:760px;margin:0 auto 16px;border:1px solid #cfd6de;background:#fff;padding:20px 26px;position:relative;font-size:12px;color:#222}
.rx-sheet.emergency{background:#fffdf0}
.rx-sheet.pediatric{background:#f2fbf5}
.rx-sheet.narc{background:#fff2f2}
.rx-kind{position:absolute;right:20px;top:16px;border:1px solid #888;border-radius:10px;padding:1px 10px;font-size:12px;color:#333}
.rx-sheet-title{text-align:center;font-size:18px;letter-spacing:3px;margin-bottom:12px}
.rx-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 12px;margin-bottom:8px}
.rx-meta .it{border-bottom:1px solid #cfd6de;min-height:20px}
.rx-diag{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.rx-diag .box{flex:1;border:1px solid #cfd6de;border-radius:3px;padding:4px 8px;min-height:24px}
.rx-rp{border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:8px 0;min-height:100px;line-height:1.9}
.rx-rp .rp{font-size:16px;font-weight:500}
.rx-rp .line{display:flex;justify-content:space-between;padding-left:16px}
.rx-rp .sig{padding-left:28px;color:#555}
.rx-blank{text-align:center;letter-spacing:10px;color:#888;padding:10px 0 12px;border-bottom:1px solid #ddd}
.rx-sign{margin-top:10px;line-height:2}
.rx-sign .row{display:flex;justify-content:space-between}
.rx-sign .amt{font-weight:500}
.pc-toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:8px 16px;border-radius:4px;z-index:100;font-size:12px;display:none}
.pc-toast.show{display:block}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;position:static}
  .pc-dialog{box-shadow:none;border:none}
  .pc-dialog-hd,.pc-dialog-ft{display:none!important}
  .pc-dialog-bd{overflow:visible;padding:0}
  .pc-dialog{position:static;transform:none;width:100%;max-width:none;max-height:none;display:block}
  .rx-sheet{break-after:page;page-break-after:always}
}
</style>
</head>

function closeDlg(id){$(id).classList.remove('show');showMask(false)}
function closeAllDlg(){['addrDialog','viewDialog','rxDialog'].forEach(function(i){$(i).classList.remove('show')});showMask(false)}

/* ---------- 视图切换：只切下方区域，患者卡常驻 ---------- */
function showListView(){$('formView').style.display='none';$('listView').style.display='';renderList()}
function showFormView(){$('listView').style.display='none';$('formView').style.display='';$('formBody').scrollTop=0}

/* ---------- 药品内联下拉 ---------- */
function drugDropHead(kind){
  return kind==='west'
    ? '<tr><th>药品名称</th><th>规格</th><th>剂型</th><th>拆零</th><th>可用库存</th><th>零售价</th><th>毒性</th><th>麻醉</th><th>精神药品</th></tr>'
    : '<tr><th>药品名称</th><th>规格</th><th>可用库存</th><th>零售价</th><th>毒性</th><th>麻醉</th><th>精神药品</th></tr>';
}
function bindDrugDrop(inputId,dropId,kind,onSelect){
  var input=$(inputId),drop=$(dropId);if(!input||!drop)return;
  function render(q){
    q=(q||'').toLowerCase();
    var list=(kind==='west'?WEST_DRUGS:TCM_DRUGS).filter(function(d){return !q||d.name.indexOf(q)>=0||d.py.indexOf(q)>=0});
    drop.innerHTML='<table class="pc-table"><thead>'+drugDropHead(kind)+'</thead><tbody>'+list.map(function(d){
      return '<tr data-id="'+d.id+'"><td>'+d.name+'</td><td>'+d.spec+'</td>'+
        (kind==='west'?'<td>'+d.form+'</td><td>'+d.split+'</td>':'')+
        '<td>'+d.stock+(kind==='west'?'':' g')+'</td><td>'+money(d.price)+(kind==='tcm'?'/g':'')+'</td>'+
        '<td>'+(d.toxic?'是':'否')+'</td><td>'+(d.narc?'是':'否')+'</td><td>'+d.psych+'</td></tr>';
    }).join('')+'</tbody></table>'||'<div style="padding:10px;color:#999">无匹配药品</div>';
    drop.querySelectorAll('tr[data-id]').forEach(function(tr){
      tr.onclick=function(){
        var d=(kind==='west'?WEST_DRUGS:TCM_DRUGS).filter(function(x){return x.id===tr.getAttribute('data-id')})[0];
        input.value=d.name;input._drug=d;drop.classList.remove('show');
        if(onSelect)onSelect(d);
      };
    });
  }
  input.addEventListener('focus',function(){render('');drop.classList.add('show')});
  input.addEventListener('input',function(){render(this.value.trim());drop.classList.add('show')});
  input.addEventListener('blur',function(){setTimeout(function(){drop.classList.remove('show')},180)});
  drop.addEventListener('mousedown',function(e){e.preventDefault()});
}

/* ---------- 表单 ---------- */
var draft=null,editingId=null,draftKind='west',editIdx=null;
function openForm(kind,rx){
  draftKind=kind;editingId=rx?rx.id:null;editIdx=null;
  draft=rx?JSON.parse(JSON.stringify(rx)):{id:genId(),type:'01',kind:kind,diag:'',fee:0,status:'待推送',longRx:false,external:false,created:now(),note:'',days:3,items:[],addr:null};
  if(kind==='tcm'){
    if(!draft.doses)draft.doses=1;
    if(!draft.herbUsage)draft.herbUsage=['每日','1剂','煎服','300','ml','1次','饭后','温服'];
    if(!draft.pharm)draft.pharm=(rx&&rx.items[0]&&rx.items[0].pharm)||'中药房';
  }else if(!draft.pharm){
    // 西药：药房为处方级，默认取已有明细的药房
    draft.pharm=(rx&&rx.items[0]&&rx.items[0].pharm)||PHARMS[0];
  }
  $('formTitle').textContent=(rx?'编辑':'新建')+(kind==='west'?'西药':'中药')+'处方';
  $('formSubmit').textContent=rx?'保存修改':'生成处方';
  renderForm();
  showFormView();
}

    html+='<div class="pc-block"><table class="pc-table"><thead><tr><th>药品名称</th><th>规格</th><th>单次用量</th><th>频次</th><th>用法</th><th>用药天数</th><th>滴速</th><th>总数</th><th>皮试</th><th>金额</th><th>操作</th></tr></thead><tbody id="westItems"></tbody></table>'+

    '</div><div class="pc-entry-ft">'+
      '<button class="pc-btn primary" id="westAdd">添加</button>'+
      '<button class="pc-btn" id="westCancelEdit">取消</button></div></div></div>';

      '<div class="pc-inline" style="flex-wrap:wrap;gap:8px">'+
        '<span class="pc-unit"><i class="pc-req">*</i>药品名称：</span>'+
        '<div class="pc-drugwrap" style="flex:1;min-width:260px"><input class="pc-ipt" id="tcmDrugName" placeholder="输入药品名称 / 拼音码，或点击选择药品" autocomplete="off" style="width:100%"><div class="pc-drugdrop" id="tcmDrugDrop" style="width:520px;left:0;top:32px"></div></div>'+
        '<span class="pc-unit"><i class="pc-req">*</i>数量：</span><input class="pc-ipt" id="tcmQty" type="number" value="0" style="width:64px"><span class="pc-unit">g</span>'+

      '</div>'+

          '<div class="pc-herbwrap">'+
            '<div class="pc-herbtext"><input class="pc-ipt" id="herbUsageText" value="'+esc((d.herbUsage||[]).join(''))+'" readonly><span class="caret">▼</span></div>'+

              ['每三日','1剂','冲服','100','ml','1次','空腹','温服'].map(function(v,i){return '<select class="pc-ipt" data-hu'+i+'>'+[v,'每日','每日两次','煎服','300','500','200','饭前','饭后','暂无'].map(function(o){return '<option'+(o===d.herbUsage[i]?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'}).join('')+
            '</div>'+
          '</div>'+
        '</div>'+

function bindForm(){
  $('fType').onchange=function(){draft.type=this.value};
  $('fExternal').onchange=function(){
    draft.external=this.checked;
    $('addrLink').style.display=this.checked?'':'none';
    if(this.checked&&!draft.addr)openAddr();
  };
    $('addrLink').onclick=function(){openAddr()};
  if(draftKind==='tcm'){
    bindDrugDrop('tcmDrugName','tcmDrugDrop','tcm',function(){$('tcmQty').value=1});
    $('fDoses').onchange=function(){
      var v=Number(this.value)||0;
      draft.doses=v>0?v:1;
      recalc();renderTcmChips();
    };
    $('tcmAdd').onclick=function(){
      var d=$('tcmDrugName')._drug,qty=Number($('tcmQty').value);
      if(!d){toast('请先选择药味');return}
      if(!(qty>0)){toast('数量须大于 0');return}
      if(qty>d.stock){toast('库存不足，禁止添加');return}
      if(draft.items.some(function(x){return x.drugId===d.id})){toast('该药味已在处方中');return}
      var pharm=$('fMainPharm').value;
      draft.items.push({drugId:d.id,name:d.name,spec:d.spec,pharm:pharm,qty:qty,usage:$('tcmUsage').value,price:d.price,amount:+(qty*d.price).toFixed(2)});
      $('tcmDrugName').value='';$('tcmDrugName')._drug=null;$('tcmQty').value=0;$('tcmUsage').value='';
      recalc();renderTcmChips();
    };
    // 中草药用法：点击输入框展开下拉，下拉变化同步到组合文本
    $('herbUsageText').onclick=function(e){
      e.stopPropagation();
      $('herbUsageDrop').classList.toggle('show');
    };
    window._huDocClick&&document.removeEventListener('click',window._huDocClick);
    window._huDocClick=function(e){
      var box=$('herbUsageDrop'),inp=$('herbUsageText');
      if(box&&box.classList.contains('show')&&!box.contains(e.target)&&e.target!==inp)box.classList.remove('show');
    };
    document.addEventListener('click',window._huDocClick);
    Array.prototype.slice.call($('herbUsageDrop').querySelectorAll('select[data-hu]')).forEach(function(sel){
      sel.onchange=function(){
        var vals=Array.prototype.slice.call($('herbUsageDrop').querySelectorAll('select[data-hu]')).map(function(s){return s.value});
        $('herbUsageText').value=vals.join('');
        draft.herbUsage=vals;
      };
    });
  }else{
    bindDrugDrop('westDrugName','westDrugDrop','west',function(d){
      $('westSpec').value=d.spec;
      $('doseUnit').textContent=d.doseUnit||'片';
      $('dTotalUnit').textContent=d.unit||'盒';
    });
    $('dRoute').onchange=function(){
      var iv=this.value==='静脉输液';
      $('dDrip').disabled=!iv;$('dDripUnit').disabled=!iv;
      if(!iv){$('dDrip').value=''}
    };
    $('westToggleEntry').onclick=function(){resetWestEntry();showWestEntry(true);$('westDrugName').focus()};
    $('westAdd').onclick=function(){saveWestItem()};
    $('westCancelEdit').onclick=function(){resetWestEntry()};
    // 药房为处方级：切换时若已有明细，需清空并重新添加
    $('fPharm').onchange=function(){
      var sel=this,prev=draft.pharm||PHARMS[0];
      if(draft.items.length){
        if(!confirm('切换药房后，已添加的药品需重新添加，是否继续？')){sel.value=prev;return}
        draft.items=[];recalc();resetWestEntry();renderWestItems();
      }
      draft.pharm=sel.value;
    };
  }
}
function showWestEntry(on){var e=$('westEntry');if(e)e.style.display=on?'':'none'}
function recalc(){
  var s=draft.items.reduce(function(a,i){return a+(i.amount||((i.qty||0)*(i.price||0)))},0);
  // 中药：明细金额为单剂金额，合计需乘剂数
  draft.fee=+(draftKind==='tcm'?s*(draft.doses||1):s).toFixed(2);
}
function isNarcDrug(d){return !!(d&&(d.toxic||d.narc||d.psych!=='否'))}
function isNarcItem(it){return isNarcDrug(WEST_DRUGS.filter(function(x){return x.id===it.drugId})[0])}
function collectWestItem(){
  var d=$('westDrugName')._drug;
  if(!$('fPharm').value){toast('请选择药房');return null}
  if(!d){toast('请选择药品');return null}
  // 数量限制：普通药品最多 5 个；含毒麻精药品的处方仅限 1 个
  var others=draft.items.filter(function(_,i){return i!==editIdx});
  var narcNew=isNarcDrug(d),narcExist=others.some(isNarcItem);
  if((narcNew||narcExist)&&others.length>=1){toast('含毒麻精药品的处方仅限 1 个药品');return null}
  if(others.length>=5){toast('每张西药处方最多 5 个药品');return null}
  var total=Number($('dTotal').value)||0;
  if(total<=0){toast('总数须大于 0');return null}
  if(total>d.stock){toast('库存不足（可用 '+d.stock+'），禁止添加');return null}
  var route=$('dRoute').value;
  var drip=route==='静脉输液'&&$('dDrip').value?($('dDrip').value+' '+$('dDripUnit').value):'';
  return {drugId:d.id,name:d.name,spec:d.spec,pharm:$('fPharm').value,doseNum:$('doseNum').value,doseUnit:$('doseUnit').textContent,freq:$('dFreq').value,route:route,days:Number($('dDays').value)||1,drip:drip,total:total,totalUnit:$('dTotalUnit').textContent,skin:$('dSkin').checked,price:d.price,amount:+(d.price*total).toFixed(2)};
}
function saveWestItem(){
  var item=collectWestItem();if(!item)return;
  if(editIdx!==null){draft.items[editIdx]=item;toast('已保存修改')}else{draft.items.push(item);toast('已添加')}
  resetWestEntry();recalc();renderWestItems();
}
function resetWestEntry(){
  editIdx=null;
  $('westDrugName').value='';$('westDrugName')._drug=null;$('westSpec').value='';
  $('dTotal').value=1;$('dSkin').checked=false;
  $('doseNum').value='1';$('doseUnit').textContent='片';
  $('dDrip').value='';$('dDrip').disabled=true;$('dDripUnit').disabled=true;$('dDripUnit').value='滴/分';
  $('dRoute').value='口服';$('dDays').value=3;$('dTotalUnit').textContent='盒';
  $('westAdd').textContent='添加';
  showWestEntry(false);
}
function renderWestItems(){
  var tb=$('westItems');if(!tb)return;
  tb.innerHTML=draft.items.map(function(it,i){
    return '<tr><td>'+esc(it.name)+'</td><td>'+it.spec+'</td><td>'+it.doseNum+' '+it.doseUnit+'</td>'+
      '<td>'+it.freq+'</td><td>'+it.route+'</td><td>'+it.days+' 天</td><td>'+(it.drip||'—')+'</td>'+
      '<td>'+it.total+' '+it.totalUnit+'</td><td>'+(it.skin?'是':'否')+'</td><td>'+money(it.amount)+'</td>'+
      '<td><span class="pc-link" data-wedit="'+i+'">编辑</span><span class="pc-link danger" data-wdel="'+i+'">移除</span></td></tr>';
  }).join('')||'<tr><td colspan="11" style="text-align:center;color:#999">暂无明细，请点击「+ 添加药品」</td></tr>';
  tb.querySelectorAll('[data-wdel]').forEach(function(el){el.onclick=function(){
    if(editIdx===+el.getAttribute('data-wdel'))resetWestEntry();
    draft.items.splice(+el.getAttribute('data-wdel'),1);recalc();renderWestItems();
  }});
  tb.querySelectorAll('[data-wedit]').forEach(function(el){el.onclick=function(){
    editIdx=+el.getAttribute('data-wedit');var it=draft.items[editIdx];
    $('westDrugName')._drug=WEST_DRUGS.filter(function(x){return x.id===it.drugId})[0];
    $('westDrugName').value=it.name;$('westSpec').value=it.spec;
    $('doseNum').value=it.doseNum;$('doseUnit').textContent=it.doseUnit;$('dFreq').value=it.freq;$('dRoute').value=it.route;
    $('dDays').value=it.days;
    var iv=it.route==='静脉输液';$('dDrip').disabled=!iv;$('dDripUnit').disabled=!iv;
    var dp=(it.drip||'').split(' ');$('dDrip').value=dp[0]||'';$('dDripUnit').value=dp[1]||'滴/分';
    $('dTotal').value=it.total;$('dTotalUnit').textContent=it.totalUnit||'盒';$('dSkin').checked=it.skin;
    $('westAdd').textContent='保存修改';
    showWestEntry(true);$('westDrugName').focus();
  }});
}
function renderTcmChips(){
  var box=$('tcmChips');if(!box)return;
  box.innerHTML=draft.items.map(function(it,i){
    return '<span class="pc-chip"><span class="nm">'+esc(it.name)+'</span>'+
      '<input class="pc-ipt" type="number" value="'+it.qty+'" data-qty="'+i+'"><span class="pc-unit">g</span>'+
      '<select class="pc-ipt" data-us="'+i+'">'+['请选择'].concat(TCM_USAGE).map(function(u){return '<option value="'+u+'"'+(u===it.usage?' selected':'')+'>'+u+'</option>'}).join('')+'</select>'+
      '<span class="x" data-tdel="'+i+'">×</span></span>';
  }).join('');
  var sum=$('tcmSummary');
  if(sum){
    var w=draft.items.reduce(function(s,i){return s+(Number(i.qty)||0)},0);
    var per=draft.items.reduce(function(s,i){return s+(i.amount||0)},0);
    var doses=draft.doses||1;
    sum.innerHTML='<span>共 <b>'+draft.items.length+'</b> 种药味</span><span>药品重量：<b>'+w+' g</b></span>'+
      '<span>单剂金额：<b>'+money(per)+'</b></span><span>剂数：<b>'+doses+' 剂</b></span>'+
      '<span>合计金额：<b>'+money(per*doses)+'</b></span>';
  }
  box.querySelectorAll('[data-tdel]').forEach(function(el){el.onclick=function(){draft.items.splice(+el.getAttribute('data-tdel'),1);recalc();renderTcmChips()}});
  box.querySelectorAll('[data-qty]').forEach(function(el){el.onchange=function(){var i=+el.getAttribute('data-qty');var q=Number(el.value);var d=TCM_DRUGS.filter(function(x){return x.id===draft.items[i].drugId})[0];if(q>d.stock){toast('库存不足');el.value=draft.items[i].qty;return}draft.items[i].qty=q;draft.items[i].amount=+(q*draft.items[i].price).toFixed(2);recalc();renderTcmChips()}});
  box.querySelectorAll('[data-us]').forEach(function(el){el.onchange=function(){draft.items[+el.getAttribute('data-us')].usage=el.value}});
}

/* ---------- 外送地址 ---------- */
function openAddr(){
  var a=draft.addr||state.patient;
  $('aName').value=a.name||'';$('aPhone').value=a.phone||'';$('aRegion').value=a.region||'';$('aDetail').value=a.detail||'';
  openDlg('addrDialog');
}

/* ---------- 提交表单 ---------- */
$('formSubmit').onclick=function(){
  draft.type=$('fType').value;draft.days=Number($('fDays').value)||3;draft.diag=$('fDiag').value;
  draft.longRx=$('fLong').checked;draft.external=$('fExternal').checked;
  draft.note=$('fNote')?$('fNote').value:'';
  if(draft.external&&!draft.addr){toast('请填写外送地址');openAddr();return}
  if(!draft.items.length){toast('请至少添加一条明细');return}
  if(draft.days>3){toast('有效天数最长 3 天');return}
  if(draftKind==='tcm'){
    draft.doses=Number($('fDoses').value)||0;
    if(!(draft.doses>0)){toast('请填写剂数');return}
    draft.pharm=$('fMainPharm').value;
    draft.herbUsage=Array.prototype.slice.call($('formBody').querySelectorAll('[data-hu]')).map(function(s){return s.value});
    if(!draft.herbUsage.join('').trim()){toast('请填写中草药用法');return}
  }else{
    draft.pharm=$('fPharm')?$('fPharm').value:draft.pharm;
  }
  recalc();
  if(editingId){
    var idx=state.list.map(function(r){return r.id}).indexOf(editingId);
    var old=findRx(editingId);draft.id=editingId;draft.created=old.created;draft.status=old.status;
    state.list[idx]=JSON.parse(JSON.stringify(draft));
  }else{
    state.list.unshift(JSON.parse(JSON.stringify(draft)));
  }
  save();showListView();toast(editingId?'已保存':'已生成处方（待推送）');
};

/* ---------- 「更多」浮动菜单 ---------- */
var moreMenu=$('moreMenu');
function closeMore(){if(moreMenu)moreMenu.classList.remove('show')}
function moreItemsOf(rx){
  if(rx.status==='待推送')return [{op:'edit',t:'编辑'},{op:'abolish',t:'作废',danger:true}];
  if(rx.status==='待毒麻精审核'||rx.status==='待合理用药审核')return [{op:'recall',t:'撤回'}];
  if(rx.status==='待收费')return [{op:'print',t:'打印'}];
  return [];
}
function openMore(anchor,rx){
  var items=moreItemsOf(rx);
  if(!items.length)return;
  moreMenu.innerHTML=items.map(function(i){
    return '<div'+(i.danger?' class="danger"':'')+' data-op="'+i.op+'" data-id="'+rx.id+'">'+i.t+'</div>';
  }).join('');
  moreMenu.classList.add('show');
  var r=anchor.getBoundingClientRect();
  var w=moreMenu.offsetWidth||96,h=moreMenu.offsetHeight||36;
  var left=Math.min(Math.max(8,r.right-w),window.innerWidth-w-8);
  var top=r.bottom+6;
  if(top+h>window.innerHeight-8)top=Math.max(8,r.top-h-6);
  moreMenu.style.left=left+'px';moreMenu.style.top=top+'px';
}
moreMenu.addEventListener('click',function(e){
  var el=e.target.closest('[data-op]');if(!el)return;
  var op=el.getAttribute('data-op'),id=el.getAttribute('data-id');
  closeMore();doOp(op,id);
});

/* ---------- 操作 ---------- */
function doOp(op,id){
  var rx=findRx(id);if(!rx)return;
  if(op==='preview'){openRxPreview(rx,false)}
  else if(op==='view'){openView(rx)}
  else if(op==='send'){openRxPreview(rx,true)}
  else if(op==='edit'){openForm(rx.kind,rx)}
  else if(op==='print'){previewSendId=null;$('rxSendConfirm').style.display='none';$('rxPaper').innerHTML=buildRxSheet(rx);openDlg('rxDialog')}
  else if(op==='recall'){rx.status='待推送';save();renderList();toast('已撤回至待推送')}
  else if(op==='abolish'){
    if(confirm('确认作废处方 '+rx.id+'？')){rx.status='作废';save();renderList();toast('已作废')}
  }
}
$('rxList').addEventListener('click',function(e){
  var el=e.target.closest('[data-op]');if(!el)return;
  var op=el.getAttribute('data-op'),id=el.getAttribute('data-id'),rx=findRx(id);
  if(!rx)return;
  if(op==='more'){openMore(el,rx);return}
  closeMore();doOp(op,id);
});
$('selAll').onchange=function(){var on=this.checked;document.querySelectorAll('.rx-sel').forEach(function(c){c.checked=on})};
$('btnPrintSelected').onclick=function(){
  var ids=Array.prototype.slice.call(document.querySelectorAll('.rx-sel:checked')).map(function(c){return c.value});
  if(!ids.length){toast('请先勾选要打印的处方');return}
  previewSendId=null;$('rxSendConfirm').style.display='none';
  $('rxPaper').innerHTML=ids.map(function(id){var rx=findRx(id);return rx?buildRxSheet(rx):''}).join('');
  openDlg('rxDialog');
};

/* ---------- 查看 ---------- */
function pvItem(k,v,full){return '<div class="pv-it'+(full?' full':'')+'"><i>'+k+'</i><span>'+(v===''||v==null?'—':v)+'</span></div>'}
/* 中草药用法：[每三日,1剂,冲服,100,ml,1次,空腹,温服] → 数字与单位合并后逐项成标签 */
function herbTokens(arr){
  var a=arr||[],out=[],i=0;
  while(i<a.length){
    var t=a[i];
    if(/^\d+(\.\d+)?$/.test(t)&&i+1<a.length&&/^[a-zA-Z]+$/.test(a[i+1])){out.push(t+a[i+1]);i+=2}
    else{out.push(t);i++}
  }
  return out;
}
function herbUsageHtml(arr){
  var t=herbTokens(arr);
  if(!t.length)return '';
  return t.map(function(x){return '<span class="pv-tok">'+esc(x)+'</span>'}).join('');
}
function openView(rx){
  var isWest=rx.kind==='west';
  var org=state.org||'北京市朝阳区中心医院',dept=state.dept||'内科门诊',doctor=state.doctor||'孙磊';
  var pharm=rx.pharm||(rx.items[0]&&rx.items[0].pharm)||'—';
  var kindTxt=isWest?'西药处方':'中药饮片处方';

  var head='<div class="pv-head">'+statusTag(rx.status)+
    '<span class="pv-id">'+rx.id+'</span>'+
    '<span class="pv-amt">'+money(rx.fee)+'</span></div>';

  var addrVal='—';
  if(rx.addr)addrVal=esc(rx.addr.region+' '+rx.addr.detail)+'<br><span style="color:var(--text-tertiary)">'+esc(rx.addr.name)+' · '+esc(rx.addr.phone)+'</span>';

  var base='<div class="pv-sec"><div class="pv-sec-hd">基础信息</div><div class="pv-grid">'+
    pvItem('处方类型',TYPE_TEXT[rx.type])+pvItem('处方类别',kindTxt)+pvItem('临床诊断',esc(rx.diag))+
    pvItem('有效天数',(rx.days||3)+' 天')+pvItem('长处方',rx.longRx?'是':'否')+pvItem('外配',rx.external?'是':'否')+
    pvItem('配送地址',addrVal)+pvItem('药房',esc(pharm))+
    (isWest?pvItem('备注',esc(rx.note||'')):pvItem('剂数',(rx.doses||1)+' 剂'))+
    pvItem('开方医生',esc(doctor))+pvItem('开方科室',esc(dept))+pvItem('开方机构',esc(org))+
    (isWest?'':pvItem('备注',esc(rx.note||''),true)+pvItem('中草药用法',herbUsageHtml(rx.herbUsage),true))+
    '</div></div>';

  var rows,th,total;
  if(isWest){
    th='<th class="idx">#</th><th>药品名称</th><th style="width:110px">规格</th><th style="width:92px">单次用量</th><th style="width:86px">频次</th><th style="width:104px">用法</th><th style="width:80px">用药天数</th><th style="width:80px">总数</th><th class="num" style="width:84px">金额</th>';
    rows=rx.items.map(function(it,i){
      var route=esc(it.route)+(it.drip?' · '+esc(it.drip):'');
      return '<tr><td class="idx">'+(i+1)+'</td><td>'+esc(it.name)+(it.skin?' <span class="pc-tag blue" style="margin-left:4px">皮试</span>':'')+'</td>'+
        '<td>'+esc(it.spec)+'</td><td>'+esc(it.doseNum)+' '+esc(it.doseUnit)+'</td><td>'+esc(it.freq)+'</td>'+
        '<td>'+route+'</td><td>'+it.days+' 天</td><td>'+it.total+' '+esc(it.totalUnit)+'</td>'+
        '<td class="num">'+money(it.amount)+'</td></tr>';
    }).join('');
    total='<span>共 <b>'+rx.items.length+'</b> 种药品</span><span>合计金额：<b class="amt">'+money(rx.fee)+'</b></span>';
  }else{
    th='<th class="idx">#</th><th>药味</th><th style="width:120px">规格</th><th style="width:90px">数量</th><th style="width:150px">用法 / 煎法</th><th class="num" style="width:100px">单剂金额</th>';
    rows=rx.items.map(function(it,i){
      var u=(it.usage&&it.usage!=='暂无')?esc(it.usage):'—';
      return '<tr><td class="idx">'+(i+1)+'</td><td>'+esc(it.name)+'</td><td>'+esc(it.spec)+'</td>'+
        '<td>'+it.qty+' g</td><td>'+u+'</td><td class="num">'+money(it.amount)+'</td></tr>';
    }).join('');
    var per=rx.items.reduce(function(s,i){return s+(i.amount||0)},0);
    var doses=rx.doses||1;
    var weight=rx.items.reduce(function(s,i){return s+(Number(i.qty)||0)},0);
    total='<span>共 <b>'+rx.items.length+'</b> 种药味</span><span>总量 <b>'+weight+' g</b></span>'+
      '<span>单剂 <b>'+money(per)+'</b> × <b>'+doses+'</b> 剂</span><span>合计金额：<b class="amt">'+money(rx.fee)+'</b></span>';
  }
  var items='<div class="pv-sec"><div class="pv-sec-hd">药品明细<span class="cnt">（'+rx.items.length+' 项）</span></div>'+
    '<div class="pv-tblwrap pv-tbl"><table class="pc-table"><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="pv-total">'+total+'</div></div>';

  $('viewBody').innerHTML=head+base+items;
  openDlg('viewDialog');
}

/* ---------- 处方笺 ---------- */
var previewSendId=null;
function buildRxSheet(rx){
  var narc=isNarcRx(rx);
  var cls=rx.type==='02'?'emergency':(rx.type==='03'?'pediatric':(narc?'narc':''));
  var kind=narc?'麻、精一':(rx.type==='02'?'急诊':(rx.type==='03'?'儿科':'普通'));
  var p=state.patient;
  var lines='';
  if(rx.kind==='west'){
    lines=rx.items.map(function(it){
      return '<div class="line"><span>'+esc(it.name)+' '+esc(it.spec)+'</span><span>×'+it.total+' '+it.totalUnit+'</span></div>'+
        '<div class="sig">Sig: '+it.doseNum+' '+it.doseUnit+'　'+it.route+'　'+it.freq+'</div>';
    }).join('');
  }else{
    lines=rx.items.map(function(it){return '<div class="line"><span>'+esc(it.name)+(it.usage&&it.usage!=='暂无'?'（'+it.usage+'）':'')+'</span><span>'+it.qty+' g</span></div>'}).join('')+
      '<div class="sig">'+esc(herbTokens(rx.herbUsage).join('　'))+'　共 '+(rx.doses||1)+' 剂</div>';
  }
  return '<div class="rx-sheet '+cls+'">'+
    '<span class="rx-kind">'+kind+'</span><div class="rx-sheet-title">'+esc(state.org||'北京市朝阳区中心医院')+'　门诊处方笺</div>'+
    '<div class="rx-meta">'+
      '<div class="it">姓名：<span>'+esc(p.name)+'</span></div><div class="it">性别：<span>'+esc(p.sex)+'</span></div>'+
      '<div class="it">年龄：<span>'+esc(p.age)+'</span></div><div class="it">科别：<span>'+esc(state.dept||'内科门诊')+'</span></div>'+
      '<div class="it">收费种类：<span>自费</span></div><div class="it">处方日期：<span>'+rx.created.slice(0,10)+'</span></div>'+
      '<div class="it">门诊号：<span>'+esc(p.mzh)+'</span></div><div class="it">处方号：<span>'+rx.id+'</span></div>'+
    '</div>'+
    '<div class="rx-diag">临床诊断：<span class="box">'+esc(rx.diag)+'</span></div>'+
    '<div class="rx-rp"><div class="rp">Rp.</div>'+lines+'</div>'+
    '<div class="rx-blank">以　下　空　白</div>'+
    '<div class="rx-sign"><div class="row"><span>医师：孙磊</span><span>医师(签名)：____________</span></div>'+
    '<div class="row"><span>药师(审核、校对、发药)：____________</span><span>药师/士(调配)：____________</span></div>'+
    '<div class="row amt"><span>金额：'+money(rx.fee)+'</span></div></div></div>';
}
function openRxPreview(rx,fromSend){
  previewSendId=fromSend?rx.id:null;
  $('rxPaper').innerHTML=buildRxSheet(rx);
  $('rxSendConfirm').style.display=fromSend?'':'none';
  openDlg('rxDialog');
}
$('rxSendConfirm').onclick=function(){
  var rx=findRx(previewSendId);if(!rx)return;
  rx.status=isNarcRx(rx)?'待毒麻精审核':'待合理用药审核';
  save();closeAllDlg();renderList();toast('已发送 → '+rx.status);
};
$('rxPrint').onclick=function(){window.print()};

/* ---------- 全局 ---------- */
$('mask').onclick=function(){closeAllDlg()};
document.querySelectorAll('[data-close]').forEach(function(el){el.onclick=function(){closeDlg(el.getAttribute('data-close'))}});
document.addEventListener('click',function(e){
  if(e.target.closest('#moreMenu')||e.target.closest('[data-op="more"]'))return;
  closeMore();
});
(function(){
  var sc=document.querySelector('.pc-scroll');
  if(sc)sc.addEventListener('scroll',closeMore,true);
  window.addEventListener('resize',closeMore);
})();
$('fStatus').onchange=renderList;
$('btnNewWest').onclick=function(){openForm('west')};
$('btnNewTcm').onclick=function(){openForm('tcm')};
$('formBack').onclick=function(){showListView()};
$('formCancel').onclick=function(){showListView()};
$('addrSave').onclick=function(){
  draft.addr={name:$('aName').value,phone:$('aPhone').value,region:$('aRegion').value,detail:$('aDetail').value};
  var link=$('addrLink');
  link.textContent='外送地址：'+draft.addr.region+draft.addr.detail+'（点击修改）';
  link.title=draft.addr.name+' '+draft.addr.phone+' '+draft.addr.region+draft.addr.detail;
  closeDlg('addrDialog');toast('外送地址已保存');
};
$('btnPatient360').onclick=function(){toast('跳转患者360（原型不实现页面）')};
$('btnRecord').onclick=function(){toast('跳转病历浏览（原型不实现页面）')};

renderList();
})();
</script>
