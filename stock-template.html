<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>库存模板 · 中心药房</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"/>
        <path d="M8.4 15.6L15.6 8.4"/>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <div class="header-user">
      <div class="header-avatar">张</div>
      <span class="header-user-name">张明远</span>
    </div>
  </div>
</header>

<div class="app-body">
  <!-- ========== 左侧导航 ========== -->
  <aside class="app-side" id="appSide"></aside>
<!-- ========== 主区域 ========== -->
  <main class="app-main">
    <div class="tabbar">
      <div class="tab" onclick="location.href='drug-catalog.html'">首页</div>
      <div class="tab">
        药品期初管理
        <button class="tab-close" title="关闭" onclick="location.href='init-stock.html'">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M5 5l14 14M19 5L5 19"/>
          </svg>
        </button>
      </div>
      <div class="tab active">库存模板</div>
    </div>

    <div class="page">
      <div class="page-head">
        <div class="page-title">库存模板</div>
        <div class="page-acts">
          <button class="btn" id="btnBack">返回</button>
          <button class="btn btn-primary" id="btnConfirm">确定</button>
        </div>
      </div>

      <div class="page-body">
        <section class="init-main">
          <div class="tpl-locbar">
            <span class="ctx-lbl"><span class="req">*</span>库位：</span>
            <select class="select" id="selLocationCombo"></select>
          </div>

          <div class="init-filter" id="filterBar">
            <div class="mf-fi">
              <span class="lbl">药品名称：</span>
              <input class="input" id="fltName" placeholder="名称/编码/拼音码" autocomplete="off">
            </div>
            <div class="mf-fi">
              <span class="lbl">生产企业：</span>
              <div class="pk" id="pkVendor">
                <input class="pk-input input" id="pkVendorInput" placeholder="请选择生产企业" autocomplete="off">
                <svg class="pk-caret" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.2">
                  <path d="M1 1l4 4 4-4"/>
                </svg>
                <div class="pk-menu">
                  <div class="pk-list" id="pkVendorList"></div>
                </div>
              </div>
            </div>
            <div class="mf-fi">
              <span class="lbl">供应商：</span>
              <div class="pk" id="pkSupplier">
                <input class="pk-input input" id="pkSupplierInput" placeholder="请选择供应商" autocomplete="off">
                <svg class="pk-caret" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.2">
                  <path d="M1 1l4 4 4-4"/>
                </svg>
                <div class="pk-menu">
                  <div class="pk-list" id="pkSupplierList"></div>
                </div>
              </div>
            </div>
            <div class="filter-acts">
              <button class="btn btn-sm" id="btnReset">重置</button>
              <button class="btn btn-sm btn-primary" id="btnSearch">查询</button>
            </div>
          </div>

          <div class="init-table-wrap" id="tableWrap">
            <table class="init-table">
              <colgroup>
                <col style="width:40px">
                <col style="width:48px">
                <col style="width:125px">
                <col style="width:95px">
                <col style="width:105px">
                <col style="width:120px">
                <col style="width:68px">
                <col style="width:68px">
                <col style="width:80px">
                <col style="width:92px">
                <col style="width:92px">
                <col style="width:135px">
                <col style="width:135px">
              </colgroup>
              <thead>
                <tr>
                  <th><input type="checkbox" id="checkAll"></th>
                  <th>序号</th>
                  <th>批次编码</th>
                  <th>药品编码</th>
                  <th>药品名称</th>
                  <th>药品规格</th>
                  <th>进货价</th>
                  <th>零售价</th>
                  <th>批号</th>
                  <th>生产日期</th>
                  <th>有效期</th>
                  <th>生产企业</th>
                  <th>供应商</th>
                </tr>
              </thead>
              <tbody id="listBody"></tbody>
            </table>
          </div>

          <div class="init-pager">
            <span class="total">共 <b id="totalNum">0</b> 条</span>
            <select class="select init-size" id="pageSize">
              <option value="18">18条/页</option>
              <option value="36">36条/页</option>
              <option value="50">50条/页</option>
            </select>
            <button class="pager-btn" id="pagePrev">‹</button>
            <span id="pageNums"></span>
            <button class="pager-btn" id="pageNext">›</button>
            <span>跳至第</span>
            <input class="input init-jump" id="pageJump" value="1">
            <span>页</span>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6L9 17l-5-5"/>
  </svg>
  <span id="toastText"></span>
</div>

<script src="mock.js"></script>
<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmt(n) { return Number(n || 0).toFixed(2); }

  var PHARMACIES = ["中心药房", "门诊药房", "住院药房"];
  var LOCATIONS = ["主库位", "二级库位", "冷藏库位"];
  var SUPPLIERS = [
    "国药控股山东有限公司",
    "华润山东医药有限公司",
    "山东海王银河医药有限公司",
    "上药控股山东有限公司",
    "山东九州通医药有限公司"
  ];

  var CTX_KEY = "STOCK_INIT_CTX";
  var APPLY_KEY = "STOCK_TPL_APPLY";

  var CTX = { pharmacy: PHARMACIES[0], location: LOCATIONS[0] };
  try {
    var saved = JSON.parse(sessionStorage.getItem(CTX_KEY) || "null");
    if (saved && PHARMACIES.indexOf(saved.pharmacy) >= 0 && LOCATIONS.indexOf(saved.location) >= 0) {
      CTX = { pharmacy: saved.pharmacy, location: saved.location };
    }
  } catch (e) { /* ignore */ }
  try { sessionStorage.setItem(CTX_KEY, JSON.stringify(CTX)); } catch (e) { /* ignore */ }

  /* ================= 当前库位药品（模板数据源） ================= */
  var DRUGS = (window.MOCK && window.MOCK.drugs) ? window.MOCK.drugs : [];
  var SPECS = [];
  DRUGS.forEach(function (d) {
    (d.specs || []).forEach(function (s) {
      if (s.status === "off") return;
      var v = (s.vendors && s.vendors[0]) || { name: "", approval: "" };
      SPECS.push({
        sid: SPECS.length,
        name: d.name, code: s.code, py: d.py || "",
        spec: s.title,
        vendor: v.name,
        split: !!(d.marks && d.marks.defaultSplit),
        factor: Number(s.splitFactor || s.minFactor || 1) || 1
      });
    });
  });
  if (!SPECS.length) {
    SPECS = [{ sid: 0, name: "阿莫西林胶囊", code: "1010400101", py: "AMXLJN", spec: "0.25g * 24粒/盒",
      vendor: "华北制药股份有限公司", split: true, factor: 24 }];
  }

  var BATCHES = [
    { code: "20241105", prod: "2024-11-05", expiry: "2026-10-31" },
    { code: "20250225", prod: "2025-02-25", expiry: "2027-01-31" },
    { code: "20250303", prod: "2025-03-03", expiry: "2027-02-28" }
  ];

  var ROWS = [];
  SPECS.forEach(function (sp, si) {
    BATCHES.forEach(function (b, bi) {
      var buy = Math.round((4.6 + si * 3.7 + bi * 1.9) * 100) / 100;
      var retail = Math.round(buy * 1.3 * 100) / 100;
      ROWS.push({
        key: sp.code + "-" + b.code,
        sid: sp.sid,
        name: sp.name,
        code: sp.code,
        spec: sp.spec,
        batchCode: "17" + String(305000000 + si * 12000 + bi * 37),
        buy: buy,
        retail: retail,
        batch: b.code,
        prod: b.prod,
        expiry: b.expiry,
        vendor: sp.vendor,
        supplier: SUPPLIERS[(si + bi) % SUPPLIERS.length],
        py: sp.py,
        split: sp.split
      });
    });
  });

  var VENDORS = [];
  ROWS.forEach(function (r) { if (VENDORS.indexOf(r.vendor) < 0) VENDORS.push(r.vendor); });

  var ST = { filters: { name: "", vendor: "", supplier: "" }, page: 1, size: 18 };
  var SEL = {};

  function toast(msg) {
    $("toastText").textContent = msg;
    var t = $("toast");
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  function filtered() {
    var f = ST.filters;
    return ROWS.filter(function (r) {
      if (f.name) {
        var kw = f.name.toLowerCase();
        var hay = (r.name + " " + r.code + " " + r.py).toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      if (f.vendor && r.vendor !== f.vendor) return false;
      if (f.supplier && r.supplier !== f.supplier) return false;
      return true;
    });
  }

  function render() {
    var rows = filtered();
    var pages = Math.max(1, Math.ceil(rows.length / ST.size));
    if (ST.page > pages) ST.page = pages;
    var start = (ST.page - 1) * ST.size;
    var pageRows = rows.slice(start, start + ST.size);

    $("totalNum").textContent = rows.length;

    $("listBody").innerHTML = pageRows.map(function (r, i) {
      return "<tr>"
        + '<td><input type="checkbox" class="row-check" data-key="' + esc(r.key) + '"' + (SEL[r.key] ? " checked" : "") + "></td>"
        + "<td>" + (start + i + 1) + "</td>"
        + "<td>" + esc(r.batchCode) + "</td>"
        + "<td>" + esc(r.code) + "</td>"
        + "<td>" + esc(r.name) + "</td>"
        + "<td>" + esc(r.spec) + "</td>"
        + '<td class="num">' + fmt(r.buy) + "</td>"
        + '<td class="num">' + fmt(r.retail) + "</td>"
        + "<td>" + esc(r.batch) + "</td>"
        + "<td>" + esc(r.prod) + "</td>"
        + "<td>" + esc(r.expiry) + "</td>"
        + "<td>" + esc(r.vendor) + "</td>"
        + "<td>" + esc(r.supplier) + "</td>"
        + "</tr>";
    }).join("");

    renderPager(pages);
    syncCheckAll(pageRows);
  }

  function renderPager(pages) {
    var html = "";
    for (var p = 1; p <= pages; p++) {
      html += '<button class="pager-btn pager-num' + (p === ST.page ? " is-cur" : "") + '" data-page="' + p + '">' + p + "</button>";
    }
    $("pageNums").innerHTML = html;
    $("pagePrev").disabled = ST.page <= 1;
    $("pageNext").disabled = ST.page >= pages;
    $("pageJump").value = ST.page;
  }

  function syncCheckAll(pageRows) {
    var all = pageRows.length > 0 && pageRows.every(function (r) { return !!SEL[r.key]; });
    $("checkAll").checked = all;
  }

  /* ================= 下拉选择器 ================= */
  var allPickers = [];

  function createPicker(cfg) {
    var root = cfg.root, input = cfg.input, listEl = cfg.list, items = cfg.items || [];
    var cur = null;
    var menuEl = root.querySelector(".pk-menu");
    if (cfg.wide) menuEl.classList.add("is-wide");

    function openMenu() {
      allPickers.forEach(function (p) { if (p !== api) p.close(); });
      root.classList.add("is-open");
      listEl.innerHTML = items.map(function (it, i) {
        return '<div class="pk-item" data-i="' + i + '">' + esc(it) + "</div>";
      }).join("");
    }
    function closeMenu() { root.classList.remove("is-open"); }

    input.addEventListener("click", function (e) {
      e.stopPropagation();
      if (root.classList.contains("is-open")) closeMenu(); else openMenu();
    });
    listEl.addEventListener("click", function (e) {
      e.stopPropagation();
      var it = e.target.closest(".pk-item");
      if (!it) return;
      cur = items[Number(it.getAttribute("data-i"))];
      input.value = cur || "";
      input.classList.toggle("is-filled", !!cur);
      closeMenu();
    });

    var api = {
      get: function () { return cur; },
      reset: function () { cur = null; input.value = ""; input.classList.remove("is-filled"); },
      close: closeMenu
    };
    allPickers.push(api);
    return api;
  }

  document.addEventListener("click", function () {
    allPickers.forEach(function (p) { p.close(); });
  });

  var pkVendor = createPicker({ root: $("pkVendor"), input: $("pkVendorInput"), list: $("pkVendorList"), items: VENDORS, wide: true });
  var pkSupplier = createPicker({ root: $("pkSupplier"), input: $("pkSupplierInput"), list: $("pkSupplierList"), items: SUPPLIERS, wide: true });

  /* ================= 库位 ================= */
  var COMBOS = [];
  PHARMACIES.forEach(function (p) {
    LOCATIONS.forEach(function (l) { COMBOS.push({ p: p, l: l, label: p + " · " + l }); });
  });

  $("selLocationCombo").innerHTML = COMBOS.map(function (c) {
    var sel = c.p === CTX.pharmacy && c.l === CTX.location ? " selected" : "";
    return '<option value="' + esc(c.p) + "|" + esc(c.l) + '"' + sel + ">" + esc(c.label) + "</option>";
  }).join("");

  $("selLocationCombo").addEventListener("change", function () {
    var parts = this.value.split("|");
    CTX = { pharmacy: parts[0], location: parts[1] };
    try { sessionStorage.setItem(CTX_KEY, JSON.stringify(CTX)); } catch (e) { /* ignore */ }
    ST.page = 1;
    render();
  });

  /* ================= 事件 ================= */
  $("listBody").addEventListener("change", function (e) {
    var cb = e.target.closest(".row-check");
    if (!cb) return;
    var key = cb.getAttribute("data-key");
    if (cb.checked) SEL[key] = true; else delete SEL[key];
    render();
  });

  $("checkAll").addEventListener("change", function () {
    var rows = filtered();
    var start = (ST.page - 1) * ST.size;
    var pageRows = rows.slice(start, start + ST.size);
    var on = this.checked;
    pageRows.forEach(function (r) {
      if (on) SEL[r.key] = true; else delete SEL[r.key];
    });
    render();
  });

  $("btnSearch").addEventListener("click", function () {
    ST.filters.name = $("fltName").value.trim();
    ST.filters.vendor = pkVendor.get() || "";
    ST.filters.supplier = pkSupplier.get() || "";
    pkVendor.close();
    pkSupplier.close();
    ST.page = 1;
    render();
  });

  $("btnReset").addEventListener("click", function () {
    $("fltName").value = "";
    pkVendor.reset();
    pkSupplier.reset();
    ST.filters = { name: "", vendor: "", supplier: "" };
    ST.page = 1;
    render();
  });

  $("fltName").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("btnSearch").click();
  });

  $("btnBack").addEventListener("click", function () {
    location.href = "init-stock.html";
  });

  $("btnConfirm").addEventListener("click", function () {
    var selected = ROWS.filter(function (r) { return SEL[r.key]; });
    if (!selected.length) {
      toast("请先勾选需要同步的药品");
      return;
    }
    var rows = selected.map(function (r) {
      return {
        id: "tpl-" + r.key,
        sid: r.sid,
        supplier: r.supplier,
        batch: r.batch,
        prod: r.prod,
        expiry: r.expiry,
        qty: 0,
        buy: r.buy,
        retail: r.retail,
        split: r.split
      };
    });
    try {
      sessionStorage.setItem(CTX_KEY, JSON.stringify(CTX));
      sessionStorage.setItem(APPLY_KEY, JSON.stringify({ rows: rows }));
    } catch (e) { /* ignore */ }
    location.href = "init-stock.html";
  });

  $("pagePrev").addEventListener("click", function () {
    if (ST.page > 1) { ST.page--; render(); }
  });
  $("pageNext").addEventListener("click", function () {
    var pages = Math.max(1, Math.ceil(filtered().length / ST.size));
    if (ST.page < pages) { ST.page++; render(); }
  });
  $("pageNums").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-page]");
    if (!b) return;
    ST.page = Number(b.getAttribute("data-page"));
    render();
  });
  $("pageSize").addEventListener("change", function () {
    ST.size = Number(this.value);
    ST.page = 1;
    render();
  });
  $("pageJump").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var pages = Math.max(1, Math.ceil(filtered().length / ST.size));
    var p = Number(this.value);
    if (p >= 1 && p <= pages) { ST.page = p; render(); }
    else this.value = ST.page;
  });

  render();
})();
</script>
  <script src="nav.js"></script>
</body>
</html>
