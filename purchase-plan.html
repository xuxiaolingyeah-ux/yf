<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>采购计划 · 区域药房协同管理系统</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ---------- 配送地址维护（右侧抽屉）：一行 = 地址输入框 + 默认地址勾选 ---------- */
.addr-drawer { width: 620px; }
.addr-tip { font-size: 12px; color: var(--text-tertiary); line-height: 1.7; margin-bottom: 14px; }
.addr-list { display: flex; flex-direction: column; gap: 12px; }
.addr-row { display: flex; align-items: center; gap: 10px; }
.addr-row .addr-input { flex: 1; min-width: 0; font-size: 13px; }
.addr-row .addr-input.is-error { border-color: var(--danger); }
.addr-default {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text-secondary); cursor: pointer;
  user-select: none; white-space: nowrap;
}
.addr-default input { width: 14px; height: 14px; margin: 0; accent-color: var(--primary); cursor: pointer; }
.addr-del { flex: none; font-size: 13px; color: var(--text-tertiary); cursor: pointer; white-space: nowrap; }
.addr-del:hover { color: var(--danger); }
.addr-empty { padding: 24px 0 6px; text-align: center; color: var(--text-placeholder); font-size: 13px; }
/* 新增地址：紧跟地址列表下方的虚线按钮 */
.addr-add {
  width: 100%; height: 40px; margin-top: 12px;
  border: 1px dashed var(--border); border-radius: 6px; background: transparent;
  color: var(--primary); font-size: 13px; cursor: pointer;
}
.addr-add:hover { border-color: var(--primary); background: var(--primary-lighter, #F0F7FF); }
</style>
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"/>
        <path d="M8.4 15.6L15.6 8.4"/>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <div class="header-user" id="headerUser" title="点击退出登录">
      <span class="header-avatar">药</span>
      <span class="header-user-name">—</span>
      <svg class="user-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>
</header>

<div class="app-body">
  <!-- ========== 左侧导航 ========== -->
  <aside class="app-side" id="appSide"></aside>
  <!-- ========== 主区域 ========== -->
  <main class="app-main">
    <div class="tabbar">
      <div class="tab">首页</div>
      <div class="tab active">
        采购计划
        <button class="tab-close" id="tabClose" title="关闭">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
    </div>

    <div class="page sel-page">
      <div class="sel-main">
        <div class="page-head">
          <h1 class="page-title">采购计划</h1>
          <div class="page-acts" style="margin-left:auto;" id="pageActs"></div>
        </div>

        <div class="sel-card">
          <!-- 筛选 -->
          <div class="filter-bar">
            <div class="filter-item">
              <span class="filter-label">计划单号</span>
              <input class="input" id="fCode" placeholder="请输入计划单号" style="width:170px;">
            </div>
            <div class="filter-item">
              <span class="filter-label">审核状态</span>
              <select class="select" id="fStatus" style="width:130px;">
                <option value="">全部状态</option>
                <option value="draft">草稿</option>
                <option value="audit">待审核</option>
                <option value="approved">审核通过</option>
                <option value="rejected">已拒绝</option>
              </select>
            </div>
            <div class="filter-item">
              <span class="filter-label">提交人</span>
              <input class="input" id="fCreator" placeholder="请输入提交人" style="width:120px;">
            </div>
            <div class="filter-item">
              <span class="filter-label">提交时间</span>
              <input class="input" type="date" id="fDateFrom">
              <span class="filter-sep">至</span>
              <input class="input" type="date" id="fDateTo">
            </div>
            <div class="filter-acts">
              <button class="btn" id="btnReset">重置</button>
              <button class="btn btn-primary" id="btnQuery">查询</button>
            </div>
          </div>

          <!-- 列表 -->
          <div class="pa-list-wrap">
            <table class="data-table pur-table">
              <thead>
                <tr>
                  <th style="width:150px;">计划单号</th>
                  <th style="width:110px;">涉及药品笔数</th>
                  <th style="width:110px;" class="num">合计金额</th>
                  <th style="width:110px;" class="num">基药金额占比</th>
                  <th style="width:100px;">提交人</th>
                  <th style="width:150px;">提交时间</th>
                  <th style="width:110px;">审核状态</th>
                  <th class="col-acts">操作</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
            <div class="table-empty" id="tableEmpty" style="display:none;">暂无数据</div>
          </div>

          <div class="pager">
            <span id="pagerInfo"></span>
            <div class="pager-ctrl">
              <button class="pager-btn" id="pgPrev" title="上一页">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
              </button>
              <span class="pager-num" id="pgNum">1</span>
              <button class="pager-btn" id="pgNext" title="下一页">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ========== 抽屉：配送地址维护 ========== -->
<div class="drawer-mask" id="addrMask"></div>
<aside class="drawer addr-drawer" id="addrDrawer">
  <div class="drawer-head">
    <div class="drawer-title" id="addrTitle">配送地址维护</div>
    <button class="drawer-close" id="addrClose" title="关闭">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <!-- 每行直接是地址输入框 + 「默认地址」勾选，抽屉底部统一 保存/取消 -->
    <div id="addrListView">
      <div class="addr-tip" id="addrTip"></div>
      <div class="addr-list" id="addrList"></div>
      <button class="addr-add" id="addrAdd">＋ 新增地址</button>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn" id="addrCancel">取消</button>
    <button class="btn btn-primary" id="addrSave">保存</button>
  </div>
</aside>

<div class="modal-mask" id="modalMask"></div>
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastText"></span>
</div>

<script src="mock.js"></script>
<script src="selection-common.js"></script>
<script src="purchase-mgmt-common.js"></script>
<script>
(function () {
  var $ = SEL.$, esc = SEL.esc;

  var user = PC.user();
  if (!user) return;

  /* 采购计划仅成员机构 / 中心药房可见 */
  if (user.role !== "member" && user.role !== "center" && user.role !== "pharmacist") {
    location.href = "purchase-need.html"; return;
  }

  var state = {
    code: "", status: "", creator: "", dateFrom: "", dateTo: "",
    page: 1, size: 10
  };

  /* ---------------- 列表（全部单据合并展示，不再分页签） ---------------- */
  function statusLabel(r) {
    if (r.status === "member") return "待审核（成员机构）";
    if (r.status === "center") return "待审核（中心药房）";
    return PC.STATUS[r.status] || "—";
  }

  function filtered() {
    var list = PC.load("plan");
    return list.filter(function (r) {
      if (!PC.inScope(r, user)) return false;
      if (state.code && r.code.toLowerCase().indexOf(state.code.toLowerCase()) < 0) return false;
      if (state.status) {
        if (state.status === "audit") {
          if (r.status !== "member" && r.status !== "center") return false;
        } else if (r.status !== state.status) return false;
      }
      if (state.creator && r.creator.indexOf(state.creator) < 0) return false;
      if (state.dateFrom || state.dateTo) {
        var day = r.createdAt.slice(0, 10);
        if (state.dateFrom && day < state.dateFrom) return false;
        if (state.dateTo && day > state.dateTo) return false;
      }
      return true;
    }).sort(function (x, y) {
      if (x.createdAt === y.createdAt) return 0;
      return x.createdAt < y.createdAt ? 1 : -1;
    });
  }

  function actionHtml(r) {
    var acts = ['<button class="link-btn" data-act="view" data-id="' + r.id + '">查看</button>'];
    var mine = PC.isCreator(r, user);

    if (r.status === "draft" || r.status === "rejected") {
      if (mine) {
        acts.push('<button class="link-btn" data-act="edit" data-id="' + r.id + '">编辑</button>');
        acts.push('<button class="link-btn" data-act="submit" data-id="' + r.id + '">提交</button>');
        acts.push('<button class="link-btn is-danger" data-act="del" data-id="' + r.id + '">删除</button>');
      }
    } else if (r.status === "member" || r.status === "center") {
      if (mine) acts.push('<button class="link-btn" data-act="withdraw" data-id="' + r.id + '">撤回</button>');
      if (PC.canAudit(r, user)) acts.push('<button class="link-btn" data-act="audit" data-id="' + r.id + '">审核</button>');
    }
    return acts.join("");
  }

  function renderTable() {
    var rows = filtered();
    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total / state.size));
    if (state.page > pages) state.page = pages;
    var start = (state.page - 1) * state.size;
    var slice = rows.slice(start, start + state.size);

    $("tbody").innerHTML = slice.map(function (r) {
      return "<tr>" +
        "<td>" + esc(r.code) + "</td>" +
        "<td>" + (r.items ? r.items.length : 0) + "</td>" +
        '<td class="num">' + esc(PC.fmtMoney(PC.planTotal(r.items))) + "</td>" +
        '<td class="num">' + esc(PC.planEssentialRatio(r.items)) + "</td>" +
        "<td>" + esc(r.creator) + "</td>" +
        "<td>" + esc(r.createdAt) + "</td>" +
        '<td><span class="status-text">' + esc(statusLabel(r)) + "</span></td>" +
        '<td class="col-acts">' + actionHtml(r) + "</td>" +
      "</tr>";
    }).join("");

    $("tableEmpty").style.display = total ? "none" : "block";
    $("pagerInfo").textContent = "共 " + total + " 条";
    $("pgNum").textContent = state.page + " / " + pages;
    $("pgPrev").disabled = state.page <= 1;
    $("pgNext").disabled = state.page >= pages;
  }

  /* ---------------- 操作 ---------------- */
  function doSubmit(id) {
    var list = PC.load("plan");
    var r = PC.byId(list, id);
    if (!r) return;
    var next = PC.nextStatus(r);
    var tip = r.creatorRole === "center"
      ? "中心药房发起的采购计划提交后自动生效，确认提交？"
      : "确认提交采购计划「" + r.code + "」？提交后进入审核，期间不可编辑。";
    SEL.confirmDialog({
      title: "提交采购计划",
      text: tip,
      okText: "提交",
      onOk: function () {
        r.records.push({ node: "提交", org: r.creatorOrg, person: r.creator, result: "已提交", opinion: "—", time: SEL.fmtNow() });
        if (next === "approved") {
          r.status = "approved";
          r.records.push({ node: "中心药房审核", org: r.creatorOrg, person: r.creator, result: "通过", opinion: "中心药房发起，提交后自动生效。", time: SEL.fmtNow() });
        } else {
          r.status = next;
        }
        PC.persist("plan", r);
        SEL.toast("已提交");
        renderTable();
      }
    });
  }

  function doWithdraw(id) {
    var list = PC.load("plan");
    var r = PC.byId(list, id);
    if (!r) return;
    SEL.confirmDialog({
      title: "撤回采购计划",
      text: "确认撤回采购计划「" + r.code + "」？撤回后回到草稿，可重新编辑提交。",
      okText: "撤回",
      onOk: function () {
        r.status = "draft";
        r.records.push({ node: "撤回", org: r.creatorOrg, person: r.creator, result: "已撤回", opinion: "—", time: SEL.fmtNow() });
        PC.persist("plan", r);
        SEL.toast("已撤回");
        renderTable();
      }
    });
  }

  function doDelete(id) {
    var list = PC.load("plan");
    var r = PC.byId(list, id);
    if (!r) return;
    SEL.confirmDialog({
      title: "删除采购计划",
      text: "确认删除采购计划「" + r.code + "」？删除后不可恢复。",
      okText: "删除",
      onOk: function () {
        PC.save("plan", list.filter(function (x) { return x.id !== id; }));
        SEL.toast("已删除");
        renderTable();
      }
    });
  }

  /* ---------------- 配送地址维护（每行直接是输入框 + 默认地址勾选，抽屉整体 保存/取消） ---------------- */
  var addrDraft = [];      /* 当前机构地址草稿（未保存） */

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function addrStored() { return PC.addressesOf(user.org); }
  function addrDirty() { return JSON.stringify(addrDraft) !== JSON.stringify(addrStored()); }

  function openAddr() {
    addrDraft = addrStored().map(clone);
    renderAddrList();
    document.body.classList.add("drawer-open");
  }

  function closeAddr(force) {
    if (!force && addrDirty()) {
      SEL.confirmDialog({
        title: "放弃修改",
        text: "地址修改尚未保存，确定关闭并放弃？",
        okText: "放弃修改",
        onOk: function () { closeAddr(true); }
      });
      return;
    }
    document.body.classList.remove("drawer-open");
  }

  function addrInputEl(id) {
    return document.querySelector('#addrList input[data-addr-input][data-id="' + id + '"]');
  }

  function renderAddrList() {
    var def = addrDraft.filter(function (a) { return a.isDefault; })[0];
    $("addrTip").innerHTML = "当前机构：<b>" + esc(user.org) + "</b>　共 " + addrDraft.length + " 条地址" +
      (def ? "；默认地址将在新建采购计划时自动带入" : '<span style="color:var(--danger);">尚未设置默认地址</span>') +
      "；修改地址后点「保存」生效";
    var html;
    if (!addrDraft.length) {
      html = '<div class="addr-empty">暂无配送地址，点击下方「新增地址」添加</div>';
    } else {
      html = addrDraft.map(function (a) {
        return '<div class="addr-row">' +
          '<input class="input addr-input" data-addr-input data-id="' + a.id + '" maxlength="100"' +
            ' value="' + esc(a.address || PC.addrFull(a)) + '" placeholder="请输入配送地址（最多 100 字）">' +
          '<label class="addr-default"><input type="checkbox" data-addr-default data-id="' + a.id + '"' +
            (a.isDefault ? " checked" : "") + ">默认地址</label>" +
          '<a class="addr-del" data-addr-act="del" data-id="' + a.id + '">删除</a>' +
        "</div>";
      }).join("");
    }
    $("addrList").innerHTML = html;
  }

  function saveAddr() {
    if (!addrDraft.length) { SEL.toast("请至少添加一条配送地址"); return; }
    var bad = addrDraft.filter(function (x) { return !(x.address || "").trim(); })[0];
    if (bad) {
      renderAddrList();
      var el = addrInputEl(bad.id);
      if (el) { el.classList.add("is-error"); el.focus(); }
      SEL.toast("存在空地址，请填写后再保存");
      return;
    }
    if (!addrDraft.some(function (x) { return x.isDefault; })) addrDraft[0].isDefault = true;
    /* 存克隆：断开草稿与库存的对象引用，取消时才能真正回退 */
    PC.setAddresses(user.org, addrDraft.map(clone));
    renderAddrList();
    SEL.toast("地址已保存");
  }

  /* 输入即写入草稿（不重渲染，避免打断输入） */
  $("addrList").addEventListener("input", function (e) {
    var el = e.target;
    if (!el.matches || !el.matches("[data-addr-input]")) return;
    el.classList.remove("is-error");
    var id = el.getAttribute("data-id");
    addrDraft.forEach(function (x) { if (x.id === id) x.address = el.value; });
  });

  /* 默认地址：单选（勾选一条自动取消其他；取消勾选时还原，始终保留一条默认） */
  $("addrList").addEventListener("change", function (e) {
    var el = e.target;
    if (!el.matches || !el.matches("[data-addr-default]")) return;
    var id = el.getAttribute("data-id");
    if (!el.checked) {
      el.checked = true;
      SEL.toast("需保留一条默认地址");
      return;
    }
    addrDraft.forEach(function (x) { x.isDefault = x.id === id; });
    renderAddrList();
  });

  $("addrList").addEventListener("click", function (e) {
    var a = e.target.closest("[data-addr-act]");
    if (!a || a.getAttribute("data-addr-act") !== "del") return;
    var id = a.getAttribute("data-id");
    var target = addrDraft.filter(function (x) { return x.id === id; })[0];
    if (!target) return;
    SEL.confirmDialog({
      title: "删除配送地址",
      text: "确认删除配送地址「" + (target.address || PC.addrFull(target) || "空地址") + "」？（保存后生效）",
      okText: "删除",
      onOk: function () {
        addrDraft = addrDraft.filter(function (x) { return x.id !== id; });
        /* 删掉的若是默认地址，自动把第一条转正 */
        if (addrDraft.length && !addrDraft.some(function (x) { return x.isDefault; })) addrDraft[0].isDefault = true;
        renderAddrList();
      }
    });
  });

  /* 输入框回车 = 直接保存 */
  $("addrList").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.matches && e.target.matches("[data-addr-input]")) {
      e.preventDefault();
      saveAddr();
    }
  });

  /* 新增地址：列表末尾追加一行空输入框并聚焦 */
  $("addrAdd").addEventListener("click", function () {
    var rec = {
      id: "ad-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      org: user.org, address: "",
      isDefault: addrDraft.length === 0
    };
    addrDraft.push(rec);
    renderAddrList();
    var el = addrInputEl(rec.id);
    if (el) el.focus();
  });

  $("addrSave").addEventListener("click", saveAddr);
  /* 「取消」= 明确放弃修改，直接关闭；X / 遮罩 / Esc 关闭时才确认是否丢弃 */
  $("addrCancel").addEventListener("click", function () { closeAddr(true); });
  $("addrClose").addEventListener("click", function () { closeAddr(false); });
  $("addrMask").addEventListener("click", function () { closeAddr(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.body.classList.contains("drawer-open")) closeAddr(false);
  });

  /* ---------------- 事件 ---------------- */
  $("pageActs").innerHTML =
    '<button class="btn" id="btnAddr">配送地址维护</button>' +
    '<button class="btn btn-primary" id="btnCreate">发起采购计划</button>';
  $("btnAddr").addEventListener("click", openAddr);
  $("btnCreate").addEventListener("click", function () {
    location.href = "purchase-plan-create.html";
  });

  function doQuery() {
    state.code = $("fCode").value.trim();
    state.status = $("fStatus").value;
    state.creator = $("fCreator").value.trim();
    state.dateFrom = $("fDateFrom").value;
    state.dateTo = $("fDateTo").value;
    state.page = 1;
    renderTable();
  }
  $("btnQuery").addEventListener("click", doQuery);
  $("fCode").addEventListener("keydown", function (e) { if (e.key === "Enter") doQuery(); });

  $("btnReset").addEventListener("click", function () {
    state.code = ""; state.status = ""; state.creator = ""; state.dateFrom = ""; state.dateTo = ""; state.page = 1;
    $("fCode").value = ""; $("fStatus").value = ""; $("fCreator").value = "";
    $("fDateFrom").value = ""; $("fDateTo").value = "";
    renderTable();
  });

  $("pgPrev").addEventListener("click", function () { state.page--; renderTable(); });
  $("pgNext").addEventListener("click", function () { state.page++; renderTable(); });

  $("tbody").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-id]");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var act = btn.getAttribute("data-act") || "view";
    if (act === "view") location.href = "purchase-plan-detail.html?id=" + id;
    else if (act === "edit") location.href = "purchase-plan-create.html?id=" + id;
    else if (act === "audit") location.href = "purchase-plan-detail.html?id=" + id + "&mode=approve";
    else if (act === "submit") doSubmit(id);
    else if (act === "withdraw") doWithdraw(id);
    else if (act === "del") doDelete(id);
  });

  $("tabClose").addEventListener("click", function () { location.href = "home.html"; });
  $("headerUser").addEventListener("click", function () {
    SEL.confirmDialog({
      title: "退出登录",
      text: "确认退出当前账号「" + user.name + "」？",
      okText: "退出",
      onOk: function () { SEL.logout(); }
    });
  });

  SEL.renderHeaderUser(user);
  SEL.bindNav();
  renderTable();
})();
</script>
