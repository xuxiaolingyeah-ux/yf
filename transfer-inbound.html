<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>调拨入库 · 区域药房协同管理系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"/>
        <path d="M8.4 15.6L15.6 8.4"/>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <div class="header-user" id="headerUser" title="点击退出登录">
      <span class="header-avatar">药</span>
      <span class="header-user-name">—</span>
      <svg class="user-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>
</header>

<div class="app-body">
  <aside class="app-side" id="appSide"></aside>
<main class="app-main">
    <div class="tabbar">
      <div class="tab">首页</div>
      <div class="tab" data-href="transfer.html">调拨管理</div>
      <div class="tab active">
        <span id="tabName">调拨入库</span>
        <button class="tab-close" id="tabClose" title="关闭">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
    </div>

    <div class="page sel-page tr-detail">
      <div class="sel-main">
        <div class="page-head">
          <div class="head-back">
            <button class="back-btn" id="btnBack" title="返回调拨列表">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <h1 class="page-title">调拨入库</h1>
            <span class="pa-code" id="headCode">调拨单号：—</span>
          </div>
          <span class="status-text" id="headStatus"></span>
        </div>

        <div class="sel-card">
          <div class="card-body" style="padding:16px;">
            <div class="form-wrap">

              <section class="block">
                <div class="block-head"><h2 class="block-title">申请信息</h2></div>
                <div class="form-grid-4" id="applyInfo"></div>
              </section>

              <section class="block">
                <div class="block-head"><h2 class="block-title">出库信息</h2></div>
                <div class="form-grid-4" id="outInfo"></div>
              </section>

              <section class="block">
                <div class="block-head"><h2 class="block-title">入库信息</h2></div>
                <div class="form-grid-4">
                  <div class="form-item">
                    <span class="form-label">入库单号</span>
                    <input class="input is-readonly" id="fInCode" readonly value="确认入库后生成">
                  </div>
                  <div class="form-item">
                    <span class="form-label">入库时间</span>
                    <input class="input is-readonly" id="fInTime" readonly value="—">
                  </div>
                  <div class="form-item">
                    <span class="form-label">入库人</span>
                    <input class="input is-readonly" id="fInUser" readonly>
                  </div>
                </div>
              </section>

              <section class="block">
                <div class="block-head">
                  <h2 class="block-title">药品明细</h2>
                  <span class="tr-in-hint">入库数量为必填项，可少于（少发）或多于（多发）调拨数量；不合格数量选填且不超过入库数量，填写后必须选择不合格原因</span>
                </div>
                <div class="tr-stage-table is-scroll">
                  <table class="data-table tr-tree tr-in-tree">
                    <thead>
                      <tr>
                        <th style="width:36px;"></th>
                        <th style="width:180px;">药品名称</th>
                        <th style="width:140px;">药品规格</th>
                        <th style="width:120px;">品规编码</th>
                        <th style="width:80px;" class="num">申请数量</th>
                        <th style="width:80px;" class="num">调拨数量</th>
                        <th style="width:80px;" class="num">入库数量</th>
                        <th style="width:84px;" class="num">不合格数量</th>
                        <th style="width:120px;" class="num">进货价金额合计</th>
                        <th style="width:120px;" class="num">零售价金额合计</th>
                      </tr>
                    </thead>
                    <tbody id="rowBody"></tbody>
                  </table>
                </div>

                <div class="tr-in-sum">
                  <span class="item">入库总量<b id="sumIn">0</b></span>
                  <span class="item">不合格总量<b id="sumBad" class="is-bad">0</b></span>
                  <span class="item">合格入库量<b id="sumGood">0</b></span>
                  <span class="item">进货价合计<b id="sumPurchase">0.00</b></span>
                  <span class="item">零售价合计<b id="sumRetail">0.00</b></span>
                </div>
              </section>

            </div>
          </div>

          <div class="tr-in-bar">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnConfirm">确认入库</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-mask" id="modalMask"></div>
<div class="drawer-mask" id="drawerMask"></div>
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastText"></span>
</div>

<script src="mock.js"></script>
<script src="selection-common.js"></script>
<script src="transfer-common.js"></script>
<script>
(function () {
  var $ = SEL.$, esc = SEL.esc;
  var user = TR.user();
  if (!user) return;

  var all = TR.load();
  var bill = SEL.qs("id") ? TR.byId(all, SEL.qs("id")) : null;
  if (!bill || !TR.canInbound(bill, user)) { location.href = "transfer.html"; return; }
  bill = JSON.parse(JSON.stringify(bill));

  var expanded = {};

  bill.batches.forEach(function (g) {
    (g.rows || []).forEach(function (r) {
      if (!r.badReason) r.badReason = "";
    });
  });

  function isOpen(g) { return expanded[g.key] !== undefined ? expanded[g.key] : (g.rows || []).length > 0; }
  /* 组级汇总：入库数量 / 不合格数量均由各批次行手工录入后求和（存在少发、多发，入库数量不强制等于调拨数量） */
  function badCount(g) {
    var n = 0;
    (g.rows || []).forEach(function (r) { n += Number(r.badQty) || 0; });
    return n;
  }
  function inCount(g) {
    var n = 0;
    (g.rows || []).forEach(function (r) { n += Number(r.inQty) || 0; });
    return n;
  }
  function moneyOf(g) {
    var p = 0, rt = 0;
    (g.rows || []).forEach(function (r) {
      var good = Math.max(0, (Number(r.inQty) || 0) - (Number(r.badQty) || 0));
      p += good * (Number(r.purchase) || 0);
      rt += good * (Number(r.retail) || 0);
    });
    return { purchase: TR.money(p), retail: TR.money(rt) };
  }

  function infoItem(l, v) {
    return '<div class="form-item"><span class="form-label">' + esc(l) + '</span>' +
      '<span class="text-value">' + esc(v || "—") + "</span></div>";
  }

  function renderInfos() {
    $("applyInfo").innerHTML =
      infoItem("申请机构", bill.applyOrgName) +
      infoItem("申请库位", bill.applyLocationName) +
      infoItem("提交人", bill.creator) +
      infoItem("提交时间", bill.submitTime) +
      '<div class="form-item span-2of4"><span class="form-label">缺药说明</span>' +
        '<span class="text-value">' + esc(bill.shortageDesc || "—") + "</span></div>";

    $("outInfo").innerHTML =
      infoItem("出库机构", bill.outOrgName) +
      infoItem("出库库位", bill.outLocationName) +
      infoItem("出库单号", bill.outCode) +
      infoItem("出库时间", bill.outTime);
    $("fInUser").value = user.name;
  }

  function renderRows() {
    $("rowBody").innerHTML = bill.batches.length ? bill.batches.map(function (g, idx) {
      var rows = g.rows || [];
      var open = isOpen(g);
      var badN = badCount(g);
      var inN = inCount(g);
      var m = moneyOf(g);
      var unit = TR.unitOfSpec(g.spec);
      var html =
        '<tr class="tr-tree-parent">' +
          '<td><button class="tr-expander' + (open ? " is-open" : "") + '" data-toggle="' + idx + '" title="展开/收起">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
          "</button></td>" +
          "<td>" + esc(g.drugName) + "</td>" +
          "<td>" + esc(g.spec) + "</td>" +
          "<td>" + esc(g.drugCode) + "</td>" +
          '<td class="num">' + g.applyQty + (unit ? ' <span class="qty-unit">' + esc(unit) + "</span>" : "") + "</td>" +
          '<td class="num">' + TR.allocated(g) + (unit ? ' <span class="qty-unit">' + esc(unit) + "</span>" : "") + "</td>" +
          '<td class="num' + (inN ? "" : " is-empty-num") + '">' + (inN || "—") + (inN && unit ? ' <span class="qty-unit">' + esc(unit) + "</span>" : "") + "</td>" +
          '<td class="num' + (badN ? " is-bad-num" : "") + '">' + badN + (badN && unit ? ' <span class="qty-unit">' + esc(unit) + "</span>" : "") + "</td>" +
          '<td class="num">' + m.purchase + "</td>" +
          '<td class="num">' + m.retail + "</td>" +
        "</tr>";

      if (open) {
        html += '<tr class="tr-child-wrap"><td></td><td colspan="9"><table class="tr-child-table"><thead><tr>' +
          '<th style="width:120px;">批次号</th>' +
          '<th style="width:150px;">生产企业</th>' +
          '<th style="width:95px;">有效期</th>' +
          '<th style="width:90px;" class="num">进货价</th>' +
          '<th style="width:90px;" class="num">零售价</th>' +
          '<th style="width:90px;" class="num">调拨数量</th>' +
          '<th style="width:110px;" class="num">入库数量</th>' +
          '<th style="width:110px;" class="num">不合格数量</th>' +
          '<th style="width:130px;"><span class="req">*</span>不合格原因</th>' +
        "</tr></thead><tbody>";
        if (!rows.length) {
          html += '<tr class="tr-child-empty"><td colspan="9">暂无出库批次</td></tr>';
        } else {
          html += rows.map(function (r, ri) {
            var badN2 = Number(r.badQty) || 0;
            return "<tr>" +
              "<td>" + esc(r.batchNo) + "</td>" +
              "<td>" + esc(r.vendor) + "</td>" +
              "<td>" + esc(r.expDate) + "</td>" +
              '<td class="num">' + TR.money(r.purchase) + "</td>" +
              '<td class="num">' + TR.money(r.retail) + "</td>" +
              '<td class="num">' + (Number(r.outQty) || 0) + (unit ? ' <span class="qty-unit">' + esc(unit) + "</span>" : "") + "</td>" +
              '<td class="num"><input class="input tr-in-qty" type="text" inputmode="numeric" value="' + (r.inQty === undefined ? "" : r.inQty) +
                '" placeholder="必填" data-g="' + idx + '" data-r="' + ri + '" data-field="inQty"></td>' +
              '<td class="num"><input class="input tr-bad-qty" type="text" inputmode="numeric" value="' + (r.badQty === undefined ? "" : r.badQty) +
                '" placeholder="0" data-g="' + idx + '" data-r="' + ri + '" data-field="badQty"></td>' +
              '<td><select class="select tr-reason" data-g="' + idx + '" data-r="' + ri + '" data-field="badReason"' + (badN2 > 0 ? "" : " disabled") + ">" +
                '<option value="">请选择</option>' +
                TR.BAD_REASONS.map(function (x) {
                  return '<option value="' + x + '"' + (r.badReason === x ? " selected" : "") + ">" + x + "</option>";
                }).join("") +
              "</select></td>" +
            "</tr>";
          }).join("");
        }
        html += "</tbody></table></td></tr>";
      }
      return html;
    }).join("") : '<tr><td colspan="11" class="tr-empty-cell">暂无药品明细</td></tr>';
    renderSums();
  }

  function renderSums() {
    var totalIn = 0, totalBad = 0, purchase = 0, retail = 0;
    bill.batches.forEach(function (g) {
      (g.rows || []).forEach(function (r) {
        var iq = Number(r.inQty) || 0;
        var b = Number(r.badQty) || 0;
        var good = Math.max(0, iq - b);
        totalIn += iq;
        totalBad += b;
        purchase += good * (Number(r.purchase) || 0);
        retail += good * (Number(r.retail) || 0);
      });
    });
    $("sumIn").textContent = totalIn;
    $("sumBad").textContent = totalBad;
    $("sumGood").textContent = totalIn - totalBad;
    $("sumPurchase").textContent = TR.money(purchase);
    $("sumRetail").textContent = TR.money(retail);
  }

  function renderAll() {
    renderRows();
  }

  /* ---------------- 校验 / 确认入库 ---------------- */
  function confirmIn() {
    if (!bill.batches.length) { SEL.toast("暂无药品明细"); return; }
    var missingQty = false, badQtyBad = false, needReason = false;
    $("rowBody").querySelectorAll("input[data-field]").forEach(function (el) {
      var g = bill.batches[parseInt(el.getAttribute("data-g"), 10)];
      var r = g && g.rows[parseInt(el.getAttribute("data-r"), 10)];
      if (!r) return;
      var field = el.getAttribute("data-field");
      var v = String(el.value).trim();
      var n = /^\d+$/.test(v) ? parseInt(v, 10) : NaN;
      if (field === "inQty") {
        /* 必填正整数；可少于（少发）或多于（多发）调拨数量，不做上限约束 */
        var ok = !isNaN(n) && n >= 1;
        el.classList.toggle("is-invalid", !ok);
        if (!ok) missingQty = true;
      } else if (field === "badQty") {
        var ok2 = v === "" || (!isNaN(n) && n >= 1 && n <= (Number(r.inQty) || 0));
        el.classList.toggle("is-invalid", !ok2);
        if (!ok2) badQtyBad = true;
      }
    });
    bill.batches.forEach(function (g) {
      (g.rows || []).forEach(function (r) {
        if ((Number(r.badQty) || 0) > 0 && !r.badReason) needReason = true;
      });
    });
    $("rowBody").querySelectorAll("select[data-field='badReason']").forEach(function (el) {
      var g = bill.batches[parseInt(el.getAttribute("data-g"), 10)];
      var r = g && g.rows[parseInt(el.getAttribute("data-r"), 10)];
      if (!r) return;
      el.classList.toggle("is-invalid", (Number(r.badQty) || 0) > 0 && !el.value);
    });
    if (missingQty) { SEL.toast("请填写入库数量（正整数）"); return; }
    if (badQtyBad) { SEL.toast("不合格数量需为正整数且不超过入库数量"); return; }
    if (needReason) { SEL.toast("请为不合格批次选择不合格原因"); return; }

    /* 回写输入值到单据数据 */
    bill.batches.forEach(function (g) {
      (g.rows || []).forEach(function (r) {
        r.inQty = Number(String(r.inQty).trim()) || 0;
        r.badQty = r.badQty === "" || r.badQty === undefined ? 0 : Number(String(r.badQty).trim()) || 0;
        if (!r.badQty) r.badReason = "";
      });
    });

    var code = TR.newInCode(TR.load());
    bill.inCode = code;
    bill.inUser = user.name;
    bill.inTime = SEL.fmtNow();
    bill.transferStatus = "done";
    TR.addRecord(bill, "入库", user.name, user.org, "已完成", "入库单号 " + code);
    TR.persist(bill);
    SEL.toast("已确认入库，入库单号 " + code);
    setTimeout(function () { location.href = "transfer.html"; }, 500);
  }

  /* ---------------- 事件 ---------------- */
  $("headCode").textContent = "调拨单号：" + bill.code;
  $("headStatus").textContent = "调拨状态：" + (TR.TRANSFER[bill.transferStatus] || "—");
  document.title = "调拨入库 " + bill.code + " · 区域药房协同管理系统";
  $("btnBack").addEventListener("click", function () { location.href = "transfer.html"; });
  $("tabClose").addEventListener("click", function () { location.href = "transfer.html"; });
  $("btnConfirm").addEventListener("click", confirmIn);
  $("btnCancel").addEventListener("click", function () { location.href = "transfer.html"; });

  $("rowBody").addEventListener("click", function (e) {
    var t = e.target.closest("[data-toggle]");
    if (t) {
      var g0 = bill.batches[parseInt(t.getAttribute("data-toggle"), 10)];
      expanded[g0.key] = !isOpen(g0);
      renderRows();
    }
  });

  $("rowBody").addEventListener("input", function (e) {
    var el = e.target;
    var f = el.getAttribute && el.getAttribute("data-field");
    if (f !== "inQty" && f !== "badQty") return;
    el.classList.remove("is-invalid");
  });

  $("rowBody").addEventListener("change", function (e) {
    var el = e.target;
    var field = el.getAttribute("data-field");
    var idx = parseInt(el.getAttribute("data-g"), 10);
    var g = bill.batches[idx];
    if (!g) return;

    if (field === "inQty" || field === "badQty") {
      var r = g.rows[parseInt(el.getAttribute("data-r"), 10)];
      if (!r) return;
      var v = String(el.value).trim();
      var n = /^\d+$/.test(v) ? parseInt(v, 10) : NaN;
      if (field === "inQty") {
        var ok = !isNaN(n) && n >= 1;
        el.classList.toggle("is-invalid", !ok);
        if (ok) { r.inQty = n; if (Number(r.badQty) > n) r.badQty = ""; }
      } else {
        var ok2 = v === "" || (!isNaN(n) && n >= 1 && n <= (Number(r.inQty) || 0));
        el.classList.toggle("is-invalid", !ok2);
        r.badQty = v === "" ? "" : (ok2 ? n : el.value);
      }
      /* 入库/不合格数量变化影响原因下拉的启用状态与合计，整组重渲染 */
      renderRows();
      return;
    }

    if (field === "badReason") {
      var r2 = g.rows[parseInt(el.getAttribute("data-r"), 10)];
      if (!r2) return;
      r2.badReason = el.value;
      el.classList.remove("is-invalid");
      if ((Number(r2.badQty) || 0) > 0 && !r2.badReason) el.classList.add("is-invalid");
    }
  });

  $("headerUser").addEventListener("click", function () {
    SEL.confirmDialog({
      title: "退出登录",
      text: "确认退出当前账号「" + user.name + "」？",
      okText: "退出",
      onOk: function () { SEL.logout(); }
    });
  });

  renderInfos();
  renderRows();
  SEL.renderHeaderUser(user);
  SEL.bindNav();
})();
</script>
  <script src="nav.js?v=20261111c"></script>
</body>
</html>
