<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>药品目录遴选 · 区域药房协同管理系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"/>
        <path d="M8.4 15.6L15.6 8.4"/>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <div class="header-user" id="headerUser" title="点击退出登录">
      <span class="header-avatar">药</span>
      <span class="header-user-name">—</span>
      <svg class="user-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>
</header>

<div class="app-body">
  <!-- ========== 左侧导航 ========== -->
  <aside class="app-side" id="appSide"></aside>
<!-- ========== 主区域 ========== -->
  <main class="app-main">
    <div class="tabbar">
      <div class="tab">首页</div>
      <div class="tab active">
        药品目录遴选
        <button class="tab-close" id="tabClose" title="关闭">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
    </div>

    <div class="page sel-page">
      <div class="sel-main">
        <!-- 标题行 -->
        <div class="page-head">
          <h1 class="page-title">药品目录遴选</h1>
          <div class="page-acts" id="pageActs"></div>
        </div>

        <div class="sel-card">
          <!-- 筛选 -->
          <div class="filter-bar">
            <div class="filter-item">
              <span class="filter-label">申请标题</span>
              <input class="input" id="fKeyword" placeholder="请输入申请标题" style="width:200px;">
            </div>
            <div class="filter-item">
              <span class="filter-label">申请时间</span>
              <input class="input" type="date" id="fDateFrom">
              <span class="filter-sep">至</span>
              <input class="input" type="date" id="fDateTo">
            </div>
            <div class="filter-item">
              <span class="filter-label">当前状态</span>
              <select class="select" id="fStatus" style="width:170px">
                <option value="">全部状态</option>
              </select>
            </div>
            <div class="filter-acts">
              <button class="btn" id="btnReset">重置</button>
              <button class="btn btn-primary" id="btnQuery">查询</button>
            </div>
          </div>

          <!-- 列表 -->
          <div class="table-wrap" style="padding:0 16px;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>申请标题</th>
                  <th style="width:110px;">涉及药品数量</th>
                  <th style="width:200px;">申请机构</th>
                  <th style="width:90px;">申请人</th>
                  <th style="width:164px;" class="th-sort desc" id="thTime">
                    申请时间
                    <span class="sort-ico"><span class="s-up">▲</span><span class="s-down">▼</span></span>
                  </th>
                  <th style="width:130px;">当前状态</th>
                  <th style="width:110px;">药品遴选得分</th>
                  <th class="col-acts">操作</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
            <div class="table-empty" id="tableEmpty" style="display:none;">暂无数据</div>
          </div>

          <div class="pager">
            <span id="pagerInfo"></span>
            <div class="pager-ctrl">
              <button class="pager-btn" id="pgPrev" title="上一页">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
              </button>
              <span class="pager-num" id="pgNum">1</span>
              <button class="pager-btn" id="pgNext" title="下一页">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-mask" id="modalMask"></div>

<!-- 专家打分抽屉 -->
<div class="drawer-mask" id="scoreMask"></div>
<aside class="drawer is-edit" id="scoreDrawer">
  <div class="drawer-head">
    <span class="drawer-title" id="scTitle">专家打分</span>
    <button class="drawer-close" id="scClose" title="关闭">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="scBody"></div>
  <div class="drawer-foot" id="scFoot"></div>
</aside>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastText"></span>
</div>

<script src="mock.js"></script>
<script src="selection-common.js"></script>
<script>
(function () {
  var $ = SEL.$, esc = SEL.esc;

  var user = SEL.requireAuth();
  if (!user) return;

  var state = {
    status: "",
    keyword: "",
    dateFrom: "",
    dateTo: "",
    sort: "desc",        // 申请时间排序，默认倒序
    page: 1,
    size: 10
  };

  /* 数据可见范围：村室发起人只看本机构发起的申请；成员机构 / 中心药房 / 专家看全部 */
  function canSee(a) {
    if (user.role === "village") return SEL.isApplicant(a, user);
    return true;
  }

  /* ---------------- 列表 ---------------- */
  function filtered() {
    return SEL.loadData().filter(function (a) {
      if (!canSee(a)) return false;
      if (state.status && a.status !== state.status) return false;
      if (state.keyword && a.title.toLowerCase().indexOf(state.keyword.toLowerCase()) < 0) return false;
      var day = a.createdAt.slice(0, 10);
      if (state.dateFrom && day < state.dateFrom) return false;
      if (state.dateTo && day > state.dateTo) return false;
      return true;
    }).sort(function (x, y) {
      if (x.createdAt === y.createdAt) return 0;
      var r = x.createdAt < y.createdAt ? -1 : 1;
      return state.sort === "desc" ? -r : r;
    });
  }

  function actionHtml(a) {
    var mine = SEL.isApplicant(a, user);
    var acts = [];
    acts.push('<button class="link-btn" data-act="view" data-id="' + a.id + '">查看</button>');

    if (a.status === "draft" || a.status === "rejected") {
      if (mine) {
        acts.push('<button class="link-btn" data-act="edit" data-id="' + a.id + '">编辑</button>');
        acts.push('<button class="link-btn" data-act="submit" data-id="' + a.id + '">提交审核</button>');
        acts.push('<button class="link-btn is-danger" data-act="del" data-id="' + a.id + '">删除</button>');
      }
    } else if (a.status === "member" || a.status === "center") {
      if (mine) {
        acts.push('<button class="link-btn" data-act="revoke" data-id="' + a.id + '">撤销审核</button>');
      }
      if (SEL.canApprove(a, user)) {
        acts.push('<button class="link-btn" data-act="approve" data-id="' + a.id + '">审核</button>');
      }
    } else if (a.status === "approved" && user.role === "expert") {
      acts.push('<button class="link-btn" data-act="score" data-id="' + a.id + '">专家打分</button>');
    }
    return acts.join("");
  }

  function renderTable() {
    var rows = filtered();
    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total / state.size));
    if (state.page > pages) state.page = pages;
    var start = (state.page - 1) * state.size;
    var slice = rows.slice(start, start + state.size);

    $("tbody").innerHTML = slice.map(function (a) {
      return "<tr>" +
        '<td><div class="cell-ellipsis" title="' + esc(a.title) + '">' + esc(a.title) + "</div></td>" +
        "<td>" + a.items.length + "</td>" +
        '<td><div class="cell-ellipsis" title="' + esc(a.org) + '">' + esc(a.org) + "</div></td>" +
        "<td>" + esc(a.applicant) + "</td>" +
        "<td>" + esc(a.createdAt) + "</td>" +
        '<td><span class="status-text">' + esc(SEL.STATUS[a.status]) + "</span></td>" +
        '<td class="sel-score-cell">' + scoreCellHtml(a) + "</td>" +
        '<td class="col-acts">' + actionHtml(a) + "</td>" +
      "</tr>";
    }).join("");

    $("tableEmpty").style.display = total ? "none" : "block";
    $("pagerInfo").textContent = "共 " + total + " 条";
    $("pgNum").textContent = state.page + " / " + pages;
    $("pgPrev").disabled = state.page <= 1;
    $("pgNext").disabled = state.page >= pages;
  }

  function renderActs() {
    if (user.role === "village" || user.role === "member") {
      $("pageActs").innerHTML = '<button class="btn btn-primary" id="btnCreate">发起申请</button>';
      $("btnCreate").addEventListener("click", function () {
        location.href = "drug-selection-create.html";
      });
    } else {
      $("pageActs").innerHTML = "";
    }
  }

  /* 得分列：有打分显示「查看得分」，否则显示 — */
  function scoreCellHtml(a) {
    if (!SEL.hasScores(a)) return "—";
    return '<button class="link-btn" data-act="scoreView" data-id="' + a.id + '">查看得分</button>';
  }

  function renderAll() {
    renderTable();
  }

  /* ---------------- 得分矩阵弹窗 ---------------- */
  function openScoreMatrix(app) {
    var experts = SEL.experts();
    var head = '<tr><th style="min-width:200px;">药品名称</th><th style="width:90px;">分类</th>' +
      experts.map(function (e) {
        return '<th style="width:90px;">' + esc(e.name) + "</th>";
      }).join("") +
      '<th style="width:90px;">平均分</th></tr>';

    var rows = app.items.map(function (it, i) {
      var cells = experts.map(function (e) {
        var rec = app.scores && app.scores[i] && app.scores[i][e.id];
        return "<td>" + (rec ? '<span class="sc-score-num">' + rec.total + "</span>" : '<span class="sc-score-none">未打分</span>') + "</td>";
      }).join("");
      var avg = SEL.itemAvg(app, i);
      return "<tr>" +
        '<td><div class="cell-ellipsis" title="' + esc(it.name) + '">' + (i + 1) + ". " + esc(it.name) + "</div></td>" +
        '<td><span class="sc-cat ' + (it.cat === "中成药" ? "is-tcm" : "") + '">' + esc(it.cat || "化学药品") + "</span></td>" +
        cells +
        '<td><b class="sc-score-avg">' + (avg === null ? "—" : avg) + "</b></td>" +
      "</tr>";
    }).join("");

    SEL.openModal(
      '<div class="modal-head">' +
        '<span class="modal-title">药品遴选得分 · ' + esc(app.title) + "</span>" +
        '<button class="drawer-close" data-close="1">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>' +
        "</button>" +
      "</div>" +
      '<div class="modal-body" style="padding-top:8px;">' +
        '<div class="sc-matrix-info">申请机构：' + esc(app.org) + "　申请人：" + esc(app.applicant) +
          "　申请时间：" + esc(app.createdAt) + "　打分依据：" + esc(SEL.rulesOf(app.items[0] && app.items[0].cat).ref) + "</div>" +
        '<div class="table-wrap sc-matrix-wrap"><table class="data-table sc-matrix">' +
          "<thead>" + head + "</thead><tbody>" + rows + "</tbody>" +
        "</table></div>" +
        '<div class="sc-matrix-note">平均分 = 该药品已提交打分专家的算术平均值；专家打分依据药品分类对应附件3（化学药品）或附件4（中成药）。</div>' +
      "</div>"
    );
  }

  /* ---------------- 专家打分抽屉 ---------------- */
  var scState = { appId: null, itemIdx: 0, picks: {} };

  function openScoreDrawer(app, idx) {
    scState.appId = app.id;
    scState.itemIdx = idx || 0;
    var existed = app.scores && app.scores[scState.itemIdx] && app.scores[scState.itemIdx][user.id];
    scState.picks = existed ? JSON.parse(JSON.stringify(existed.picks || {})) : {};
    renderDrawer();
    document.body.classList.add("drawer-open");
  }

  function closeScoreDrawer() {
    document.body.classList.remove("drawer-open");
  }

  function curApp() { return SEL.byId(SEL.loadData(), scState.appId); }

  function renderDrawer() {
    var app = curApp();
    if (!app) { closeScoreDrawer(); return; }
    var it = app.items[scState.itemIdx];
    var rules = SEL.rulesOf(it.cat);

    $("scTitle").textContent = "专家打分 · " + (app.title || "");

    /* 药品切换 */
    var tabs = app.items.map(function (x, i) {
      return '<span class="sc-drug-tab' + (i === scState.itemIdx ? " active" : "") + '" data-sc-idx="' + i + '">' +
        (i + 1) + ". " + esc(x.name) +
        '<i class="sc-cat' + (x.cat === "中成药" ? " is-tcm" : "") + '">' + esc(x.cat || "化学药品") + "</i></span>";
    }).join("");

    /* 指标勾选 */
    var html = '<div class="sc-drawer-info">' +
      '<div>申请人：<b>' + esc(app.applicant) + "</b>　申请机构：" + esc(app.org) + "　申请时间：" + esc(app.createdAt) + "</div>" +
      '<div class="sc-drawer-ref">打分依据：' + esc(rules.ref) + "</div></div>" +
      '<div class="sc-drug-tabs">' + tabs + "</div>";

    rules.groups.forEach(function (g) {
      html += '<div class="drawer-section"><div class="drawer-section-title">' +
        g.no + ". " + esc(g.name) + '<span class="sc-gmax">（' + g.max + " 分）</span></div>";
      g.subs.forEach(function (sub) {
        var pick = scState.picks[sub.no];
        html += '<div class="sc-sub"><div class="sc-sub-name">' + esc(sub.no) + " " + esc(sub.name) +
          '<span class="sc-sub-max">（' + sub.max + " 分" + (sub.kind === "multi" ? "，可多选" : "") + "）</span></div>" +
          '<div class="sc-opts">';
        sub.opts.forEach(function (o, oi) {
          var checked = sub.kind === "multi"
            ? Array.isArray(pick) && pick.indexOf(o.v) >= 0
            : pick === o.v;
          var input = sub.kind === "multi"
            ? '<input type="checkbox" data-sc-sub="' + sub.no + '" data-sc-v="' + o.v + '"' + (checked ? " checked" : "") + ">"
            : '<input type="radio" name="sc-r-' + sub.no + '" data-sc-sub="' + sub.no + '" data-sc-v="' + o.v + '"' + (checked ? " checked" : "") + ">";
          html += '<label class="sc-opt">' + input + '<span class="sc-opt-v">' + o.v + " 分</span>" +
            '<span class="sc-opt-t">' + esc(o.t) + "</span></label>";
        });
        html += "</div></div>";
      });
      html += "</div>";
    });

    $("scBody").innerHTML = html;

    var total = SEL.calcTotal(rules, scState.picks);
    $("scFoot").innerHTML =
      '<div class="sc-foot-total">当前总分：<b id="scTotal">' + total + "</b><span> / 100</span></div>" +
      '<div class="sc-foot-btns">' +
        '<button class="btn" id="scCancel">取消</button>' +
        '<button class="btn btn-primary" id="scSave">保存打分</button>' +
      "</div>";

    $("scCancel").addEventListener("click", closeScoreDrawer);
    $("scSave").addEventListener("click", saveScore);
  }

  function onPickChange(e) {
    var el = e.target.closest("[data-sc-sub]");
    if (!el) return;
    var subNo = el.getAttribute("data-sc-sub");
    var val = parseFloat(el.getAttribute("data-sc-v"));
    var isMulti = el.type === "checkbox";
    if (isMulti) {
      var arr = Array.isArray(scState.picks[subNo]) ? scState.picks[subNo].slice() : [];
      if (el.checked) {
        if (arr.indexOf(val) < 0) arr.push(val);
      } else {
        arr = arr.filter(function (v) { return v !== val; });
      }
      if (arr.length) scState.picks[subNo] = arr;
      else delete scState.picks[subNo];
    } else {
      scState.picks[subNo] = val;
    }
    var app = curApp();
    var rules = SEL.rulesOf(app.items[scState.itemIdx].cat);
    $("scTotal").textContent = SEL.calcTotal(rules, scState.picks);
  }

  function saveScore() {
    var list = SEL.loadData();
    var app = SEL.byId(list, scState.appId);
    if (!app) return;
    var rules = SEL.rulesOf(app.items[scState.itemIdx].cat);
    app.scores = app.scores || {};
    app.scores[scState.itemIdx] = app.scores[scState.itemIdx] || {};
    app.scores[scState.itemIdx][user.id] = {
      picks: scState.picks,
      total: SEL.calcTotal(rules, scState.picks),
      time: SEL.fmtNow()
    };
    SEL.saveData(list);
    SEL.toast("已保存打分，总分 " + app.scores[scState.itemIdx][user.id].total + " 分");
    closeScoreDrawer();
    renderTable();
  }

  /* ---------------- 操作 ---------------- */
  function doSubmit(id) {
    var list = SEL.loadData();
    var app = SEL.byId(list, id);
    if (!app) return;
    SEL.confirmDialog({
      title: "提交审核",
      text: "确认提交「" + app.title + "」？提交后进入" + (app.orgType === "village" ? "成员机构审核" : "中心药房审核") + "，期间不可编辑。",
      okText: "提交",
      onOk: function () {
        app.status = SEL.nextStatus(app);
        app.records.push({ node: "提交", org: app.org, person: app.applicant, result: "已提交", opinion: "—", time: SEL.fmtNow() });
        SEL.saveData(list);
        SEL.toast("已提交审核");
        renderAll();
      }
    });
  }

  function doRevoke(id) {
    var list = SEL.loadData();
    var app = SEL.byId(list, id);
    if (!app) return;
    SEL.confirmDialog({
      title: "撤销审核",
      text: "确认撤销「" + app.title + "」的审核？撤销后申请回到草稿，可重新编辑提交。",
      okText: "撤销",
      onOk: function () {
        app.status = "draft";
        app.records.push({ node: "撤销审核", org: app.org, person: app.applicant, result: "已撤销", opinion: "—", time: SEL.fmtNow() });
        SEL.saveData(list);
        SEL.toast("已撤销审核");
        renderAll();
      }
    });
  }

  function doDelete(id) {
    var list = SEL.loadData();
    var app = SEL.byId(list, id);
    if (!app) return;
    SEL.confirmDialog({
      title: "删除申请",
      text: "确认删除「" + app.title + "」？删除后不可恢复。",
      okText: "删除",
      onOk: function () {
        var next = list.filter(function (x) { return x.id !== id; });
        SEL.saveData(next);
        SEL.toast("已删除");
        renderAll();
      }
    });
  }

  /* ---------------- 事件 ---------------- */
  $("fStatus").addEventListener("change", doQuery);

  $("fKeyword").addEventListener("keydown", function (e) {
    if (e.key === "Enter") doQuery();
  });
  $("fDateFrom").addEventListener("change", doQuery);
  $("fDateTo").addEventListener("change", doQuery);

  $("btnQuery").addEventListener("click", doQuery);

  function doQuery() {
    state.status = $("fStatus").value;
    state.keyword = $("fKeyword").value.trim();
    state.dateFrom = $("fDateFrom").value;
    state.dateTo = $("fDateTo").value;
    state.page = 1;
    renderTable();
  }

  $("btnReset").addEventListener("click", function () {
    state.status = ""; state.keyword = ""; state.dateFrom = ""; state.dateTo = ""; state.page = 1;
    $("fStatus").value = ""; $("fKeyword").value = ""; $("fDateFrom").value = ""; $("fDateTo").value = "";
    renderTable();
  });

  $("thTime").addEventListener("click", function () {
    state.sort = state.sort === "desc" ? "asc" : "desc";
    this.classList.toggle("desc", state.sort === "desc");
    this.classList.toggle("asc", state.sort === "asc");
    renderTable();
  });

  $("pgPrev").addEventListener("click", function () { state.page--; renderTable(); });
  $("pgNext").addEventListener("click", function () { state.page++; renderTable(); });

  $("tbody").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-id]");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var act = btn.getAttribute("data-act") || "view";
    if (act === "view") location.href = "drug-selection-detail.html?id=" + id;
    else if (act === "edit") location.href = "drug-selection-create.html?id=" + id;
    else if (act === "approve") location.href = "drug-selection-detail.html?id=" + id + "&mode=approve";
    else if (act === "submit") doSubmit(id);
    else if (act === "revoke") doRevoke(id);
    else if (act === "del") doDelete(id);
    else if (act === "scoreView") {
      var app = SEL.byId(SEL.loadData(), id);
      if (app) openScoreMatrix(app);
    } else if (act === "score") {
      var a2 = SEL.byId(SEL.loadData(), id);
      if (a2) openScoreDrawer(a2, 0);
    }
  });

  /* 打分抽屉：勾选 / 药品切换 / 遮罩关闭 */
  $("scBody").addEventListener("change", onPickChange);
  $("scBody").addEventListener("click", function (e) {
    var tab = e.target.closest("[data-sc-idx]");
    if (tab) {
      scState.itemIdx = parseInt(tab.getAttribute("data-sc-idx"), 10);
      var app = curApp();
      var existed = app.scores && app.scores[scState.itemIdx] && app.scores[scState.itemIdx][user.id];
      scState.picks = existed ? JSON.parse(JSON.stringify(existed.picks || {})) : {};
      renderDrawer();
    }
  });
  $("scClose").addEventListener("click", closeScoreDrawer);
  $("scoreMask").addEventListener("click", closeScoreDrawer);

  $("tabClose").addEventListener("click", function () { location.href = "drug-catalog.html"; });
  $("headerUser").addEventListener("click", function () {
    SEL.confirmDialog({
      title: "退出登录",
      text: "确认退出当前账号「" + user.name + "」？",
      okText: "退出",
      onOk: function () { SEL.logout(); }
    });
  });

  /* 状态下拉选项 */
  Object.keys(SEL.STATUS).forEach(function (k) {
    var opt = document.createElement("option");
    opt.value = k; opt.textContent = SEL.STATUS[k];
    $("fStatus").appendChild(opt);
  });

  SEL.renderHeaderUser(user);
  SEL.bindNav();
  renderActs();
  renderAll();
})();
</script>
  <script src="nav.js"></script>
</body>
</html>
