<style>
/* ===== 处方管理 · 药品消耗明细 ===== */

/* 灰底水槽 + 白卡浮起 */
.page.dc-page { background: var(--bg-page); padding: 12px; gap: 0; }
.dc-card {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--bg-white);
  border-radius: var(--radius-lg);
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
  overflow: hidden;
}
.dc-card > .page-head {
  flex: none;
  height: 48px; padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-white);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}

/* 紧凑筛选区 */
.dc-filter {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 10px 20px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-white);
}
.dc-filter .filter-item { display: flex; align-items: center; gap: 6px; }
.dc-filter .filter-label { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
.dc-filter .input, .dc-filter .select { height: 30px; }
.dc-filter .filter-item .input, .dc-filter .filter-item .select { width: 170px; }
.dc-filter .filter-item .input[type="date"] { width: 130px; }
.dc-filter .filter-date-sep { font-size: 12px; color: var(--text-tertiary); }
.dc-filter .filter-item.kw .input { width: 220px; }
.dc-filter .filter-acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }

/* 多选下拉触发器 */
.multi-select {
  position: relative;
  width: 170px;
}
.multi-select .ms-trigger {
  display: flex; align-items: center; justify-content: space-between;
  height: 30px; padding: 0 10px;
  border: 1px solid var(--border-input); border-radius: var(--radius);
  background: var(--bg-white); cursor: pointer; font-size: 13px;
  transition: border-color .15s;
}
.multi-select .ms-trigger:hover { border-color: var(--primary-dark); }
.multi-select .ms-trigger.is-open { border-color: var(--primary-dark); box-shadow: 0 0 0 2px rgba(43,127,255,.12); }
.multi-select .ms-placeholder { color: var(--text-placeholder); }
.multi-select .ms-value { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
.multi-select .ms-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 4px;
  background: var(--primary); color: #fff; font-size: 11px; line-height: 1;
  border-radius: 9px; margin-left: 6px;
}
.multi-select .ms-arrow { color: var(--text-tertiary); font-size: 12px; margin-left: 4px; }
.multi-select .ms-panel {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  max-height: 260px; overflow-y: auto;
  background: #fff; border: 1px solid var(--border-input);
  border-radius: var(--radius); box-shadow: 0 4px 12px rgba(0,0,0,.1);
  z-index: 100; display: none;
}
.multi-select .ms-panel.is-open { display: block; }
.multi-select .ms-option {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; cursor: pointer; font-size: 13px;
}
.multi-select .ms-option:hover { background: var(--table-hover); }
.multi-select .ms-option.is-checked .ms-opt-label { color: var(--primary); }
.multi-select .ms-check {
  width: 14px; height: 14px; border: 1px solid var(--border-input); border-radius: 3px;
  display: flex; align-items: center; justify-content: center; flex: none;
}
.multi-select .ms-option.is-checked .ms-check { background: var(--primary); border-color: var(--primary); }
.multi-select .ms-option.is-checked .ms-check::after {
  content: ""; width: 8px; height: 4px; border: solid #fff; border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}

/* 药品消耗表格容器 */
.dc-table-wrap {
  flex: 1; min-height: 0; overflow: auto;
  background: var(--bg-white);
  padding: 0 16px;
}
.dc-table {
  width: max-content; min-width: 100%;
  border-collapse: collapse; font-size: 13px;
}
.dc-table th {
  position: sticky; top: 0; z-index: 2;
  background: var(--table-head);
  height: 38px; padding: 0 10px;
  text-align: left; font-weight: 500; color: var(--text-secondary);
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
.dc-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text-primary);
  white-space: nowrap;
}
.dc-table tbody tr:nth-child(even) { background: var(--table-even); }
.dc-table tbody tr:hover { background: var(--table-hover); }
.dc-table .col-num { text-align: right; font-variant-numeric: tabular-nums; }
.dc-table .amt { font-weight: 500; color: var(--primary-dark); }

/* 药品种类彩色标签 */
.kind-tag { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 12px; line-height: 18px; }
.kind-tag.k-west     { background: #E6F1FB; color: #2B7FFF; }
.kind-tag.k-cm       { background: #F6FFED; color: #52C41A; }
.kind-tag.k-tcm      { background: #FFF7E6; color: #FA8C16; }
.kind-tag.k-granule  { background: #F9F0FF; color: #722ED1; }
.kind-tag.k-narcotic { background: #FFF1F0; color: #FF4D4F; }
.kind-tag.k-psy1     { background: #FFF1F0; color: #FF4D4F; }
.kind-tag.k-psy2     { background: #FFF7E6; color: #FA8C16; }
.kind-tag.k-toxic    { background: #FFF1F0; color: #FF4D4F; }
.kind-tag.k-vaccine  { background: #E6FFFB; color: #13C2C2; }

/* 性别小标签 */
.sex-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 12px; }
.sex-tag.m { background: #E6F1FB; color: #2B7FFF; }
.sex-tag.f { background: #FFF0F5; color: #EB2F96; }

/* 底部分页：左侧汇总 + 右侧标准 pager */
.dc-card > .pager { padding: 0 16px; }
.dc-summary { font-size: 12px; color: var(--text-secondary); }
.dc-summary strong { color: var(--primary-dark); font-weight: 500; }

/* 导出按钮 */
.btn-export { display: inline-flex; align-items: center; gap: 4px; }
.btn-export::before {
  content: ""; width: 13px; height: 13px;
  background: currentColor;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2'><path d='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'/><polyline points='7 10 12 15 17 10'/><line x1='12' y1='15' x2='12' y2='3'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2'><path d='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'/><polyline points='7 10 12 15 17 10'/><line x1='12' y1='15' x2='12' y2='3'/></svg>") center/contain no-repeat;
}

</style>
</head>

    { kind:'麻醉药品',name:'盐酸吗啡注射液', code:'YP005001', spec:'10mg*1ml*5支',unitCoeff:5, prepSpec:'10mg',   purchase:12.00,retail:18.50,vendor:'东北制药集团股份有限公司',     approval:'国药准字H21022455', batch:'M260112A' },
    { kind:'第二类精神药品',name:'地西泮片', code:'YP006001', spec:'2.5mg*24片',  unitCoeff:1,  prepSpec:'2.5mg',  purchase:0.20, retail:0.40, vendor:'江苏恩华药业股份有限公司',     approval:'国药准字H32020337', batch:'S260208A' }
  ];

  function genMockData() {
    var rows = [];
    var today = new Date();
    var seed = 42;
    function srand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    function sItem(arr) { return arr[Math.floor(srand() * arr.length)]; }
    function sInt(a, b) { return a + Math.floor(srand() * (b - a + 1)); }

    for (var i = 0; i < 128; i++) {
      var drug = sItem(DRUG_POOL);
      var pt   = sItem(PATIENTS);
      var offsetHours = sInt(0, 24 * 14);
      var dispenseAt = new Date(today.getTime() - offsetHours * 3600 * 1000 - sInt(0, 3600) * 1000);
      var qty = sInt(1, 20);
      var row = {
        id: 'R' + String(100000 + i),
        patient: pt.name, sex: pt.sex, age: pt.age,
        dispenseAt: dispenseAt,
        dispenser: sItem(DOCTORS),
        dept: sItem(DEPTS),
        drugName: drug.name, drugCode: drug.code,
        spec: drug.spec, unitCoeff: drug.unitCoeff,
        prepSpec: drug.prepSpec,
        purchasePrice: drug.purchase, retailPrice: drug.retail,
        qty: qty,
        batch: drug.batch + '-' + sInt(1, 99),
        vendor: drug.vendor, approval: drug.approval,
        kind: drug.kind,
        loc: sItem(['loc-c1-A','loc-c1-B','loc-c2-A'])
      };
      row.amount = +(row.qty * row.retailPrice).toFixed(2);
      rows.push(row);
    }
    rows.sort(function (a, b) { return b.dispenseAt - a.dispenseAt; });
    return rows;
  }

  /* ---------- 状态 ---------- */
  var ST = {
    all: [],
    filtered: [],
    page: 1,
    pageSize: 20,
    msLocVals: [''],
    msKindVals: ['']
  };

  /* ---------- 初始化 ---------- */
  function init() {
    ST.all = genMockData();
    var end = new Date();
    var start = new Date(end.getTime() - 6 * 86400 * 1000);
    $('f-date-start').value = fmtDate(start);
    $('f-date-end').value   = fmtDate(end);
    bindEvents();
    DC.search();
  }

  function bindEvents() {
    $('f-kw').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') DC.search();
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.multi-select')) {
        document.querySelectorAll('.multi-select .ms-panel.is-open').forEach(function (p) { p.classList.remove('is-open'); });
        document.querySelectorAll('.multi-select .ms-trigger.is-open').forEach(function (t) { t.classList.remove('is-open'); });
      }
    });
  }

  /* ---------- 多选下拉 ---------- */
  DC.toggleMs = function (id, ev) {
    ev.stopPropagation();
    var el = $(id);
    var trigger = el.querySelector('.ms-trigger');
    var panel = el.querySelector('.ms-panel');
    var isOpen = panel.classList.contains('is-open');
    document.querySelectorAll('.multi-select .ms-panel.is-open').forEach(function (p) { p.classList.remove('is-open'); });
    document.querySelectorAll('.multi-select .ms-trigger.is-open').forEach(function (t) { t.classList.remove('is-open'); });
    if (!isOpen) { panel.classList.add('is-open'); trigger.classList.add('is-open'); }
  };

  DC.toggleMsOpt = function (id, opt, ev) {
    ev.stopPropagation();
    var val = opt.getAttribute('data-val');
    var panel = opt.parentElement;
    var isAll = val === '';

    if (isAll) {
      panel.querySelectorAll('.ms-option').forEach(function (o) { o.classList.remove('is-checked'); });
      opt.classList.add('is-checked');
    } else {
      panel.querySelectorAll('.ms-option').forEach(function (o) {
        if (o.getAttribute('data-val') === '') o.classList.remove('is-checked');
      });
      opt.classList.toggle('is-checked');
      var any = panel.querySelectorAll('.ms-option:not([data-val=""]).is-checked').length;
      if (any === 0) panel.querySelector('.ms-option[data-val=""]').classList.add('is-checked');
    }
    DC.syncMsTrigger(id);
  };

  DC.syncMsTrigger = function (id) {
    var el = $(id);
    var panel = el.querySelector('.ms-panel');
    var trigger = el.querySelector('.ms-trigger');
    var label = trigger.querySelector('.ms-value') || trigger.querySelector('.ms-placeholder');
    var checked = panel.querySelectorAll('.ms-option.is-checked:not([data-val=""])');
    var vals = [];
    checked.forEach(function (o) { vals.push(o.getAttribute('data-val')); });
    if (vals.length === 0) {
      ST[id === 'ms-loc' ? 'msLocVals' : 'msKindVals'] = [''];
      if (label.classList.contains('ms-value')) label.classList.remove('ms-value');
      label.classList.add('ms-placeholder');
      label.textContent = '全部';
      var countEl = trigger.querySelector('.ms-count');
      if (countEl) countEl.remove();
    } else {
      ST[id === 'ms-loc' ? 'msLocVals' : 'msKindVals'] = vals;
      var names = [];
      checked.forEach(function (o) { names.push(o.textContent.trim()); });
      if (label.classList.contains('ms-placeholder')) label.classList.remove('ms-placeholder');
      label.classList.add('ms-value');
      label.textContent = names.join('、');
      var countEl = trigger.querySelector('.ms-count');
      if (vals.length > 1) {
        if (!countEl) {
          countEl = document.createElement('span');
          countEl.className = 'ms-count';
          trigger.appendChild(countEl);
        }
        countEl.textContent = vals.length;
      } else if (countEl) {
        countEl.remove();
      }
    }
  };

  /* ---------- 查询 / 重置 ---------- */
  DC.search = function () {
    var dateS = $('f-date-start').value;
    var dateE = $('f-date-end').value;
    var kw    = $('f-kw').value.trim().toLowerCase();
    var locs  = ST.msLocVals;
    var kinds = ST.msKindVals;

    ST.filtered = ST.all.filter(function (r) {
      if (!(locs.length === 1 && locs[0] === '')) {
        if (locs.indexOf(r.loc) === -1) return false;
      }
      if (dateS) {
        var ds = new Date(dateS + 'T00:00:00');
        if (r.dispenseAt < ds) return false;
      }
      if (dateE) {
        var de = new Date(dateE + 'T23:59:59');
        if (r.dispenseAt > de) return false;
      }
      if (kw) {
        var hit = (r.drugCode || '').toLowerCase().indexOf(kw) !== -1
               || (r.drugName || '').toLowerCase().indexOf(kw) !== -1;
        if (!hit) return false;
      }
      if (!(kinds.length === 1 && kinds[0] === '')) {
        if (kinds.indexOf(r.kind) === -1) return false;
      }
      return true;
    });

    ST.page = 1;
    render();
  };

  DC.reset = function () {
    $('f-org').value = 'org-c';
    var end = new Date();
    var start = new Date(end.getTime() - 6 * 86400 * 1000);
    $('f-date-start').value = fmtDate(start);
    $('f-date-end').value   = fmtDate(end);
    $('f-kw').value = '';
    ['ms-loc', 'ms-kind'].forEach(function (mid) {
      var panel = $(mid + '-panel');
      panel.querySelectorAll('.ms-option').forEach(function (o) { o.classList.remove('is-checked'); });
      panel.querySelector('.ms-option[data-val=""]').classList.add('is-checked');
      DC.syncMsTrigger(mid);
    });
    DC.search();
  };

  /* ---------- 渲染 ---------- */
  function render() {
    renderTable();
    renderFooter();
    renderPager();
  }

  function kindClass(kind) {
    var map = {
      '西药':'k-west','中成药':'k-cm','中药饮片':'k-tcm','配方颗粒':'k-granule',
      '麻醉药品':'k-narcotic','第一类精神药品':'k-psy1','第二类精神药品':'k-psy2',
      '医疗用毒性药品':'k-toxic','疫苗':'k-vaccine'
    };
    return map[kind] || 'k-west';
  }

  function renderTable() {
    var tbody = $('dc-tbody');
    var start = (ST.page - 1) * ST.pageSize;
    var pageRows = ST.filtered.slice(start, start + ST.pageSize);

    if (pageRows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="20" class="table-empty">暂无数据</td></tr>';
      return;
    }

    var LOC_NAMES = { 'loc-c1-A':'西药库', 'loc-c1-B':'中药库', 'loc-c2-A':'藏药库', 'loc-a1-1-A':'门诊西药库', 'loc-a1-1-B':'门诊中药库' };

    var html = '';
    pageRows.forEach(function (r) {
      html += '<tr>'
        + '<td>' + esc(LOC_NAMES[r.loc] || r.loc) + '</td>'
        + '<td>' + esc(r.patient) + '</td>'
        + '<td>' + (r.sex === 'm' ? '男' : '女') + '</td>'
        + '<td>' + esc(r.age) + '</td>'
        + '<td>' + fmtDT(r.dispenseAt) + '</td>'
        + '<td>' + esc(r.dispenser) + '</td>'
        + '<td>' + esc(r.dept) + '</td>'
        + '<td title="' + esc(r.drugName) + '">' + esc(r.drugName) + '</td>'
        + '<td>' + esc(r.drugCode) + '</td>'
        + '<td>' + esc(r.spec) + '</td>'
        + '<td class="col-num">' + esc(r.unitCoeff) + '</td>'
        + '<td>' + esc(r.prepSpec) + '</td>'
        + '<td class="col-num">' + money(r.purchasePrice) + '</td>'
        + '<td class="col-num">' + money(r.retailPrice) + '</td>'
        + '<td class="col-num">' + esc(r.qty) + '</td>'
        + '<td class="col-num">' + money(r.amount) + '</td>'
        + '<td>' + esc(r.batch) + '</td>'
        + '<td title="' + esc(r.vendor) + '">' + esc(r.vendor) + '</td>'
        + '<td>' + esc(r.approval) + '</td>'
        + '<td>' + esc(r.kind) + '</td>'
        + '</tr>';
    });
    tbody.innerHTML = html;
  }

  function renderFooter() {
    var sum = 0;
    ST.filtered.forEach(function (r) { sum += r.amount; });
    $('dc-summary').innerHTML = '共 <strong>' + ST.filtered.length + '</strong> 条记录，零售金额合计：<strong>' + money(sum) + '</strong>';
  }

  function renderPager() {
    var ctrl = $('dc-pager');
    var total = ST.filtered.length;
    var pages = Math.max(1, Math.ceil(total / ST.pageSize));
    ST.page = Math.min(ST.page, pages);

    var html = '';
    // 上一页
    html += '<button class="pager-btn"' + (ST.page <= 1 ? ' disabled' : '') + ' onclick="DC.goPage(' + (ST.page - 1) + ')" title="上一页">'
      + '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>';
    // 当前/总页数
    html += '<span class="pager-num">' + ST.page + ' / ' + pages + '</span>';
    // 下一页
    html += '<button class="pager-btn"' + (ST.page >= pages ? ' disabled' : '') + ' onclick="DC.goPage(' + (ST.page + 1) + ')" title="下一页">'
      + '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>';

    ctrl.innerHTML = html;
  }

  DC.goPage = function (n) {
    var pages = Math.max(1, Math.ceil(ST.filtered.length / ST.pageSize));
    if (n < 1 || n > pages) return;
    ST.page = n;
    render();
    var wrap = document.querySelector('.dc-table-wrap');
    if (wrap) wrap.scrollTop = 0;
  };

  /* ---------- 导出 CSV ---------- */
  DC.exportData = function () {
    if (ST.filtered.length === 0) {
      showToast('没有可导出的数据');
      return;
    }
    var headers = ['病人姓名','性别','年龄','消耗时间','发药人','开单科室','药品名称','药品编码','药品规格','最小换算系数','制剂规格','发药时进货价','发药时零售价','发药数量','零售金额','批次号','生产企业','批准文号','药品种类'];
    var lines = [headers.join(',')];
    ST.filtered.forEach(function (r) {
      var row = [
        r.patient, r.sex === 'm' ? '男' : '女', r.age, fmtDT(r.dispenseAt),
        r.dispenser, r.dept, r.drugName, r.drugCode, r.spec, r.unitCoeff,
        r.prepSpec, r.purchasePrice, r.retailPrice, r.qty, r.amount,
        r.batch, r.vendor, r.approval, r.kind
      ];
      lines.push(row.map(function (v) {
        var s = String(v).replace(/"/g, '""');
        return /[",\n]/.test(s) ? '"' + s + '"' : s;
      }).join(','));
    });
    var csv = '\uFEFF' + lines.join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '药品消耗明细_' + fmtDate(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已导出 ' + ST.filtered.length + ' 条记录');
  };

  /* ---------- Toast ---------- */
  function showToast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;top:72px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 20px;border-radius:4px;font-size:13px;z-index:9999;';
    document.body.appendChild(t);
    setTimeout(function () {
      t.style.opacity = '0'; t.style.transition = 'opacity .3s';
      setTimeout(function () { t.remove(); }, 300);
    }, 1800);
  }

  init();
})();
</script>

  <script src="nav.js"></script>
