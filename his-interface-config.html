<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIS 对接配置 · 中心药房</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ===== 页面级样式（hc- 前缀） ===== */
.hc-mode { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.hc-mode.page { background: var(--primary-lighter); color: var(--primary-dark); }
.hc-mode.api { background: #eef4ff; color: #3b6fd4; }
.hc-url { color: var(--text-secondary); font-size: 12px; }
.hc-header { display: inline-block; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; color: var(--text-secondary); font-size: 12px; }
.dw .eg-field textarea.input { width: 100%; min-height: 76px; line-height: 1.6; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; resize: vertical; }
.hc-st-ok { color: var(--success); font-size: 12px; }
.hc-st-fail { color: var(--danger); font-size: 12px; }
.hc-time { color: var(--text-secondary); font-size: 12px; }
.hc-detail-head { display: flex; align-items: center; gap: 10px; }
.hc-page-config { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; margin-bottom: 12px; background: var(--bg-white); border-radius: var(--radius-lg); box-shadow: 0 1px 2px rgba(0,0,0,.04); font-size: 12px; color: var(--text-secondary); line-height: 1.8; }
.hc-page-config b { color: var(--text-primary); font-weight: 500; }
.hc-tip { font-size: 12px; color: var(--text-tertiary); line-height: 1.7; background: var(--bg-page); border-radius: 6px; padding: 8px 10px; margin-top: 14px; }

/* ===== 右侧抽屉（dw- 前缀） ===== */
.dw-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 90; }
.dw-mask.show { opacity: 1; pointer-events: auto; }
.dw { position: fixed; top: 0; right: -580px; width: 560px; max-width: 94vw; height: 100vh; background: #fff; z-index: 91; box-shadow: -8px 0 24px rgba(0,0,0,.12); transition: right .25s ease; display: flex; flex-direction: column; }
.dw.show { right: 0; }
.dw-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.dw-title { font-size: 15px; font-weight: 500; }
.dw-body { flex: 1; overflow: auto; padding: 18px 20px; }
.dw .eg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.dw .span-3 { grid-column: 1 / -1; }
.dw .eg-field .input, .dw .eg-field .select { width: 100%; }
.dw-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
.dw-sec-title { font-size: 13px; font-weight: 500; margin: 20px 0 10px; padding-left: 8px; border-left: 3px solid var(--primary); }
.dw-sec-title:first-child { margin-top: 0; }

/* 对接方式卡片 */
.mode-cards { display: flex; gap: 10px; }
.mode-card { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; cursor: pointer; transition: border-color .15s, background .15s; }
.mode-card:hover { border-color: var(--primary); }
.mode-card.active { border-color: var(--primary); background: var(--primary-lighter); }
.mode-card .mc-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.mode-card .mc-desc { font-size: 11px; color: var(--text-tertiary); line-height: 1.6; }

/* 测试结果 */
.dw-test { border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.7; display: flex; gap: 8px; align-items: flex-start; }
.dw-test svg { flex: none; margin-top: 2px; }
.dw-test.is-ok { background: #f0f9eb; border: 1px solid #c2e7b0; color: #4c8038; }
.dw-test.is-fail { background: #fef0f0; border: 1px solid #fbc4c4; color: #b23c3c; }
.dw-test .t-reason { color: inherit; opacity: .85; word-break: break-all; }
.dw-test.is-testing { background: var(--bg-page); color: var(--text-secondary); }
@keyframes dwspin { to { transform: rotate(360deg); } }

/* 查询区域 */
.hc-query { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 14px 16px; margin-bottom: 12px; background: var(--bg-white); border-radius: var(--radius-lg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
.hc-flt-label { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
.hc-flt-sep { font-size: 12px; color: var(--text-tertiary); }
.hc-flt-org { width: 170px; }
.hc-flt-item { width: 120px; }
.hc-flt-date { width: 138px; height: 32px; padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"></rect>
        <path d="M8.4 15.6L15.6 8.4"></path>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <div class="header-user">
      <div class="header-avatar">孙</div>
      <span class="header-user-name">孙磊</span>
    </div>
  </div>
</header>

<div class="app-body">
  <!-- ========== 左侧导航 ========== -->
  <aside class="app-side" id="appSide"></aside>

  <main class="app-main">
    <div class="tabbar">
      <div class="tab" onclick="location.href='drug-catalog.html'">首页</div>
      <div class="tab active">
        HIS 对接配置
        <button class="tab-close" title="关闭" onclick="location.href='drug-catalog.html'">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M5 5l14 14M19 5L5 19"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- ========== 第一页：机构对接列表 ========== -->
    <div class="page" id="viewList">
      <div class="page-head">
        <div class="page-head-left"><h1 class="page-title">HIS 对接配置</h1></div>
        <div class="page-acts"><button class="btn btn-primary" id="btnAddOrg">新增对接配置</button></div>
      </div>

      <div class="hc-query">
        <span class="hc-flt-label">机构</span>
        <select class="select hc-flt-org" id="fltOrg"><option value="">全部</option></select>
        <span class="hc-flt-label" style="margin-left:6px;">对接方式</span>
        <select class="select hc-flt-item" id="fltMode"><option value="">全部</option></select>
        <span class="hc-flt-label" style="margin-left:6px;">创建时间</span>
        <input type="date" class="input hc-flt-date" id="fltFrom">
        <span class="hc-flt-sep">至</span>
        <input type="date" class="input hc-flt-date" id="fltTo">
        <button class="btn btn-primary btn-sm" id="btnQuery" style="margin-left:10px;">查询</button>
        <button class="btn btn-sm" id="btnReset">重置</button>
      </div>

      <div class="sel-card">
        <div class="mf-table-wrap" style="padding:14px 16px 16px;">
          <table class="data-table">
            <colgroup>
              <col><col style="width:130px"><col style="width:140px"><col style="width:130px">
            </colgroup>
            <thead>
              <tr><th>机构</th><th>对接方式</th><th>创建时间</th><th>操作</th></tr>
            </thead>
            <tbody id="orgBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ========== 第二页：某机构的接口列表 ========== -->
    <div class="page" id="viewDetail" style="display:none;">
      <div class="page-head">
        <div class="page-head-left hc-detail-head">
          <button class="btn btn-sm" id="btnBack">返回列表</button>
          <h1 class="page-title" id="detailTitle" style="margin:0;"></h1>
          <span class="hc-mode" id="detailMode"></span>
        </div>
        <div class="page-acts"><button class="btn btn-primary" id="btnAddIface">新增接口</button></div>
      </div>

      <div id="pageConfigBox"></div>

      <div class="sel-card">
        <div class="mf-table-wrap" style="padding:14px 16px 16px;">
          <table class="data-table">
            <colgroup>
              <col style="width:160px"><col><col style="width:200px">
              <col style="width:80px"><col style="width:100px"><col style="width:110px"><col style="width:110px">
            </colgroup>
            <thead>
              <tr>
                <th>接口名称</th><th>URL</th><th>Header</th><th>状态</th>
                <th>最近同步</th><th>创建时间</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="ifaceBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ========== 右侧抽屉 ========== -->
<div class="dw-mask" id="dwMask"></div>
<div class="dw" id="drawer"></div>

<!-- ========== Toast ========== -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6L9 17l-5-5"></path>
  </svg>
  <span id="toastText"></span>
</div>

<script src="identity.js"></script>
<script src="mock.js"></script>
<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function inlineText(s) { return esc(s).replace(/\r?\n/g, " ↵ "); }

  /* ================= 访问控制 ================= */
  var ME = {};
  try { ME = JSON.parse(sessionStorage.getItem("SEL_USER") || "{}"); } catch (e) { /* ignore */ }
  if (ME.role !== "his") {
    document.body.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-page);">'
      + '<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:44px 52px;text-align:center;max-width:440px;">'
      + '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#b0b6c0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;">'
      + '<rect x="4.5" y="10.5" width="15" height="9.5" rx="2"></rect>'
      + '<path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"></path>'
      + '<circle cx="12" cy="15.2" r="1.4" fill="#b0b6c0" stroke="none"></circle></svg>'
      + '<div style="font-size:16px;font-weight:500;margin:14px 0 8px;">无访问权限</div>'
      + '<div style="font-size:13px;color:var(--text-tertiary);line-height:1.9;">「HIS 对接配置」仅对 HIS 对接人员开放<br>'
      + '当前登录：' + esc(ME.name || "未登录") + (ME.roleName ? "（" + esc(ME.roleName) + "）" : "")
      + '，如需使用请联系管理员开通权限</div>'
      + '<button class="btn btn-primary" style="margin-top:22px;" onclick="location.href=\'home.html\'">返回首页</button>'
      + "</div></div>";
    return;
  }

  /* ================= 对接方式与接口字典 =================
     out = 我方调用 HIS；in = HIS 调用我方 */
  var MODES = {
    page: {
      label: "页面对接",
      desc: "中心药房处方开放页面完全嵌入 HIS，同时完成处方/发药数据同步",
      ifaces: [
        { key: "rxSync", name: "处方同步", direction: "out" },
        { key: "rxStatusUpdate", name: "处方状态更新", direction: "out" },
        { key: "dispenseSync", name: "发药记录同步", direction: "out" },
        { key: "dispenseStatusUpdate", name: "发药记录状态更新", direction: "out" },
        { key: "returnSync", name: "退药同步", direction: "out" },
        { key: "paymentStatusUpdate", name: "缴费状态更新", direction: "in" },
        { key: "visitInfoPush", name: "就诊信息传递", direction: "in" }
      ]
    },
    api: {
      label: "接口对接",
      desc: "不做页面嵌入，仅在接口层面完成业务数据交互",
      ifaces: [
        { key: "drugStockQuery", name: "药品可用库存查询", direction: "out" }
      ]
    }
  };
  function defOf(mode, key) {
    var list = MODES[mode].ifaces;
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
    return null;
  }

  var ALL_ORGS = (function () {
    var out = [];
    (function walk(list) {
      (list || []).forEach(function (n) { out.push(n.name); walk(n.children); });
    })([
      { name: "区域中心药房", children: [
        { name: "城东社区卫生服务中心", children: [{ name: "城东第一村室" }, { name: "城东第二村室" }] },
        { name: "城西卫生院", children: [{ name: "青河村卫生室" }] },
        { name: "滨江卫生院" }
      ] }
    ]);
    return out;
  })();

  /* ================= 数据 =================
     机构记录：{ id, org, mode, ifaces:[], createdAt }（页面对接的嵌入页面地址由医共体统一固定，不再维护）
     接口记录：{ id, key, name, direction, url, header, ok, lastSync, createdAt, custom } */
  var DATA_KEY = "HIS_CFG_V10";
  var HDR_WN = "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ3bmlmeC0wMDEiLCJleHAiOjE3OTA3MzQ0MDB9.3Xk9pQ2vR7mZwA8sLc1eFjHb5nY0uT6dI4gOaKqVx2E";
  var HDR_DH = "dh_tk_9f27c8a4b6e1d305882f4c0a7d93be56";
  var HDR_KS = "ks_tk_88d2f1a9c407be65d2381f0e47a9c5b2";
  var HDR_BASE = "base_tk_5c1e88f0a92d4b7ce6f30184a9d2570b3";

  function mkIface(id, mode, key, url, header, ok, createdAt, lastSync) {
    var def = defOf(mode, key) || { name: key, direction: "out" };
    return {
      id: id, key: key, name: def.name, direction: def.direction,
      url: url, header: header, ok: ok !== false,
      lastSync: lastSync, createdAt: createdAt, custom: false
    };
  }
  function seed() {
    return [
      { id: 1, org: "城东社区卫生服务中心", mode: "page",
        createdAt: "2026-10-28 10:23",
        ifaces: [
          mkIface(101, "page", "rxSync", "http://10.0.8.11:8080/his/rx/sync", HDR_WN, true, "2026-10-28 10:25", "今天 18:02"),
          mkIface(102, "page", "rxStatusUpdate", "http://10.0.8.11:8080/his/rx/status", HDR_WN, true, "2026-10-28 10:28", "今天 18:02"),
          mkIface(103, "page", "dispenseSync", "http://10.0.8.11:8080/his/dispense/sync", HDR_WN, true, "2026-10-28 10:31", "今天 17:45"),
          mkIface(104, "page", "dispenseStatusUpdate", "http://10.0.8.11:8080/his/dispense/status", HDR_WN, true, "2026-10-28 10:33", "今天 17:45"),
          mkIface(105, "page", "paymentStatusUpdate", "http://10.8.1.20:8080/callback/his/payment/status", "cb_tk_cd_pay_83a1", true, "2026-11-02 15:47", "今天 18:05"),
          mkIface(106, "page", "visitInfoPush", "http://10.8.1.20:8080/callback/his/visit/info", "cb_tk_cd_visit_42f7", true, "2026-11-02 15:49", "今天 18:05")
        ] },
      { id: 2, org: "城西卫生院", mode: "api",
        createdAt: "2026-11-05 09:12",
        ifaces: [
          mkIface(201, "api", "drugStockQuery", "http://10.2.6.18:9000/api/drug/stock", HDR_DH, true, "2026-11-05 09:15", "今天 17:46"),
          { id: 202, key: "custom_purchase_plan", name: "药品采购计划查询", direction: "out", url: "http://10.2.6.18:9000/api/purchase/plan", header: HDR_DH, ok: true, lastSync: "今天 17:46", createdAt: "2026-11-12 11:08", custom: true }
        ] },
      { id: 3, org: "滨江卫生院", mode: "api",
        createdAt: "2026-11-10 11:05",
        ifaces: [
          mkIface(301, "api", "drugStockQuery", "http://10.3.4.21:7001/ws/drug/stock", HDR_KS, false, "2026-11-10 11:08", "昨天 22:10")
        ] },
      { id: 4, org: "青河村卫生室", mode: "page",
        createdAt: "2026-11-09 14:31",
        ifaces: [
          mkIface(401, "page", "rxSync", "http://10.2.6.19:8080/basehis/rx/sync", HDR_BASE, true, "2026-11-09 14:33", "今天 18:00"),
          mkIface(402, "page", "paymentStatusUpdate", "http://10.8.1.20:8080/callback/his/payment/status", "cb_tk_qh_pay_61bd", true, "2026-11-14 10:22", "今天 18:00")
        ] }
    ];
  }

  var DATA = [];
  function loadData() {
    try {
      var raw = sessionStorage.getItem(DATA_KEY);
      if (raw) { DATA = JSON.parse(raw); return; }
    } catch (e) { /* ignore */ }
    DATA = seed();
  }
  function saveData() {
    try { sessionStorage.setItem(DATA_KEY, JSON.stringify(DATA)); } catch (e) { /* ignore */ }
  }
  function recOf(id) { return DATA.filter(function (r) { return r.id === id; })[0] || null; }
  function recOfOrg(org) { return DATA.filter(function (r) { return r.org === org; })[0] || null; }
  function currentOrg() { return recOf(ST.orgId); }

  /* ================= 状态 ================= */
  var ST = { view: "list", orgId: 0, drawer: null };
  var FLT = { org: "", mode: "", from: "", to: "" };

  function showView(v) {
    ST.view = v;
    $("viewList").style.display = v === "list" ? "" : "none";
    $("viewDetail").style.display = v === "detail" ? "" : "none";
    if (v === "detail") renderDetail();
  }

  /* ================= 第一页：机构列表 ================= */
  function filteredOrgs() {
    return DATA.filter(function (r) {
      if (FLT.org && r.org !== FLT.org) return false;
      if (FLT.mode && r.mode !== FLT.mode) return false;
      var day = String(r.createdAt || "").slice(0, 10);
      if (FLT.from && day < FLT.from) return false;
      if (FLT.to && day > FLT.to) return false;
      return true;
    });
  }
  function renderOrgList() {
    var rows = filteredOrgs();
    if (!rows.length) {
      var msg = (FLT.org || FLT.mode || FLT.from || FLT.to)
        ? "没有符合条件的对接配置，可调整查询条件后重新查询"
        : "暂无对接配置，点击右上角「新增对接配置」开始配置";
      $("orgBody").innerHTML = '<tr><td colspan="4" class="table-empty">' + msg + "</td></tr>";
      return;
    }
    $("orgBody").innerHTML = rows.map(function (r) {
      var acts = '<button class="link-btn" data-act="edit" data-id="' + r.id + '">编辑</button>'
        + '<button class="link-btn is-danger" data-act="del" data-id="' + r.id + '">删除</button>';
      return "<tr>"
        + "<td>" + esc(r.org) + "</td>"
        + '<td><span class="hc-mode ' + (r.mode === "page" ? "page" : "api") + '">' + MODES[r.mode].label + "</span></td>"
        + '<td><span class="hc-time">' + esc(r.createdAt || "—") + "</span></td>"
        + '<td><div class="mf-acts">' + acts + "</div></td>"
        + "</tr>";
    }).join("");
  }

  /* ================= 第二页：接口列表 ================= */
  function renderPageConfig(rec) {
    if (rec.mode !== "page") {
      $("pageConfigBox").innerHTML = '<div class="hc-page-config"><div>当前机构为<b>接口对接</b>，不做页面嵌入，仅配置接口层 URL 与 Header。</div>'
        + '<button class="btn btn-sm" data-page-edit="1">编辑对接信息</button></div>';
      return;
    }
    /* 页面对接：嵌入页面地址由医共体统一提供（各机构一致），无需维护 */
    $("pageConfigBox").innerHTML = '<div class="hc-page-config"><div>当前机构为<b>页面对接</b>。同一医共体内嵌入页面地址统一固定，由平台侧维护，机构无需在此配置页面 URL 与 Header。</div>'
      + '<button class="btn btn-sm" data-page-edit="1">编辑对接信息</button></div>';
  }
  function renderIfaceTable(rec) {
    var rows = rec.ifaces || [];
    if (!rows.length) {
      $("ifaceBody").innerHTML = '<tr><td colspan="7" class="table-empty">暂无接口，点击右上角「新增接口」开始配置</td></tr>';
      return;
    }
    $("ifaceBody").innerHTML = rows.map(function (it) {
      var stHtml = it.ok === false
        ? '<span class="hc-st-fail">● 异常</span>'
        : '<span class="hc-st-ok">● 正常</span>';
      var acts = '<button class="link-btn" data-act="edit" data-id="' + it.id + '">编辑</button>'
        + '<button class="link-btn is-danger" data-act="del" data-id="' + it.id + '">删除</button>';
      return "<tr>"
        + "<td>" + esc(it.name) + "</td>"
        + '<td><span class="hc-url" title="' + esc(it.url) + '">' + esc(it.url) + "</span></td>"
        + '<td><span class="hc-header" title="' + esc(it.header) + '">' + inlineText(it.header) + "</span></td>"
        + "<td>" + stHtml + "</td>"
        + "<td>" + esc(it.lastSync || "—") + "</td>"
        + '<td><span class="hc-time">' + esc(it.createdAt || "—") + "</span></td>"
        + '<td><div class="mf-acts">' + acts + "</div></td>"
        + "</tr>";
    }).join("");
  }
  function renderDetail() {
    var rec = currentOrg();
    if (!rec) { showView("list"); return; }
    $("detailTitle").textContent = rec.org;
    $("detailMode").className = "hc-mode " + (rec.mode === "page" ? "page" : "api");
    $("detailMode").textContent = MODES[rec.mode].label;
    renderPageConfig(rec);
    renderIfaceTable(rec);
  }

  /* ================= 抽屉 ================= */
  function field(label, inner, span) {
    return '<div class="eg-field' + (span ? " span-3" : "") + '"><span class="eg-label">' + label + "</span>" + inner + "</div>";
  }
  function openDrawer(html) {
    $("drawer").innerHTML = html;
    $("dwMask").classList.add("show");
    $("drawer").classList.add("show");
  }
  function closeDrawer() {
    $("dwMask").classList.remove("show");
    $("drawer").classList.remove("show");
    ST.drawer = null;
  }
  function drawerShell(title, body, foot) {
    return '<div class="dw-head"><span class="dw-title">' + title + "</span>"
      + '<button class="drawer-close" data-dw-close="1"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>'
      + '<div class="dw-body">' + body + "</div>"
      + '<div class="dw-foot">' + foot + "</div>";
  }
  var FOOT_DEFAULT = '<button class="btn" data-dw-close="1">取消</button><button class="btn btn-primary" data-dw-save="1">保存</button>';

  /* --- 机构抽屉（第一页新增 / 页面配置编辑） --- */
  function modeCards(cur) {
    return '<div class="mode-cards">' + Object.keys(MODES).map(function (k) {
      var m = MODES[k];
      return '<div class="mode-card' + (cur === k ? " active" : "") + '" data-mode="' + k + '">'
        + '<div class="mc-title">' + m.label + "</div>"
        + '<div class="mc-desc">' + m.desc + "</div></div>";
    }).join("") + "</div>";
  }
  function openOrgDrawer(rec) {
    var d = rec ? JSON.parse(JSON.stringify(rec)) : { id: 0, org: "", mode: "page", createdAt: "", ifaces: [] };
    ST.drawer = { kind: "org", mode: rec ? "edit" : "create", draft: d };
    renderOrgDrawer();
  }
  function renderOrgDrawer() {
    var d = ST.drawer.draft;
    /* 页面对接：嵌入页面地址由医共体统一固定，无需维护页面嵌入配置 */
    var pagePart = d.mode === "page"
      ? '<div class="span-3"><div class="hc-tip" style="margin-top:0;">页面对接的嵌入页面地址由医共体统一提供（各机构一致），无需在此维护页面嵌入配置。</div></div>'
      : "";
    openDrawer(drawerShell(
      ST.drawer.mode === "create" ? "新增对接配置" : "编辑对接配置",
      '<div class="dw-sec-title">基本信息</div><div class="eg-grid">'
      + field('<span class="req">*</span>机构', '<select class="select" data-k="org">'
        + ALL_ORGS.map(function (o) { return '<option value="' + esc(o) + '"' + (d.org === o ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("")
        + "</select>")
      + field('<span class="req">*</span>对接方式', modeCards(d.mode), true)
      + "</div>" + pagePart,
      FOOT_DEFAULT
    ));
  }
  function saveOrgDrawer() {
    var d = ST.drawer.draft;
    if (!d.org) { toast("请选择机构"); return; }
    var now = new Date();
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    var ts = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());

    if (ST.drawer.mode === "create") {
      if (recOfOrg(d.org)) { toast("该机构已存在对接配置，请直接编辑"); return; }
      var maxId = 0;
      DATA.forEach(function (r) { if (r.id > maxId) maxId = r.id; });
      DATA.push({
        id: maxId + 1, org: d.org, mode: d.mode,
        pageUrl: "", pageHeader: "",
        ifaces: [], createdAt: ts
      });
      toast("已新增：" + d.org);
    } else {
      var rec = recOf(d.id);
      if (!rec) { closeDrawer(); return; }
      if (d.org !== rec.org && recOfOrg(d.org)) { toast("该机构已存在对接配置，请直接编辑"); return; }
      var modeChanged = rec.mode !== d.mode;
      if (modeChanged && rec.ifaces.length && !confirm("切换对接方式将清空该机构下已配置的接口，确定继续吗？")) return;
      rec.org = d.org;
      rec.mode = d.mode;
      rec.pageUrl = "";
      rec.pageHeader = "";
      if (modeChanged) rec.ifaces = [];
      toast("已保存：" + d.org);
    }
    saveData();
    closeDrawer();
    renderOrgList();
    if (ST.view === "detail") renderDetail();
  }

  /* --- 接口抽屉（第二页新增 / 编辑）：所有接口均为自定义，只填名称 / URL / Header ---
     调用方向不再由用户选择：新增接口固定为「我方调用 HIS」，已有接口保持原方向 */
  function openIfaceDrawer(rec) {
    var d = rec
      ? { id: rec.id, key: rec.key || "", name: rec.name, direction: rec.direction, url: rec.url, header: rec.header, custom: true }
      : { id: 0, key: "", name: "", direction: "out", url: "", header: "", custom: true };
    ST.drawer = { kind: "iface", mode: rec ? "edit" : "create", draft: d };
    renderIfaceDrawer();
  }
  function renderIfaceDrawer() {
    var d = ST.drawer.draft;
    var isIn = d.direction === "in";
    var namePart = field('<span class="req">*</span>接口名称', '<input class="input" data-k="name" value="' + esc(d.name) + '" placeholder="如：处方同步、药品可用库存查询" autocomplete="off">');
    var testFoot = isIn
      ? FOOT_DEFAULT
      : '<button class="btn" data-iface-test="1" id="btnTest">测试连接</button>' + FOOT_DEFAULT;
    openDrawer(drawerShell(
      ST.drawer.mode === "create" ? "新增接口" : "编辑接口",
      '<div class="dw-sec-title">接口信息</div><div class="eg-grid">'
      + namePart
      + field('<span class="req">*</span>URL', '<input class="input" data-k="url" value="' + esc(d.url) + '" placeholder="http://" autocomplete="off">', true)
      + field('<span class="req">*</span>Header', '<textarea class="input" data-k="header" rows="3" placeholder="可输入多行 Header">' + esc(d.header) + "</textarea>", true)
      + '<div class="span-3"><div class="hc-tip" style="margin-top:0;">' + (isIn
        ? "该接口由 HIS 侧发起调用，URL 与 Header 由我方提供，无需在此测试连通性。"
        : "URL 与 Header 由 HIS 厂商提供，我方调用时按约定携带。入参 / 出参报文以我方《标准接口规范》为准。") + "</div></div>"
      + '<div class="span-3" id="ifaceTest"></div>'
      + "</div>",
      testFoot
    ));
  }
  function saveIfaceDrawer() {
    var d = ST.drawer.draft;
    var org = currentOrg();
    if (!String(d.name || "").trim()) { toast("请填写接口名称"); return; }
    if (!String(d.url || "").trim()) { toast("请填写 URL"); return; }
    if (!String(d.header || "").trim()) { toast("请填写 Header"); return; }
    var existing = org.ifaces.filter(function (x) { return x.id === ST.drawer.id; })[0];
    var payload = {
      key: existing && existing.key ? existing.key : "custom_" + Date.now(),
      name: String(d.name).trim(), direction: d.direction,
      url: String(d.url).trim(), header: String(d.header).trim(), custom: true
    };
    var now = new Date();
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    var ts = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());

    if (ST.drawer.mode === "edit") {
      if (!existing) { closeDrawer(); return; }
      existing.name = payload.name; existing.direction = payload.direction;
      existing.url = payload.url; existing.header = payload.header; existing.custom = true;
      toast("已保存：" + existing.name);
    } else {
      var maxId = 0;
      org.ifaces.forEach(function (x) { if (x.id > maxId) maxId = x.id; });
      org.ifaces.push({
        id: maxId + 1, key: payload.key, name: payload.name, direction: payload.direction,
        url: payload.url, header: payload.header,
        ok: true, lastSync: "—", createdAt: ts, custom: payload.custom
      });
      toast("已新增：" + payload.name);
    }
    saveData();
    closeDrawer();
    renderIfaceTable(org);
  }

  /* ================= 测试连接 ================= */
  var ICON_OK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var ICON_FAIL = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.2v.1"/></svg>';
  function simulateTest(d) {
    var url = String(d.url || "").trim();
    var header = String(d.header || "").trim();
    if (!/^https?:\/\/.+/i.test(url)) return { ok: false, reason: "URL 格式错误：需以 http:// 或 https:// 开头，并包含主机地址" };
    if (url.indexOf(":7001") >= 0) return { ok: false, reason: "连接超时：10 秒内未收到应答。请检查网络、IP 或端口是否正确" };
    if (header.length < 8) return { ok: false, reason: "鉴权失败：对方返回 401，Header 无效或已过期" };
    return { ok: true, reason: "应答正常，鉴权通过，耗时 " + (120 + Math.floor(Math.random() * 380)) + " ms" };
  }
  function runIfaceTest() {
    var d = ST.drawer.draft;
    if (!String(d.url || "").trim()) { toast("请先填写 URL"); return; }
    if (!String(d.header || "").trim()) { toast("请先填写 Header"); return; }
    var box = $("ifaceTest");
    var btn = $("btnTest");
    btn.disabled = true;
    box.innerHTML = '<div class="dw-test is-testing"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="animation:dwspin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg><span>正在连接，请稍候……</span></div>';
    setTimeout(function () {
      if (!ST.drawer || ST.drawer.kind !== "iface") return;
      var res = simulateTest(d);
      d.testOk = res.ok;
      btn.disabled = false;
      box.innerHTML = '<div class="dw-test ' + (res.ok ? "is-ok" : "is-fail") + '">'
        + (res.ok ? ICON_OK : ICON_FAIL)
        + '<div><div class="t-title">' + (res.ok ? "连接成功" : "测试失败") + "</div>"
        + '<div class="t-reason">' + esc(res.reason) + "</div></div></div>";
      if (ST.drawer.mode === "edit") {
        var it = currentOrg().ifaces.filter(function (x) { return x.id === ST.drawer.id; })[0];
        if (it) { it.ok = res.ok; saveData(); renderIfaceTable(currentOrg()); }
      }
    }, 700);
  }

  /* ================= Toast ================= */
  var toastTimer = null;
  function toast(msg) {
    $("toastText").textContent = msg;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").classList.remove("show"); }, 2200);
  }

  /* ================= 事件 ================= */
  function bindEvents() {
    $("btnAddOrg").addEventListener("click", function () { openOrgDrawer(null); });
    $("btnBack").addEventListener("click", function () { showView("list"); });
    $("btnAddIface").addEventListener("click", function () { openIfaceDrawer(null); });

    $("orgBody").addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-act]");
      if (!btn) return;
      var id = Number(btn.getAttribute("data-id"));
      var r = recOf(id);
      if (!r) return;
      if (btn.getAttribute("data-act") === "edit") {
        ST.orgId = id;
        showView("detail");
      } else {
        if (confirm("确定删除「" + r.org + "」的对接配置及其下所有接口吗？")) {
          DATA.splice(DATA.indexOf(r), 1);
          saveData();
          renderOrgList();
          toast("已删除：" + r.org);
        }
      }
    });

    $("pageConfigBox").addEventListener("click", function (e) {
      if (e.target.closest("[data-page-edit]")) openOrgDrawer(currentOrg());
    });

    $("ifaceBody").addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-act]");
      if (!btn) return;
      var id = Number(btn.getAttribute("data-id"));
      var org = currentOrg();
      if (!org) return;
      var it = org.ifaces.filter(function (x) { return x.id === id; })[0];
      if (!it) return;
      if (btn.getAttribute("data-act") === "edit") openIfaceDrawer(it);
      else {
        if (confirm("确定删除接口「" + it.name + "」吗？")) {
          org.ifaces.splice(org.ifaces.indexOf(it), 1);
          saveData();
          renderIfaceTable(org);
          toast("已删除：" + it.name);
        }
      }
    });

    $("drawer").addEventListener("click", function (e) {
      if (!ST.drawer) return;
      if (e.target.closest("[data-dw-close]")) { closeDrawer(); return; }
      if (e.target.closest("[data-dw-save]")) {
        if (ST.drawer.kind === "org") saveOrgDrawer(); else saveIfaceDrawer();
        return;
      }
      if (ST.drawer.kind === "org") {
        var modeCard = e.target.closest("[data-mode]");
        if (modeCard && modeCard.getAttribute("data-mode") !== ST.drawer.draft.mode) {
          ST.drawer.draft.mode = modeCard.getAttribute("data-mode");
          renderOrgDrawer();
        }
        return;
      }
      if (e.target.closest("[data-iface-test]")) { runIfaceTest(); return; }
    });

    $("dwMask").addEventListener("click", closeDrawer);

    $("drawer").addEventListener("input", function (e) {
      if (!ST.drawer) return;
      var el = e.target;
      var k = el.getAttribute && el.getAttribute("data-k");
      if (k) ST.drawer.draft[k] = el.value;
    });
    $("drawer").addEventListener("change", function (e) {
      if (!ST.drawer) return;
      var el = e.target;
      var k = el.getAttribute && el.getAttribute("data-k");
      if (!k) return;
      ST.drawer.draft[k] = el.value;
    });
  }

  /* ================= 初始化 ================= */
  function initFilters() {
    ALL_ORGS.forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o; opt.textContent = o;
      $("fltOrg").appendChild(opt);
    });
    Object.keys(MODES).forEach(function (k) {
      var opt = document.createElement("option");
      opt.value = k; opt.textContent = MODES[k].label;
      $("fltMode").appendChild(opt);
    });
    $("btnQuery").addEventListener("click", function () {
      FLT = { org: $("fltOrg").value, mode: $("fltMode").value, from: $("fltFrom").value, to: $("fltTo").value };
      renderOrgList();
    });
    $("btnReset").addEventListener("click", function () {
      $("fltOrg").value = ""; $("fltMode").value = ""; $("fltFrom").value = ""; $("fltTo").value = "";
      FLT = { org: "", mode: "", from: "", to: "" };
      renderOrgList();
    });
  }

  loadData();
  bindEvents();
  initFilters();
  renderOrgList();
})();
</script>
