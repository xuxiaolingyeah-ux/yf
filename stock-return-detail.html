<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退库详情 · 中心药房</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ===== 药品退库 查看/审核/出库/入库页 局部样式 ===== */
.sr-page { background: var(--bg-page); }
.sr-card { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg-white); margin: 12px; border-radius: var(--radius-lg); box-shadow: 0 1px 2px rgba(0,0,0,.04); overflow: hidden; }
/* 标题行 */
.sr-head { flex: none; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--border); }
.sr-head .page-title { font-size: 16px; font-weight: 500; }
.sr-head .sr-code { font-size: 12px; color: var(--text-tertiary); }
.sr-head .status-text { margin-left: auto; font-size: 13px; display: flex; gap: 20px; }
/* 页签（胶囊分段） */
.sr-tabs { flex: none; padding: 0; }
.sr-tabs .page-tabs { margin: 10px 20px 0; }
/* 内容区 */
.sr-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px; }
.sr-sec + .sr-sec { margin-top: 20px; }
.sr-sec-title { font-size: 13px; font-weight: 500; color: var(--text-primary); padding-left: 8px; margin-bottom: 12px; border-left: 3px solid var(--primary); }
/* 只读键值：4 列 */
.sr-view { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px 16px; max-width: 1280px; }
.sr-view .fi { display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
.sr-view .fi .lbl { width: 104px; flex: none; text-align: right; font-size: 13px; color: var(--text-secondary); white-space: nowrap; line-height: 22px; }
.sr-view .fi .val { flex: 1; min-width: 0; font-size: 13px; color: var(--text-primary); line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 药品明细宽表 */
.sr-items-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: auto; }
.sr-items { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 13px; }
.sr-items th { position: sticky; top: 0; z-index: 2; background: var(--table-head); height: 38px; padding: 0 8px; text-align: left; font-weight: 500; color: var(--text-secondary); white-space: nowrap; border-bottom: 1px solid var(--border); }
.sr-items th .req { color: var(--danger); margin-right: 2px; }
.sr-items td { padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; background: var(--bg-white); }
.sr-items tbody tr:nth-child(even) td { background: var(--table-even); }
.sr-items .num { text-align: right; font-variant-numeric: tabular-nums; }
.sr-items .cell-input, .sr-items .cell-select { height: 28px; width: 100%; min-width: 0; box-sizing: border-box; font-size: 12px; }
.sr-items .cell-ellipsis { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
/* 药品名称列左固定 / 操作列右固定 */
.sr-items .col-drug { position: sticky; left: 0; z-index: 3; box-shadow: 2px 0 4px rgba(0,0,0,.04); }
.sr-items .col-acts { position: sticky; right: 0; z-index: 3; box-shadow: -2px 0 4px rgba(0,0,0,.04); }
.sr-items th.col-drug, .sr-items th.col-acts { background: var(--table-head); z-index: 4; }
.sr-items td.col-drug, .sr-items td.col-acts { background: var(--bg-white); }
.sr-items tbody tr:nth-child(even) td.col-drug, .sr-items tbody tr:nth-child(even) td.col-acts { background: var(--table-even); }
/* 表格下方合计条（表格外） */
.sr-sum-line { display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 10px 4px 0; font-size: 13px; color: var(--text-secondary); }
.sr-sum-line b { font-weight: 500; color: var(--text-primary); font-variant-numeric: tabular-nums; }
/* 审批记录 */
.sr-rec { width: 100%; border-collapse: collapse; font-size: 13px; }
.sr-rec th { background: var(--table-head); height: 38px; padding: 0 10px; text-align: left; font-weight: 500; color: var(--text-secondary); border-bottom: 1px solid var(--border); white-space: nowrap; }
.sr-rec td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.sr-rec tbody tr:nth-child(even) td { background: var(--table-even); }
.sr-rec .op-cell { max-width: 320px; white-space: normal; line-height: 1.5; }
.sr-empty { padding: 32px 0; text-align: center; color: var(--text-placeholder); font-size: 13px; }
/* 底部操作条（居中） */
.sr-foot { flex: none; height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; border-top: 1px solid var(--border); background: var(--bg-white); }
/* 审批区（三行，固定底部，与卡片同宽） */
.sr-approve { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--bg-white); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.sr-approve .ap-radios { display: flex; gap: 20px; }
.sr-approve .ap-btns { display: flex; justify-content: flex-end; gap: 8px; }
.sr-approve textarea { width: 100%; }
/* 追溯码弹窗 */
.sr-trace .modal { width: 720px; max-width: 92vw; }
.sr-trace-input { display: flex; gap: 8px; margin-bottom: 12px; }
.sr-trace-input .input { flex: 1; }
.sr-trace-tip { font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px; }
.sr-trace-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sr-trace-table th { background: var(--table-head); height: 36px; padding: 0 10px; text-align: left; font-weight: 500; color: var(--text-secondary); white-space: nowrap; border-bottom: 1px solid var(--border); }
.sr-trace-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.sr-trace-table .bad-tag { color: var(--danger); font-size: 12px; }
.sr-trace-table input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; }
.sr-trace-empty { padding: 32px 0; text-align: center; color: var(--text-placeholder); font-size: 13px; }
/* 确认弹窗 */
.sr-confirm .modal { width: 400px; }
.sr-confirm-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
/* 数量列单位后缀 */
.qty-unit { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
</style>
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"/>
        <path d="M8.4 15.6L15.6 8.4"/>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
    <span class="header-sub">中心药房</span>
  </div>
  <div class="header-right">
    <div class="header-user">
      <div class="header-avatar" id="userAvatar">王</div>
      <span class="header-user-name" id="userName">王芳</span>
    </div>
  </div>
</header>

<div class="app-body">
  <!-- ========== 左侧导航 ========== -->
  <aside class="app-side" id="appSide"></aside>
<!-- ========== 主区域 ========== -->
  <main class="app-main">
    <div class="tabbar">
      <div class="tab" onclick="location.href='batch-management.html'">首页</div>
      <div class="tab" onclick="location.href='stock-return.html'">药品退库</div>
      <div class="tab active">
        退库详情
        <button class="tab-close" title="关闭" onclick="location.href='stock-return.html'">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
    </div>

    <div class="page sr-page">
      <div class="sr-card" id="mainCard">
        <!-- 标题行 -->
        <div class="sr-head">
          <button class="back-btn" id="btnBack" title="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="page-title">退库详情</div>
          <span class="sr-code" id="headCode"></span>
          <span class="status-text" id="headStatus"></span>
        </div>

        <!-- 页签：快速定位 -->
        <div class="sr-tabs">
          <div class="page-tabs" id="pageTabs">
            <span class="page-tab active" data-target="secInfo">退库详情</span>
            <span class="page-tab" data-target="secRecords">审批记录</span>
          </div>
        </div>

        <!-- 内容区 -->
        <div class="sr-body" id="detailBody">
          <!-- 退库信息 -->
          <div class="sr-sec" id="secInfo">
            <div class="sr-sec-title">退库信息</div>
            <div class="sr-view">
              <div class="fi"><span class="lbl">退库机构：</span><span class="val" id="vFromOrg"></span></div>
              <div class="fi"><span class="lbl">退库库位：</span><span class="val" id="vFromLocation"></span></div>
              <div class="fi"><span class="lbl">提交人：</span><span class="val" id="vCreator"></span></div>
              <div class="fi"><span class="lbl">提交时间：</span><span class="val" id="vTime"></span></div>

              <div class="fi"><span class="lbl">接收机构：</span><span class="val" id="vToOrg"></span></div>
              <div class="fi"><span class="lbl">接收库位：</span><span class="val" id="vToLocation"></span></div>
              <div class="fi"><span class="lbl">出库单号：</span><span class="val" id="vOutCode"></span></div>
              <div class="fi"><span class="lbl">入库单号：</span><span class="val" id="vInCode"></span></div>
            </div>
          </div>

          <!-- 药品明细 -->
          <div class="sr-sec">
            <div class="sr-sec-title">药品明细</div>
            <div class="sr-items-wrap">
              <table class="sr-items">
                <thead id="itemsHead"></thead>
                <tbody id="itemsBody"></tbody>
              </table>
            </div>
            <div class="sr-sum-line" id="sumLine"></div>
          </div>

          <!-- 审批记录 -->
          <div class="sr-sec" id="secRecords">
            <div class="sr-sec-title">审批记录</div>
            <table class="sr-rec">
              <thead>
                <tr><th style="width:90px">节点</th><th style="width:90px">审批人</th><th style="width:180px">所属机构</th><th style="width:160px">时间</th><th style="width:90px">结果</th><th>意见</th></tr>
              </thead>
              <tbody id="recBody"></tbody>
            </table>
            <div class="sr-empty" id="recEmpty" style="display:none">暂无审批记录</div>
          </div>
        </div>

        <!-- 审批区（仅审核模式渲染） / 底部操作条（出库/入库/返回） -->
        <div id="pageFoot" style="display:contents"></div>
      </div>
    </div>
  </main>
</div>

<!-- ========== 弹窗：录入追溯码（出库） ========== -->
<div class="modal-mask sr-trace" id="traceMask">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="traceTitle">录入追溯码</div>
      <button class="drawer-close" id="traceClose" title="关闭">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="sr-trace-input">
        <input class="input" id="traceInput" placeholder="扫码或手工输入药品追溯码，回车追加" autocomplete="off">
        <button class="btn" id="traceScan">模拟扫码</button>
      </div>
      <div class="sr-trace-tip" id="traceTip">已录入 0 条</div>
      <table class="sr-trace-table">
        <thead>
          <tr><th>药品追溯码</th><th>药品名称</th><th>药品规格</th><th style="width:70px">操作</th></tr>
        </thead>
        <tbody id="traceBody"></tbody>
      </table>
      <div class="sr-trace-empty" id="traceEmpty">暂无追溯码，请扫码录入</div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="traceCancel">取消</button>
      <button class="btn btn-primary" id="traceOk">确定</button>
    </div>
  </div>
</div>

<!-- ========== 抽屉：扫码核对（签收入库） ========== -->
<div class="drawer-mask" id="verifyMask">
  <div class="drawer is-pa" id="verifyDrawer">
    <div class="drawer-head">
      <span class="drawer-title" id="verifyTitle">扫码核对</span>
      <button class="drawer-close" id="verifyClose" title="关闭">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <div class="drawer-body trv-body" id="verifyBody"></div>
    <div class="drawer-foot">
      <button class="btn" id="verifyCancel">取消</button>
      <button class="btn btn-primary" id="verifyOk">确认核对</button>
    </div>
  </div>
</div>

<!-- ========== 抽屉：追溯码明细（只读） ========== -->
<div class="drawer-mask" id="viewMask">
  <div class="drawer is-pa">
    <div class="drawer-head">
      <span class="drawer-title" id="viewTitle">追溯码明细</span>
      <button class="drawer-close" id="viewClose" title="关闭">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <div class="drawer-body trv-body" id="viewBody"></div>
    <div class="drawer-foot">
      <button class="btn" id="viewOk">关闭</button>
    </div>
  </div>
</div>

<!-- ========== 确认弹窗 ========== -->
<div class="modal-mask sr-confirm" id="cfMask">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="cfTitle">提示</div>
      <button class="drawer-close" id="cfClose" title="关闭">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <div class="modal-body"><div class="sr-confirm-desc" id="cfDesc"></div></div>
    <div class="modal-foot">
      <button class="btn" id="cfCancel">取消</button>
      <button class="btn btn-primary" id="cfOk">确定</button>
    </div>
  </div>
</div>

<!-- toast -->
<div id="toast" style="position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:8px 16px;background:rgba(0,0,0,.78);color:#fff;border-radius:4px;font-size:13px;z-index:9999;display:none"></div>

<script src="identity.js"></script>
  <script src="stock-return-common.js"></script>
<script>
(function(){
  "use strict";
  var SR = window.SR;
  var $ = function(s,c){return (c||document).querySelector(s);};
  var $$ = function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));};
  function toast(msg){var t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none";},2200);}

  var user = SR.currentUser();
  $("#userAvatar").textContent = user.name.charAt(0);
  $("#userName").textContent = user.name;

  var mode = SR.qs("mode")==="approve" ? "approve" : "view";
  var id = SR.qs("id");
  var list = SR.load();
  var bill = list.filter(function(b){return b.id===id;})[0];
  if(!bill){ location.href = "stock-return.html"; return; }

  function setV(sel, v){ $(sel).textContent = (v===null||v===undefined||v==="") ? "—" : v; }

  /* ===== 当前页面动作形态 ===== */
  var mine = bill.creatorId === user.id;
  var isOut = bill.auditStatus==="approved" && bill.receiveStatus==="out" && mine;
  var isIn  = bill.auditStatus==="approved" && bill.receiveStatus==="sign" && user.orgId===bill.toOrgId;
  var isApprove = mode==="approve" && SR.canAudit(bill, user);
  var hasTraceCol = isOut || isIn || bill.receiveStatus==="sign" || bill.receiveStatus==="done";

  /* ===== 基本信息渲染 ===== */
  function renderBase(){
    $("#headCode").textContent = "退库单号：" + bill.code;
    $("#headStatus").innerHTML = "<span>审核状态："+SR.esc(SR.AUDIT_STATUS[bill.auditStatus])+"</span><span>接收状态："+SR.esc(SR.RECV[bill.receiveStatus])+"</span>";
    setV("#vFromOrg", SR.orgName(bill.fromOrgId)); setV("#vFromLocation", bill.fromLocation);
    setV("#vToOrg", SR.orgName(bill.toOrgId)); setV("#vToLocation", bill.toLocation);
    setV("#vCreator", bill.creatorName); setV("#vTime", bill.submitTime);
    setV("#vOutCode", bill.outCode ? bill.outCode : "—（出库后生成）");
    setV("#vInCode", bill.inCode ? bill.inCode : "—（入库后生成）");
  }

  /* ===== 药品明细 ===== */
  /* 签收态数量由扫码结果驱动：入库数量=已核合格码数，不合格数量=标记不合格码数 */
  function syncItemQty(it){
    if(!isIn) return;
    it.inQty = (it.verified||[]).length;
    it.unqQty = (it.badCodes||[]).length;
  }
  function renderItems(){
    var cols = [
      ["药品名称","col-drug","150px"],["药品编码","","100px"],["药品规格","","100px"],["生产企业","","180px"],
      ["包装规格","","90px"],["批次号","","96px"],["当前库存量","num","86px"],["退库数量","num","86px"],
      ["进货价","num","84px"],["零售价","num","84px"],["进货价金额合计","num","110px"],["零售价金额合计","num","110px"],["有效期","","96px"]
    ];
    if(isIn || bill.receiveStatus==="done") cols.push(["入库数量","num","92px"],["不合格数量","num","92px"],["不合格原因","","130px"],["追溯码核对","num","96px"]);
    if(hasTraceCol) cols.push([isOut?"追溯码":"操作","col-acts","110px"]);
    $("#itemsHead").innerHTML = "<tr>"+cols.map(function(c){
      return '<th class="'+(c[1]||"")+'" style="width:'+c[2]+'">'+c[0]+'</th>';
    }).join("")+"</tr>";

    $("#itemsBody").innerHTML = (bill.items||[]).map(function(it, i){
      /* 行单位：明细数据缺省时按药品编码回查（兼容旧数据） */
      var unit = it.minUnit || ((SR.drugOf(it.code) || {}).minUnit) || "";
      var h = "<tr>";
      h += '<td class="col-drug cell-ellipsis" title="'+SR.esc(it.name)+'">'+SR.esc(it.name)+'</td>';
      h += "<td>"+SR.esc(it.code)+"</td><td>"+SR.esc(it.spec)+"</td>";
      h += '<td class="cell-ellipsis" title="'+SR.esc(it.vendor)+'">'+SR.esc(it.vendor)+'</td>';
      h += "<td>"+SR.esc(it.packSpec)+"</td><td>"+SR.esc(it.batch)+"</td>";
      h += '<td class="num">'+SR.esc(it.stock)+'</td><td class="num">'+SR.esc(it.qty)+(unit?' <span class="qty-unit">'+SR.esc(unit)+'</span>':"")+"</td>";
      h += '<td class="num">'+SR.num2(it.purchase)+'</td><td class="num">'+SR.num2(it.retail)+'</td>';
      h += '<td class="num">'+SR.num2(SR.purchaseAmt(it))+'</td><td class="num">'+SR.num2(SR.retailAmt(it))+"</td>";
      h += "<td>"+SR.esc(it.expiry)+"</td>";
      var vDone = false;
      if(isIn){
        var v = (it.verified||[]).length, b = (it.badCodes||[]).length, need = (it.traces||[]).length;
        vDone = need>0 && v+b>=need;
        h += '<td class="num">'+v+(unit?' <span class="qty-unit">'+SR.esc(unit)+'</span>':'')+'</td><td class="num"'+(b?' style="color:var(--danger)"':'')+'>'+b+(unit?' <span class="qty-unit">'+SR.esc(unit)+'</span>':'')+'</td>';
        h += '<td>'+SR.esc(it.unqReason||'—')+'</td>';
        h += '<td class="num" style="color:'+(vDone?'var(--success)':v>0?'var(--warning)':'var(--text-tertiary)')+';font-weight:500">'+v+'/'+need+(unit?' '+SR.esc(unit):'')+'</td>';
      } else if(bill.receiveStatus==="done"){
        var vd = Number(it.inQty||0), bd = Number(it.unqQty||0), nd = (it.traces||[]).length || Number(it.qty||0);
        h += '<td class="num">'+SR.esc(it.inQty)+(unit?' <span class="qty-unit">'+SR.esc(unit)+'</span>':'')+'</td><td class="num">'+SR.esc(it.unqQty)+(unit?' <span class="qty-unit">'+SR.esc(unit)+'</span>':'')+'</td><td>'+SR.esc(it.unqReason||'—')+'</td>';
        h += '<td class="num">'+(vd+bd)+'/'+nd+(unit?' '+SR.esc(unit):'')+'</td>';
      }
      if(hasTraceCol){
        if(isOut){
          var n = (it.traces||[]).length;
          h += '<td class="col-acts"><a class="link-btn" data-act="trace" data-idx="'+i+'">录入追溯码</a><span style="font-size:12px;color:var(--text-tertiary);margin-left:6px">'+n+'/'+SR.esc(it.qty)+(unit?' '+SR.esc(unit):'')+'</span></td>';
        } else if(isIn){
          h += '<td class="col-acts"><a class="link-btn" data-act="verify" data-idx="'+i+'">'+(vDone?'查看核对':'扫码核对')+'</a></td>';
        } else {
          h += '<td class="col-acts"><a class="link-btn" data-act="view" data-idx="'+i+'">追溯码明细</a></td>';
        }
      }
      return h + "</tr>";
    }).join("");

    /* 合计条 */
    var s = SR.sums(bill);
    var sh = '共 <b>'+(bill.items||[]).length+'</b> 条明细 · 退库数量合计 <b>'+s.qty+'</b> · 进货价合计金额 <b>'+SR.num2(s.purchase)+'</b> · 零售价合计金额 <b>'+SR.num2(s.retail)+'</b>';
    if(isIn || bill.receiveStatus==="done"){
      var iq=0, uq=0;
      bill.items.forEach(function(it){ syncItemQty(it); iq+=Number(it.inQty||0); uq+=Number(it.unqQty||0); });
      sh += ' · 入库数量合计 <b>'+iq+'</b> · 不合格数量合计 <b>'+uq+'</b>';
    }
    $("#sumLine").innerHTML = sh;

    /* 行内事件 */
    $$("#itemsBody [data-act]").forEach(function(a){
      a.addEventListener("click", function(){
        var i = parseInt(a.getAttribute("data-idx"),10);
        var act = a.getAttribute("data-act");
        if(act==="trace") openTrace(i);
        else if(act==="verify") openVerify(i);
        else openView(i);
      });
    });
  }

  /* ===== 审批记录 ===== */
  function renderRecords(){
    var rs = bill.records || [];
    $("#recEmpty").style.display = rs.length ? "none" : "block";
    $("#recBody").innerHTML = rs.map(function(r){
      return "<tr><td>"+SR.esc(r.node)+"</td><td>"+SR.esc(r.person)+"</td><td>"+SR.esc(r.org)+"</td>"
        +"<td>"+SR.esc(r.time)+"</td><td>"+SR.esc(r.result)+"</td>"
        +"<td class='op-cell'>"+SR.esc(r.opinion)+"</td></tr>";
    }).join("");
  }

  /* ===== 底部：审批区 / 出库条 / 入库条 / 返回 ===== */
  function renderFoot(){
    var foot = $("#pageFoot");
    if(isApprove){
      foot.innerHTML =
        '<div class="sr-approve">'
        +'<div class="ap-radios">'
        +'<label class="radio"><input type="radio" name="apResult" value="通过" checked><span>通过</span></label>'
        +'<label class="radio"><input type="radio" name="apResult" value="拒绝"><span>拒绝</span></label>'
        +'</div>'
        +'<textarea class="textarea" id="apOpinion" rows="2" placeholder="请输入审批意见（拒绝时必填）"></textarea>'
        +'<div class="ap-btns"><button class="btn" id="apCancel">取消</button>'
        +'<button class="btn btn-primary" id="apSubmit">提交</button></div>'
        +'</div>';
      $$('input[name="apResult"]').forEach(function(r){
        r.addEventListener("change", function(){ $("#apOpinion").classList.remove("is-invalid"); });
      });
      $("#apOpinion").addEventListener("input", function(){ this.classList.remove("is-invalid"); });
      $("#apCancel").addEventListener("click", function(){ location.href = "stock-return.html"; });
      $("#apSubmit").addEventListener("click", onApprove);
      return;
    }
    if(isOut){
      foot.innerHTML = '<div class="sr-foot"><button class="btn" id="ftCancel">取消</button><button class="btn btn-primary" id="ftOut">出库</button></div>';
      $("#ftCancel").addEventListener("click", function(){ location.href = "stock-return.html"; });
      $("#ftOut").addEventListener("click", onOut);
      return;
    }
    if(isIn){
      foot.innerHTML = '<div class="sr-foot"><button class="btn" id="ftCancel">取消</button><button class="btn btn-primary" id="ftIn">入库</button></div>';
      $("#ftCancel").addEventListener("click", function(){ location.href = "stock-return.html"; });
      $("#ftIn").addEventListener("click", onIn);
      return;
    }
    if(bill.receiveStatus==="done"){
      foot.innerHTML = '<div class="sr-foot"><button class="btn" id="ftBack">返回</button></div>';
      $("#ftBack").addEventListener("click", function(){ location.href = "stock-return.html"; });
      return;
    }
    foot.innerHTML = "";
  }

  /* ===== 审批提交 ===== */
  function onApprove(){
    var result = $('input[name="apResult"]:checked').value;
    var opinion = $("#apOpinion").value.trim();
    if(result==="拒绝" && !opinion){
      $("#apOpinion").classList.add("is-invalid");
      toast("拒绝时必须填写审批意见");
      return;
    }
    var now = SR.fmtNow();
    if(result==="拒绝"){
      bill.auditStatus = "rejected";
    } else if(bill.auditStatus==="upper"){
      /* 上级机构 == 接收机构时跳过接收机构审核 */
      if(SR.upperOrgOf(bill.fromOrgId) === bill.toOrgId){
        bill.auditStatus = "approved"; bill.receiveStatus = "out";
      } else {
        bill.auditStatus = "receiver";
      }
    } else if(bill.auditStatus==="receiver"){
      bill.auditStatus = "approved"; bill.receiveStatus = "out";
    }
    bill.records.push({ node:"审核", person:user.name, org:SR.orgName(user.orgId), time:now, result:result, opinion:opinion });
    SR.save(list);
    toast(result==="通过" ? "已通过" : "已拒绝");
    isApprove = false; mine = bill.creatorId === user.id;
    isOut = bill.auditStatus==="approved" && bill.receiveStatus==="out" && mine;
    isIn  = bill.auditStatus==="approved" && bill.receiveStatus==="sign" && user.orgId===bill.toOrgId;
    hasTraceCol = isOut || isIn || bill.receiveStatus==="sign" || bill.receiveStatus==="done";
    renderBase(); renderItems(); renderRecords(); renderFoot();
  }

  /* ===== 出库 ===== */
  function onOut(){
    var lack = [];
    bill.items.forEach(function(it, i){
      if((it.traces||[]).length !== Number(it.qty||0)) lack.push("第"+(i+1)+"行（已录 "+(it.traces||[]).length+" / 退库数量 "+it.qty+"）");
    });
    if(lack.length){ toast("追溯码数量不足：" + lack.slice(0,2).join("、") + (lack.length>2?" 等":"")); return; }
    confirmDlg("确认出库", "确认出库后系统将自动生成出库单并扣减退库方库存，是否继续？", "确认出库", false, function(){
      var now = SR.fmtNow();
      bill.outCode = SR.newCode(list, "CK", "outCode");
      bill.outTime = now;
      bill.receiveStatus = "sign";
      bill.records.push({ node:"出库", person:user.name, org:SR.orgName(bill.fromOrgId), time:now, result:"已出库", opinion:"出库单号："+bill.outCode });
      SR.save(list);
      toast("已出库，出库单号：" + bill.outCode);
      isOut = false; hasTraceCol = true;
      renderBase(); renderItems(); renderRecords(); renderFoot();
    });
  }

  /* ===== 入库 ===== */
  function onIn(){
    var errs = [], anyScan = false;
    bill.items.forEach(function(it, i){
      var n = "第"+(i+1)+"行";
      var v = (it.verified||[]).length, b = (it.badCodes||[]).length;
      if(v + b > 0) anyScan = true;
      if(b > 0 && !it.unqReason) errs.push(n+"不合格原因");
    });
    if(!anyScan){ toast("请先扫码核对追溯码后再入库"); return; }
    if(errs.length){ toast("请完善：" + errs.slice(0,2).join("、") + (errs.length>2?" 等":"")); return; }
    confirmDlg("确认入库", "确认入库后系统将自动生成入库单，接收方按合格数量增加库存，少发、多发差异将随核对结果回传出库方，是否继续？", "确认入库", false, function(){
      var now = SR.fmtNow();
      bill.inCode = SR.newCode(list, "RK", "inCode");
      bill.inTime = now;
      bill.receiveStatus = "done";
      var uq = 0, lack = 0, extra = 0;
      bill.items.forEach(function(it){
        syncItemQty(it);
        uq += Number(it.unqQty||0);
        var v = (it.verified||[]).length, b = (it.badCodes||[]).length, need = (it.traces||[]).length;
        if(need > v + b) lack += need - v - b;
        extra += (it.extraCodes||[]).length + (it.unknownExtras||[]).length;
      });
      bill.records.push({ node:"入库", person:user.name, org:SR.orgName(bill.toOrgId), time:now, result:"已入库",
        opinion: "入库单号："+bill.inCode
          + (uq>0 ? "；不合格 "+uq+"（线下处理）" : "")
          + (lack>0 ? "；少发 "+lack+"（差异已回传）" : "")
          + (extra>0 ? "；非本单码 "+extra+"（已登记差异）" : "") });
      SR.save(list);
      toast("已入库，入库单号：" + bill.inCode);
      isIn = false; hasTraceCol = true;
      renderBase(); renderItems(); renderRecords(); renderFoot();
    });
  }

  /* ===== 确认弹窗 ===== */
  var cfCb = null;
  function confirmDlg(title, desc, okText, danger, cb){
    $("#cfTitle").textContent = title; $("#cfDesc").textContent = desc;
    var ok = $("#cfOk"); ok.textContent = okText; ok.className = danger ? "btn btn-danger" : "btn btn-primary";
    cfCb = cb; $("#cfMask").classList.add("show");
  }
  function closeCf(){ $("#cfMask").classList.remove("show"); cfCb=null; }
  $("#cfCancel").addEventListener("click", closeCf);
  $("#cfClose").addEventListener("click", closeCf);
  $("#cfOk").addEventListener("click", function(){ var cb=cfCb; closeCf(); if(cb) cb(); });

  /* ===== 录入追溯码弹窗（出库） ===== */
  var traceIdx = -1, traceDraft = [];
  function renderTrace(){
    var it = bill.items[traceIdx];
    $("#traceTip").textContent = "已录入 "+traceDraft.length+" 条 / 退库数量 "+it.qty;
    $("#traceEmpty").style.display = traceDraft.length ? "none" : "block";
    $("#traceBody").innerHTML = traceDraft.map(function(t, i){
      return '<tr><td>'+SR.esc(t)+'</td><td>'+SR.esc(it.name)+'</td><td>'+SR.esc(it.spec)+'</td>'
        +'<td><a class="link-btn is-danger" data-ti="'+i+'">删除</a></td></tr>';
    }).join("");
    $$("#traceBody [data-ti]").forEach(function(a){
      a.addEventListener("click",function(){ traceDraft.splice(parseInt(a.getAttribute("data-ti"),10),1); renderTrace(); });
    });
  }
  function openTrace(i){
    traceIdx = i;
    traceDraft = (bill.items[i].traces||[]).slice();
    $("#traceTitle").textContent = "录入追溯码 — " + bill.items[i].name + " " + bill.items[i].spec;
    $("#traceInput").value = "";
    renderTrace();
    $("#traceMask").classList.add("show");
    setTimeout(function(){ $("#traceInput").focus(); }, 50);
  }
  function closeTrace(){ $("#traceMask").classList.remove("show"); traceIdx=-1; traceDraft=[]; }
  function appendTrace(code){
    var it = bill.items[traceIdx];
    code = (code||"").trim();
    if(!code) return;
    if(traceDraft.indexOf(code)>=0){ toast("该追溯码已录入，请勿重复"); return; }
    if(traceDraft.length >= Number(it.qty)){ toast("追溯码数量不能超过退库数量"); return; }
    traceDraft.push(code);
    $("#traceInput").value = "";
    renderTrace();
  }
  $("#traceInput").addEventListener("keydown", function(e){ if(e.key==="Enter"){ appendTrace(this.value); } });
  $("#traceScan").addEventListener("click", function(){
    var it = bill.items[traceIdx];
    var pool = SR.traceCodes(it.batch, Number(it.qty));
    for(var i=0;i<pool.length;i++){
      if(traceDraft.indexOf(pool[i])<0){ appendTrace(pool[i]); return; }
    }
    toast("追溯码已录满");
  });
  $("#traceClose").addEventListener("click", closeTrace);
  $("#traceCancel").addEventListener("click", closeTrace);
  $("#traceOk").addEventListener("click", function(){
    if(traceIdx>=0) bill.items[traceIdx].traces = traceDraft.slice();
    closeTrace(); renderItems(); toast("追溯码已保存");
  });

  /* ===== 扫码核对弹窗（签收入库，与调拨入库同款交互） ===== */
  var vfIdx = -1, vfMode = "verify";
  function vState(it, t){
    if((it.badCodes||[]).indexOf(t)>=0) return "bad";
    if((it.verified||[]).indexOf(t)>=0) return "ok";
    return "pending";
  }
  function vChip(t, st){
    var cls = "tr-code-chip" + (st==="ok" ? " is-ok" : st==="bad" ? " is-bad" : st==="extra" ? " is-extra" : "");
    return '<span class="'+cls+'" data-code="'+SR.esc(t)+'" data-st="'+st+'" title="'+SR.esc(t)+'">'+SR.esc(t)+'</span>';
  }
  function vAddExtra(it, code){
    it.extraCodes = it.extraCodes||[];
    it.unknownExtras = it.unknownExtras||[];
    if(code.indexOf("TRC"+it.batch)===0){
      if(it.extraCodes.indexOf(code)>=0){ toast("该追溯码已在非本单码列表中"); return; }
      it.extraCodes.push(code);
      toast("已登记为非本单码（本批次）");
    } else {
      if(it.unknownExtras.indexOf(code)>=0){ toast("该追溯码已在非本单码列表中"); return; }
      it.unknownExtras.push(code);
      toast("已登记为非本单码（未识别批次）");
    }
  }
  function vVerify(it, code){
    if((it.traces||[]).indexOf(code)<0){ vAddExtra(it, code); return; }
    var st = vState(it, code);
    if(st==="bad"){
      it.badCodes.splice(it.badCodes.indexOf(code),1);
      it.verified.push(code);
      toast("已恢复合格并核对");
    } else if(st==="ok"){
      toast("该追溯码已核对");
    } else {
      it.verified.push(code);
    }
  }
  function vBad(it, code){
    if((it.traces||[]).indexOf(code)<0){ vAddExtra(it, code); return; }
    var st = vState(it, code);
    if(st==="bad"){ toast("该追溯码已标记为不合格"); return; }
    if(st==="ok") it.verified.splice(it.verified.indexOf(code),1);
    it.badCodes.push(code);
    if(!it.unqReason) it.unqReason = SR.REASONS[0];
  }
  function vUndo(it, code){
    var at = (it.badCodes||[]).indexOf(code);
    if(at>=0){ it.badCodes.splice(at,1); return; }
    at = (it.verified||[]).indexOf(code);
    if(at>=0){ it.verified.splice(at,1); return; }
    at = (it.extraCodes||[]).indexOf(code);
    if(at>=0){ it.extraCodes.splice(at,1); return; }
    at = (it.unknownExtras||[]).indexOf(code);
    if(at>=0){ it.unknownExtras.splice(at,1); return; }
    toast("未找到该追溯码的核对记录");
  }
  function renderVerify(){
    var it = bill.items[vfIdx];
    if(!it) return;
    it.verified = it.verified||[]; it.badCodes = it.badCodes||[];
    it.extraCodes = it.extraCodes||[]; it.unknownExtras = it.unknownExtras||[];
    var need = (it.traces||[]).length;
    var extraN = it.extraCodes.length + it.unknownExtras.length;
    var modeBtn = function(m,label){ return '<span class="trv-mode'+(vfMode===m?' is-active':'')+'" data-mode="'+m+'">'+label+'</span>'; };

    var chips = (it.traces||[]).map(function(t){ return vChip(t, vState(it,t)); }).join("");
    chips += it.extraCodes.map(function(t){ return vChip(t,"extra"); }).join("");
    if(!chips) chips = '<span class="sr-trace-empty">该批次暂无追溯码</span>';
    var group =
      '<div class="tr-code-group"><div class="tr-code-head"><b>批次 '+SR.esc(it.batch)+
      ' <span class="tr-code-exp">· 效期 '+SR.esc(it.expiry||'—')+'</span></b>'+
      '<span class="count">已核 '+it.verified.length+'/'+need+' · 不合格 '+it.badCodes.length+
      (it.extraCodes.length ? ' · 非本单码 '+it.extraCodes.length : '')+'</span></div>'+
      '<div class="tr-code-chips">'+chips+'</div></div>';
    if(it.unknownExtras.length){
      group += '<div class="tr-code-group"><div class="tr-code-head"><b>未识别批次</b>'+
        '<span class="count">非本单码 '+it.unknownExtras.length+'</span></div>'+
        '<div class="tr-code-chips">'+it.unknownExtras.map(function(t){ return vChip(t,"extra"); }).join('')+'</div></div>';
    }

    $("#verifyBody").innerHTML =
      '<div class="trv-stats">'
        +'<div class="trv-stat"><span class="label">应到码数</span><b>'+need+'</b></div>'
        +'<div class="trv-stat is-ok"><span class="label">已核码数</span><b>'+it.verified.length+'</b></div>'
        +'<div class="trv-stat is-bad"><span class="label">不合格</span><b>'+it.badCodes.length+'</b></div>'
        +'<div class="trv-stat is-extra"><span class="label">非本单码</span><b>'+extraN+'</b></div>'
      +'</div>'
      +'<div class="tr-scan-input">'
        +'<div class="trv-modes">'+modeBtn("verify","扫码核对")+modeBtn("bad","标记不合格")+modeBtn("undo","撤销扫码")+'</div>'
        +'<input class="input" id="verifyInput" placeholder="'+(vfMode==="undo"?'扫描需撤销的追溯码后回车':'扫描或输入追溯码后回车')+'" autocomplete="off">'
        +'<button class="btn" id="verifyAdd">录入</button>'
      +'</div>'
      +'<div class="trv-reason"><span class="label">不合格原因</span><select class="select" id="verifyReason">'
        +'<option value="">请选择</option>'
        +SR.REASONS.map(function(r){ return '<option'+(r===it.unqReason?' selected':'')+'>'+r+'</option>'; }).join("")
      +'</select></div>'
      +'<div class="trv-legend">'
        +'<span><i style="background:#D9D9D9;"></i>未扫码</span>'
        +'<span><i style="background:#52C41A;"></i>核对无误</span>'
        +'<span><i style="background:#FF4D4F;"></i>不合格</span>'
        +'<span><i style="background:#FA8C16;"></i>非本单码</span>'
      +'</div>'
      + group;

    var input = $("#verifyInput");
    function submit(){
      var code = input.value.trim().toUpperCase();
      if(!code) return;
      if(vfMode==="undo") vUndo(it, code);
      else if(vfMode==="bad") vBad(it, code);
      else vVerify(it, code);
      input.value = "";
      syncItemQty(it);
      renderVerify();
      renderItems();
      setTimeout(function(){ var el=$("#verifyInput"); if(el) el.focus(); },0);
    }
    input.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); submit(); } });
    $("#verifyAdd").addEventListener("click", submit);
    $$("#verifyBody .trv-mode").forEach(function(btn){
      btn.addEventListener("click", function(){
        vfMode = btn.getAttribute("data-mode");
        renderVerify();
        setTimeout(function(){ var el=$("#verifyInput"); if(el) el.focus(); },0);
      });
    });
    $("#verifyReason").addEventListener("change", function(){ it.unqReason = this.value; renderItems(); });
    $("#verifyBody").onclick = function(e){
      var chip = e.target.closest("[data-code]");
      if(!chip) return;
      var code = chip.getAttribute("data-code");
      var st = chip.getAttribute("data-st");
      if(vfMode==="bad"){
        /* 标记不合格模式：点标签直接标记/取消不合格 */
        if(st==="bad"){ it.badCodes.splice(it.badCodes.indexOf(code),1); }
        else if(st==="pending"){ it.badCodes.push(code); if(!it.unqReason) it.unqReason = SR.REASONS[0]; }
        else if(st==="ok"){ it.verified.splice(it.verified.indexOf(code),1); it.badCodes.push(code); if(!it.unqReason) it.unqReason = SR.REASONS[0]; }
      } else if(vfMode==="undo"){
        /* 撤销扫码模式：点标签撤销当前状态 */
        if(st==="bad"){ it.badCodes.splice(it.badCodes.indexOf(code),1); }
        else if(st==="ok"){ it.verified.splice(it.verified.indexOf(code),1); }
        else if(st==="extra"){
          var p2 = it.extraCodes.indexOf(code);
          if(p2>=0) it.extraCodes.splice(p2,1);
          else { var q2 = it.unknownExtras.indexOf(code); if(q2>=0) it.unknownExtras.splice(q2,1); }
        }
      } else {
        /* 扫码核对模式：待核对→核对；已核对→撤销；不合格→恢复合格并核对 */
        vVerify(it, code);
        syncItemQty(it);
        renderVerify();
        renderItems();
        return;
      }
      syncItemQty(it);
      renderVerify();
      renderItems();
    };
    setTimeout(function(){ input.focus(); }, 50);
  }
  function openVerify(i){
    vfIdx = i; vfMode = "verify";
    var it = bill.items[i];
    it.verified = it.verified||[]; it.badCodes = it.badCodes||[];
    it.extraCodes = it.extraCodes||[]; it.unknownExtras = it.unknownExtras||[];
    $("#verifyTitle").textContent = "扫码核对 — " + it.name + " " + it.spec;
    renderVerify();
    document.body.classList.add("drawer-open");
  }
  function closeVerify(){ document.body.classList.remove("drawer-open"); vfIdx=-1; vfMode="verify"; }
  $("#verifyMask").addEventListener("click", function(e){ if(e.target === this) closeVerify(); });
  $("#verifyClose").addEventListener("click", closeVerify);
  $("#verifyCancel").addEventListener("click", closeVerify);
  $("#verifyOk").addEventListener("click", function(){
    closeVerify(); renderItems();
    toast("核对结果已确认；少发、多发差异将随入库结果回传出库方");
  });

  /* ===== 追溯码明细抽屉（只读，与调拨详情同款四色展示） ===== */
  function openView(i){
    var it = bill.items[i];
    it.verified = it.verified||[]; it.badCodes = it.badCodes||[];
    it.extraCodes = it.extraCodes||[]; it.unknownExtras = it.unknownExtras||[];
    $("#viewTitle").textContent = "追溯码明细 — " + it.name + " " + it.spec;
    var ts = it.traces || [];
    var okN = it.verified.length, badN = it.badCodes.length;
    var extraN = it.extraCodes.length + it.unknownExtras.length;
    function chip(c, st){
      var cls = "tr-code-chip" + (st==="ok"?" is-ok":st==="bad"?" is-bad":st==="extra"?" is-extra":"");
      return '<span class="'+cls+'">'+SR.esc(c)+"</span>";
    }
    var chips = ts.map(function(t){
      var st = it.badCodes.indexOf(t)>=0 ? "bad" : it.verified.indexOf(t)>=0 ? "ok" : "pending";
      return chip(t, st);
    }).join("") + it.extraCodes.map(function(c){ return chip(c,"extra"); }).join("");
    if(!chips) chips = '<span class="tr-code-empty">该药品暂未录入追溯码</span>';
    var stat = "已核 " + okN + "/" + ts.length + (badN ? " · 不合格 " + badN : "") + (extraN ? " · 非本单码 " + extraN : "");
    $("#viewBody").innerHTML =
      '<div class="trv-stats">' +
        '<div class="trv-stat"><span class="label">出库码数</span><b>'+ts.length+'</b></div>' +
        '<div class="trv-stat is-ok"><span class="label">已核码数</span><b>'+okN+'</b></div>' +
        '<div class="trv-stat is-bad"><span class="label">不合格</span><b>'+badN+'</b></div>' +
        '<div class="trv-stat is-extra"><span class="label">非本单码</span><b>'+extraN+'</b></div>' +
      '</div>' +
      (badN > 0 ? '<div class="trv-badline">不合格原因：<b>'+SR.esc(it.unqReason||"未填写")+'</b></div>' : "") +
      '<div class="trv-legend">' +
        '<span><i style="background:#D9D9D9;"></i>未扫码</span>' +
        '<span><i style="background:#52C41A;"></i>核对无误</span>' +
        '<span><i style="background:#FF4D4F;"></i>不合格</span>' +
        '<span><i style="background:#FA8C16;"></i>非本单码</span>' +
      '</div>' +
      '<div class="tr-code-group">' +
        '<div class="tr-code-head"><b>批次 '+SR.esc(it.batch)+'</b><span class="count">'+stat+'</span></div>' +
        '<div class="tr-code-chips">'+chips+'</div>' +
      '</div>';
    document.body.classList.add("view-open");
  }
  function closeView(){ document.body.classList.remove("view-open"); }
  $("#viewClose").addEventListener("click", closeView);
  $("#viewOk").addEventListener("click", closeView);

  /* ===== 页签定位滚动 ===== */
  $$("#pageTabs .page-tab").forEach(function(t){
    t.addEventListener("click", function(){
      var sec = $("#"+t.getAttribute("data-target"));
      if(!sec) return;
      var body = $("#detailBody");
      body.scrollTo({ top: sec.offsetTop - body.offsetTop - 12, behavior: "auto" });
    });
  });
  $("#detailBody").addEventListener("scroll", function(){
    var body = this;
    var atBottom = body.scrollTop >= body.scrollHeight - body.clientHeight - 2;
    var target = "secInfo";
    if(atBottom || $("#secRecords").getBoundingClientRect().top <= body.getBoundingClientRect().top + 120) target = "secRecords";
    $$("#pageTabs .page-tab").forEach(function(t){ t.classList.toggle("active", t.getAttribute("data-target")===target); });
  });

  $("#btnBack").addEventListener("click", function(){ location.href = "stock-return.html"; });

  /* ===== 初始化 ===== */
  renderBase(); renderItems(); renderRecords(); renderFoot();
})();
</script>
