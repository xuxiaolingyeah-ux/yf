<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业管理 · 中心药房</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"></rect>
        <path d="M8.4 15.6L15.6 8.4"></path>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <div class="header-user">
      <div class="header-avatar">张</div>
      <span class="header-user-name">张明远</span>
    </div>
  </div>
</header>

<div class="app-body">
  <!-- ========== 左侧导航 ========== -->
  <aside class="app-side" id="appSide"></aside>
<!-- ========== 主区域 ========== -->
  <main class="app-main">
    <div class="tabbar">
      <div class="tab" onclick="location.href='drug-catalog.html'">首页</div>
      <div class="tab active">
        企业管理
        <button class="tab-close" title="关闭" onclick="location.href='drug-catalog.html'">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M5 5l14 14M19 5L5 19"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="page">
      <div class="page-head">
        <h1 class="page-title">企业管理</h1>
        <div class="page-acts">
          <button class="btn" id="btnBlack">黑名单管理</button>
          <button class="btn btn-primary" id="btnAdd">新增企业</button>
        </div>
      </div>

      <div class="sel-card">
        <div class="filter-bar mf-filter" id="filterBar">
            <div class="mf-fi">
              <span class="lbl">企业名称：</span>
              <input class="input" id="fltName" placeholder="请输入企业名称" autocomplete="off">
            </div>
            <div class="mf-fi">
              <span class="lbl">企业类型：</span>
              <select class="select" id="fltType">
                <option value="">请选择企业类型</option>
                <option value="供应商">供应商</option>
                <option value="生产企业">生产企业</option>
                <option value="生产企业+供应商">生产企业+供应商</option>
              </select>
            </div>
            <div class="mf-fi mf-more is-hidden">
              <span class="lbl">企业分类：</span>
              <select class="select" id="fltCategory">
                <option value="">请选择企业分类</option>
                <option value="物资">物资</option>
                <option value="药品">药品</option>
                <option value="药品+物资">药品+物资</option>
              </select>
            </div>
            <div class="mf-fi" id="shelfFilter">
              <span class="lbl">启用状态：</span>
              <div class="mf-radios">
                <label class="mf-radio"><input type="radio" name="fltShelf" value="all" checked>全部</label>
                <label class="mf-radio"><input type="radio" name="fltShelf" value="on">启用</label>
                <label class="mf-radio"><input type="radio" name="fltShelf" value="off">停用</label>
              </div>
            </div>
            <div class="filter-acts">
              <button class="btn btn-sm" id="btnReset">重置</button>
              <button class="btn btn-sm btn-primary" id="btnSearch">查询</button>
              <button class="mf-toggle" id="btnExpand">
                展开
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 9l6 6 6-6"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- 企业管理 -->
          <div class="mf-table-wrap" id="paneVendor" style="padding:0 16px;">
            <table class="data-table mf-table">
              <colgroup>
                <col style="width:56px"><col style="width:104px"><col style="width:180px"><col style="width:110px">
                <col style="width:140px"><col style="width:100px"><col style="width:100px"><col style="width:116px">
                <col style="width:96px"><col style="width:150px">
              </colgroup>
              <thead>
                <tr>
                  <th>序号</th><th>企业编码</th><th>企业名称</th><th>企业简称</th>
                  <th>企业类型</th><th>企业分类</th><th>授权人姓名</th><th>手机号码</th>
                  <th>启用状态</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="listBody"></tbody>
            </table>
          </div>

          <div class="mf-pager">
            <span>共 <b id="totalNum">0</b> 条</span>
            <div class="ctrl">
              <button class="pager-btn" id="pagePrev">‹</button>
              <span id="pageNums"></span>
              <button class="pager-btn" id="pageNext">›</button>
              <select class="select mf-size" id="pageSize">
                <option value="15">15条/页</option>
                <option value="30">30条/页</option>
                <option value="50">50条/页</option>
              </select>
              <span>跳至第</span>
              <input class="input mf-jump" id="pageJump" value="1">
              <span>页</span>
            </div>
          </div>
      </div>
    </div>
  </main>
</div>

<!-- ========== 抽屉：新增 / 更新 / 详情 ========== -->
<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer is-edit" id="drawer">

    <button class="mf-tab active" data-tab="info">企业信息</button>
    <button class="mf-tab" data-tab="qual">资质信息</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>

<!-- ========== 通用弹窗 ========== -->
<div class="modal-mask" id="modalMask"></div>

<!-- ========== Toast ========== -->

    <path d="M20 6L9 17l-5-5"></path>
  </svg>

  function toPyCode(text) {
    var out = "";
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (/[0-9A-Za-z]/.test(ch)) out += ch.toUpperCase();
      else if (PY_MAP[ch]) out += PY_MAP[ch];
    }
    return out;
  }

  /* ================= Mock 数据 ================= */
  function blankQual() {
    var q = {};
    QUAL_SECTIONS.forEach(function (s) { q[s.k] = { no: "", from: "", to: "", forever: false, img: false }; });
    return q;
  }

  function makeVendor(o) {
    var v = {
      code: "", name: "", py: "", shortName: "", type: "", category: "", classType: "", province: "",
      address: "", capital: "", legalName: "", legalId: "", authName: "", authId: "", authPhone: "",
      contactName: "", contactId: "", contactTitle: "", contactPhone: "", bankAccount: "", bankName: "",
      website: "", fax: "", email: "", intro: "", remark: "",
      shelf: "停用", black: false, blackAt: "", blackReason: "",
      multiCert: "否", qual: blankQual()
    };
    Object.keys(o || {}).forEach(function (k) { v[k] = o[k]; });
    if (!v.py && v.name) v.py = toPyCode(v.name);
    return v;
  }

  var DATA_KEY = "MF_VENDORS_V4";
  var DATA = [];

  function loadData() {
    try {
      var raw = sessionStorage.getItem(DATA_KEY);
      if (raw) { DATA = JSON.parse(raw); return; }
    } catch (e) { /* ignore */ }
    DATA = SEED.map(function (o, i) {
      var base = makeVendor(o);
      if (i === 0) {
        Object.keys(SEED_DETAIL).forEach(function (k) { base[k] = SEED_DETAIL[k]; });
      }
      return base;
    });
  }
  function saveData() {
    try { sessionStorage.setItem(DATA_KEY, JSON.stringify(DATA)); } catch (e) { /* ignore */ }
  }

  /* ================= 状态 ================= */
  var ST = {
    filters: { kw: "", type: "", category: "", shelf: "all" },
    expanded: false,
    page: 1,
    size: 15,
    dw: null                 // 抽屉状态
  };

  function findVendor(code) {
    return DATA.filter(function (v) { return v.code === code; })[0] || null;
  }

  function filtered() {
    var f = ST.filters;
    return DATA.filter(function (v) {
      if (v.black) return false;
      if (f.kw) {
        var kw = f.kw.toLowerCase();
        var hay = [v.name, v.code, v.py, v.shortName].join("|").toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      if (f.type && v.type !== f.type) return false;
      if (f.category && v.category !== f.category) return false;
      if (f.shelf === "on" && v.shelf !== "启用") return false;
      if (f.shelf === "off" && v.shelf === "启用") return false;
      return true;
    });
  }

  /* ================= 列表渲染 ================= */
  function statusCell(text, kind) {
    if (!text) return '<span class="mf-status">—</span>';
    return '<span class="mf-status"><i class="dot ' + kind + '"></i>' + esc(text) + "</span>";
  }

  function renderList() {
    var rows = filtered();
    var start = (ST.page - 1) * ST.size;
    var pageRows = rows.slice(start, start + ST.size);
    renderVendorRows(pageRows, start);
    renderPager(rows.length);
  }

  function renderVendorRows(pageRows, start) {
    var body = $("listBody");
    if (!pageRows.length) {
      body.innerHTML = '<tr><td colspan="10" class="table-empty">暂无数据</td></tr>';
      return;
    }
    body.innerHTML = pageRows.map(function (v, i) {
      var on = v.shelf === "启用";
      var acts = "";
      acts += on
        ? '<button class="link-btn" data-act="off" data-id="' + esc(v.code) + '">停用</button>'
        : '<button class="link-btn" data-act="on" data-id="' + esc(v.code) + '">启用</button>';
      if (!on) acts += '<button class="link-btn" data-act="edit" data-id="' + esc(v.code) + '">更新</button>';
      acts += '<button class="link-btn" data-act="view" data-id="' + esc(v.code) + '">详情</button>';
      acts += '<button class="link-btn is-danger" data-act="del" data-id="' + esc(v.code) + '">删除</button>';

      return "<tr>"
        + "<td>" + (start + i + 1) + "</td>"
        + "<td>" + esc(v.code) + "</td>"
        + "<td title=\"" + esc(v.name) + "\">" + (v.name ? esc(v.name) : "—") + "</td>"
        + "<td>" + (v.shortName ? esc(v.shortName) : "—") + "</td>"
        + "<td>" + (v.type ? esc(v.type) : "—") + "</td>"
        + "<td>" + (v.category ? esc(v.category) : "—") + "</td>"
        + "<td>" + (v.authName ? esc(v.authName) : "—") + "</td>"
        + "<td>" + (v.authPhone ? esc(v.authPhone) : "—") + "</td>"
        + "<td>" + statusCell(v.shelf, on ? "on" : "off") + "</td>"
        + '<td><div class="mf-acts">' + acts + "</div></td>"
        + "</tr>";
    }).join("");
  }

  function renderPager(total) {
    var pages = Math.max(1, Math.ceil(total / ST.size));
    if (ST.page > pages) ST.page = pages;
    if (ST.page < 1) ST.page = 1;
    $("totalNum").textContent = total;

    var nums = "";
    var from = 1, to = pages;
    if (pages > 7) {
      from = Math.max(1, ST.page - 2);
      to = Math.min(pages, from + 4);
      from = Math.max(1, to - 4);
    }
    for (var p = from; p <= to; p++) {
      nums += '<button class="pager-num' + (p === ST.page ? " is-cur" : "") + '" data-page="' + p + '">' + p + "</button>";
    }
    if (from > 1) nums = '<button class="pager-num" data-page="1">1</button><span>…</span>' + nums;
    if (to < pages) nums = nums + "<span>…</span>" + '<button class="pager-num" data-page="' + pages + '">' + pages + "</button>";
    $("pageNums").innerHTML = nums;

    $("pagePrev").disabled = ST.page <= 1;
    $("pageNext").disabled = ST.page >= pages;
    $("pageJump").value = ST.page;
  }

  /* ================= 抽屉 ================= */
  var DW_TITLE = { create: "新增企业", edit: "企业更新", detail: "企业详情" };

  function openDrawer(mode, code) {
    var v = code ? findVendor(code) : null;
    if (mode !== "create" && !v) return;
    var draft;
    if (mode === "create") {
      draft = makeVendor({});
    } else {
      draft = JSON.parse(JSON.stringify(v));
    }
    ST.dw = { mode: mode, code: code || null, tab: "info", draft: draft, dirty: false };
    $("drawerTitle").textContent = DW_TITLE[mode];
    renderDrawer();
    document.body.classList.add("drawer-open");
  }

  function renderDrawer() {
    var dw = ST.dw;
    // 页签
    Array.prototype.forEach.call(document.querySelectorAll(".mf-tab"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === dw.tab);
    });
    $("drawerBody").innerHTML = dw.tab === "info" ? renderInfoTab() : renderQualTab();
    renderDrawerFoot();
  }

  function renderInfoTab() {
    var dw = ST.dw, v = dw.draft, detail = dw.mode === "detail";
    if (detail) {
      return '<div class="mf-view">' + INFO_FIELDS.map(function (f) {
        var val = v[f.k];
        var text = val ? esc(val) : "—";
        return '<div class="fi' + (f.span ? " span-2" : "") + '"><span class="lbl">' + esc(f.label) + '：</span>'
          + '<span class="val">' + text + '</span></div>';
      }).join("") + "</div>";
    }

    return '<div class="mf-form">' + INFO_FIELDS.map(function (f) {
      var val = v[f.k] === null || v[f.k] === undefined ? "" : v[f.k];
      var label = '<span class="lbl">' + (f.req ? '<span class="req">*</span>' : "") + esc(f.label) + '：</span>';
      var ctrl;
      if (f.kind === "select") {
        ctrl = '<select class="select" data-k="' + f.k + '"><option value="">' + esc(f.ph) + "</option>"
          + f.opts.map(function (o) {
            return '<option value="' + esc(o) + '"' + (val === o ? " selected" : "") + ">" + esc(o) + "</option>";
          }).join("") + "</select>";
      } else if (f.kind === "textarea") {
        ctrl = '<textarea class="textarea" data-k="' + f.k + '" placeholder="' + esc(f.ph) + '">' + esc(val) + "</textarea>";
      } else {
        ctrl = '<input class="input" data-k="' + f.k + '" value="' + esc(val) + '" placeholder="' + esc(f.ph) + '" autocomplete="off">';
      }
      return '<div class="fi' + (f.span ? " span-2" : "") + '">' + label + '<div class="ctrl">' + ctrl + "</div></div>";
    }).join("") + "</div>";
  }

  function renderQualTab() {
    var dw = ST.dw, v = dw.draft, detail = dw.mode === "detail";
    var head = '<div class="mf-qual-head">多证合一：';
    if (detail) {
      head += '<span>' + esc(v.multiCert || "否") + "</span>";
    } else {
      head += '<label class="mf-radio"><input type="radio" name="multiCert" value="是" data-q-multi="1"'
        + (v.multiCert === "是" ? " checked" : "") + ">是</label>"
        + '<label class="mf-radio"><input type="radio" name="multiCert" value="否" data-q-multi="1"'
        + (v.multiCert !== "是" ? " checked" : "") + ">否</label>";
    }
    head += "</div>";

    var secs = QUAL_SECTIONS.map(function (s) {
      var q = v.qual[s.k] || { no: "", from: "", to: "", forever: false, img: false };
      var rows;
      if (detail) {
        rows = '<div class="mf-qual-row"><span class="lbl">照片信息：</span>'
          + (q.img ? '<span class="val">已上传</span>' : '<span class="mf-qual-empty">—</span>') + "</div>"
          + '<div class="mf-qual-row"><span class="lbl">资质证号：</span><span class="val">' + (q.no ? esc(q.no) : "—") + "</span></div>"
          + '<div class="mf-qual-row"><span class="lbl">有效期：</span><span class="val">'
          + (q.forever ? "长期" : ((q.from || "—") + " 至 " + (q.to || "—"))) + "</span></div>";
      } else {
        rows = '<div class="mf-qual-row"><span class="lbl">照片信息：</span>'
          + '<div class="mf-upload" data-upload="' + s.k + '" title="上传照片">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
          + "</div></div>"
          + '<div class="mf-qual-row"><span class="lbl">资质证号：</span>'
          + '<input class="input" style="max-width:320px" data-q="' + s.k + '.no" value="' + esc(q.no) + '" autocomplete="off"></div>'
          + '<div class="mf-qual-row"><span class="lbl">有效期：</span><div class="mf-date-range">'
          + '<input class="input" type="date" data-q="' + s.k + '.from" value="' + esc(q.from) + '">'
          + "<span>-</span>"
          + '<input class="input" type="date" data-q="' + s.k + '.to" value="' + esc(q.to) + '">'
          + '<label class="mf-check"><input type="checkbox" data-q="' + s.k + '.forever"' + (q.forever ? " checked" : "") + ">长期</label>"
          + "</div></div>";
      }
      return '<div class="mf-qual-sec"><div class="mf-qual-title">' + esc(s.name) + "</div>" + rows + "</div>";
    }).join("");

    return head + secs;
  }

  function renderDrawerFoot() {
    var mode = ST.dw.mode;
    var html = "";
    if (mode === "create") {
      html = '<button class="btn" data-foot="draft">暂存</button>'
        + '<button class="btn btn-primary" data-foot="submit">保存并启用</button>'
        + '<button class="btn" data-foot="back">返回</button>';
    } else if (mode === "edit") {
      html = '<button class="btn" data-foot="draft">暂存</button>'
        + '<button class="btn btn-primary" data-foot="submit">更新</button>'
        + '<button class="btn" data-foot="back">返回</button>';
    } else {
      html = '<button class="btn" data-foot="back">返回</button>';
    }
    $("drawerFoot").innerHTML = html;
  }

  function syncDraft() {
    var dw = ST.dw;
    if (!dw || dw.mode === "detail") return;
    if (dw.tab === "info") {
      Array.prototype.forEach.call(document.querySelectorAll("#drawerBody [data-k]"), function (el) {
        dw.draft[el.getAttribute("data-k")] = el.value;
      });
    } else {
      var multi = document.querySelector('#drawerBody input[name="multiCert"]:checked');
      if (multi) dw.draft.multiCert = multi.value;
      Array.prototype.forEach.call(document.querySelectorAll("#drawerBody [data-q]"), function (el) {
        var path = el.getAttribute("data-q");
        var parts = path.split(".");
        var sec = parts[0], key = parts[1];
        if (!dw.draft.qual[sec]) dw.draft.qual[sec] = { no: "", from: "", to: "", forever: false, img: false };
        dw.draft.qual[sec][key] = el.type === "checkbox" ? el.checked : el.value;
      });
    }
  }

  function switchTab(tab) {
    if (!ST.dw || ST.dw.tab === tab) return;
    syncDraft();
    ST.dw.tab = tab;
    renderDrawer();
  }

  function closeDrawer(force) {
    if (!ST.dw) return;
    if (!force && ST.dw.dirty && ST.dw.mode !== "detail") {
      confirmDialog("提示", "确认关闭？", "确定", function () {
        document.body.classList.remove("drawer-open");
        ST.dw = null;
      });
      return;
    }
    document.body.classList.remove("drawer-open");
    ST.dw = null;
  }

  /* ================= 保存 / 提交 ================= */
  function nextCode() {
    var max = 0;
    DATA.forEach(function (v) {
      var m = /Q(\d+)/.exec(v.code || "");
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
    return "Q" + (max + 1);
  }

  function validate(draft) {
    var miss = [];
    INFO_FIELDS.forEach(function (f) {
      if (f.req && !String(draft[f.k] || "").trim()) miss.push(f.label);
    });
    return miss;
  }

  function markInvalid() {
    Array.prototype.forEach.call(document.querySelectorAll("#drawerBody [data-k]"), function (el) {
      var f = INFO_FIELDS.filter(function (x) { return x.k === el.getAttribute("data-k"); })[0];
      if (f && f.req && !el.value.trim()) el.classList.add("is-invalid");
    });
  }

  function saveDrawer(kind) {
    var dw = ST.dw;
    syncDraft();
    var v = dw.draft;

    if (kind === "submit") {
      var miss = validate(v);
      if (miss.length) {
        markInvalid();
        toast("请完善：" + miss.join("、"));
        return;
      }
    } else if (!String(v.name || "").trim()) {
      toast("请至少填写企业名称");
      return;
    }

    if (dw.mode === "create") {
      v.code = nextCode();
      v.py = v.py || toPyCode(v.name);
      if (!v.qual) v.qual = blankQual();
      v.shelf = kind === "submit" ? "启用" : "停用";
      DATA.unshift(v);
      toast(kind === "submit" ? "已启用：" + v.name : "已暂存：" + v.name);
    } else {
      var idx = DATA.findIndex(function (x) { return x.code === dw.code; });
      if (idx >= 0) {
        v.py = v.py || toPyCode(v.name);
        DATA[idx] = v;
        toast(kind === "submit" ? "已更新：" + v.name : "已暂存：" + v.name);
      }
    }

    saveData();
    document.body.classList.remove("drawer-open");
    ST.dw = null;
    ST.page = 1;
    renderList();
  }

  /* ================= 弹窗 / Toast ================= */
  function openModal(html) {
    var mask = $("modalMask");
    mask.innerHTML = '<div class="modal">' + html + "</div>";
    mask.classList.add("show");
  }
  function closeModal() {
    var mask = $("modalMask");
    mask.classList.remove("show");
    mask.innerHTML = "";
  }
  function confirmDialog(title, text, okText, onOk) {
    openModal(
      '<div class="modal-head"><span class="modal-title">' + esc(title) + "</span>"
      + '<button class="drawer-close" data-close="1">'
      + '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>'
      + "</button></div>"
      + '<div class="modal-body"><p class="modal-text">' + esc(text) + "</p></div>"
      + '<div class="modal-foot"><button class="btn" data-close="1">取消</button>'
      + '<button class="btn btn-primary" data-ok="1">' + esc(okText || "确定") + "</button></div>"
    );
    $("modalMask").querySelector("[data-ok]").addEventListener("click", function () {
      closeModal();
      if (onOk) onOk();
    });
  }

  var toastTimer = null;
  function toast(msg) {
    var el = $("toast");
    $("toastText").textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  /* ================= 查询 / 重置 / 展开 ================= */
  function applyFilters() {
    ST.filters.kw = $("fltName").value.trim();
    ST.filters.type = $("fltType").value;
    ST.filters.category = $("fltCategory").value;
    var rd = document.querySelector('input[name="fltShelf"]:checked');
    ST.filters.shelf = rd ? rd.value : "all";
    ST.page = 1;
    renderList();
  }

  function resetFilters() {
    $("fltName").value = "";
    $("fltType").value = "";
    $("fltCategory").value = "";
    document.querySelector('input[name="fltShelf"][value="all"]').checked = true;
    ST.filters = { kw: "", type: "", category: "", shelf: "all" };
    ST.page = 1;
    renderList();
  }

  function toggleExpand() {
    ST.expanded = !ST.expanded;
    Array.prototype.forEach.call(document.querySelectorAll(".mf-more"), function (el) {
      el.classList.toggle("is-hidden", !ST.expanded);
    });
    var btn = $("btnExpand");
    btn.classList.toggle("is-open", ST.expanded);
    btn.childNodes[0].nodeValue = ST.expanded ? "收起" : "展开";
  }

  /* ================= 事件绑定 ================= */
  function bindEvents() {
    $("btnAdd").addEventListener("click", function () { openDrawer("create"); });
    $("btnBlack").addEventListener("click", function () { location.href = "blacklist-manage.html"; });

    $("btnSearch").addEventListener("click", applyFilters);
    $("btnReset").addEventListener("click", resetFilters);
    $("btnExpand").addEventListener("click", toggleExpand);
    $("fltName").addEventListener("keydown", function (e) {
      if (e.key === "Enter") applyFilters();
    });

    // 列表行操作
    $("listBody").addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-act]");
      if (!btn) return;
      var act = btn.getAttribute("data-act");
      var code = btn.getAttribute("data-id");
      var v = findVendor(code);
      if (!v) return;

      if (act === "edit") openDrawer("edit", code);
      else if (act === "view") openDrawer("detail", code);
      else if (act === "on") {
        if (v.black) { toast("黑名单企业不可启用，请先移出黑名单"); return; }
        v.shelf = "启用";
        saveData();
        renderList();
        toast("已启用：" + (v.name || v.code));
      } else if (act === "off") {
        confirmDialog("提示", "确认停用厂商「" + (v.name || v.code) + "」？", "停用", function () {
          v.shelf = "停用";
          saveData();
          renderList();
          toast("已停用：" + (v.name || v.code));
        });
      } else if (act === "del") {
        confirmDialog("提示", "确认删除厂商「" + (v.name || v.code) + "」？", "删除", function () {
          DATA = DATA.filter(function (x) { return x.code !== code; });
          saveData();
          renderList();
          toast("已删除：" + (v.name || v.code));
        });
      }
    });

    // 分页
    $("pagePrev").addEventListener("click", function () { if (ST.page > 1) { ST.page--; renderList(); } });
    $("pageNext").addEventListener("click", function () {
      var pages = Math.max(1, Math.ceil(filtered().length / ST.size));
      if (ST.page < pages) { ST.page++; renderList(); }
    });
    $("pageNums").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-page]");
      if (!b) return;
      ST.page = parseInt(b.getAttribute("data-page"), 10);
      renderList();
    });
    $("pageSize").addEventListener("change", function () {
      ST.size = parseInt(this.value, 10);
      ST.page = 1;
      renderList();
    });
    $("pageJump").addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      var n = parseInt(this.value, 10);
      var pages = Math.max(1, Math.ceil(filtered().length / ST.size));
      if (isNaN(n)) n = 1;
      ST.page = Math.min(pages, Math.max(1, n));
      renderList();
    });

    // 抽屉页签
    $("drawerTabs").addEventListener("click", function (e) {
      var b = e.target.closest(".mf-tab");
      if (!b) return;
      switchTab(b.getAttribute("data-tab"));
    });

    // 抽屉关闭
    $("drawerClose").addEventListener("click", function () { closeDrawer(false); });
    $("drawerMask").addEventListener("click", function () { closeDrawer(false); });

    // 抽屉底部操作
    $("drawerFoot").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-foot]");
      if (!b) return;
      var kind = b.getAttribute("data-foot");
      if (kind === "back") closeDrawer(false);
      else saveDrawer(kind);
    });

    // 抽屉表单：输入即标记未保存；企业名称联动拼音码
    $("drawerBody").addEventListener("input", function (e) {
      if (!ST.dw || ST.dw.mode === "detail") return;
      ST.dw.dirty = true;
      if (e.target.classList.contains("is-invalid")) e.target.classList.remove("is-invalid");
      if (e.target.getAttribute("data-k") === "name") {
        var py = $("drawerBody").querySelector('[data-k="py"]');
        if (py && (!py.value || py.value === toPyCode(ST.dw.draft.name || ""))) {
          py.value = toPyCode(e.target.value.trim());
          ST.dw.draft.py = py.value;
        }
      }
    });
    $("drawerBody").addEventListener("change", function (e) {
      if (!ST.dw || ST.dw.mode === "detail") return;
      ST.dw.dirty = true;
      var up = e.target.closest("[data-upload]");
      if (up) { toast("原型演示：照片上传待接入"); }
    });

    // 弹窗
    $("modalMask").addEventListener("click", function (e) {
      if (e.target.closest("[data-close]") || e.target === this) closeModal();
    });
  }

  /* ================= 初始化 ================= */
  loadData();
  bindEvents();
  renderList();
})();
</script>
