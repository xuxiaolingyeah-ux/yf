<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>药品盘点 · 区域药房协同管理系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="app-header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9.4" width="17.6" height="5.2" rx="2.6" transform="rotate(-45 12 12)"></rect>
        <path d="M8.4 15.6L15.6 8.4"></path>
      </svg>
    </div>
    <div class="header-title">区域药房协同管理系统</div>
  </div>
  <div class="header-right">
    <div class="header-user" id="headerUser" title="点击退出登录">
      <span class="header-avatar">药</span>
      <span class="header-user-name">陈静 · 区域中心药房</span>
      <svg class="user-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </div>
</header>

<div class="app-body">
  <!-- ========== 左侧导航 ========== -->
  <aside class="app-side" id="appSide"></aside>
<!-- ========== 主区域 ========== -->
  <main class="app-main">
    <div class="tabbar">
      <div class="tab">首页</div>
      <div class="tab active">
        库存盘点
        <button class="tab-close" id="tabClose" title="关闭">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg>
        </button>
      </div>
    </div>

    <div class="page sel-page">
      <div class="sel-main">
        <!-- 标题行：左对齐 -->
        <div class="page-head">
          <div class="page-head-left">
            <h1 class="page-title">库存盘点</h1>
          </div>
          <button class="btn btn-primary" id="btnCreate">新增盘点</button>
        </div>

        <div class="sel-card">
          <!-- 筛选区 -->
          <div class="filter-bar sc-filter">
            <div class="filter-item">
              <span class="filter-label">盘点名称</span>
              <input class="input" id="fName" style="width:160px;" placeholder="请输入">
            </div>
            <div class="filter-item">
              <span class="filter-label">盘点单号</span>
              <input class="input" id="fCode" style="width:160px;" placeholder="请输入">
            </div>
            <div class="filter-item">
              <span class="filter-label">机构</span>
              <select class="select" id="fOrg" style="width:160px;">
                <option value="">全部机构</option>
              </select>
            </div>
            <div class="filter-item">
              <span class="filter-label">库位</span>
              <select class="select" id="fLoc" style="width:140px;">
                <option value="">全部库位</option>
              </select>
            </div>
            <div class="filter-item">
              <span class="filter-label">药品种类</span>
              <select class="select" id="fKind" style="width:140px;">
                <option value="">全部种类</option>
              </select>
            </div>
            <div class="filter-item">
              <span class="filter-label">创建时间</span>
              <input class="input" id="fDateFrom" type="date" style="width:130px;"> ~
              <input class="input" id="fDateTo" type="date" style="width:130px;">
            </div>
            <div class="filter-item">
              <span class="filter-label">审核状态</span>
              <select class="select" id="fAudit" style="width:140px;">
                <option value="">全部状态</option>
                <option value="draft">草稿</option>
                <option value="pending">待审核</option>
                <option value="approved">审核通过</option>
                <option value="rejected">已拒绝</option>
              </select>
            </div>
            <div class="filter-acts">
              <button class="btn" id="btnReset">重置</button>
              <button class="btn btn-primary" id="btnQuery">查询</button>
            </div>
          </div>

          <!-- 盘点列表 -->
          <div style="padding:0 16px;">
            <div class="sc-list-wrap">
              <table class="data-table sc-list-table">
                <thead>
                  <tr>
                    <th>盘点名称</th>
                    <th>盘点单号</th>
                    <th>机构</th>
                    <th>库位</th>
                    <th>药品种类</th>
                    <th>创建人</th>
                    <th>创建时间</th>
                    <th class="col-audit">审核状态</th>
                    <th class="col-acts">操作</th>
                  </tr>
                </thead>
                <tbody id="tbody"></tbody>
              </table>
              <div class="table-empty" id="tableEmpty" style="display:none;">暂无数据</div>
            </div>
          </div>

          <div class="pager">
            <span id="pagerInfo">共 5 条</span>
            <div class="pager-ctrl">
              <button class="pager-btn" id="pgPrev" title="上一页" disabled="">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
              </button>
              <span class="pager-num" id="pgNum">1 / 1</span>
              <button class="pager-btn" id="pgNext" title="下一页" disabled="">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-mask" id="modalMask"></div>
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
  <span id="toastText"></span>
</div>

<script src="mock.js"></script>
<script src="selection-common.js"></script>
<script src="stock-check-common.js"></script>
<script>
(function () {
  var $ = SEL.$, esc = SEL.esc;

  var user = SC.user();
  if (!user) return;

  var state = {
    name: "", code: "", org: "", loc: "",
    kind: "", dateFrom: "", dateTo: "", audit: "",
    page: 1, size: 10
  };

  /* ---------------- 初始化筛选下拉 ---------------- */
  function initFilters() {
    var fOrg = $("fOrg");
    SC.ORGS.forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o.id; opt.textContent = o.name;
      fOrg.appendChild(opt);
    });

    var fKind = $("fKind");
    (MOCK.drugKinds || []).forEach(function (k) {
      var opt = document.createElement("option");
      opt.value = k; opt.textContent = k;
      fKind.appendChild(opt);
    });

    /* 库位下拉：机构下全量库位 */
    var fLoc = $("fLoc");
    SC.locationsOf(SC.ORGS[0].id).forEach(function (l) {
      var opt = document.createElement("option");
      opt.value = l; opt.textContent = l;
      fLoc.appendChild(opt);
    });
  }

  /* ---------------- 列表 ---------------- */
  function filtered() {
    var list = SC.load();
    return list.filter(function (b) {
      if (state.name && b.name.toLowerCase().indexOf(state.name.toLowerCase()) < 0) return false;
      if (state.code && b.code.toLowerCase().indexOf(state.code.toLowerCase()) < 0) return false;
      if (state.org && b.orgId !== state.org) return false;
      if (state.loc && b.location !== state.loc) return false;
      if (state.kind && b.kind !== state.kind) return false;
      if (state.dateFrom || state.dateTo) {
        var day = (b.createdAt || "").slice(0, 10);
        if (!day) return false;
        if (state.dateFrom && day < state.dateFrom) return false;
        if (state.dateTo && day > state.dateTo) return false;
      }
      if (state.audit && b.auditStatus !== state.audit) return false;
      return true;
    }).sort(function (x, y) {
      if (x.createdAt === y.createdAt) return 0;
      return x.createdAt < y.createdAt ? 1 : -1;
    });
  }

  function renderTable() {
    var rows = filtered();
    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total / state.size));
    if (state.page > pages) state.page = pages;
    var start = (state.page - 1) * state.size;
    var slice = rows.slice(start, start + state.size);

    $("tbody").innerHTML = slice.map(function (b) {
      return "<tr>" +
        '<td title="' + esc(b.name) + '">' + esc(b.name) + "</td>" +
        "<td>" + esc(b.code) + "</td>" +
        '<td title="' + esc(b.orgName) + '">' + esc(b.orgName) + "</td>" +
        "<td>" + esc(b.location) + "</td>" +
        "<td>" + esc(b.kind) + "</td>" +
        "<td>" + esc(b.creator) + "</td>" +
        "<td>" + esc(b.createdAt) + "</td>" +
        '<td class="col-audit"><span class="status-text">' + esc(SC.AUDIT[b.auditStatus]) + "</span></td>" +
        '<td class="col-acts">' + SC.actionsFor(b, user).map(function (a) {
          var cls = a === "删除" ? "link-btn is-danger" : "link-btn";
          return '<button class="' + cls + '" data-act="' + a + '" data-id="' + b.id + '">' + a + "</button>";
        }).join("") + "</td>" +
      "</tr>";
    }).join("");

    $("tableEmpty").style.display = total ? "none" : "block";
    $("pagerInfo").textContent = "共 " + total + " 条";
    $("pgNum").textContent = state.page + " / " + pages;
    $("pgPrev").disabled = state.page <= 1;
    $("pgNext").disabled = state.page >= pages;
  }

  /* ---------------- 新增盘点弹窗 ---------------- */
  function openCreate() {
    var kindOpts = (MOCK.drugKinds || []).map(function (k) {
      return '<option value="' + esc(k) + '">' + esc(k) + "</option>";
    }).join("");
    var locOpts = SC.locationsOf(SC.ORGS[0].id).map(function (l) {
      return '<option value="' + esc(l) + '">' + esc(l) + "</option>";
    }).join("");

    SEL.openModal(
      '<div class="modal-head">' +
        '<span class="modal-title">新增盘点</span>' +
        '<button class="drawer-close" id="mClose">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>' +
        "</button>" +
      "</div>" +
      '<div class="modal-body">' +
        '<div class="sc-modal-grid">' +
          '<div class="form-item"><span class="form-label"><span class="req">*</span>盘点名称</span><input class="input" id="mName" placeholder="请输入盘点名称" maxlength="40"></div>' +
          '<div class="form-item"><span class="form-label">机构</span><input class="input is-readonly" id="mOrg" value="' + esc(SC.ORGS[0].name) + '" readonly></div>' +
          '<div class="form-item"><span class="form-label"><span class="req">*</span>库位名称</span><select class="select" id="mLoc"><option value="">请选择库位</option>' + locOpts + "</select></div>" +
          '<div class="form-item"><span class="form-label"><span class="req">*</span>药品种类</span><select class="select" id="mKind"><option value="">请选择药品种类</option>' + kindOpts + "</select></div>" +
        "</div>" +
      "</div>" +
      '<div class="modal-foot">' +
        '<button class="btn" id="mCancel">取消</button>' +
        '<button class="btn btn-primary" id="mOk">确定</button>' +
      "</div>"
    );
    var modal = $("modalMask").querySelector(".modal");
    if (modal) modal.classList.add("sc-modal");

    $("mClose").addEventListener("click", SEL.closeModal);
    $("mCancel").addEventListener("click", SEL.closeModal);

    ["mName", "mLoc", "mKind"].forEach(function (id) {
      var el = $(id);
      el.addEventListener("input", function () { this.classList.remove("is-invalid"); });
      el.addEventListener("change", function () { this.classList.remove("is-invalid"); });
    });

    $("mOk").addEventListener("click", submitCreate);
    setTimeout(function () { $("mName").focus(); }, 50);
  }

  function submitCreate() {
    var name = $("mName").value.trim();
    var loc = $("mLoc").value;
    var kind = $("mKind").value;

    var missing = [];
    if (!name) missing.push({ id: "mName", label: "盘点名称" });
    if (!loc) missing.push({ id: "mLoc", label: "库位名称" });
    if (!kind) missing.push({ id: "mKind", label: "药品种类" });
    if (missing.length) {
      SEL.toast("请填写：" + missing.map(function (m) { return m.label; }).join("、"));
      missing.forEach(function (m) { $(m.id).classList.add("is-invalid"); });
      return;
    }

    var list = SC.load();
    var now = SEL.fmtNow();
    var org = SC.ORGS[0];
    var bill = {
      id: "sc_" + Date.now(),
      code: SC.newCode(list),
      name: name,
      orgId: org.id, orgName: org.name,
      pharmacy: "", location: loc,
      kind: kind, checkTime: now,
      auditStatus: "draft",
      creatorId: user.id, creator: user.name, createdAt: now,
      items: [], records: []
    };
    /* 点击确定的这一刻锁定账面库存 */
    SC.fillItems(bill);
    SC.persist(bill);

    SEL.closeModal();
    SEL.toast("盘点单已创建");
    setTimeout(function () {
      location.href = "stock-check-count.html?id=" + bill.id;
    }, 300);
  }

  $("btnCreate").addEventListener("click", openCreate);

  /* ---------------- 行操作 ---------------- */
  function doSubmit(id) {
    var list = SC.load();
    var b = SC.byId(list, id);
    if (!b) return;
    SEL.confirmDialog({
      title: "提交审核",
      text: "确认提交盘点单「" + b.code + "」？提交后进入审核，期间不可编辑。",
      okText: "提交",
      onOk: function () {
        b.auditStatus = "pending";
        b.records.push({ node: "提交", person: user.name, result: "已提交", opinion: "—", time: SEL.fmtNow() });
        SC.persist(b);
        SEL.toast("已提交审核");
        renderTable();
      }
    });
  }

  function doDelete(id) {
    SEL.confirmDialog({
      title: "删除盘点单",
      text: "确认删除该盘点单？删除后不可恢复。",
      okText: "删除",
      onOk: function () {
        var list = SC.load();
        list = list.filter(function (b) { return b.id !== id; });
        SC.save(list);
        SEL.toast("已删除");
        renderTable();
      }
    });
  }

  $("tbody").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    var id = btn.getAttribute("data-id");
    if (act === "查看") location.href = "stock-check-detail.html?id=" + id;
    else if (act === "编辑") location.href = "stock-check-count.html?id=" + id;
    else if (act === "审核") location.href = "stock-check-detail.html?id=" + id + "&mode=approve";
    else if (act === "提交") doSubmit(id);
    else if (act === "撤回") doWithdraw(id);
    else if (act === "删除") doDelete(id);
  });

  function doWithdraw(id) {
    var list = SC.load();
    var b = SC.byId(list, id);
    if (!b) return;
    SEL.confirmDialog({
      title: "撤回",
      text: "确认撤回该盘点单？撤回后状态变回草稿。",
      okText: "撤回",
      onOk: function () {
        b.auditStatus = "draft";
        b.records.push({ node: "撤回", person: user.name, org: user.org, result: "已撤回", opinion: "—", time: SEL.fmtNow() });
        SC.persist(b);
        SEL.toast("已撤回");
        renderTable();
      }
    });
  }

  /* ---------------- 筛选 / 分页 ---------------- */
  $("btnQuery").addEventListener("click", function () {
    state.name = $("fName").value.trim().toLowerCase();
    state.code = $("fCode").value.trim().toLowerCase();
    state.org = $("fOrg").value;
    state.loc = $("fLoc").value;
    state.kind = $("fKind").value;
    state.dateFrom = $("fDateFrom").value;
    state.dateTo = $("fDateTo").value;
    state.audit = $("fAudit").value;
    state.page = 1;
    renderTable();
  });

  $("btnReset").addEventListener("click", function () {
    $("fName").value = ""; $("fCode").value = "";
    $("fOrg").value = ""; $("fLoc").value = "";
    $("fKind").value = "";
    $("fDateFrom").value = ""; $("fDateTo").value = "";
    $("fAudit").value = "";
    state.name = state.code = state.org = state.loc = state.kind = state.audit = "";
    state.dateFrom = state.dateTo = "";
    state.page = 1;
    renderTable();
  });

  $("pgPrev").addEventListener("click", function () { state.page--; renderTable(); });
  $("pgNext").addEventListener("click", function () { state.page++; renderTable(); });

  $("tabClose").addEventListener("click", function () { location.href = "batch-management.html"; });
  $("headerUser").addEventListener("click", function () {
    SEL.confirmDialog({
      title: "退出登录",
      text: "确认退出当前账号「" + user.name + "」？",
      okText: "退出",
      onOk: function () { SC.logout(); }
    });
  });

  SEL.renderHeaderUser(user);
  SEL.bindNav();
  initFilters();
  renderTable();
})();
</script>
  <script src="nav.js?v=20261111c"></script>
</body>
</html>
